<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VehicleCare · DB Editor</title>
<style>
  :root{
    --bg:#0f1318; --panel:#161b22; --panel2:#1c232d; --bd:#243040;
    --tx:#e6edf3; --mut:#8b95a3; --acc:#fb923c; --acc2:#f59e0b;
    --dng:#f87171; --dngbg:#3a1d1d; --ok:#34d399; --okbg:#13312a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);}
  body{padding-bottom:40px;}
  a{color:var(--acc);}
  /* Header */
  header{position:sticky;top:0;z-index:20;background:#0b0e12;border-bottom:1px solid var(--bd);
    padding:env(safe-area-inset-top) 12px 0;}
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 0 10px;}
  .logo{font-weight:800;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);}
  .logo small{font-family:var(--mono);font-weight:500;color:var(--mut);font-size:11px;}
  .htools{margin-left:auto;display:flex;gap:6px;}
  .ic{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:8px;
    padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--ui);}
  .ic:active{transform:scale(.96);}
  .ic.dng{color:var(--dng);border-color:#552;background:var(--dngbg);}
  /* Store chips */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--bd);border-radius:999px;
    padding:7px 12px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center;}
  .chip .n{font-family:var(--mono);font-size:11px;background:#0b0e12;border-radius:999px;padding:1px 7px;color:var(--mut);}
  .chip.act{color:#0b0e12;background:var(--acc);border-color:var(--acc);font-weight:800;}
  .chip.act .n{background:rgba(0,0,0,.25);color:#1a1208;}
  .chip.idb{border-style:dashed;}
  /* Main */
  main{padding:14px 12px;max-width:920px;margin:0 auto;}
  .stbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sttitle{font-size:17px;font-weight:800;}
  .stkey{font-family:var(--mono);font-size:11px;color:var(--mut);}
  .stbar .sp{flex:1;}
  .btn{border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:8px;
    padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ui);}
  .btn:active{transform:scale(.97);}
  .btn.acc{background:var(--acc);color:#0b0e12;border-color:var(--acc);}
  .btn.ok{background:var(--okbg);color:var(--ok);border-color:#1d5;}
  .btn.dng{background:var(--dngbg);color:var(--dng);border-color:#633;}
  .btn.sm{padding:6px 9px;font-size:11px;}
  .search{width:100%;background:var(--panel);border:1px solid var(--bd);border-radius:9px;color:var(--tx);
    padding:10px 12px;font-size:13px;font-family:var(--mono);margin-bottom:12px;outline:none;}
  .search:focus{border-color:var(--acc);}
  .hint{font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--acc);
    border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.5;}
  /* Record card */
  .rec{background:var(--panel);border:1px solid var(--bd);border-radius:11px;margin-bottom:9px;overflow:hidden;}
  .rec>summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;gap:10px;}
  .rec>summary::-webkit-details-marker{display:none;}
  .rec[open]>summary{border-bottom:1px solid var(--bd);}
  .rec .idx{font-family:var(--mono);font-size:11px;color:var(--mut);flex:0 0 auto;min-width:24px;}
  .rec .sum{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .rec .sub{font-family:var(--mono);font-size:11px;color:var(--mut);}
  .rec .thumb{width:40px;height:30px;border-radius:5px;object-fit:cover;flex:0 0 auto;background:#0b0e12;border:1px solid var(--bd);}
  .rec .chev{color:var(--mut);font-size:12px;flex:0 0 auto;}
  .body{padding:12px 13px;}
  textarea{width:100%;background:#0b0e12;border:1px solid var(--bd);border-radius:9px;color:#cfe;
    font-family:var(--mono);font-size:12.5px;line-height:1.55;padding:11px;resize:vertical;outline:none;min-height:120px;}
  textarea:focus{border-color:var(--acc);}
  textarea.big{min-height:340px;}
  textarea.err{border-color:var(--dng);}
  .rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:12px;margin-bottom:11px;}
  .kv label{color:var(--mut);font-family:var(--mono);font-size:11px;}
  .kv input,.kv select{background:#0b0e12;border:1px solid var(--bd);border-radius:7px;color:var(--tx);
    padding:8px 9px;font-size:12.5px;font-family:var(--mono);outline:none;width:100%;}
  .kv input:focus{border-color:var(--acc);}
  .empty{text-align:center;color:var(--mut);padding:34px 0;font-size:13px;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--mut);}
  .pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);}
  .pillimg{color:var(--ok);border-color:#1d5;}
  /* Toast */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#0b0e12;border:1px solid var(--bd);border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;
    z-index:60;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.ok{border-color:#1d5;color:var(--ok);}
  #toast.err{border-color:#633;color:var(--dng);}
  /* Modal */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
  #ov.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:380px;width:100%;}
  .modal h3{margin:0 0 8px;font-size:16px;}
  .modal p{margin:0 0 14px;font-size:13px;color:var(--mut);line-height:1.55;}
  .modal .mrow{display:flex;gap:8px;justify-content:flex-end;}
  .modal input{width:100%;background:#0b0e12;border:1px solid var(--bd);border-radius:8px;color:var(--tx);
    padding:10px;font-family:var(--mono);margin-bottom:14px;outline:none;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><span class="dot"></span>DB&nbsp;Editor <small>VehicleCare</small></div>
    <div class="htools">
      <button class="ic" onclick="reloadAll()">↻ Ricarica</button>
      <button class="ic" onclick="exportAll()">⤓ Esporta</button>
      <button class="ic dng" onclick="wipeAll()">⚠ Azzera</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>

<div id="toast"></div>
<div id="ov"><div class="modal" id="modal"></div></div>

<script>
"use strict";
// ─────────────────────────────────────────────
//  Definizione store
// ─────────────────────────────────────────────
const STORES = [
  {id:'vehicles',          key:'vcp_vehicles',          kind:'ls-array',  label:'Veicoli'},
  {id:'checks',            key:'vcp_checks',            kind:'ls-array',  label:'Check'},
  {id:'interventions',     key:'vcp_interventions',     kind:'ls-array',  label:'Interventi'},
  {id:'segnalazioni',      key:'vcp_segnalazioni',      kind:'ls-array',  label:'Segnalazioni'},
  {id:'suppliers',         key:'vcp_suppliers',         kind:'ls-array',  label:'Fornitori'},
  {id:'tires',             key:'vcp_tires',             kind:'ls-array',  label:'Gomme'},
  {id:'tiresStorico',      key:'vcp_tires_storico',     kind:'ls-array',  label:'Storico gomme'},
  {id:'tireInterventions', key:'vcp_tire_interventions',kind:'ls-array',  label:'Interventi gomme'},
  {id:'settings',          key:'vcp_settings',          kind:'ls-object', label:'Impostazioni'},
  {id:'calibration',       key:'vcp_calibration',       kind:'ls-object', label:'Calibrazione'},
  {id:'documents_ls',      key:'vcp_documents',         kind:'ls-array',  label:'Documenti (LS legacy)'},
  {id:'idb_documents',     kind:'idb-docs',   store:'documents',      label:'Documenti (IDB)'},
  {id:'idb_photos',        kind:'idb-photos', store:'vehicle_photos', label:'Foto veicoli (IDB)'},
];
const IDB_NAME='VehicleCarePro', IDB_VER=2;
let current = STORES[0].id;
let filter = '';
let _idbCache = {}; // storeName -> array (per render)

// ─────────────────────────────────────────────
//  Helper localStorage
// ─────────────────────────────────────────────
function lsGet(key, kind){
  const raw = localStorage.getItem(key);
  if(raw===null) return kind==='ls-object'?{}:[];
  try{ return JSON.parse(raw); }catch(e){ return kind==='ls-object'?{}:[]; }
}
function lsSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function storeById(id){ return STORES.find(s=>s.id===id); }
function countOf(s){
  try{
    if(s.kind==='ls-array')  return lsGet(s.key,s.kind).length;
    if(s.kind==='ls-object') return Object.keys(lsGet(s.key,s.kind)).length;
    if(s.kind.startsWith('idb')) return (_idbCache[s.store]||[]).length;
  }catch(e){}
  return 0;
}

// ─────────────────────────────────────────────
//  Helper IndexedDB
// ─────────────────────────────────────────────
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,IDB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result, tx=e.target.transaction;
      let st;
      if(!db.objectStoreNames.contains('documents')){ st=db.createObjectStore('documents',{keyPath:'id'}); }
      else st=tx.objectStore('documents');
      if(st && !st.indexNames.contains('vehicleId')) st.createIndex('vehicleId','vehicleId',{unique:false});
      if(!db.objectStoreNames.contains('vehicle_photos')) db.createObjectStore('vehicle_photos',{keyPath:'vehicleId'});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function idbAll(store){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const rq=tx.objectStore(store).getAll();
    rq.onsuccess=()=>res(rq.result||[]); rq.onerror=e=>rej(e.target.error);
  });
}
async function idbPut(store,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete=res; tx.onerror=e=>rej(e.target.error);
  });
}
async function idbDel(store,key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=res; tx.onerror=e=>rej(e.target.error);
  });
}
async function idbClear(store){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete=res; tx.onerror=e=>rej(e.target.error);
  });
}

// ─────────────────────────────────────────────
//  UI base
// ─────────────────────────────────────────────
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className=t.className.replace('show','').trim(),2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function confirmDanger(title, body, cb, typeWord){
  const ov=document.getElementById('ov'), m=document.getElementById('modal');
  if(typeWord){
    m.innerHTML=`<h3>${esc(title)}</h3><p>${body}</p>
      <input id="cfx" placeholder="scrivi ${typeWord}" autocomplete="off">
      <div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button>
      <button class="btn dng" id="cfgo">Conferma</button></div>`;
    ov.classList.add('show');
    document.getElementById('cfgo').onclick=()=>{
      if((document.getElementById('cfx').value||'').trim().toUpperCase()!==typeWord){ toast('Parola di conferma errata','err'); return; }
      closeOv(); cb();
    };
  }else{
    m.innerHTML=`<h3>${esc(title)}</h3><p>${body}</p>
      <div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button>
      <button class="btn dng" id="cfgo">Conferma</button></div>`;
    ov.classList.add('show');
    document.getElementById('cfgo').onclick=()=>{ closeOv(); cb(); };
  }
}
function closeOv(){ document.getElementById('ov').classList.remove('show'); }

// ─────────────────────────────────────────────
//  Chips + selezione
// ─────────────────────────────────────────────
function renderChips(){
  const c=document.getElementById('chips');
  c.innerHTML=STORES.map(s=>{
    const n=countOf(s);
    const idb=s.kind.startsWith('idb')?' idb':'';
    return `<div class="chip${s.id===current?' act':''}${idb}" onclick="selectStore('${s.id}')">
      ${esc(s.label)}<span class="n">${n}</span></div>`;
  }).join('');
  const act=c.querySelector('.act'); if(act) act.scrollIntoView({inline:'center',block:'nearest'});
}
function selectStore(id){ current=id; filter=''; renderChips(); renderMain(); window.scrollTo(0,0); }

async function reloadAll(){
  // ricarica cache IDB e ridisegna
  try{ _idbCache['documents']=await idbAll('documents'); }catch(e){ _idbCache['documents']=[]; }
  try{ _idbCache['vehicle_photos']=await idbAll('vehicle_photos'); }catch(e){ _idbCache['vehicle_photos']=[]; }
  renderChips(); renderMain(); toast('Ricaricato','ok');
}

// ─────────────────────────────────────────────
//  Render principale
// ─────────────────────────────────────────────
function renderMain(){
  const s=storeById(current);
  if(s.kind==='ls-array')  return renderLsArray(s);
  if(s.kind==='ls-object') return renderLsObject(s);
  if(s.kind==='idb-docs')  return renderIdbDocs(s);
  if(s.kind==='idb-photos')return renderIdbPhotos(s);
}

function summaryOf(rec,i){
  if(rec && typeof rec==='object'){
    const t = rec.targa||rec.nome||rec.descrizione||rec.voce||rec.tipo||'';
    const d = rec.data||rec.dataApertura||rec.dataProgrammazione||rec.createdAt||'';
    const main = t || (rec.id?('id '+String(rec.id).slice(0,8)):'');
    return {main: main||('#'+i), sub: d?String(d).slice(0,19):''};
  }
  return {main:'#'+i, sub:String(rec).slice(0,40)};
}
function matchFilter(rec){
  if(!filter) return true;
  try{ return JSON.stringify(rec).toLowerCase().includes(filter.toLowerCase()); }catch(e){ return true; }
}

// ── localStorage ARRAY ──
function renderLsArray(s){
  const arr=lsGet(s.key,s.kind);
  const idxs=arr.map((r,i)=>i).filter(i=>matchFilter(arr[i]));
  const head=`
    <div class="stbar">
      <div><div class="sttitle">${esc(s.label)}</div><div class="stkey">${s.key} · array[${arr.length}]</div></div>
      <div class="sp"></div>
      <button class="btn acc sm" onclick="addRecord('${s.id}')">+ Aggiungi</button>
      <button class="btn sm" onclick="rawEdit('${s.id}')">{ } JSON</button>
      <button class="btn dng sm" onclick="wipeStore('${s.id}')">Svuota</button>
    </div>
    <input class="search" placeholder="filtra record…" value="${esc(filter)}" oninput="filter=this.value;renderMain();this.focus();">`;
  let list;
  if(arr.length===0) list=`<div class="empty">Nessun record. Usa “+ Aggiungi”.</div>`;
  else if(idxs.length===0) list=`<div class="empty">Nessun record corrisponde al filtro.</div>`;
  else list=idxs.map(i=>{
    const sm=summaryOf(arr[i],i);
    return `<details class="rec">
      <summary><span class="idx">${i}</span>
        <span class="sum">${esc(sm.main)}</span>
        ${sm.sub?`<span class="sub">${esc(sm.sub)}</span>`:''}
        <span class="chev">▾</span></summary>
      <div class="body">
        <textarea id="ta-${s.id}-${i}" spellcheck="false">${esc(JSON.stringify(arr[i],null,2))}</textarea>
        <div class="rowbtns">
          <button class="btn ok sm" onclick="saveRecord('${s.id}',${i})">Salva</button>
          <button class="btn sm" onclick="dupRecord('${s.id}',${i})">Duplica</button>
          <button class="btn dng sm" onclick="delRecord('${s.id}',${i})">Elimina</button>
        </div>
      </div></details>`;
  }).join('');
  document.getElementById('main').innerHTML=head+list;
}
function saveRecord(id,i){
  const s=storeById(id), arr=lsGet(s.key,s.kind);
  const ta=document.getElementById('ta-'+id+'-'+i);
  let val; try{ val=JSON.parse(ta.value); }catch(e){ ta.classList.add('err'); toast('JSON non valido: '+e.message,'err'); return; }
  arr[i]=val; lsSet(s.key,arr); toast('Record '+i+' salvato','ok'); renderChips();
}
function delRecord(id,i){
  confirmDanger('Eliminare record?', `Record #${i} di <b>${storeById(id).label}</b>. Operazione non annullabile.`,()=>{
    const s=storeById(id), arr=lsGet(s.key,s.kind); arr.splice(i,1); lsSet(s.key,arr);
    toast('Record eliminato','ok'); renderChips(); renderMain();
  });
}
function dupRecord(id,i){
  const s=storeById(id), arr=lsGet(s.key,s.kind);
  const copy=JSON.parse(JSON.stringify(arr[i]));
  if(copy && typeof copy==='object' && 'id' in copy){ try{ copy.id=(crypto.randomUUID&&crypto.randomUUID())||('dup-'+Date.now()); }catch(e){ copy.id='dup-'+Date.now(); } }
  arr.splice(i+1,0,copy); lsSet(s.key,arr); toast('Record duplicato','ok'); renderChips(); renderMain();
}
function addRecord(id){
  const s=storeById(id), arr=lsGet(s.key,s.kind);
  const tpl={}; try{ tpl.id=(crypto.randomUUID&&crypto.randomUUID())||('new-'+Date.now()); }catch(e){ tpl.id='new-'+Date.now(); }
  arr.push(tpl); lsSet(s.key,arr); toast('Record aggiunto in fondo','ok'); renderChips(); renderMain();
}

// ── localStorage OBJECT (settings/calibration) ──
function renderLsObject(s){
  const obj=lsGet(s.key,s.kind);
  document.getElementById('main').innerHTML=`
    <div class="stbar">
      <div><div class="sttitle">${esc(s.label)}</div><div class="stkey">${s.key} · object</div></div>
      <div class="sp"></div>
      <button class="btn dng sm" onclick="wipeStore('${s.id}')">Svuota</button>
    </div>
    <div class="hint">Oggetto singolo: modifica il JSON e salva. Le immagini base64 (es. <span class="meta">pdfBg</span>) possono essere molto lunghe.</div>
    <textarea id="ta-obj-${s.id}" class="big" spellcheck="false">${esc(JSON.stringify(obj,null,2))}</textarea>
    <div class="rowbtns">
      <button class="btn ok" onclick="saveObject('${s.id}')">Salva</button>
      <button class="btn" onclick="formatObject('${s.id}')">Formatta</button>
    </div>`;
}
function saveObject(id){
  const s=storeById(id), ta=document.getElementById('ta-obj-'+id);
  let val; try{ val=JSON.parse(ta.value); }catch(e){ ta.classList.add('err'); toast('JSON non valido: '+e.message,'err'); return; }
  lsSet(s.key,val); toast(s.label+' salvato','ok'); renderChips();
}
function formatObject(id){
  const ta=document.getElementById('ta-obj-'+id);
  try{ ta.value=JSON.stringify(JSON.parse(ta.value),null,2); ta.classList.remove('err'); }catch(e){ toast('JSON non valido','err'); }
}

// ── Raw JSON dell'intero array ──
function rawEdit(id){
  const s=storeById(id), arr=lsGet(s.key,s.kind);
  document.getElementById('main').innerHTML=`
    <div class="stbar">
      <div><div class="sttitle">${esc(s.label)} · JSON grezzo</div><div class="stkey">${s.key}</div></div>
      <div class="sp"></div>
      <button class="btn sm" onclick="renderMain()">‹ Torna ai record</button>
    </div>
    <div class="hint">Modifica l'intero array. Deve restare un array JSON valido.</div>
    <textarea id="ta-raw-${id}" class="big" spellcheck="false">${esc(JSON.stringify(arr,null,2))}</textarea>
    <div class="rowbtns">
      <button class="btn ok" onclick="saveRaw('${id}')">Salva tutto</button>
      <button class="btn" onclick="(function(){var t=document.getElementById('ta-raw-${id}');try{t.value=JSON.stringify(JSON.parse(t.value),null,2);t.classList.remove('err');}catch(e){toast('JSON non valido','err');}})()">Formatta</button>
    </div>`;
}
function saveRaw(id){
  const s=storeById(id), ta=document.getElementById('ta-raw-'+id);
  let val; try{ val=JSON.parse(ta.value); }catch(e){ ta.classList.add('err'); toast('JSON non valido: '+e.message,'err'); return; }
  if(!Array.isArray(val)){ toast('Deve essere un array','err'); return; }
  lsSet(s.key,val); toast(s.label+' salvato ('+val.length+' record)','ok'); renderChips(); renderMain();
}

// ── IndexedDB: documenti ──
function renderIdbDocs(s){
  const docs=_idbCache['documents']||[];
  const list=docs.filter(matchFilter);
  const head=`
    <div class="stbar">
      <div><div class="sttitle">Documenti (IDB)</div><div class="stkey">VehicleCarePro · documents[${docs.length}]</div></div>
      <div class="sp"></div>
      <button class="btn acc sm" onclick="addDoc()">+ Carica file</button>
      <button class="btn dng sm" onclick="wipeStore('idb_documents')">Svuota</button>
    </div>
    <div class="hint">File allegati ai veicoli (binari). Puoi modificare i metadati, scaricare, sostituire il file o eliminare.</div>
    <input class="search" placeholder="filtra…" value="${esc(filter)}" oninput="filter=this.value;renderMain();this.focus();">`;
  let body;
  if(docs.length===0) body=`<div class="empty">Nessun documento in IndexedDB.</div>`;
  else if(list.length===0) body=`<div class="empty">Nessun documento corrisponde al filtro.</div>`;
  else body=list.map(d=>{
    const isImg=d.mime&&d.mime.startsWith('image/');
    const size=d.data?(d.data.byteLength||d.data.length||0):0;
    let thumb='';
    if(isImg && d.data){ try{ const u=URL.createObjectURL(new Blob([d.data],{type:d.mime})); thumb=`<img class="thumb" src="${u}">`; }catch(e){} }
    return `<details class="rec">
      <summary>${thumb||'<span class="thumb"></span>'}
        <span class="sum">${esc(d.tipo||'—')}</span>
        <span class="sub">${esc((d.nome||'').slice(0,22))}</span>
        <span class="chev">▾</span></summary>
      <div class="body">
        <div class="kv">
          <label>id</label><input value="${esc(d.id||'')}" id="d-id-${esc(d.id)}" disabled>
          <label>vehicleId</label><input value="${esc(d.vehicleId||'')}" id="d-vid-${esc(d.id)}">
          <label>tipo</label><input value="${esc(d.tipo||'')}" id="d-tipo-${esc(d.id)}">
          <label>nome</label><input value="${esc(d.nome||'')}" id="d-nome-${esc(d.id)}">
          <label>mime</label><input value="${esc(d.mime||'')}" id="d-mime-${esc(d.id)}">
        </div>
        <div class="meta">${size?(Math.round(size/1024)+' KB · '):''}${esc(d.createdAt||'')} <span class="pill ${isImg?'pillimg':''}">${esc(d.mime||'bin')}</span></div>
        <div class="rowbtns">
          <button class="btn ok sm" onclick="saveDocMeta('${esc(d.id)}')">Salva metadati</button>
          <button class="btn sm" onclick="downloadDoc('${esc(d.id)}')">Scarica</button>
          <button class="btn sm" onclick="replaceDoc('${esc(d.id)}')">Sostituisci file</button>
          <button class="btn dng sm" onclick="delDoc('${esc(d.id)}')">Elimina</button>
        </div>
      </div></details>`;
  }).join('');
  document.getElementById('main').innerHTML=head+body;
}
function findDoc(id){ return (_idbCache['documents']||[]).find(d=>String(d.id)===String(id)); }
async function saveDocMeta(id){
  const d=findDoc(id); if(!d){ toast('Documento non trovato','err'); return; }
  d.vehicleId=document.getElementById('d-vid-'+id).value;
  d.tipo=document.getElementById('d-tipo-'+id).value;
  d.nome=document.getElementById('d-nome-'+id).value;
  d.mime=document.getElementById('d-mime-'+id).value;
  await idbPut('documents',d); toast('Metadati salvati','ok'); await reloadAll();
}
function downloadDoc(id){
  const d=findDoc(id); if(!d||!d.data){ toast('Nessun dato','err'); return; }
  const blob=new Blob([d.data],{type:d.mime||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=d.nome||(d.id+'.bin'); a.click();
}
function replaceDoc(id){
  const d=findDoc(id); if(!d) return;
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    d.data=await f.arrayBuffer(); d.mime=f.type||d.mime; d.nome=f.name;
    await idbPut('documents',d); toast('File sostituito','ok'); await reloadAll();
  };
  inp.click();
}
function delDoc(id){
  confirmDanger('Eliminare documento?','Il file binario verrà rimosso da IndexedDB.',async()=>{
    await idbDel('documents',id); toast('Documento eliminato','ok'); await reloadAll();
  });
}
function addDoc(){
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    let id; try{ id=crypto.randomUUID(); }catch(_){ id='doc-'+Date.now(); }
    const doc={id, vehicleId:'', tipo:'Altro', nome:f.name, mime:f.type, data:await f.arrayBuffer(), createdAt:new Date().toISOString()};
    await idbPut('documents',doc); toast('Documento caricato — imposta vehicleId/tipo','ok'); await reloadAll();
  };
  inp.click();
}

// ── IndexedDB: foto veicoli ──
function renderIdbPhotos(s){
  const ph=_idbCache['vehicle_photos']||[];
  const list=ph.filter(matchFilter);
  const head=`
    <div class="stbar">
      <div><div class="sttitle">Foto veicoli (IDB)</div><div class="stkey">VehicleCarePro · vehicle_photos[${ph.length}]</div></div>
      <div class="sp"></div>
      <button class="btn acc sm" onclick="addPhoto()">+ Aggiungi</button>
      <button class="btn dng sm" onclick="wipeStore('idb_photos')">Svuota</button>
    </div>
    <div class="hint">Foto mostrate in dashboard. Chiave = <span class="meta">vehicleId</span>. Sostituisci o elimina per ciascun veicolo.</div>
    <input class="search" placeholder="filtra per vehicleId…" value="${esc(filter)}" oninput="filter=this.value;renderMain();this.focus();">`;
  let body;
  if(ph.length===0) body=`<div class="empty">Nessuna foto in IndexedDB.</div>`;
  else if(list.length===0) body=`<div class="empty">Nessuna foto corrisponde al filtro.</div>`;
  else body=list.map(p=>{
    const len=(p.dataUrl||'').length;
    return `<details class="rec">
      <summary><img class="thumb" src="${p.dataUrl||''}">
        <span class="sum">${esc(p.vehicleId||'—')}</span>
        <span class="sub">${Math.round(len/1024)} KB</span>
        <span class="chev">▾</span></summary>
      <div class="body">
        <img src="${p.dataUrl||''}" style="width:100%;max-height:240px;object-fit:contain;border-radius:9px;background:#0b0e12;border:1px solid var(--bd);margin-bottom:11px;">
        <div class="kv"><label>vehicleId</label><input value="${esc(p.vehicleId||'')}" id="p-vid-${esc(p.vehicleId)}"></div>
        <div class="rowbtns">
          <button class="btn ok sm" onclick="savePhotoVid('${esc(p.vehicleId)}')">Salva vehicleId</button>
          <button class="btn sm" onclick="replacePhoto('${esc(p.vehicleId)}')">Sostituisci immagine</button>
          <button class="btn dng sm" onclick="delPhoto('${esc(p.vehicleId)}')">Elimina</button>
        </div>
      </div></details>`;
  }).join('');
  document.getElementById('main').innerHTML=head+body;
}
function findPhoto(vid){ return (_idbCache['vehicle_photos']||[]).find(p=>String(p.vehicleId)===String(vid)); }
async function savePhotoVid(vid){
  const p=findPhoto(vid); if(!p) return;
  const nv=document.getElementById('p-vid-'+vid).value.trim();
  if(!nv){ toast('vehicleId vuoto','err'); return; }
  if(nv!==p.vehicleId){ await idbDel('vehicle_photos',p.vehicleId); }
  await idbPut('vehicle_photos',{vehicleId:nv,dataUrl:p.dataUrl}); toast('vehicleId aggiornato','ok'); await reloadAll();
}
function fileToDataUrl(f){ return new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f); }); }
function replacePhoto(vid){
  const p=findPhoto(vid); if(!p) return;
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    const url=await fileToDataUrl(f); await idbPut('vehicle_photos',{vehicleId:p.vehicleId,dataUrl:url});
    toast('Immagine sostituita','ok'); await reloadAll();
  };
  inp.click();
}
function delPhoto(vid){
  confirmDanger('Eliminare foto?','La foto del veicolo verrà rimossa.',async()=>{
    await idbDel('vehicle_photos',vid); toast('Foto eliminata','ok'); await reloadAll();
  });
}
function addPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    const url=await fileToDataUrl(f);
    await idbPut('vehicle_photos',{vehicleId:'NUOVO-'+Date.now(),dataUrl:url});
    toast('Foto aggiunta — imposta il vehicleId corretto','ok'); await reloadAll();
  };
  inp.click();
}

// ─────────────────────────────────────────────
//  Azzeramenti / Export
// ─────────────────────────────────────────────
function wipeStore(id){
  const s=storeById(id);
  confirmDanger('Svuotare “'+s.label+'”?', 'Tutti i record di questo store verranno eliminati.', async()=>{
    if(s.kind==='ls-array') lsSet(s.key,[]);
    else if(s.kind==='ls-object') lsSet(s.key,{});
    else if(s.kind.startsWith('idb')) await idbClear(s.store);
    toast(s.label+' svuotato','ok'); await reloadAll();
  }, 'SVUOTA');
}
function wipeAll(){
  confirmDanger('Azzerare TUTTO il database?',
    'Verranno cancellati <b>tutti</b> i dati VehicleCare: localStorage e IndexedDB (documenti e foto). Irreversibile.',
    async()=>{
      STORES.forEach(s=>{ if(s.key) localStorage.removeItem(s.key); });
      try{ await idbClear('documents'); }catch(e){}
      try{ await idbClear('vehicle_photos'); }catch(e){}
      toast('Database azzerato','ok'); await reloadAll();
    }, 'AZZERA');
}
function exportAll(){
  const dump={ _meta:{app:'VehicleCare', exportedAt:new Date().toISOString(), source:'db-editor'}, localStorage:{} };
  STORES.forEach(s=>{ if(s.key){ const raw=localStorage.getItem(s.key); if(raw!==null){ try{ dump.localStorage[s.key]=JSON.parse(raw); }catch(e){ dump.localStorage[s.key]=raw; } } } });
  dump.indexedDB={ documents:(_idbCache['documents']||[]).map(d=>({id:d.id,vehicleId:d.vehicleId,tipo:d.tipo,nome:d.nome,mime:d.mime,bytes:d.data?(d.data.byteLength||0):0,createdAt:d.createdAt})),
                   vehicle_photos:(_idbCache['vehicle_photos']||[]).map(p=>({vehicleId:p.vehicleId,bytes:(p.dataUrl||'').length})) };
  const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='vcp_db_dump_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Export JSON (binari IDB esclusi — usa il backup ZIP dell\'app per quelli)','ok');
}

// ─────────────────────────────────────────────
//  Avvio
// ─────────────────────────────────────────────
(async function(){
  try{ _idbCache['documents']=await idbAll('documents'); }catch(e){ _idbCache['documents']=[]; }
  try{ _idbCache['vehicle_photos']=await idbAll('vehicle_photos'); }catch(e){ _idbCache['vehicle_photos']=[]; }
  renderChips(); renderMain();
})();
</script>
