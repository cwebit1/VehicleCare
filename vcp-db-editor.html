<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>VehicleCare · DB Editor</title>
<style>
  :root{ --bg:#0f1318;--panel:#161b22;--panel2:#1c232d;--bd:#243040;--bd2:#1e2733;--tx:#e6edf3;--mut:#8b95a3;--acc:#fb923c;--dng:#f87171;--dngbg:#3a1d1d;--ok:#34d399;--okbg:#13312a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace; --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);}
  body{padding-bottom:48px;}
  header{position:sticky;top:0;z-index:20;background:#0b0e12;border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top) 12px 0;}
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 0 10px;}
  .logo{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:9px;height:9px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);}
  .logo small{font-family:var(--mono);font-weight:500;color:var(--mut);font-size:11px;}
  .htools{margin-left:auto;display:flex;gap:6px;}
  .ic{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .ic:active{transform:scale(.96);} .ic.dng{color:var(--dng);border-color:#552;background:var(--dngbg);}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center;}
  .chip .n{font-family:var(--mono);font-size:11px;background:#0b0e12;border-radius:999px;padding:1px 7px;}
  .chip.act{color:#0b0e12;background:var(--acc);border-color:var(--acc);font-weight:800;} .chip.act .n{background:rgba(0,0,0,.25);color:#1a1208;}
  .chip.idb{border-style:dashed;}
  main{padding:14px 12px;max-width:1100px;margin:0 auto;}
  .stbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sttitle{font-size:17px;font-weight:800;} .stkey{font-family:var(--mono);font-size:11px;color:var(--mut);} .stbar .sp{flex:1;}
  .btn{border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ui);}
  .btn:active{transform:scale(.97);} .btn.acc{background:var(--acc);color:#0b0e12;border-color:var(--acc);} .btn.ok{background:var(--okbg);color:var(--ok);border-color:#1d5;} .btn.dng{background:var(--dngbg);color:var(--dng);border-color:#633;} .btn.sm{padding:6px 9px;font-size:11px;}
  .search{width:100%;background:var(--panel);border:1px solid var(--bd);border-radius:9px;color:var(--tx);padding:10px 12px;font-size:13px;font-family:var(--mono);margin-bottom:12px;outline:none;} .search:focus{border-color:var(--acc);}
  .hint{font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.5;}
  .empty{text-align:center;color:var(--mut);padding:34px 0;font-size:13px;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--mut);}
  /* Tabella */
  .tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:11px;background:var(--panel);-webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:12px;}
  .grid th{background:#0b0e12;color:var(--mut);font-weight:700;text-align:left;padding:9px 10px;border-right:1px solid var(--bd2);white-space:nowrap;font-size:11px;position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--bd);}
  .grid td{padding:3px 5px;border-bottom:1px solid var(--bd2);border-right:1px solid var(--bd2);vertical-align:middle;}
  .grid tbody tr:last-child td{border-bottom:none;}
  .grid th:first-child,.grid td:first-child{position:sticky;left:0;z-index:1;}
  .grid td:first-child{background:var(--panel);}
  .grid th:first-child{background:#0b0e12;z-index:3;}
  .tcell{background:transparent;border:1px solid transparent;border-radius:6px;color:var(--tx);padding:6px 7px;font-family:var(--mono);font-size:12px;min-width:96px;max-width:280px;width:100%;outline:none;}
  .tcell:focus{border-color:var(--acc);background:#0b0e12;}
  .cellbtn{background:#0b0e12;border:1px solid var(--bd);border-radius:6px;color:var(--acc);padding:6px 9px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;}
  .delbtn{background:var(--dngbg);border:1px solid #633;border-radius:7px;color:var(--dng);width:32px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .delbtn:active{transform:scale(.92);}
  .miniact{display:flex;gap:5px;}
  .iconbtn{background:#0b0e12;border:1px solid var(--bd);border-radius:6px;color:var(--tx);width:30px;height:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
  .idxc{color:var(--mut);font-size:11px;text-align:center;min-width:26px;}
  .thumb{width:42px;height:31px;border-radius:5px;object-fit:cover;background:#0b0e12;border:1px solid var(--bd);display:block;}
  .chk{width:18px;height:18px;accent-color:var(--ok);}
  .imgprev{width:100%;max-height:220px;object-fit:contain;border-radius:9px;background:#0b0e12;border:1px solid var(--bd);}
  /* Editor annidato (mini) */
  .frow{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px solid var(--bd2);}
  .flab{font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:8px;}
  .cell{background:#0b0e12;border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:9px 10px;font-size:13px;font-family:var(--mono);outline:none;width:100%;} .cell:focus{border-color:var(--acc);}
  textarea.cell{resize:vertical;line-height:1.5;min-height:64px;}
  .grp{border:1px solid var(--bd);border-radius:10px;margin:9px 0;background:var(--panel2);}
  .grp>summary{list-style:none;cursor:pointer;padding:9px 11px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;} .grp>summary::-webkit-details-marker{display:none;}
  .grp .gk{font-weight:700;color:var(--tx);} .grp .gc{color:var(--mut);font-size:11px;} .gin{padding:2px 11px 10px;border-top:1px solid var(--bd);}
  .addrow{padding:9px 0 2px;}
  .xbtn{margin-left:auto;background:var(--dngbg);color:var(--dng);border:1px solid #633;border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer;flex:0 0 auto;}
  .tog{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;} .tog input{opacity:0;width:0;height:0;position:absolute;}
  .tog .ts{position:absolute;inset:0;background:#33415a;border-radius:26px;transition:.15s;cursor:pointer;} .tog .ts:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;}
  .tog input:checked + .ts{background:var(--ok);} .tog input:checked + .ts:before{left:23px;}
  .togwrap{display:flex;align-items:center;gap:10px;} .togwrap .tv{font-family:var(--mono);font-size:12px;color:var(--mut);}
  .rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0b0e12;border:1px solid var(--bd);border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;z-index:60;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);} #toast.ok{border-color:#1d5;color:var(--ok);} #toast.err{border-color:#633;color:var(--dng);}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;} #ov.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:420px;width:100%;}
  .modal h3{margin:0 0 8px;font-size:16px;} .modal p{margin:0 0 14px;font-size:13px;color:var(--mut);line-height:1.55;} .modal .mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .modal input,.modal textarea{width:100%;background:#0b0e12;border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:10px;font-family:var(--mono);margin-bottom:14px;outline:none;}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo"><span class="dot"></span>DB&nbsp;Editor <small>VehicleCare</small></div>
    <div class="htools">
      <button class="ic" onclick="reloadAll()">↻ Ricarica</button>
      <button class="ic" onclick="exportAll()">⤓ Esporta</button>
      <button class="ic dng" onclick="wipeAll()">⚠ Azzera</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="ov"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const TRASH='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
const STORES=[
  {id:'vehicles',key:'vcp_vehicles',kind:'ls-array',label:'Veicoli'},
  {id:'checks',key:'vcp_checks',kind:'ls-array',label:'Check'},
  {id:'interventions',key:'vcp_interventions',kind:'ls-array',label:'Interventi'},
  {id:'segnalazioni',key:'vcp_segnalazioni',kind:'ls-array',label:'Segnalazioni'},
  {id:'suppliers',key:'vcp_suppliers',kind:'ls-array',label:'Fornitori'},
  {id:'tires',key:'vcp_tires',kind:'ls-array',label:'Gomme'},
  {id:'tiresStorico',key:'vcp_tires_storico',kind:'ls-array',label:'Storico gomme'},
  {id:'tireInterventions',key:'vcp_tire_interventions',kind:'ls-array',label:'Interventi gomme'},
  {id:'settings',key:'vcp_settings',kind:'ls-object',label:'Impostazioni'},
  {id:'calibration',key:'vcp_calibration',kind:'ls-object',label:'Calibrazione'},
  {id:'documents_ls',key:'vcp_documents',kind:'ls-array',label:'Documenti (LS legacy)'},
  {id:'idb_documents',kind:'idb-docs',store:'documents',label:'Documenti (IDB)'},
  {id:'idb_photos',kind:'idb-photos',store:'vehicle_photos',label:'Foto veicoli (IDB)'},
];
const IDB_NAME='VehicleCarePro',IDB_VER=2;
let current=STORES[0].id, filter='', _idbCache={};
let _editing=null,_fmap={},_cmap={},_fid=0,_cid=0,_bigRef=null;

function lsGet(key,kind){ const raw=localStorage.getItem(key); if(raw===null) return kind==='ls-object'?{}:[]; try{ return JSON.parse(raw); }catch(e){ return kind==='ls-object'?{}:[]; } }
function lsSet(key,val){ localStorage.setItem(key,JSON.stringify(val)); }
function storeById(id){ return STORES.find(s=>s.id===id); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function uuid(){ try{ return crypto.randomUUID(); }catch(e){ return 'x-'+Date.now()+'-'+Math.random().toString(16).slice(2,8); } }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function valType(v){ if(v===null) return 'null'; if(Array.isArray(v)) return 'array'; const t=typeof v; if(t==='object') return 'object'; if(t==='boolean') return 'boolean'; if(t==='number') return 'number'; return 'string'; }
function countOf(s){ try{ if(s.kind==='ls-array') return lsGet(s.key,s.kind).length; if(s.kind==='ls-object') return Object.keys(lsGet(s.key,s.kind)).length; if(s.kind.indexOf('idb')===0) return (_idbCache[s.store]||[]).length; }catch(e){} return 0; }
function fileToDataUrl(f){ return new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f); }); }

// IndexedDB
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,IDB_VER);
  r.onupgradeneeded=e=>{ const db=e.target.result,tx=e.target.transaction; let st;
    if(!db.objectStoreNames.contains('documents')) st=db.createObjectStore('documents',{keyPath:'id'}); else st=tx.objectStore('documents');
    if(st && !st.indexNames.contains('vehicleId')) st.createIndex('vehicleId','vehicleId',{unique:false});
    if(!db.objectStoreNames.contains('vehicle_photos')) db.createObjectStore('vehicle_photos',{keyPath:'vehicleId'}); };
  r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); }); }
async function idbAll(store){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const rq=tx.objectStore(store).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=e=>rej(e.target.error); }); }
async function idbPut(store,val){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=res; tx.onerror=e=>rej(e.target.error); }); }
async function idbDel(store,key){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=res; tx.onerror=e=>rej(e.target.error); }); }
async function idbClear(store){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).clear(); tx.oncomplete=res; tx.onerror=e=>rej(e.target.error); }); }

// UI base
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type?' '+type:''); clearTimeout(t._t); t._t=setTimeout(()=>t.className=t.className.replace('show','').trim(),2200); }
function flash(el){ if(!el) return; const o=el.style.borderColor; el.style.borderColor='var(--ok)'; setTimeout(()=>el.style.borderColor=o,500); }
function confirmDanger(title,body,cb,word){ const ov=document.getElementById('ov'),m=document.getElementById('modal');
  if(word){ m.innerHTML='<h3>'+esc(title)+'</h3><p>'+body+'</p><input id="cfx" placeholder="scrivi '+word+'" autocomplete="off"><div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button><button class="btn dng" id="cfgo">Conferma</button></div>'; ov.classList.add('show'); document.getElementById('cfgo').onclick=()=>{ if((document.getElementById('cfx').value||'').trim().toUpperCase()!==word){ toast('Parola errata','err'); return; } closeOv(); cb(); }; }
  else { m.innerHTML='<h3>'+esc(title)+'</h3><p>'+body+'</p><div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button><button class="btn dng" id="cfgo">Conferma</button></div>'; ov.classList.add('show'); document.getElementById('cfgo').onclick=()=>{ closeOv(); cb(); }; } }
function promptText(title,cb){ const ov=document.getElementById('ov'),m=document.getElementById('modal'); m.innerHTML='<h3>'+esc(title)+'</h3><input id="cfx" placeholder="nome" autocomplete="off"><div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button><button class="btn acc" id="cfgo">Aggiungi</button></div>'; ov.classList.add('show'); setTimeout(()=>document.getElementById('cfx').focus(),50); document.getElementById('cfgo').onclick=()=>{ const v=(document.getElementById('cfx').value||'').trim(); if(!v){ toast('Vuoto','err'); return; } closeOv(); cb(v); }; }
function closeOv(){ document.getElementById('ov').classList.remove('show'); }

function renderChips(){ const c=document.getElementById('chips'); c.innerHTML=STORES.map(s=>'<div class="chip'+(s.id===current?' act':'')+(s.kind.indexOf('idb')===0?' idb':'')+'" onclick="selectStore(\''+s.id+'\')">'+esc(s.label)+'<span class="n">'+countOf(s)+'</span></div>').join(''); const a=c.querySelector('.act'); if(a) a.scrollIntoView({inline:'center',block:'nearest'}); }
function selectStore(id){ current=id; filter=''; _editing=null; renderChips(); renderMain(); window.scrollTo(0,0); }
async function reloadAll(){ try{ _idbCache['documents']=await idbAll('documents'); }catch(e){ _idbCache['documents']=[]; } try{ _idbCache['vehicle_photos']=await idbAll('vehicle_photos'); }catch(e){ _idbCache['vehicle_photos']=[]; } _editing=null; renderChips(); renderMain(); toast('Ricaricato','ok'); }
function renderMain(){ _editing=null; const s=storeById(current); if(s.kind==='ls-array') return renderArray(s); if(s.kind==='ls-object') return renderObject(s); if(s.kind==='idb-docs') return renderDocs(s); if(s.kind==='idb-photos') return renderPhotos(s); }
function matchFilter(rec){ if(!filter) return true; try{ return JSON.stringify(rec).toLowerCase().includes(filter.toLowerCase()); }catch(e){ return true; } }

// ── Scrittura valore (array o oggetto) ──
function writeVal(e,value){ const s=storeById(e.storeId);
  if(e.index!=null){ const arr=lsGet(s.key,'ls-array'); if(!arr[e.index]) return; if(e.col!=null) arr[e.index][e.col]=value; else arr[e.index]=value; lsSet(s.key,arr); }
  else { const o=lsGet(s.key,'ls-object'); if(e.col!=null) o[e.col]=value; else lsSet(s.key,value); if(e.col!=null) lsSet(s.key,o); } }
function curVal(e){ const s=storeById(e.storeId); if(e.index!=null){ const arr=lsGet(s.key,'ls-array'); return e.col!=null?(arr[e.index]||{})[e.col]:arr[e.index]; } const o=lsGet(s.key,'ls-object'); return e.col!=null?o[e.col]:o; }
function refOf(el){ const i=el.dataset.i; return {storeId:el.dataset.store, index:(i===''||i==null)?null:Number(i), col:el.dataset.col}; }

// ── Celle generiche ──
function cellHtml(store,i,col,v){ const t=valType(v); const ds='data-store="'+store+'" data-i="'+i+'" data-col="'+esc(col)+'"';
  if(t==='boolean') return '<input type="checkbox" class="chk" '+(v?'checked':'')+' '+ds+' data-t="boolean" onchange="setCell(this)">';
  if(t==='object'||t==='array') return '<button class="cellbtn" '+ds+' onclick="openNested(this)">'+(t==='array'?'['+v.length+']':'{'+Object.keys(v).length+'}')+'</button>';
  const sv=v==null?'':String(v);
  if(sv.indexOf('data:image')===0) return '<button class="cellbtn" '+ds+' onclick="openCellBig(this)">🖼 '+Math.round(sv.length/1024)+'KB</button>';
  if(sv.length>80) return '<button class="cellbtn" '+ds+' onclick="openCellBig(this)">✎ testo…</button>';
  const tt=t==='null'?'null':(t==='number'?'number':'string');
  return '<input class="tcell" value="'+esc(sv)+'" '+ds+' data-t="'+tt+'" onchange="setCell(this)">';
}
function setCell(el){ const e=refOf(el); const t=el.dataset.t; let v;
  if(t==='boolean') v=el.checked;
  else if(t==='number'){ const raw=el.value.trim(); v=raw===''?null:(isNaN(Number(raw))?el.value:Number(raw)); }
  else if(t==='null') v=el.value===''?null:el.value;
  else v=el.value;
  writeVal(e,v); flash(el); renderChips(); }

// ── Vista TABELLA (array) ──
function cols(arr){ const seen=[]; arr.forEach(r=>{ if(r&&typeof r==='object'&&!Array.isArray(r)) Object.keys(r).forEach(k=>{ if(seen.indexOf(k)<0) seen.push(k); }); }); seen.sort((a,b)=> a==='id'?-1:b==='id'?1:0); return seen; }
function renderArray(s){ const arr=lsGet(s.key,'ls-array');
  const head='<div class="stbar"><div><div class="sttitle">'+esc(s.label)+'</div><div class="stkey">'+s.key+' · array['+arr.length+']</div></div><div class="sp"></div>'
    +'<button class="btn acc sm" onclick="addRow(\''+s.id+'\')">+ Riga</button>'
    +'<button class="btn sm" onclick="addCol(\''+s.id+'\')">+ Campo</button>'
    +'<button class="btn dng sm" onclick="wipeStore(\''+s.id+'\')">Svuota</button></div>'
    +'<input class="search" id="srch" placeholder="filtra…" value="'+esc(filter)+'" oninput="filter=this.value;fillGrid(\''+s.id+'\')"><div id="lst"></div>';
  document.getElementById('main').innerHTML=head; fillGrid(s.id); }
function fillGrid(id){ const s=storeById(id), arr=lsGet(s.key,'ls-array'), cs=cols(arr);
  const idxs=arr.map((r,i)=>i).filter(i=>matchFilter(arr[i]));
  let html;
  if(arr.length===0) html='<div class="empty">Nessun record. Usa “+ Riga”.</div>';
  else { let th='<tr><th></th><th>#</th>'+cs.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
    let rows=idxs.map(i=>{ const r=arr[i]||{};
      let tds='<td><button class="delbtn" data-store="'+id+'" data-i="'+i+'" onclick="deleteRow(this)">'+TRASH+'</button></td><td class="idxc">'+i+'</td>';
      tds+=cs.map(c=>'<td>'+cellHtml(id,i,c, (r&&typeof r==='object')?r[c]:undefined)+'</td>').join('');
      return '<tr>'+tds+'</tr>'; }).join('');
    html='<div class="tablewrap"><table class="grid"><thead>'+th+'</thead><tbody>'+rows+'</tbody></table></div>';
    if(idxs.length===0) html='<div class="empty">Nessun record corrisponde al filtro.</div>';
  }
  const el=document.getElementById('lst'); if(el) el.innerHTML=html; }
function deleteRow(btn){ const id=btn.dataset.store, i=Number(btn.dataset.i), s=storeById(id);
  confirmDanger('Eliminare record?','Riga #'+i+' di <b>'+esc(s.label)+'</b>.',()=>{ const arr=lsGet(s.key,'ls-array'); arr.splice(i,1); lsSet(s.key,arr); toast('Eliminato','ok'); renderChips(); fillGrid(id); }); }
function addRow(id){ const s=storeById(id), arr=lsGet(s.key,'ls-array'); arr.push({id:uuid()}); lsSet(s.key,arr); toast('Riga aggiunta','ok'); renderChips(); fillGrid(id); window.scrollTo(0,document.body.scrollHeight); }
function addCol(id){ const s=storeById(id); promptText('Nuovo campo (colonna)', name=>{ const arr=lsGet(s.key,'ls-array'); arr.forEach(r=>{ if(r&&typeof r==='object'&&!(name in r)) r[name]=''; }); lsSet(s.key,arr); fillGrid(id); }); }

// ── Vista OGGETTO (settings/calibration): tabella campo|valore ──
function renderObject(s){ const obj=lsGet(s.key,'ls-object'), keys=Object.keys(obj);
  let body;
  if(keys.length===0) body='<div class="empty">Oggetto vuoto.</div>';
  else { let rows=keys.map(k=>'<tr><td><button class="delbtn" data-store="'+s.id+'" data-col="'+esc(k)+'" onclick="deleteKey(this)">'+TRASH+'</button></td><td style="color:var(--mut);white-space:nowrap;padding:6px 9px;">'+esc(k)+'</td><td>'+cellHtml(s.id,'',k,obj[k])+'</td></tr>').join('');
    body='<div class="tablewrap"><table class="grid"><thead><tr><th></th><th>campo</th><th>valore</th></tr></thead><tbody>'+rows+'</tbody></table></div>'; }
  document.getElementById('main').innerHTML='<div class="stbar"><div><div class="sttitle">'+esc(s.label)+'</div><div class="stkey">'+s.key+' · object · '+keys.length+' campi</div></div><div class="sp"></div>'
    +'<button class="btn acc sm" onclick="addKey(\''+s.id+'\')">+ Campo</button><button class="btn dng sm" onclick="wipeStore(\''+s.id+'\')">Svuota</button></div>'+body; }
function deleteKey(btn){ const s=storeById(btn.dataset.store), col=btn.dataset.col; confirmDanger('Eliminare campo?','“'+esc(col)+'” da <b>'+esc(s.label)+'</b>.',()=>{ const o=lsGet(s.key,'ls-object'); delete o[col]; lsSet(s.key,o); toast('Eliminato','ok'); renderChips(); renderObject(s); }); }
function addKey(id){ const s=storeById(id); promptText('Nuovo campo', name=>{ const o=lsGet(s.key,'ls-object'); if(name in o){ toast('Esiste già','err'); return; } o[name]=''; lsSet(s.key,o); renderChips(); renderObject(s); }); }

// ── Editor annidato (oggetti/array dentro una cella) ──
function getAt(root,path){ let o=root; for(let k=0;k<path.length;k++) o=o[path[k]]; return o; }
function setAt(root,path,val){ if(path.length===0) return; let o=root; for(let k=0;k<path.length-1;k++) o=o[path[k]]; o[path[path.length-1]]=val; }
function regF(path,type){ const id=++_fid; _fmap[id]={path:path.slice(),type}; return id; }
function regC(path,kind){ const id=++_cid; _cmap[id]={path:path.slice(),kind}; return id; }
function openNested(btn){ const e=refOf(btn); _editing={storeId:e.storeId,index:e.index,col:e.col,data:clone(curVal(e))}; renderNested(); }
function renderNested(){ _fmap={};_cmap={};_fid=0;_cid=0; const e=_editing,s=storeById(e.storeId);
  const fields=(e.data&&typeof e.data==='object')?renderEntries(e.data,[]):primRow(e.col,e.data,[ ],valType(e.data),'');
  document.getElementById('main').innerHTML='<div class="rowbtns" style="margin-bottom:10px;"><button class="btn sm" onclick="renderMain()">‹ Indietro</button></div>'
    +'<div class="stbar"><div><div class="sttitle">'+esc(s.label)+(e.index!=null?(' · record '+e.index):'')+' · '+esc(e.col)+'</div><div class="stkey">campo annidato</div></div></div>'
    +'<div class="hint">Ogni valore ha la sua cella. Premi <b>Salva</b> per applicare.</div>'+fields
    +'<div class="rowbtns" style="margin-top:16px;"><button class="btn ok" onclick="saveNested()">Salva</button><button class="btn" onclick="renderMain()">Annulla</button></div>'; }
function renderEntries(val,path){ let html='';
  if(Array.isArray(val)){ const cid=regC(path,'array'); val.forEach((el,i)=>{ html+=renderEntry(String(i),el,path.concat(i),true,cid,i); }); html+='<div class="addrow"><button class="btn sm" onclick="addElem('+cid+')">+ elemento</button></div>'; }
  else { const cid=regC(path,'object'); Object.keys(val).forEach(k=>{ html+=renderEntry(k,val[k],path.concat(k),false,cid,k); }); html+='<div class="addrow"><button class="btn sm" onclick="addField('+cid+')">+ campo</button></div>'; }
  return html; }
function renderEntry(label,v,path,inArray,pcid,keyOrIdx){ const t=valType(v);
  const rm=inArray?'<button class="xbtn" onclick="removeElem('+pcid+','+keyOrIdx+')">✕</button>':'<button class="xbtn" onclick="removeField('+pcid+','+JSON.stringify(String(keyOrIdx))+')">✕</button>';
  if(t==='object'||t==='array'){ const cnt=t==='array'?'['+v.length+']':'{'+Object.keys(v).length+'}'; return '<details class="grp" open><summary><span class="gk">'+esc(label)+'</span><span class="gc">'+cnt+'</span>'+rm+'</summary><div class="gin">'+renderEntries(v,path)+'</div></details>'; }
  return primRow(label,v,path,t,rm); }
function primRow(label,v,path,t,rm){ const fid=regF(path,t); let cell;
  if(t==='boolean') cell='<div class="togwrap"><label class="tog"><input type="checkbox" data-fid="'+fid+'" '+(v?'checked':'')+' onchange="onField('+fid+')"><span class="ts"></span></label><span class="tv" id="tv-'+fid+'">'+(v?'true':'false')+'</span></div>';
  else if(t==='number') cell='<input class="cell" inputmode="decimal" data-fid="'+fid+'" value="'+esc(v)+'" onchange="onField('+fid+')">';
  else if(t==='null') cell='<input class="cell" data-fid="'+fid+'" value="" placeholder="(null)" onchange="onField('+fid+')">';
  else { const sv=String(v);
    if(sv.indexOf('data:image')===0) return '<div class="frow"><div class="flab">'+esc(label)+' <span class="meta">immagine · '+Math.round(sv.length/1024)+' KB</span>'+rm+'</div><img class="imgprev" src="'+sv+'"><div class="rowbtns"><button class="btn sm" onclick="replaceImg('+fid+')">Sostituisci</button><button class="btn dng sm" onclick="clearImg('+fid+')">Rimuovi</button></div></div>';
    if(sv.length>110||sv.indexOf('\n')>=0) cell='<textarea class="cell" data-fid="'+fid+'" rows="3" onchange="onField('+fid+')">'+esc(sv)+'</textarea>';
    else cell='<input class="cell" data-fid="'+fid+'" value="'+esc(sv)+'" onchange="onField('+fid+')">'; }
  return '<div class="frow"><div class="flab">'+esc(label)+rm+'</div>'+cell+'</div>'; }
function coerceF(fid){ const m=_fmap[fid], el=document.querySelector('[data-fid="'+fid+'"]'); if(!el) return undefined; if(m.type==='boolean') return el.checked; if(m.type==='number'){ const raw=el.value.trim(); if(raw==='') return null; const n=Number(raw); return isNaN(n)?el.value:n; } if(m.type==='null') return el.value===''?null:el.value; return el.value; }
function onField(fid){ const v=coerceF(fid); if(v===undefined) return; setAt(_editing.data,_fmap[fid].path,v); const tv=document.getElementById('tv-'+fid); if(tv) tv.textContent=v?'true':'false'; }
function syncFields(){ Object.keys(_fmap).forEach(fid=>{ const v=coerceF(fid); if(v!==undefined) setAt(_editing.data,_fmap[fid].path,v); }); }
function addField(cid){ syncFields(); const obj=getAt(_editing.data,_cmap[cid].path); promptText('Nuovo campo',name=>{ if(name in obj){ toast('Esiste già','err'); return; } obj[name]=''; renderNested(); }); }
function removeField(cid,key){ syncFields(); const obj=getAt(_editing.data,_cmap[cid].path); delete obj[key]; renderNested(); }
function addElem(cid){ syncFields(); const arr=getAt(_editing.data,_cmap[cid].path); let tpl=''; if(arr.length){ const f=arr[0]; if(Array.isArray(f)) tpl=[]; else if(f&&typeof f==='object') tpl={}; else if(typeof f==='number') tpl=0; else if(typeof f==='boolean') tpl=false; } arr.push(tpl); renderNested(); }
function removeElem(cid,idx){ syncFields(); const arr=getAt(_editing.data,_cmap[cid].path); arr.splice(idx,1); renderNested(); }
function replaceImg(fid){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; setAt(_editing.data,_fmap[fid].path,await fileToDataUrl(f)); renderNested(); }; inp.click(); }
function clearImg(fid){ setAt(_editing.data,_fmap[fid].path,''); renderNested(); }
function saveNested(){ syncFields(); writeVal(_editing,_editing.data); toast('Salvato','ok'); renderChips(); renderMain(); }

// ── Cella "grande" (testo lungo / immagine) ──
function openCellBig(btn){ const e=refOf(btn); _bigRef=e; const v=curVal(e), sv=v==null?'':String(v); const ov=document.getElementById('ov'),m=document.getElementById('modal');
  if(sv.indexOf('data:image')===0) m.innerHTML='<h3>Immagine</h3><img class="imgprev" src="'+sv+'"><div class="mrow"><button class="btn" onclick="closeOv()">Chiudi</button><button class="btn" onclick="bigReplaceImg()">Sostituisci</button><button class="btn dng" onclick="bigClear()">Rimuovi</button></div>';
  else m.innerHTML='<h3>Modifica testo</h3><textarea id="bigta" style="min-height:160px">'+esc(sv)+'</textarea><div class="mrow"><button class="btn" onclick="closeOv()">Annulla</button><button class="btn ok" onclick="bigSave()">Salva</button></div>';
  ov.classList.add('show'); }
function bigSave(){ writeVal(_bigRef,document.getElementById('bigta').value); closeOv(); toast('Salvato','ok'); renderMain(); }
function bigClear(){ writeVal(_bigRef,''); closeOv(); renderMain(); }
function bigReplaceImg(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; writeVal(_bigRef,await fileToDataUrl(f)); closeOv(); toast('Sostituita','ok'); renderMain(); }; inp.click(); }

// ── IDB documenti: tabella ──
function renderDocs(s){ const docs=_idbCache['documents']||[];
  const head='<div class="stbar"><div><div class="sttitle">Documenti (IDB)</div><div class="stkey">documents['+docs.length+']</div></div><div class="sp"></div><button class="btn acc sm" onclick="addDoc()">+ File</button><button class="btn dng sm" onclick="wipeStore(\'idb_documents\')">Svuota</button></div>'
    +'<input class="search" id="srch" placeholder="filtra…" value="'+esc(filter)+'" oninput="filter=this.value;fillDocs()"><div id="lst"></div>';
  document.getElementById('main').innerHTML=head; fillDocs(); }
function fillDocs(){ const docs=(_idbCache['documents']||[]).filter(matchFilter); let html;
  if((_idbCache['documents']||[]).length===0) html='<div class="empty">Nessun documento.</div>';
  else if(docs.length===0) html='<div class="empty">Nessun documento corrisponde al filtro.</div>';
  else { let rows=docs.map(d=>{ const isImg=d.mime&&d.mime.indexOf('image/')===0; const size=d.data?(d.data.byteLength||d.data.length||0):0; let thumb='<span class="thumb"></span>'; if(isImg&&d.data){ try{ thumb='<img class="thumb" src="'+URL.createObjectURL(new Blob([d.data],{type:d.mime}))+'">'; }catch(e){} }
    const inp=(field,val)=>'<input class="tcell" value="'+esc(val||'')+'" data-id="'+esc(d.id)+'" data-field="'+field+'" onchange="setDocField(this)">';
    return '<tr><td><button class="delbtn" data-id="'+esc(d.id)+'" onclick="delDoc(this)">'+TRASH+'</button></td><td>'+thumb+'</td><td>'+inp('vehicleId',d.vehicleId)+'</td><td>'+inp('tipo',d.tipo)+'</td><td>'+inp('nome',d.nome)+'</td><td>'+inp('mime',d.mime)+'</td><td class="meta">'+Math.round(size/1024)+'KB</td><td><div class="miniact"><button class="iconbtn" title="Scarica" data-id="'+esc(d.id)+'" onclick="downloadDoc(this)">⤓</button><button class="iconbtn" title="Sostituisci" data-id="'+esc(d.id)+'" onclick="replaceDoc(this)">⟳</button></div></td></tr>'; }).join('');
    html='<div class="tablewrap"><table class="grid"><thead><tr><th></th><th>img</th><th>vehicleId</th><th>tipo</th><th>nome</th><th>mime</th><th>dim</th><th>azioni</th></tr></thead><tbody>'+rows+'</tbody></table></div>'; }
  const el=document.getElementById('lst'); if(el) el.innerHTML=html; }
function findDoc(id){ return (_idbCache['documents']||[]).find(d=>String(d.id)===String(id)); }
async function setDocField(el){ const d=findDoc(el.dataset.id); if(!d) return; d[el.dataset.field]=el.value; await idbPut('documents',d); flash(el); }
function delDoc(btn){ const id=btn.dataset.id; confirmDanger('Eliminare documento?','Il file verrà rimosso da IndexedDB.',async()=>{ await idbDel('documents',id); toast('Eliminato','ok'); await reloadAll(); }); }
function downloadDoc(btn){ const d=findDoc(btn.dataset.id); if(!d||!d.data){ toast('Nessun dato','err'); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([d.data],{type:d.mime||'application/octet-stream'})); a.download=d.nome||(d.id+'.bin'); a.click(); }
function replaceDoc(btn){ const d=findDoc(btn.dataset.id); if(!d) return; const inp=document.createElement('input'); inp.type='file'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; d.data=await f.arrayBuffer(); d.mime=f.type||d.mime; d.nome=f.name; await idbPut('documents',d); toast('Sostituito','ok'); await reloadAll(); }; inp.click(); }
function addDoc(){ const inp=document.createElement('input'); inp.type='file'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; await idbPut('documents',{id:uuid(),vehicleId:'',tipo:'Altro',nome:f.name,mime:f.type,data:await f.arrayBuffer(),createdAt:new Date().toISOString()}); toast('Caricato','ok'); await reloadAll(); }; inp.click(); }

// ── IDB foto: tabella ──
function renderPhotos(s){ const ph=_idbCache['vehicle_photos']||[];
  const head='<div class="stbar"><div><div class="sttitle">Foto veicoli (IDB)</div><div class="stkey">vehicle_photos['+ph.length+']</div></div><div class="sp"></div><button class="btn acc sm" onclick="addPhoto()">+ Foto</button><button class="btn dng sm" onclick="wipeStore(\'idb_photos\')">Svuota</button></div>'
    +'<input class="search" id="srch" placeholder="filtra per vehicleId…" value="'+esc(filter)+'" oninput="filter=this.value;fillPhotos()"><div id="lst"></div>';
  document.getElementById('main').innerHTML=head; fillPhotos(); }
function fillPhotos(){ const ph=(_idbCache['vehicle_photos']||[]).filter(matchFilter); let html;
  if((_idbCache['vehicle_photos']||[]).length===0) html='<div class="empty">Nessuna foto.</div>';
  else if(ph.length===0) html='<div class="empty">Nessuna foto corrisponde al filtro.</div>';
  else { let rows=ph.map(p=>{ const len=(p.dataUrl||'').length;
    return '<tr><td><button class="delbtn" data-vid="'+esc(p.vehicleId)+'" onclick="delPhoto(this)">'+TRASH+'</button></td><td><img class="thumb" src="'+(p.dataUrl||'')+'"></td><td><input class="tcell" value="'+esc(p.vehicleId||'')+'" data-vid="'+esc(p.vehicleId)+'" onchange="setPhotoVid(this)"></td><td class="meta">'+Math.round(len/1024)+'KB</td><td><button class="iconbtn" title="Sostituisci" data-vid="'+esc(p.vehicleId)+'" onclick="replacePhoto(this)">⟳</button></td></tr>'; }).join('');
    html='<div class="tablewrap"><table class="grid"><thead><tr><th></th><th>img</th><th>vehicleId</th><th>dim</th><th>azioni</th></tr></thead><tbody>'+rows+'</tbody></table></div>'; }
  const el=document.getElementById('lst'); if(el) el.innerHTML=html; }
function findPhoto(vid){ return (_idbCache['vehicle_photos']||[]).find(p=>String(p.vehicleId)===String(vid)); }
async function setPhotoVid(el){ const p=findPhoto(el.dataset.vid); if(!p) return; const nv=el.value.trim(); if(!nv){ toast('vehicleId vuoto','err'); return; } if(nv!==p.vehicleId) await idbDel('vehicle_photos',p.vehicleId); await idbPut('vehicle_photos',{vehicleId:nv,dataUrl:p.dataUrl}); toast('Aggiornato','ok'); await reloadAll(); }
function replacePhoto(btn){ const p=findPhoto(btn.dataset.vid); if(!p) return; const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; await idbPut('vehicle_photos',{vehicleId:p.vehicleId,dataUrl:await fileToDataUrl(f)}); toast('Sostituita','ok'); await reloadAll(); }; inp.click(); }
function delPhoto(btn){ const vid=btn.dataset.vid; confirmDanger('Eliminare foto?','La foto verrà rimossa.',async()=>{ await idbDel('vehicle_photos',vid); toast('Eliminata','ok'); await reloadAll(); }); }
function addPhoto(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; await idbPut('vehicle_photos',{vehicleId:'NUOVO-'+Date.now(),dataUrl:await fileToDataUrl(f)}); toast('Aggiunta — imposta vehicleId','ok'); await reloadAll(); }; inp.click(); }

// ── Azzera / Export ──
function wipeStore(id){ const s=storeById(id); confirmDanger('Svuotare “'+s.label+'”?','Tutti i record verranno eliminati.',async()=>{ if(s.kind==='ls-array') lsSet(s.key,[]); else if(s.kind==='ls-object') lsSet(s.key,{}); else if(s.kind.indexOf('idb')===0) await idbClear(s.store); toast(s.label+' svuotato','ok'); await reloadAll(); },'SVUOTA'); }
function wipeAll(){ confirmDanger('Azzerare TUTTO?','Verranno cancellati <b>tutti</b> i dati VehicleCare (localStorage + IndexedDB). Irreversibile.',async()=>{ STORES.forEach(s=>{ if(s.key) localStorage.removeItem(s.key); }); try{ await idbClear('documents'); }catch(e){} try{ await idbClear('vehicle_photos'); }catch(e){} toast('Azzerato','ok'); await reloadAll(); },'AZZERA'); }
function exportAll(){ const dump={_meta:{app:'VehicleCare',exportedAt:new Date().toISOString(),source:'db-editor'},localStorage:{}}; STORES.forEach(s=>{ if(s.key){ const raw=localStorage.getItem(s.key); if(raw!==null){ try{ dump.localStorage[s.key]=JSON.parse(raw); }catch(e){ dump.localStorage[s.key]=raw; } } } }); dump.indexedDB={documents:(_idbCache['documents']||[]).map(d=>({id:d.id,vehicleId:d.vehicleId,tipo:d.tipo,nome:d.nome,mime:d.mime,bytes:d.data?(d.data.byteLength||0):0,createdAt:d.createdAt})),vehicle_photos:(_idbCache['vehicle_photos']||[]).map(p=>({vehicleId:p.vehicleId,bytes:(p.dataUrl||'').length}))}; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'})); a.download='vcp_db_dump_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('Export JSON','ok'); }

(async function(){ try{ _idbCache['documents']=await idbAll('documents'); }catch(e){ _idbCache['documents']=[]; } try{ _idbCache['vehicle_photos']=await idbAll('vehicle_photos'); }catch(e){ _idbCache['vehicle_photos']=[]; } renderChips(); renderMain(); })();
</script>
