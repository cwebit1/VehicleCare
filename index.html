// ═══════════════════════════════════════════════════════
//  PLANNER — funzione pura di build HTML per un mese
//  Genera tutto in memoria, non tocca il DOM.
// ═══════════════════════════════════════════════════════
function _buildMonthPanel(Y, M) {
  var now      = new Date();
  var todayStr = now.toISOString().slice(0, 10);
  var monthStr = Y + '-' + String(M + 1).padStart(2, '0');
  var daysInMonth     = new Date(Y, M + 1, 0).getDate();
  var startDayOfWeek  = (new Date(Y, M, 1).getDay() + 6) % 7; // lun=0
  // ── Range dell'intera griglia visibile (include code del mese prec./succ.) ──
  var beforeDays = startDayOfWeek;
  var afterDays  = (7 - ((beforeDays + daysInMonth) % 7)) % 7;
  var totalGridCells = beforeDays + daysInMonth + afterDays;
  function _ymd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  var gridStartDate = new Date(Y, M, 1 - beforeDays);
  var gridStartStr  = _ymd(gridStartDate);
  var gridEndStr    = _ymd(new Date(Y, M, 1 - beforeDays + (totalGridCells - 1)));
  function _cellDateStr(i){ var dt=new Date(gridStartDate); dt.setDate(dt.getDate()+i); return _ymd(dt); }
  function _idxOfDate(ds){ return Math.round((new Date(ds+'T00:00:00') - gridStartDate)/86400000); }
  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  var vehicles      = DB.vehicles().filter(function(v){ return !v.venduto; });
  var checks        = DB.checks();
  var interventions = DB.interventions();

  // Segni del giorno per mezzo: check OK, anomalia in attesa (cerchio arancione),
  // cambio gomme eseguito (cella blu) e programmato (cerchio blu). Più segni nello stesso giorno dividono la cella.
  var marks = {};
  function _mark(ds, vid, tipo, extra){
    if (!ds || ds < gridStartStr || ds > gridEndStr) return;
    var k = vid + '|' + ds;
    var l = marks[k] || (marks[k] = []);
    if (l.some(function(m){ return m.tipo===tipo; })) return;
    l.push(Object.assign({tipo:tipo, ds:ds, vid:vid}, extra||{}));
  }
  function _giornoPrima(ds){ var d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()-1); return _ymd(d); }
  function _giornoDopo(ds){ var d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+1); return _ymd(d); }

  // Mappa check del mese
  var checkMap = {};
  checks.forEach(function(c) {
    if (!c.data || c.data < gridStartStr || c.data > gridEndStr) return;
    if (!checkMap[c.data]) checkMap[c.data] = {};
    var hasAnom = c.items && c.items.some(function(it){ return it.val === 'anomalia'; });
    checkMap[c.data][c.vehicleId] = { stato: hasAnom ? 'anomalia' : 'ok', checkId: c.id };
    if (!hasAnom) _mark(c.data, c.vehicleId, 'checkOk');
  });

  // Altezza cella
  var cellBodyH = vehicles.length * PL_ROW_H + Math.max(0, vehicles.length - 1) * PL_ROW_GAP;
  var cellH     = PL_HDR_H + cellBodyH;

  // Griglia celle — un'unica passata su tutte le celle visibili (incluse code adiacenti)
  var gridHtml = '';
  for (var i = 0; i < totalGridCells; i++) {
    var dateStr   = _cellDateStr(i);
    var inMonth   = dateStr.slice(0, 7) === monthStr;
    var dnum      = parseInt(dateStr.slice(8, 10), 10);
    var isToday   = dateStr === todayStr;
    var dayChecks = checkMap[dateStr] || {};
    gridHtml += '<div class="pl-cell' + (isToday ? ' is-today' : '') + '" style="height:' + cellH + 'px;" data-date="' + dateStr + '">';
    gridHtml += '<div class="pl-cell-hdr" style="height:' + PL_HDR_H + 'px;' + (inMonth ? '' : 'color:#cbd5e1;') + '">' + dnum + '</div>';
    gridHtml += '<div style="display:flex;flex-direction:column;gap:' + PL_ROW_GAP + 'px;">';
    vehicles.forEach(function(v) {
      var ck     = dayChecks[v.id];
      var stato  = ck ? ck.stato : null;
      var cid    = ck ? ck.checkId : null;
      var cls    = '';
      var lbl    = '';
      var dataCk = cid ? ' data-check-id="' + cid + '" data-vehicle-id="' + v.id + '"' : '';
      gridHtml += '<div class="pl-vrow' + cls + '" data-vid="' + v.id + '"' + dataCk + ' style="height:' + PL_ROW_H + 'px;">' + lbl + '</div>';
    });
    gridHtml += '</div></div>';
  }

  // Segmenti barre intervento
  var mStart = Y + '-' + String(M+1).padStart(2,'0') + '-01';
  var mEnd   = Y + '-' + String(M+1).padStart(2,'0') + '-' + String(daysInMonth).padStart(2,'0');
  var segments = [];

  // Helper riutilizzabile: spezza un intervallo [startDateStr,endDateStr] (clippato alla
  // griglia visibile, code adiacenti incluse) in segmenti contigui riga/colonna e li accoda.
  function _pushDateRangeSegments(startDateStr, endDateStr, item) {
    if (!startDateStr) return;
    if (!endDateStr) endDateStr = startDateStr;
    if (startDateStr > gridEndStr || endDateStr < gridStartStr) return;
    var absStart = startDateStr > gridStartStr ? startDateStr : gridStartStr;
    var absEnd   = endDateStr < gridEndStr ? endDateStr : gridEndStr;
    if (absEnd < absStart) return;
    var idxStart = _idxOfDate(absStart);
    var idxEnd   = _idxOfDate(absEnd);
    var giorni = [];
    for (var ii = idxStart; ii <= idxEnd; ii++) {
      giorni.push({ riga: Math.floor(ii / PL_COLS), colonna: ii % PL_COLS });
    }
    if (!giorni.length) return;
    var cur = { riga: giorni[0].riga, colStart: giorni[0].colonna, colEnd: giorni[0].colonna, isFirst: true };
    for (var k = 1; k < giorni.length; k++) {
      var g = giorni[k];
      if (g.riga === cur.riga && g.colonna === cur.colEnd + 1) {
        cur.colEnd = g.colonna;
      } else {
        segments.push({ int: item, row: cur.riga, colStart: cur.colStart, colEnd: cur.colEnd, span: cur.colEnd - cur.colStart + 1, isFirst: cur.isFirst });
        cur = { riga: g.riga, colStart: g.colonna, colEnd: g.colonna, isFirst: false };
      }
    }
    segments.push({ int: item, row: cur.riga, colStart: cur.colStart, colEnd: cur.colEnd, span: cur.colEnd - cur.colStart + 1, isFirst: cur.isFirst });
  }

  var segnalazioniById = {};
  DB.segnalazioni().forEach(function(s){ segnalazioniById[s.id] = s; });
  var checksById = {};
  checks.forEach(function(c){ checksById[c.id] = c; });

  interventions.forEach(function(int) {
    if (!int.dataApertura) return;
    var isChiuso    = int.stato === 'chiuso';
    var isAnnullato = int.stato === 'annullato';

    // Data programmazione (inizio attesa tratteggiata). Fallback per record vecchi: createdAt → dataApertura
    var progDate = (int.dataProgrammazione || int.createdAt || int.dataApertura).slice(0,10);
    var aperturaDate = int.dataApertura;

    // ── FASE 1: ATTESA (tratteggiata rossa) — da dataProgrammazione al giorno PRIMA di dataApertura ──
    // Solo se l'intervento NON è annullato e dataProgrammazione < dataApertura (cioè c'è un gap di attesa)
    if (!isAnnullato && progDate < aperturaDate) {
      var dPrev = new Date(aperturaDate+'T00:00:00');
      dPrev.setDate(dPrev.getDate()-1);
      var attesaEnd = dPrev.getFullYear()+'-'+String(dPrev.getMonth()+1).padStart(2,'0')+'-'+String(dPrev.getDate()).padStart(2,'0');
      // L'attesa parte dalla data di programmazione. Ma se su quel giorno c'è la sfumatura
      // di transizione (intervento nato da segnalazione/anomalia), il tratteggio parte dal
      // giorno DOPO, così la sequenza è: sfumatura → poi tratteggiato.
      var hasTransition = false;
      if (int.segnalazioneId) {
        var _sg = DB.segnalazioni().find(function(x){ return x.id===int.segnalazioneId; });
        if (_sg && progDate > _sg.data) hasTransition = true;
      } else if (int.checkId) {
        var _ck = DB.checks().find(function(x){ return x.id===int.checkId; });
        if (_ck && progDate > _ck.data) hasTransition = true;
      }
      var attesaStart = progDate;
      if (hasTransition) {
        var dN = new Date(progDate+'T00:00:00');
        dN.setDate(dN.getDate()+1);
        attesaStart = dN.getFullYear()+'-'+String(dN.getMonth()+1).padStart(2,'0')+'-'+String(dN.getDate()).padStart(2,'0');
      }
      if (attesaStart <= attesaEnd) {
        _pushDateRangeSegments(attesaStart, attesaEnd, {
          id:int.id, vehicleId:int.vehicleId, _isAttesa:true,
          descrizione:int.descrizione, dataApertura:int.dataApertura, stato:int.stato,
          checkId:int.checkId, segnalazioneId:int.segnalazioneId,
          kmApertura:int.kmApertura, fornitoreId:int.fornitoreId,
          dataChiusura:int.dataChiusura, kmChiusura:int.kmChiusura, noteChiusura:int.noteChiusura
        });
      }
    }

    // ── FASE 2: LAVORAZIONE (rosso pieno) — da dataApertura in poi ──
    var startDateStr = aperturaDate;
    var endDateStr;
    var _resolvedDay = null;
    if (isAnnullato) {
      endDateStr = aperturaDate;
    } else if (isChiuso || int.dataChiusura) {
      var chiusuraDate = int.dataChiusura || aperturaDate;
      // Rosso fino al giorno di chiusura INCLUSO. Il verde "mezzo disponibile" va disegnato
      // SOPRA il rosso, su quel giorno: lo rimandiamo a dopo il push del rosso.
      endDateStr = chiusuraDate;
      _resolvedDay = chiusuraDate;
    } else {
      // Aperto e mai chiuso: rosso pieno da dataApertura fino a OGGI (prosegue giorno per
      // giorno fino alla risoluzione). Se l'intervento è programmato nel futuro (apertura > oggi)
      // resta il solo giorno programmato; non sconfina mai oltre la data odierna.
      endDateStr = todayStr > aperturaDate ? todayStr : aperturaDate;
    }
    _pushDateRangeSegments(startDateStr, endDateStr, int);
    if (_resolvedDay) {
      // Verde "mezzo tornato disponibile" SOPRA il rosso, sul giorno di chiusura (mezza cella sfumata)
      _pushDateRangeSegments(_resolvedDay, _resolvedDay, {
        id:int.id, vehicleId:int.vehicleId, _isResolved:true,
        descrizione:int.descrizione, dataApertura:int.dataApertura, stato:'chiuso',
        checkId:int.checkId, segnalazioneId:int.segnalazioneId,
        kmApertura:int.kmApertura, fornitoreId:int.fornitoreId,
        dataChiusura:int.dataChiusura, kmChiusura:int.kmChiusura, noteChiusura:int.noteChiusura
      });
    }
  });

  // Anomalie da check senza intervento collegato — traccia fino ad oggi (o fino alla data del check se nel futuro)
  checks.forEach(function(c) {
    if (!c.data || !c.items) return;
    var anomItems = c.items.filter(function(it){ return it.val === 'anomalia'; });
    if (!anomItems.length) return;
    // Per ogni anomalia del check, trova l'intervento collegato NON annullato (se esiste) e la sua dataApertura.
    // Un intervento annullato non "chiude" l'anomalia: questa resta tracciata come ancora aperta.
    var linkedDates = [];
    var senzaIntervento = false;
    anomItems.forEach(function(a){
      var linkedInt = interventions.find(function(i){ return i.checkId===c.id && i.descrizione.startsWith(a.voce) && i.stato!=='annullato'; });
      if (linkedInt && linkedInt.dataApertura) {
        // Il colore anomalia si interrompe alla data di PROGRAMMAZIONE dell'intervento (fallback dataApertura)
        linkedDates.push(linkedInt.dataProgrammazione || linkedInt.dataApertura);
      } else {
        senzaIntervento = true;
      }
    });
    var endDateStr;
    var earliest = null;
    if (!senzaIntervento && linkedDates.length) {
      // L'arancio arriva FINO al giorno di apertura/creazione intervento (incluso);
      // la sfumatura dell'apertura gli va SOPRA su quel giorno, così non c'è stacco.
      linkedDates.sort();
      earliest = linkedDates[0];
      endDateStr = earliest;
    } else {
      endDateStr = c.data > todayStr ? c.data : todayStr;
    }
    // Cerchio arancione ogni giorno dal check fino al giorno prima del passaggio in lavorazione
    var ultimo = (earliest && earliest > c.data) ? _giornoPrima(earliest) : endDateStr;
    for (var dd = c.data; dd <= ultimo; dd = _giornoDopo(dd)) {
      if (dd > gridEndStr) break;
      _mark(dd, c.vehicleId, 'anom', {primo: dd===c.data});
    }
    // Giorno di creazione intervento: sfumatura arancio→rosso (poi prosegue la tratteggiata)
    if (earliest && earliest > c.data) {
      _pushDateRangeSegments(earliest, earliest, { id:c.id, vehicleId:c.vehicleId, _isTransition:true, _transFrom:EV_COLORS.checkAnom, stato:'anomalia_check' });
    }
  });

  // Segnalazioni — traccia in giallo da s.data fino al giorno prima dell'apertura
  // dell'intervento collegato NON annullato (se esiste), o fino ad oggi se ancora non gestita.
  // Un intervento annullato non "chiude" la segnalazione: resta tracciata come ancora aperta.
  // Se l'intervento è stato aperto lo stesso giorno della segnalazione, il giorno
  // della segnalazione resta comunque giallo (un solo giorno).
  DB.segnalazioni().forEach(function(s) {
    if (!s.data) return;
    var linked = interventions.find(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
    var cut = (linked && linked.dataApertura) ? (linked.dataProgrammazione || linked.dataApertura) : null;
    var endDateStr;
    if (cut) {
      // Il giallo arriva FINO al giorno di apertura/creazione intervento (incluso).
      // Su quel giorno la sfumatura dell'apertura gli va SOPRA: così non c'è stacco.
      endDateStr = cut;
    } else {
      endDateStr = s.data > todayStr ? s.data : todayStr;
    }
    _pushDateRangeSegments(s.data, endDateStr, { id:s.id, vehicleId:s.vehicleId, _isSegnalazione:true, _segnalazioneId:s.id, stato:'segnalazione' });
    // Giorno di creazione intervento: sfumatura giallo→rosso (poi prosegue la tratteggiata)
    if (cut && cut > s.data) {
      _pushDateRangeSegments(cut, cut, { id:s.id, vehicleId:s.vehicleId, _isTransition:true, _transFrom:EV_COLORS.segnalazione, stato:'segnalazione' });
    }
  });

  // Gomme programmate
  var tireInts = DB.tireInterventions();
  tireInts.forEach(function(ti){
    if (ti.stato==='programmato') _mark(ti.dataProgrammata, ti.vehicleId, 'tireProg');
    else if (ti.stato==='completato') _mark(ti.dataEffettiva || ti.dataProgrammata, ti.vehicleId, 'tireDone');
  });
  // Gomme montate o smontate in qualunque modo (anche senza un cambio pianificato): cella blu nel giorno
  DB.tires().forEach(function(t){
    if (t.dataMontaggio) _mark(t.dataMontaggio, t.vehicleId, 'tireDone');
    if (t.stato!=='montata' && t.dataSmontaggio) _mark(t.dataSmontaggio, t.vehicleId, 'tireDone');
  });

  // Barre overlay HTML
  var colWidthPct = 100 / PL_COLS;
  // Solo grafica: il verde "mezzo disponibile" (risolto) deve stare SOPRA a tutto.
  // Ordino in modo stabile spostando i segmenti _isResolved in fondo, così sono disegnati per ultimi.
  segments.sort(function(a,b){ return (a.int._isResolved?1:0) - (b.int._isResolved?1:0); });
  var barsHtml = '';
  // Segni del giorno, sotto alle strisce
  var ORD = {checkOk:0, anom:1, tireDone:2, tireProg:3};
  Object.keys(marks).forEach(function(k){
    var list = marks[k].sort(function(a,b){ return ORD[a.tipo]-ORD[b.tipo]; });
    var vIdx = vehicles.findIndex(function(v){ return v.id===list[0].vid; });
    if (vIdx===-1) return;
    var v = vehicles[vIdx];
    var idx = _idxOfDate(list[0].ds);
    var rowTop = Math.floor(idx/PL_COLS) * (cellH + PL_CELL_GAP) + PL_HDR_H + vIdx * (PL_ROW_H + PL_ROW_GAP);
    var n = list.length, w = colWidthPct/n;
    list.forEach(function(m, j){
      var left = (idx%PL_COLS)*colWidthPct + j*w;
      var targa = n===1 && (m.tipo!=='anom' || m.primo) ? escHtml(v.targa) : '';
      if (m.tipo==='checkOk' || m.tipo==='tireDone') {
        barsHtml += '<button class="pl-bar"'
          +' style="left:calc('+left+'% + 1px);width:calc('+w+'% - 2px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;background:'+(m.tipo==='checkOk'?EV_COLORS.checkOk:EV_COLORS.gomme)+';justify-content:center;"'
          +' data-vid="'+v.id+'"><span class="pl-bar-lbl">'+targa+'</span></button>';
      } else {
        var col = m.tipo==='anom' ? EV_COLORS.checkAnom : EV_COLORS.gomme;
        barsHtml += '<button class="pl-bar pl-anom-giorno"'
          +' style="left:'+left+'%;width:'+w+'%;top:'+rowTop+'px;height:'+PL_ROW_H+'px;" data-vid="'+v.id+'">'
          +'<span class="pl-anom-dot" style="background:'+col+';"></span>'
          +(targa?'<span class="pl-bar-lbl" style="color:'+(m.tipo==='anom'?'#c2410c':'#1e40af')+';">'+targa+'</span>':'')
          +'</button>';
      }
    });
  });
  segments.forEach(function(seg) {
    var vIdx = vehicles.findIndex(function(v){ return v.id===seg.int.vehicleId; });
    if (vIdx===-1) return;
    var v    = vehicles[vIdx];
    var left = seg.colStart * colWidthPct;
    var width= seg.span    * colWidthPct;
    var rowTop = seg.row * (cellH + PL_CELL_GAP) + PL_HDR_H + vIdx * (PL_ROW_H + PL_ROW_GAP);
    var lbl  = seg.isFirst ? escHtml(v.targa) : '';
    if (seg.int._isSegnalazione) {
      barsHtml += '<button class="pl-bar pl-bar-segnalazione"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;background:'+EV_COLORS.segnalazione+';"'
        +' data-segn-id="'+seg.int._segnalazioneId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    } else if (seg.int._isAttesa) {
      // Fase di attesa: linea rossa TRATTEGGIATA (trattini corti), centrata in verticale.
      var attTop = rowTop + (PL_ROW_H/2 - 3);
      barsHtml += '<button class="pl-bar pl-bar-attesa"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+attTop+'px;height:6px;'
        +'background:repeating-linear-gradient(90deg,'+EV_COLORS.intervento+' 0,'+EV_COLORS.intervento+' 5px,transparent 5px,transparent 11px);'
        +'border:none;box-shadow:none;"'
        +' data-iid="'+seg.int.id+'" data-vid="'+seg.int.vehicleId+'"></button>';
    } else if (seg.int._isResolved) {
      // Mezzo tornato disponibile (intervento chiuso): mezza cella verde sfumata.
      barsHtml += '<button class="pl-bar pl-bar-resolved"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;'
        +'background:linear-gradient(to right, rgba(74,222,128,0), rgba(74,222,128,0.9));border:none;box-shadow:none;"'
        +' data-iid="'+seg.int.id+'" data-vid="'+seg.int.vehicleId+'">'
        +'<span class="pl-bar-lbl" style="color:#15803d;">'+lbl+'</span></button>';
    } else if (seg.int._isTransition) {
      // Giorno di creazione intervento: sfumatura dal colore origine (giallo/arancio) al rosso
      barsHtml += '<button class="pl-bar"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;'
        +'background:linear-gradient(90deg,'+seg.int._transFrom+' 0%,'+EV_COLORS.intervento+' 100%);"'
        +' data-vid="'+seg.int.vehicleId+'"></button>';
    } else {
      var color = seg.int.stato==='annullato' ? EV_COLORS.annullato : EV_COLORS.intervento;
      barsHtml += '<button class="pl-bar"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;background:'+color+';"'
        +' data-iid="'+seg.int.id+'" data-vid="'+seg.int.vehicleId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    }
  });

  // Riepilogo (solo per il pannello corrente, sarà mostrato sotto il calendario)
  var futureInts    = interventions.filter(function(i){ return i.stato!=='chiuso'&&i.stato!=='annullato'&&i.dataApertura>todayStr; });
  var openInts      = interventions.filter(function(i){ return i.stato!=='chiuso'&&i.stato!=='annullato'&&i.dataApertura<=todayStr; });
  var annullatiInts = interventions.filter(function(i){ return i.stato==='annullato'; });

  function renderSumItem(i){
    var v=DB.vehicles().find(function(x){return x.id===i.vehicleId;});
    var statoVisivo,statoColor,statoBg;
    if(i.stato==='chiuso'){statoVisivo='✅ Chiuso';statoColor='#15803d';statoBg='#dcfce7';}
    else if(i.stato==='annullato'){statoVisivo='✕ Annullato';statoColor='#92400e';statoBg='#fef3c7';}
    else if(i.dataApertura>todayStr){statoVisivo='📅 Programmato';statoColor='#1e40af';statoBg='#dbeafe';}
    else{statoVisivo='🔧 In lavorazione';statoColor='#b45309';statoBg='#fef9c3';}
    var borderCol=i.stato==='annullato'?EV_COLORS.annullato:i.stato==='chiuso'?'#16a34a':i.dataApertura>todayStr?'#3b82f6':EV_COLORS.intervento;
    var supplier=i.fornitoreId?DB.suppliers().find(function(s){return s.id===i.fornitoreId;}):null;
    return '<div class="list-item" style="border-left:4px solid '+borderCol+';">'
      +'<div class="list-item-info">'
      +'<div class="list-item-name">'+escHtml((i.descrizione||'').slice(0,44))+((i.descrizione||'').length>44?'…':'')+'</div>'
      +'<div style="margin-top:4px;">'+(v?renderTargaHtml(v.targa):'')+'</div>'
      +'<div style="font-size:12px;color:#64748b;margin-top:5px;">📅 '+fmtDate(i.dataApertura)+(i.dataChiusura&&i.stato==='chiuso'?' → '+fmtDate(i.dataChiusura):'')+'</div>'
      +'<div style="margin-top:5px;"><span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:'+statoBg+';color:'+statoColor+';">'+statoVisivo+'</span>'
      +(supplier?'<span style="font-size:11px;color:#64748b;margin-left:6px;">🏠 '+escHtml(supplier.nome)+'</span>':'')
      +'</div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">'
      +(i.stato!=='annullato'&&i.stato!=='chiuso'?'<button class="pl-btn-chiudi" data-iid="'+i.id+'" data-vid="'+i.vehicleId+'" style="background:#16a34a;color:#fff;border:none;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;">Chiudi</button>':'')
      +'<button class="pl-btn-mod" data-iid="'+i.id+'" data-vid="'+i.vehicleId+'" style="background:#f1f5f9;color:#475569;border:none;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;">Modifica</button>'
      +'</div></div>';
  }

  var sumHtml =
    (futureInts.length>0
      ?'<div style="background:#eff6ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;font-weight:700;color:#1e40af;">📅 Programmati futuri ('+futureInts.length+') — naviga al mese corretto per vederli nel calendario</div>'
        +futureInts.map(renderSumItem).join('')
      :'')
    +(openInts.length===0?'<p style="font-size:13px;color:#94a3b8;margin-bottom:8px;">Nessun intervento aperto</p>':openInts.map(renderSumItem).join(''))
    +(annullatiInts.length>0
      ?'<div style="font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;">Annullati ('+annullatiInts.length+')</div>'
        +annullatiInts.map(renderSumItem).join('')
      :'');

  var dowHdr = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']
    .map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('');

  return {
    Y: Y, M: M,
    title: MONTHS[M] + ' ' + Y,
    dowHdr: dowHdr,
    gridHtml: gridHtml,
    barsHtml: barsHtml,
    openCount: openInts.length + futureInts.length,
    sumHtml: sumHtml
  };
}

// ── Crea il nodo DOM di un pannello mese (invisibile, non appeso al DOM) ──
// ── Disegna bordo oggi su un pannello ──
function _drawTodayBorder(panel) {
  var gridId = panel.querySelector('.pl-grid');
  if (!gridId) return;
  var todayCells = gridId.querySelectorAll('.pl-cell.is-today');
  if (!todayCells.length) return;
  var wrap = panel.querySelector('.pl-grid-wrap');
  if (!wrap) return;
  var wrapRect = wrap.getBoundingClientRect();
  var groups = {};
  todayCells.forEach(function(cell){
    var r = cell.getBoundingClientRect();
    var col = Math.round(r.left);
    if (!groups[col]) groups[col] = [];
    groups[col].push(r);
  });
  Object.values(groups).forEach(function(rects){
    var top    = Math.min.apply(null, rects.map(function(r){ return r.top; }));
    var bottom = Math.max.apply(null, rects.map(function(r){ return r.bottom; }));
    var left   = rects[0].left;
    var right  = rects[0].right;
    var div = document.createElement('div');
    div.id  = 'pl-today-col';
    div.style.cssText = 'position:absolute;border:2px solid #1e40af;border-radius:4px;pointer-events:none;z-index:4;box-shadow:0 0 0 1px rgba(30,64,175,.15);';
    div.style.top    = (top  - wrapRect.top  - 2) + 'px';
    div.style.left   = (left - wrapRect.left - 2) + 'px';
    div.style.width  = (right - left + 2) + 'px';
    div.style.height = (bottom - top + 4) + 'px';
    wrap.appendChild(div);
  });
}

// ── Attacca tutti gli event listener a un pannello mese ──
function _attachPanelListeners(panel) {
  // Click su cella (mezzo × giorno) → elenco di TUTTO cio che c'e in quella cella
  var overlay = panel.querySelector('.pl-bars-overlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      var bubble = document.getElementById('pl-bubble');
      if (bubble && bubble.style.display !== 'none') { bubble.style.display='none'; return; }
      overlay.style.pointerEvents = 'none';
      var el = document.elementFromPoint(e.clientX, e.clientY);
      overlay.style.pointerEvents = '';
      if (!el) return;
      var cell = el.closest('.pl-cell[data-date]');
      if (!cell || !cell.dataset.date) return;
      var vrow = el.closest('.pl-vrow');
      var vid = vrow ? vrow.dataset.vid : null;
      if (!vid) return; // click sull'intestazione del giorno: ignora
      openPlannerCellDetail(vid, cell.dataset.date);
    });
  }

  // Riepilogo bottoni
  panel.querySelectorAll('.pl-btn-chiudi').forEach(function(el){
    el.addEventListener('click', function(){ openChiusuraForm(this.dataset.iid,this.dataset.vid,true); });
  });
  panel.querySelectorAll('.pl-btn-mod').forEach(function(el){
    el.addEventListener('click', function(){ openInterventionForm(this.dataset.vid,this.dataset.iid); });
  });
}

// ═══════════════════════════════════════════════════════
//  openPlannerCellDetail(vehicleId, dateStr)
//  Query mezzo+giorno → elenca TUTTO cio che c'e in quella
//  cella (anomalia arancio, chiuso verde, in lavorazione,
//  segnalazione, gomme) con i relativi pulsanti operativi.
// ═══════════════════════════════════════════════════════
function openPlannerCellDetail(vehicleId, dateStr){
  var v = DB.vehicles().find(function(x){ return x.id===vehicleId; });
  var avz = DB.settings().gestioneAvanzata;
  var cardCSS = 'border:1px solid #e2e8f0;border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff;';
  var titCSS  = 'font-size:13px;font-weight:700;margin-bottom:3px;';
  var descCSS = 'font-size:12px;color:#475569;margin-bottom:8px;word-break:break-word;';
  var bBase   = 'color:#fff;border:none;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer;';
  var cards = [];

  // CHECK del giorno
  DB.checks().filter(function(c){ return c.vehicleId===vehicleId && c.data===dateStr; }).forEach(function(c){
    var anomVoci=(c.items||[]).filter(function(it){return it.val==='anomalia';}).map(function(it){return it.voce;});
    cards.push('<div style="'+cardCSS+'border-left:4px solid '+(anomVoci.length?'#fb923c':'#4ade80')+';">'
      +'<div style="'+titCSS+'color:'+(anomVoci.length?'#c2410c':'#15803d')+';">'+(anomVoci.length?'🟠 Check con anomalie':'🟢 Check OK')+'</div>'
      +'<div style="'+descCSS+'">'+(anomVoci.length?escHtml(anomVoci.join(', ')):'Tutto regolare')+'</div>'
      +'<button onclick="closeModal2();openCheckViewer(\''+c.id+'\',\''+vehicleId+'\')" style="'+bBase+'background:#1e40af;">📋 Apri check</button>'
      +'</div>');
  });

  // ANOMALIE di check precedenti ancora in attesa quel giorno (cerchi arancioni)
  var oggiStr = new Date().toISOString().slice(0,10);
  var tuttiInt = DB.interventions();
  DB.checks().filter(function(c){ return c.vehicleId===vehicleId && c.data && c.data<dateStr; }).forEach(function(c){
    var anom=(c.items||[]).filter(function(it){return it.val==='anomalia';});
    if (!anom.length) return;
    var date=[], senza=false;
    anom.forEach(function(a){
      var li=tuttiInt.find(function(i){ return i.checkId===c.id && (i.descrizione||'').startsWith(a.voce) && i.stato!=='annullato'; });
      if (li && li.dataApertura) date.push(li.dataProgrammazione||li.dataApertura); else senza=true;
    });
    date.sort();
    var fine = (!senza && date.length) ? date[0] : null;
    if (fine ? dateStr>=fine : dateStr>oggiStr) return;
    var gg=Math.round((new Date(dateStr+'T12:00:00')-new Date(c.data+'T12:00:00'))/86400000);
    cards.push('<div style="'+cardCSS+'border-left:4px solid #fb923c;">'
      +'<div style="'+titCSS+'color:#c2410c;">🟠 Anomalia in attesa</div>'
      +'<div style="'+descCSS+'">'+escHtml(anom.map(function(a){return a.voce;}).join(', '))+' · dal check del '+fmtDate(c.data)+' ('+gg+' '+(gg===1?'giorno':'giorni')+')</div>'
      +'<button onclick="closeModal2();openCheckViewer(\''+c.id+'\',\''+vehicleId+'\')" style="'+bBase+'background:#1e40af;margin:2px;">📋 Apri check</button>'
      +'<button onclick="closeModal2();openCheckAnomalieFromPlanner(\''+c.id+'\',\''+vehicleId+'\')" style="'+bBase+'background:#ea580c;margin:2px;">⚠️ Gestisci anomalie</button>'
      +'</div>');
  });

  // INTERVENTI che toccano il giorno (apertura / chiusura / programmazione)
  // (anche i giorni intermedi: attesa e lavorazione)
  DB.interventions().filter(function(i){
    if (i.vehicleId!==vehicleId) return false;
    if (i.dataApertura===dateStr || i.dataChiusura===dateStr || i.dataProgrammazione===dateStr) return true;
    if (i.stato==='annullato' || !i.dataApertura) return false;
    var ini = i.dataProgrammazione || i.dataApertura;
    var fin = i.dataChiusura || (oggiStr > i.dataApertura ? oggiStr : i.dataApertura);
    return dateStr>=ini && dateStr<=fin;
  }).forEach(function(i){
    var lbl, col;
    if (i.stato==='annullato'){ lbl='🟡 Intervento annullato'; col='#ca8a04'; }
    else if (i.dataChiusura===dateStr){ lbl='🟢 Chiuso — mezzo disponibile'; col='#16a34a'; }
    else if (i.dataApertura && dateStr<i.dataApertura){ lbl='⏳ Programmato (attesa)'; col='#dc2626'; }
    else { lbl='🔴 In lavorazione'; col='#dc2626'; }
    var btns='';
    if (i.stato!=='chiuso' && i.stato!=='annullato'){
      btns+='<button onclick="closeModal2();openChiusuraForm(\''+i.id+'\',\''+vehicleId+'\',true)" style="'+bBase+'background:#16a34a;margin:2px;">✅ Chiudi</button>';
      btns+='<button onclick="closeModal2();annullaIntervento(\''+i.id+'\',\''+vehicleId+'\',true)" style="'+bBase+'background:#ca8a04;margin:2px;">✕ Annulla</button>';
    }
    btns+='<button onclick="closeModal2();openInterventionForm(\''+vehicleId+'\',\''+i.id+'\')" style="'+bBase+'background:#64748b;margin:2px;">✏️ Modifica</button>';
    if (avz) btns+='<button onclick="closeModal2();eliminaIntervento(\''+i.id+'\')" style="'+bBase+'background:#dc2626;margin:2px;">🗑️ Elimina</button>';
    cards.push('<div style="'+cardCSS+'border-left:4px solid '+col+';">'
      +'<div style="'+titCSS+'color:'+col+';">'+lbl+'</div>'
      +'<div style="'+descCSS+'">'+escHtml(i.descrizione||'')+(i.dataChiusura?' · chiuso '+fmtDate(i.dataChiusura):'')+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;">'+btns+'</div>'
      +'</div>');
  });

  // SEGNALAZIONI del giorno
  // (anche i giorni in cui è ancora in attesa di intervento)
  DB.segnalazioni().filter(function(s){
    if (s.vehicleId!==vehicleId || !s.data) return false;
    if (s.data===dateStr) return true;
    var li = tuttiInt.find(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
    var fine = (li && li.dataApertura) ? (li.dataProgrammazione||li.dataApertura) : oggiStr;
    return dateStr>s.data && dateStr<=fine;
  }).forEach(function(s){
    cards.push('<div style="'+cardCSS+'border-left:4px solid #facc15;">'
      +'<div style="'+titCSS+'color:#b45309;">🟡 Segnalazione'+(s.data!==dateStr?' aperta dal '+fmtDate(s.data):'')+'</div>'
      +'<div style="'+descCSS+'">'+escHtml(s.problema||'')+'</div>'
      +'<button onclick="closeModal2();openSegnalazioneDetail(\''+s.id+'\')" style="'+bBase+'background:#1e40af;">📢 Apri</button>'
      +'</div>');
  });

  // CAMBI GOMME del giorno
  DB.tireInterventions().filter(function(t){
    if (t.vehicleId!==vehicleId) return false;
    return t.stato==='completato' ? (t.dataEffettiva||t.dataProgrammata)===dateStr : t.dataProgrammata===dateStr;
  }).forEach(function(t){
    if (t.stato==='completato'){
      var forn = t.fornitoreId ? DB.suppliers().find(function(x){ return x.id===t.fornitoreId; }) : null;
      cards.push('<div style="'+cardCSS+'border-left:4px solid #60a5fa;">'
        +'<div style="'+titCSS+'color:#1e40af;">🔵 Cambio gomme eseguito</div>'
        +'<div style="'+descCSS+'">'+[t.kmEffettivo!=null?fmtKM(t.kmEffettivo):'', forn?escHtml(forn.nome):'', depositoLabel(t)?'deposito: '+escHtml(depositoLabel(t)):'', t.note?escHtml(t.note):''].filter(Boolean).join(' · ')+'</div>'
        +'<button onclick="closeModal2();modificaCambioGomme(\''+t.id+'\')" style="'+bBase+'background:#64748b;margin:2px;">✏️ Modifica</button>'
        +(avz?'<button onclick="closeModal2();eliminaCambioGomme(\''+t.id+'\')" style="'+bBase+'background:#dc2626;margin:2px;">🗑️ Elimina</button>':'')
        +'</div>');
      return;
    }
    cards.push('<div style="'+cardCSS+'border-left:4px solid #60a5fa;">'
      +'<div style="'+titCSS+'color:#1e40af;">🔵 Cambio gomme'+(t.stato==='annullato'?' annullato':' programmato')+'</div>'
      +'<div style="'+descCSS+'">'+escHtml(t.note||(t.stato==='annullato'?'Annullato':'Programmato'))+'</div>'
      +(t.stato==='annullato'
        ? '<button onclick="closeModal2();modificaCambioGomme(\''+t.id+'\')" style="'+bBase+'background:#64748b;">✏️ Modifica</button>'
        : '<button onclick="closeModal2();openEditCambioGomme(\''+t.id+'\')" style="'+bBase+'background:#1e40af;">✏️ Edita</button>')
      +'</div>');
  });

  // GOMME montate/smontate quel giorno senza un cambio gomme eseguito registrato
  var cambioFatto = DB.tireInterventions().some(function(t){ return t.vehicleId===vehicleId && t.stato==='completato' && (t.dataEffettiva||t.dataProgrammata)===dateStr; });
  if (!cambioFatto) {
    DB.tires().filter(function(t){ return t.vehicleId===vehicleId && (t.dataMontaggio===dateStr || (t.stato!=='montata' && t.dataSmontaggio===dateStr)); }).forEach(function(t){
      var mont = t.dataMontaggio===dateStr;
      var stag = t.stagione==='estate'?'estive':t.stagione==='4stagioni'?'4 stagioni':'invernali';
      cards.push('<div style="'+cardCSS+'border-left:4px solid #60a5fa;">'
        +'<div style="'+titCSS+'color:#1e40af;">🔵 '+(mont?'Gomme montate':(t.stato==='buttata'?'Gomme smontate e smaltite':'Gomme smontate — in deposito'))+'</div>'
        +'<div style="'+descCSS+'">'+escHtml(stag+' '+[t.marca,t.modello,t.dimensione].filter(Boolean).join(' ')+' ×'+(t.quantita||4))
          +((mont?t.kmMontaggio:t.kmSmontaggio)!=null?' · '+fmtKM(mont?t.kmMontaggio:t.kmSmontaggio):'')
          +(!mont&&depositoLabel(t)?' · '+escHtml(depositoLabel(t)):'')+'</div>'
        +'<button onclick="closeModal2();openEditTireSet(\''+t.id+'\')" style="'+bBase+'background:#64748b;">✏️ Modifica</button>'
        +'</div>');
    });
  }

  var head = (v?'<div style="margin-bottom:3px;">'+renderTargaHtml(v.targa)+'<span style="font-size:14px;font-weight:600;color:#1e293b;margin-left:8px;">'+escHtml(v.nome||'')+'</span></div>':'')
    +'<div style="font-size:12px;color:#94a3b8;margin:2px 0 12px;">📅 '+fmtDate(dateStr)+'</div>';

  var body;
  if (cards.length){
    body = head + cards.join('');
  } else {
    body = head + '<div style="font-size:13px;color:#94a3b8;margin-bottom:12px;">Nessun evento per questo mezzo in questo giorno.</div>'
      +'<button onclick="closeModal2();plannerNewIntervention('+parseInt(dateStr.slice(0,4))+','+(parseInt(dateStr.slice(5,7))-1)+','+parseInt(dateStr.slice(8,10))+')" style="'+bBase+'background:#16a34a;width:100%;padding:12px;">➕ Nuovo intervento</button>';
  }
  openModal2('Dettaglio giorno', body);
}

// ═══════════════════════════════════════════════════════
//  openPlanner — entry point
//  Strategia:
//  1. Apre la modale con header+legenda+dow+contenuto del
//     mese corrente in flow normale (modal-body scrolla normalmente).
//  2. Dopo il primo paint inietta prev/next come nodi
//     position:fixed traslati di ±100vw — invisibili,
//     pronti per lo swipe.
// ═══════════════════════════════════════════════════════
function openPlanner(year, month) {
  window._openView='planner';
  if (year  !== undefined) _plannerYear  = year;
  if (month !== undefined) _plannerMonth = month;
  if (_plannerMonth > 11) { _plannerMonth = 0;  _plannerYear++; }
  if (_plannerMonth < 0)  { _plannerMonth = 11; _plannerYear--; }
  _plannerBubble = null;

  var CY = _plannerYear, CM = _plannerMonth;
  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var PY = CM===0?CY-1:CY,  PM = CM===0?11:CM-1;
  var NY = CM===11?CY+1:CY, NM = CM===11?0:CM+1;

  var curData = _buildMonthPanel(CY, CM);

  var legendHtml =
    '<div class="pl-legend">'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkOk+'"></div>Check OK</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkAnom+'"></div>Check anomalia</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.intervento+'"></div>Intervento</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+'"></div>Gomme programmate</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+';border-radius:2px;"></div>Gomme cambiate</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.annullato+'"></div>Annullato</div>'
    +'</div>';

  var dowHdr = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']
    .map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('');

  // Costruisce l'HTML del pannello corrente direttamente come stringa
  // (va in flow normale dentro modal-body, che scrolla normalmente)
  var curPanelHtml =
    '<div class="pl-grid-wrap">'
    +'<div class="pl-grid" id="pl-grid-cur">'+curData.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+curData.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+curData.openCount+')</div>'+curData.sumHtml+'</div>';

  openModal('',
    '<div id="planner-wrap">'
    +'<div class="pl-header">'
    +'<button class="pl-nav-btn" id="pl-prev">&#8249;</button>'
    +'<div class="pl-title" id="pl-title">'+MONTHS[CM]+' '+CY+'</div>'
    +'<button class="pl-nav-btn" id="pl-next">&#8250;</button>'
    +'</div>'
    +legendHtml
    +'<div class="pl-dow-hdr">'+dowHdr+'</div>'
    +'<div id="pl-cur-panel">'+curPanelHtml+'</div>'
    +'<div id="pl-bubble" style="display:none;" class="pl-bubble"></div>'
    +'</div>'
  );

  setTimeout(function() {
    var curPanel = document.getElementById('pl-cur-panel');
    if (!curPanel) return;

    _attachPanelListeners(curPanel);
    _drawTodayBorder(curPanel);

    // Fumetto — event delegation
    document.getElementById('pl-bubble')?.addEventListener('click', function(e) {
      var bc=e.target.closest('.bubble-chiudi');
      var bm=e.target.closest('.bubble-mod');
      var ba=e.target.closest('.bubble-ann');
      var bt=e.target.closest('.bubble-tire-edita');
      if (bc) openChiusuraForm(bc.dataset.iid,bc.dataset.vid,true);
      if (bm) openInterventionForm(bm.dataset.vid,bm.dataset.iid);
      if (ba) annullaIntervento(ba.dataset.iid,ba.dataset.vid,true);
      if (bt){ document.getElementById('pl-bubble').style.display='none'; openEditCambioGomme(bt.dataset.tiid); }
    });

    document.getElementById('pl-prev')?.addEventListener('click', function(){ _plannerSwipe(false); });
    document.getElementById('pl-next')?.addEventListener('click', function(){ _plannerSwipe(true); });

    // Swipe sul modal-body
    var body = document.getElementById('modal-body');
    if (body) _initPlannerSwipe(body);

    // ── Inietta prev/next off-screen DOPO il primo paint ──
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var box = document.getElementById('modal-box');
        if (!box) return;
        var W = box.offsetWidth;

        // Rimuovi pannelli precedenti se esistono (riapertura)
        ['pl-prev-panel','pl-next-panel'].forEach(function(id){
          var old = document.getElementById(id);
          if (old) old.remove();
        });

        // prev panel — costruito come nodo DOM, posizionato fixed fuori schermo a sinistra
        var prevData = _buildMonthPanel(PY, PM);
        var prevNode = _buildPanelNode(prevData, PY, PM);
        prevNode.id = 'pl-prev-panel';
        _setPanelOffscreen(prevNode, -W);
        _attachPanelListeners(prevNode);
        document.body.appendChild(prevNode);

        // next panel — fuori schermo a destra
        var nextData = _buildMonthPanel(NY, NM);
        var nextNode = _buildPanelNode(nextData, NY, NM);
        nextNode.id = 'pl-next-panel';
        _setPanelOffscreen(nextNode, W);
        _attachPanelListeners(nextNode);
        document.body.appendChild(nextNode);
      });
    });

  }, 50);
}

// ── Crea il nodo pannello off-screen (appeso a body, position:fixed) ──
function _buildPanelNode(data, Y, M) {
  var div = document.createElement('div');
  div.className = 'pl-month-panel';
  div.dataset.plY = Y;
  div.dataset.plM = M;
  // Il contenuto è identico alla struttura del pannello corrente
  div.innerHTML =
    '<div class="pl-grid-wrap">'
    +'<div class="pl-grid" id="pl-grid-'+Y+'-'+M+'">'+data.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+data.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+data.openCount+')</div>'+data.sumHtml+'</div>';
  return div;
}

// ── Posiziona un pannello off-screen (fixed, stessa geometria del modal-box) ──
function _setPanelOffscreen(node, dx) {
  var box = document.getElementById('modal-box');
  if (!box) return;
  var r = box.getBoundingClientRect();
  node.style.cssText =
    'position:fixed;'
    +'top:'+r.top+'px;left:'+r.left+'px;'
    +'width:'+r.width+'px;height:'+r.height+'px;'
    +'overflow-y:auto;-webkit-overflow-scrolling:touch;'
    +'padding:0 16px 20px;'
    +'background:#fff;'
    +'z-index:199;'   // sotto la modale (z-index 200) → invisibile
    +'transform:translateX('+dx+'px);'
    +'will-change:transform;pointer-events:none;';
}

// ── Esegui la transizione animata ──
// Strategia semplice e robusta:
//  1. Costruisce subito il DOM del mese nuovo (non animato)
//  2. Crea due cloni fixed: "uscita" (contenuto attuale) e "entrata" (nuovo)
//  3. Nasconde il modal-body, anima i cloni, poi ripristina
//  4. In questo modo il modal-body non viene mai sfarfallato
function _plannerSwipe(goNext) {
  // Blocca swipe multipli sovrapposti
  if (window._plannerSwiping) return;
  window._plannerSwiping = true;

  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  // Aggiorna stato globale
  _plannerMonth += goNext ? 1 : -1;
  if (_plannerMonth > 11) { _plannerMonth = 0;  _plannerYear++; }
  if (_plannerMonth < 0)  { _plannerMonth = 11; _plannerYear--; }

  var box  = document.getElementById('modal-box');
  var body = document.getElementById('modal-body');
  if (!box || !body) { window._plannerSwiping = false; openPlanner(_plannerYear, _plannerMonth); return; }

  var r    = box.getBoundingClientRect();
  var W    = r.width;
  var dur  = 300;
  var ease = 'cubic-bezier(.4,0,.2,1)';

  // ── Costruisce l'HTML del nuovo mese ──
  var newData = _buildMonthPanel(_plannerYear, _plannerMonth);
  var newPanelHtml =
    '<div id="planner-wrap">'
    +'<div class="pl-header">'
    +'<button class="pl-nav-btn" id="pl-prev">&#8249;</button>'
    +'<div class="pl-title" id="pl-title">'+MONTHS[_plannerMonth]+' '+_plannerYear+'</div>'
    +'<button class="pl-nav-btn" id="pl-next">&#8250;</button>'
    +'</div>'
    +'<div class="pl-legend">'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkOk+'"></div>Check OK</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkAnom+'"></div>Check anomalia</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.intervento+'"></div>Intervento</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+'"></div>Gomme programmate</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+';border-radius:2px;"></div>Gomme cambiate</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.annullato+'"></div>Annullato</div>'
    +'</div>'
    +'<div class="pl-dow-hdr">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('')+'</div>'
    +'<div id="pl-cur-panel">'
    +'<div class="pl-grid-wrap">'
    +'<div class="pl-grid">'+newData.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+newData.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+newData.openCount+')</div>'+newData.sumHtml+'</div>'
    +'</div>'
    +'<div id="pl-bubble" style="display:none;" class="pl-bubble"></div>'
    +'</div>';

  // ── Crea clone "uscita": snapshot del contenuto corrente ──
  var cloneBase = 'position:fixed;top:'+r.top+'px;left:'+r.left+'px;'
    +'width:'+W+'px;overflow:hidden;background:#fff;pointer-events:none;will-change:transform;';
  // Altezza: dalla top del body fino al fondo del box
  var bodyTop  = body.getBoundingClientRect().top;
  var clipH    = r.bottom - bodyTop;

  var exitClone = document.createElement('div');
  exitClone.style.cssText = cloneBase
    +'top:'+bodyTop+'px;height:'+clipH+'px;z-index:210;padding:0 16px 20px;overflow-y:hidden;';
  exitClone.innerHTML = body.innerHTML;
  document.body.appendChild(exitClone);

  // ── Crea clone "entrata": il nuovo mese, parte da ±W ──
  var enterClone = document.createElement('div');
  enterClone.style.cssText = cloneBase
    +'top:'+bodyTop+'px;height:'+clipH+'px;z-index:209;padding:0 16px 20px;overflow-y:hidden;'
    +'transform:translateX('+(goNext ? W : -W)+'px);';
  enterClone.innerHTML = newPanelHtml;
  document.body.appendChild(enterClone);

  // Nasconde il body reale e setta l'overflow:hidden sul box per clippare
  body.style.visibility = 'hidden';
  box.style.overflow = 'hidden';

  // ── Avvia animazione al prossimo frame ──
  requestAnimationFrame(function() {
    var t = 'transform '+dur+'ms '+ease;
    exitClone.style.transition  = t;
    enterClone.style.transition = t;
    exitClone.style.transform   = 'translateX('+(goNext ? -W : W)+'px)';
    enterClone.style.transform  = 'translateX(0)';

    setTimeout(function() {
      // Pulizia cloni
      exitClone.remove();
      enterClone.remove();

      // Aggiorna il DOM reale con il nuovo mese
      body.innerHTML = newPanelHtml;
      body.style.visibility = '';
      body.scrollTop = 0;
      box.style.overflow = '';

      // Riattacca listeners
      var newCur = document.getElementById('pl-cur-panel');
      if (newCur) {
        _attachPanelListeners(newCur);
        _drawTodayBorder(newCur);
      }

      document.getElementById('pl-bubble')?.addEventListener('click', function(e) {
        var bc=e.target.closest('.bubble-chiudi');
        var bm=e.target.closest('.bubble-mod');
        var ba=e.target.closest('.bubble-ann');
        var bt=e.target.closest('.bubble-tire-edita');
        if (bc) openChiusuraForm(bc.dataset.iid,bc.dataset.vid,true);
        if (bm) openInterventionForm(bm.dataset.vid,bm.dataset.iid);
        if (ba) annullaIntervento(ba.dataset.iid,ba.dataset.vid,true);
        if (bt){ document.getElementById('pl-bubble').style.display='none'; openEditCambioGomme(bt.dataset.tiid); }
      });

      document.getElementById('pl-prev')?.addEventListener('click', function(){ _plannerSwipe(false); });
      document.getElementById('pl-next')?.addEventListener('click', function(){ _plannerSwipe(true); });
      _initPlannerSwipe(body);

      // Sblocca swipe e ricrea pannelli off-screen
      window._plannerSwiping = false;

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var bx2 = document.getElementById('modal-box');
          if (!bx2) return;
          var W2 = bx2.offsetWidth;
          // Rimuovi vecchi off-screen
          ['pl-prev-panel','pl-next-panel'].forEach(function(id){
            var n=document.getElementById(id); if(n) n.remove();
          });
          var PY2 = _plannerMonth===0?_plannerYear-1:_plannerYear, PM2 = _plannerMonth===0?11:_plannerMonth-1;
          var NY2 = _plannerMonth===11?_plannerYear+1:_plannerYear, NM2 = _plannerMonth===11?0:_plannerMonth+1;

          var pD=_buildMonthPanel(PY2,PM2), pN=_buildPanelNode(pD,PY2,PM2);
          pN.id='pl-prev-panel'; _setPanelOffscreen(pN,-W2); _attachPanelListeners(pN); document.body.appendChild(pN);

          var nD=_buildMonthPanel(NY2,NM2), nN=_buildPanelNode(nD,NY2,NM2);
          nN.id='pl-next-panel'; _setPanelOffscreen(nN,W2); _attachPanelListeners(nN); document.body.appendChild(nN);
        });
      });
    }, dur + 10);
  });
}

// ── Inizializza swipe touch ──
function _initPlannerSwipe(el) {
  // No-op: lo swipe è gestito da un unico listener persistente su modal-overlay
  // inizializzato una sola volta da _initPlannerSwipeGlobal()
}

// Unico listener swipe planner — attaccato una volta sola sull'overlay
var _plannerSwipeInited = false;
function _initPlannerSwipeGlobal() {
  if (_plannerSwipeInited) return;
  _plannerSwipeInited = true;
  var tx=null, ty=null;
  var overlay = document.getElementById('modal-overlay');
  if (!overlay) return;
  overlay.addEventListener('touchstart', function(e) {
    // Solo se il planner è aperto
    if (!document.getElementById('planner-wrap')) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  overlay.addEventListener('touchend', function(e) {
    if (tx === null) return;
    if (!document.getElementById('planner-wrap')) { tx=null; return; }
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = null; ty = null;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      _plannerSwipe(dx < 0);
    }
  }, { passive: true });
}

function openCheckAnomalieFromPlanner(checkId, vehicleId) {
  var check = DB.checks().find(function(c) { return c.id === checkId; });
  var v = DB.vehicles().find(function(x) { return x.id === vehicleId; });
  if (!check) return;

  var anom = check.items ? check.items.filter(function(i) { return i.val === 'anomalia'; }) : [];
  var interventions = DB.interventions();

  // Calcola anomalie ancora senza intervento
  var anomSenzaInt = anom.filter(function(a) {
    return !interventions.some(function(i) {
      return i.checkId === checkId && i.descrizione && i.descrizione.startsWith(a.voce) && i.stato!=='annullato';
    });
  });

  if (anomSenzaInt.length === 0) {
    openModal2('Anomalie — ' + (v ? v.targa : ''),
      '<div style="background:#dcfce7;border-radius:8px;padding:14px;text-align:center;font-size:14px;color:#15803d;font-weight:700;">'
      + '✅ Tutti gli interventi sono già stati creati per questo check.'
      + '</div>'
      + '<button onclick="closeModal2()" style="width:100%;background:#f1f5f9;color:#475569;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;">Chiudi</button>'
    );
    return;
  }

  var rows = anomSenzaInt.map(function(a) {
    var hasInt = interventions.some(function(i) {
      return i.checkId === checkId && i.descrizione && i.descrizione.startsWith(a.voce) && i.stato!=='annullato';
    });
    if (hasInt) return ''; // già gestita
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;margin-bottom:8px;">'
      + '<div style="flex:1;">'
      + '<div style="font-size:13px;font-weight:700;color:#c2410c;">⚠️ ' + escHtml(a.voce) + '</div>'
      + (a.note ? '<div style="font-size:11px;color:#9a3412;margin-top:2px;">' + escHtml(a.note) + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;gap:6px;flex-shrink:0;">'
      + '<button class="crea-int-anom"'
      + ' data-cid="' + checkId + '" data-vid="' + vehicleId + '"'
      + ' data-voce="' + escHtml(a.voce) + '" data-note="' + escHtml(a.note||'') + '" data-km="' + (check.km||0) + '"'
      + ' style="background:#1e40af;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">'
      + '+ Intervento</button>'
      + '<button class="ris-anom"'
      + ' data-cid="' + checkId + '" data-vid="' + vehicleId + '"'
      + ' data-voce="' + escHtml(a.voce) + '" data-km="' + (check.km||0) + '"'
      + ' style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">'
      + '✓ Risolto</button>'
      + '</div>'
      + '</div>';
  }).join('');

  openModal2('Anomalie check — ' + (v ? v.targa : ''),
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">'
    + (v ? renderTargaHtml(v.targa) : '')
    + '<div style="font-size:13px;color:#64748b;">' + fmtDate(check.data) + '</div>'
    + '</div>'
    + '<div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:10px;">'
    + anomSenzaInt.length + ' anomali' + (anomSenzaInt.length===1?'a':'e') + ' senza intervento:'
    + '</div>'
    + rows
    + '<div style="font-size:12px;color:#94a3b8;margin-top:8px;">Dopo aver creato un intervento la voce scomparirà da questa lista.</div>'
    + '<div style="height:8px;"></div>'
  );
  // Event delegation: +Intervento e Risolto (onclick diretto, no accumulo listener)
  setTimeout(function(){
    document.querySelectorAll('.crea-int-anom').forEach(function(btn){
      btn.onclick = function(){
        var cid=btn.dataset.cid, vid=btn.dataset.vid, voce=btn.dataset.voce, note=btn.dataset.note, km=parseInt(btn.dataset.km)||0;
        closeModal2();
        setTimeout(function(){ openInterventionFromAnomaliaCheck(cid, vid, voce, note, km); }, 20);
      };
    });
    document.querySelectorAll('.ris-anom').forEach(function(btn){
      btn.onclick = function(){
        var cid=btn.dataset.cid, vid=btn.dataset.vid, voce=btn.dataset.voce, km=parseInt(btn.dataset.km)||0;
        closeModal2();
        setTimeout(function(){ risolviAnomalia(vid, cid, voce, km); }, 20);
      };
    });
  }, 30);
}

// Crea intervento da anomalia check (chiamato dal planner)
function creaInterventoAnomalia(checkId, vehicleId, voce, note, km) {
  var interventions = DB.interventions();
  // Controlla duplicato
  if (interventions.some(function(i) { return i.checkId === checkId && i.descrizione && i.descrizione.startsWith(voce) && i.stato!=='annullato'; })) {
    toast('Intervento già esistente per questa anomalia');
    openCheckAnomalieFromPlanner(checkId, vehicleId);
    return;
  }
  interventions.push({
    id: DB.uid(), vehicleId: vehicleId, checkId: checkId,
    dataApertura: today(), kmApertura: parseInt(km) || null,
    descrizione: voce + (note ? ' — ' + note : ''),
    stato: 'anomalia', origine: 'check',
    fornitoreId: null, dataChiusura: null, kmChiusura: null, noteChiusura: '',
    createdAt: nowISO()
  });
  DB.saveInterventions(interventions);
  toast('Intervento creato', 'success');
  renderAlerts();
  // Riapri la stessa finestra anomalie — se ne restano apre ancora, altrimenti chiude
  openCheckAnomalieFromPlanner(checkId, vehicleId);
}

function savePlannerIntervention() {
  var desc       = document.getElementById('pni-desc')?.value.trim();
  var vehicleId  = document.getElementById('pni-veh')?.value;
  var data       = document.getElementById('pni-data')?.value;
  var dataProg   = document.getElementById('pni-data-prog')?.value || null;
  var fornitoreId= document.getElementById('pni-fornitore')?.value || null;
  if (!desc) { toast('Inserisci una descrizione','error'); return; }
  var km = kmInput('pni-km');
  var nuovo = {
    id: DB.uid(), vehicleId, descrizione: desc,
    dataApertura: data, dataProgrammazione: dataProg, kmApertura: km,
    stato: 'in_lavorazione', fornitoreId: fornitoreId, origine: 'manuale',
    dataChiusura: null, kmChiusura: null, noteChiusura: '',
    createdAt: nowISO()
  };
  var err = _checkInterventionData(nuovo);
  if (err) { toast(err,'error'); return; }
  var interventions = DB.interventions();
  interventions.push(nuovo);
  DB.saveInterventions(interventions);
  toast('Intervento creato','success');
  renderAlerts();
  openPlanner(_plannerYear, _plannerMonth);
}

function caricaModuloPNG(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Seleziona un file PNG o JPG','error'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    // Verifica dimensioni
    const img = new Image();
    img.onload = function(){
      if(img.width !== 800 || img.height !== 1101){
        toast('Attenzione: dimensioni ' + img.width + '×' + img.height + 'px (attese 800×1101). Caricato comunque.','');
      }
      const s = DB.settings();
      s.pdfBg = e.target.result;
      DB.saveSettings(s);
      toast('Modulo caricato','success');
      openSettings();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveModificaCambioGomme(intId){
  const tireInts = DB.tireInterventions();
  const idx = tireInts.findIndex(x=>x.id===intId);
  if(idx===-1){ toast('Intervento non trovato','error'); return; }
  const it = tireInts[idx];
  const norm = x => (x===undefined||x===null||x==='') ? null : String(x);
  const numOrNull = id => { const el=document.getElementById(id); if(!el||el.value==='') return null; return parseInt(el.value)||0; };
  const strOrNull = id => { const el=document.getElementById(id); return el ? (el.value.trim()||null) : undefined; };
  let cambiati = 0;

  // Intervento: solo i campi cambiati (il veicolo non si cambia)
  const formInt = {
    stato: document.getElementById('et-stato').value,
    dataProgrammata: document.getElementById('et-dataprog').value||null,
    dataEffettiva: document.getElementById('et-dataeff').value||null,
    kmEffettivo: numOrNull('et-kmeff'),
    note: document.getElementById('et-note').value.trim(),
    fornitoreId: document.getElementById('et-fornitore').value || null
  };
  const dep = _gommeDepositoRead('et-deposito');
  if(!dep){ toast('Scrivi dove sono in deposito le gomme','error'); return; }
  Object.assign(formInt, dep);
  Object.keys(formInt).forEach(k=>{ if(norm(formInt[k])!==norm(it[k])){ it[k]=formInt[k]; cambiati++; } });
  if(cambiati) DB.saveTireInterventions(tireInts);

  // Gomme del veicolo mostrate nella maschera: solo i campi cambiati
  const tires = DB.tires();
  let gommeCambiate = 0;
  tires.forEach(tire=>{
    if(tire.vehicleId!==it.vehicleId || !document.getElementById('et-marca-'+tire.id)) return;
    const f = {
      stagione: document.getElementById('et-stagione-'+tire.id).value,
      stato: document.getElementById('et-stato-'+tire.id).value,
      marca: strOrNull('et-marca-'+tire.id),
      modello: strOrNull('et-modello-'+tire.id),
      dimensione: strOrNull('et-dim-'+tire.id),
      quantita: numOrNull('et-qty-'+tire.id),
      dataMontaggio: document.getElementById('et-datamon-'+tire.id).value||null,
      kmMontaggio: numOrNull('et-kmmon-'+tire.id),
      dataSmontaggio: document.getElementById('et-datasmon-'+tire.id).value||null,
      kmSmontaggio: numOrNull('et-kmsmon-'+tire.id),
      note: strOrNull('et-note-'+tire.id)
    };
    Object.keys(f).forEach(k=>{
      if(norm(f[k])!==norm(tire[k])){
        if(k==='marca' && !f[k]) return;            // la marca non si svuota
        tire[k] = (k==='modello'||k==='dimensione'||k==='note') ? (f[k]||'') : f[k];
        gommeCambiate++;
      }
    });
  });
  if(gommeCambiate) DB.saveTires(tires);

  closeModal();
  toast((cambiati||gommeCambiate) ? 'Cambio gomme aggiornato' : 'Nessuna modifica', (cambiati||gommeCambiate)?'success':'');
  renderMain();
}

  // Collegato al cloud: copia di sicurezza, poi cancellazione propagata a tutti i dispositivi
  if(CloudSync.user){
    if(CloudSync.status!=='ready'){ closeModal(); toast('Cloud non connesso: riprova quando sei online','error'); return; }
    closeModal();
    toast('Azzeramento in corso…');
    try{
      await CloudSync.safetySnapshot('pre-azzera');
      Object.keys(DB.keys).forEach(k=>DB.set(k, DB.defaults(k)));
      for(const d of await IDB.getAll()) await IDB.delete(d.id);
      for(const p of await getAllVehiclePhotos()) await deleteVehiclePhoto(p.vehicleId);
      for(const k in _photoCache) delete _photoCache[k];
      toast('Dati azzerati su tutti i dispositivi');
    }catch(e){
      console.error(e);
      toast('Errore azzeramento: '+((e&&e.message)||e),'error');
    }
    renderAlerts();
    renderMain();
    return;
  }
  Object.values(DB.keys).forEach(k=>localStorage.removeItem(k));
  CloudSync.forgetLocal();
  IDB.clear();
  closeModal();
  toast('Dati azzerati');
  renderAlerts();
  renderMain();
}

async function exportData(){
  if(typeof JSZip==='undefined'){
    toast('Libreria ZIP non disponibile — verifica connessione','error');
    return;
  }
  toast('Creazione backup ZIP…');
  try{
    const zip=new JSZip();
    // Dati testo
    const backup={
      version:2, exportedAt:nowISO(),
      vehicles:DB.vehicles(), checks:DB.checks(),
      interventions:DB.interventions(), segnalazioni:DB.segnalazioni(),
      suppliers:DB.suppliers(),
      tires:DB.tires(), tiresStorico:DB.tiresStorico(),
      tireInterventions:DB.tireInterventions(), settings:DB.settings(),
      calibration:DB.get('calibration')
    };
    zip.file('dati.json', JSON.stringify(backup, null, 2));
    // Foto veicoli da IndexedDB (vehicle_photos)
    const photos = await new Promise(res=>{
      const req=indexedDB.open('VehicleCarePro',2);
      req.onsuccess=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('vehicle_photos')){ res([]); return; }
        const tx=db.transaction('vehicle_photos','readonly');
        tx.objectStore('vehicle_photos').getAll().onsuccess=r=>res(r.target.result||[]);
      };
      req.onerror=()=>res([]);
    });
    if(photos.length>0){
      zip.file('vehicle_photos.json', JSON.stringify(photos, null, 2));
    }
    const docs=await IDB.getAll();
    if(docs.length>0){
      const docsFolder=zip.folder('documenti');
      const meta=[];
      for(const doc of docs){
        const ext=doc.nome.includes('.')?doc.nome.split('.').pop():'bin';
        const filename=`${doc.id}.${ext}`;
        docsFolder.file(filename, doc.data); // ArrayBuffer diretto
        meta.push({id:doc.id,vehicleId:doc.vehicleId,tipo:doc.tipo,nome:doc.nome,mime:doc.mime,filename,createdAt:doc.createdAt});
      }
      zip.file('documenti_meta.json', JSON.stringify(meta, null, 2));
    }
    const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const filename=`VehicleCarePro_${today()}.zip`;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    a.click();
    // Salva data ultimo backup
    const s=DB.settings();
    s.lastBackup=nowISO();
    DB.saveSettings(s);
    toast(`Backup "${filename}" scaricato`,'success');
  }catch(e){
    toast('Errore backup: '+e.message,'error');
    console.error(e);
  }
}

function importData(){
  if(typeof JSZip==='undefined'){
    toast('Libreria ZIP non disponibile — verifica connessione','error');
    return;
  }
  const input=document.createElement('input');
  input.type='file';
  input.accept='.zip,.json,application/zip,application/json';
  input.onchange=async function(e){
    const file=e.target.files[0];
    if(!file){ return; }
    toast('Lettura file backup…');
    try{
      // Distingui ZIP da JSON
      if(file.name.endsWith('.zip')||file.type==='application/zip'){
        await _importFromZip(file);
      } else {
        // Vecchio formato JSON — compatibilità
        const text=await file.text();
        const data=JSON.parse(text);
        if(!data.vehicles){ toast('File non valido','error'); return; }
        window._importData=data;
        _showImportConfirm(data, false);
      }
    }catch(err){
      toast('Errore lettura: '+err.message,'error');
      console.error(err);
    }
  };
  input.click();
}

async function _importFromZip(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const dataFile=zip.file('dati.json');
  if(!dataFile){ toast('ZIP non valido: manca dati.json','error'); return; }
  const data=JSON.parse(await dataFile.async('string'));
  if(!data.vehicles){ toast('File dati non valido','error'); return; }
  // Leggi meta documenti
  const metaFile=zip.file('documenti_meta.json');
  const docsToImport=[];
  if(metaFile){
    const meta=JSON.parse(await metaFile.async('string'));
    for(const m of meta){
      const zipEntry=zip.file('documenti/'+m.filename);
      if(zipEntry){
        const ab=await zipEntry.async('arraybuffer');
        docsToImport.push({id:m.id,vehicleId:m.vehicleId,tipo:m.tipo,nome:m.nome,mime:m.mime,data:ab,createdAt:m.createdAt});
      }
    }
  }
  window._importData=data;
  window._importDocs=docsToImport;
  // Foto veicoli
  const photosFile=zip.file('vehicle_photos.json');
  window._importPhotos=photosFile?JSON.parse(await photosFile.async('string')):[];
  _showImportConfirm(data, docsToImport.length);
}

    <div style="background:#dcfce7;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#15803d;font-weight:600;">
      ✅ File valido — pronto per il ripristino
    </div>
    <div style="font-size:14px;color:#334155;margin-bottom:12px;font-weight:600;">Contenuto:</div>
    <div style="background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;color:#334155;line-height:2;">

      📋 ${data.checks?.length||0} check mensili<br>
      🔧 ${data.interventions?.length||0} interventi<br>
      📣 ${data.segnalazioni?.length||0} segnalazioni<br>
      🔵 ${data.tires?.length||0} set gomme<br>
      🏠 ${data.suppliers?.length||0} fornitori<br>

    </div>

    <div class="btn-row">

async function _doImport(){
  try{
    const data=window._importData;
    const docs=window._importDocs||[];
    if(!data){ toast('Nessun dato da importare','error'); return; }
    const cloud = CloudSync.user && CloudSync.status==='ready';
    if(CloudSync.user && !cloud){ toast('Cloud non connesso: riprova quando sei online','error'); return; }
    if(cloud){
      // Copia di sicurezza, poi sostituzione completa anche nel cloud (ordine dei record compreso)
      closeModal();
      toast('Ripristino in corso…');
      await CloudSync.safetySnapshot('pre-import');
      const rec={};
      ['vehicles','checks','interventions','segnalazioni','suppliers','tires','tiresStorico','tireInterventions'].forEach(k=>{ if(data[k]) rec[k]=data[k]; });
      if(data.settings) rec.settings={...DB.settings(),...data.settings};
      if(data.calibration) rec.calibration=data.calibration;
      await CloudSync._restoreRecords(rec);
    }else{
    if(data.vehicles) DB.saveVehicles(data.vehicles);
    if(data.checks) DB.saveChecks(data.checks);
    if(data.interventions) DB.saveInterventions(data.interventions);
    if(data.segnalazioni) DB.saveSegnalazioni(data.segnalazioni);
    if(data.suppliers) DB.saveSuppliers(data.suppliers);
    if(data.tires) DB.saveTires(data.tires);
    if(data.tiresStorico) DB.saveTiresStorico(data.tiresStorico);
    if(data.tireInterventions) DB.saveTireInterventions(data.tireInterventions);
    if(data.settings){ const s={...DB.settings(),...data.settings}; DB.saveSettings(s); }
    if(data.calibration) DB.set('calibration', data.calibration);
    }
    // Ripristina documenti in IDB (solo se il backup ne contiene: un backup senza
    // documenti non cancella quelli presenti). Le eliminazioni arrivano anche al cloud.
    if(docs.length>0){
      const keep=new Set(docs.map(d=>d.id));
      for(const d of await IDB.getAll()){ if(!keep.has(d.id)) await IDB.delete(d.id); }
      for(const doc of docs) await IDB.put(doc);
    }
    // Ripristina foto veicoli
    const photos=window._importPhotos||[];
    if(photos.length>0){
      const nuove=new Map(photos.map(p=>[p.vehicleId, p.dataUrl]));
      for(const p of await getAllVehiclePhotos()){
        if(nuove.get(p.vehicleId)!==p.dataUrl) await deleteVehiclePhoto(p.vehicleId);
      }
      for(const p of photos) await saveVehiclePhoto(p.vehicleId, p.dataUrl);
      for(const k in _photoCache) delete _photoCache[k];
      CloudSync.onFileChanged();
    }
    window._importPhotos=null;
    window._importData=null;
    window._importDocs=null;
    closeModal();
    toast('Dati ripristinati con successo','success');
    renderAlerts();
    renderMain();
  }catch(err){
    toast('Errore importazione: '+err.message,'error');
    console.error(err);
  }
}

function exportCSV(){
  const vehicles=DB.vehicles();
  const checks=DB.checks();
  const interventions=DB.interventions();

  const rows=[['Tipo','Data','Veicolo','Targa','KM','Dettaglio','Stato','Operatore']];

  checks.forEach(c=>{
    const v=vehicles.find(x=>x.id===c.vehicleId);
    const anom=c.items?.filter(i=>i.val==='anomalia').map(i=>i.voce).join('; ')||'';
    rows.push(['Check',c.data,v?.nome||'',v?.targa||'',c.km,anom||'Tutto OK','',c.operatore||'']);
  });

  interventions.forEach(i=>{
    const v=vehicles.find(x=>x.id===i.vehicleId);
    rows.push(['Intervento',i.dataApertura,v?.nome||'',v?.targa||'',i.kmApertura,i.descrizione,i.stato,'']);
  });

  const csv=rows.map(r=>r.map(cell=>`"${String(cell||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`vehiclecare-storico-${today()}.csv`;
  a.click();
  toast('CSV esportato','success');
}

  if('serviceWorker' in navigator){
    const swCode=`
const CACHE='vcp-v1';
const URLS=['/'];
self.addEventListener('install',e=>{ e.waitUntil(caches.open(CACHE).then(c=>c.addAll([]))); self.skipWaiting(); });
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))); self.clients.claim(); });
self.addEventListener('fetch',e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))); });
    `;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
}

function renderBackupStatus(){
  const el=document.getElementById('backup-status-box');
  if(!el) return;
  const s=DB.settings();
  if(!s.lastBackup){
    el.innerHTML='<div style="background:#fee2e2;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#b91c1c;font-weight:600;">⚠️ Nessun backup eseguito</div>';
    return;
  }
  const days=Math.floor((new Date()-new Date(s.lastBackup))/(1000*60*60*24));
  const warn=days>=(s.backupWarningDays||7);
  el.innerHTML=`<div style="background:${warn?'#fef3c7':'#dcfce7'};border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:${warn?'#92400e':'#15803d'};font-weight:600;">
    ${warn?'⚠️':'✅'} Ultimo backup: ${new Date(s.lastBackup).toLocaleDateString('it-IT')} (${days} giorni fa)
  </div>`;
}

function checkBackupAlert(){
  const s=DB.settings();
  if(!s.lastBackup) return; // Prima volta, non disturbare
  const days=Math.floor((new Date()-new Date(s.lastBackup))/(1000*60*60*24));
  const warn=s.backupWarningDays||7;
  if(days>=warn){
    // Banner non invasivo in cima alla pagina principale
    const existing=document.getElementById('backup-alert-banner');
    if(existing) return;
    const banner=document.createElement('div');
    banner.id='backup-alert-banner';
    banner.className='backup-banner';
    banner.innerHTML=`
      <div class="backup-banner-text">⚠️ Ultimo backup ${days} giorni fa</div>
      <button class="backup-banner-btn" onclick="exportData();this.closest('#backup-alert-banner').remove()">Backup ora</button>
      <button onclick="this.closest('#backup-alert-banner').remove()" style="background:none;border:none;color:#92400e;font-size:18px;cursor:pointer;padding:0 4px;">×</button>
    `;
    const main=document.getElementById('main');
    main.insertBefore(banner, main.firstChild);
  }
}

// Sincronizza vehicle_photos dai documenti "Foto veicolo" già presenti in IDB.
// Serve dopo un ripristino backup dove vehicle_photos è vuoto ma i doc ci sono.
async function syncVehiclePhotosFromDocs(){
  try{
    const allDocs = await IDB.getAll();
    const fotoVeicolo = allDocs.filter(d => d.tipo === 'Foto veicolo' && d.mime && d.mime.startsWith('image/'));
    let changed = false;
    for(const doc of fotoVeicolo){
      const existing = await getVehiclePhoto(doc.vehicleId);
      if(!existing){
        const blob = new Blob([doc.data], {type: doc.mime});
        const dataUrl = await new Promise(res => {
          const r = new FileReader();
          r.onload = e => res(e.target.result);
          r.readAsDataURL(blob);
        });
        await saveVehiclePhoto(doc.vehicleId, dataUrl);
        changed = true;
      }
    }
    if(changed) renderMain();
  }catch(e){ console.warn('syncVehiclePhotosFromDocs:', e); }
}

function init(){
  initPWA();
  // Richiede storage persistente: evita che il browser svuoti IndexedDB
  // (foto/documenti) sotto pressione di memoria su mobile.
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});

  // Migrazione: rinomina 'Libretto circolazione' → 'Libretto circolazione (fronte)'
  (async()=>{
    try{
      const docs = await IDB.getAll();
      for(const doc of docs){
        if(doc.tipo==='Libretto circolazione'){
          doc.tipo='Libretto circolazione (fronte)';
          await IDB.put(doc);

      }

  renderAlerts();
  renderMain();
  renderFab();

  }
}
