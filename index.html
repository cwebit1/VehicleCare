  const periodi=[['presa','Dalla presa in carico a oggi'],['mese','Ultimo mese'],['12mesi','Ultimi 12 mesi'],['anno','Anno in corso'],['annoPrec','Anno precedente'],['custom','Periodo personalizzato']];
  container.innerHTML=`
    <div class="card" style="margin-bottom:12px;">
      <div class="section-title" style="margin-top:0;">Nuova relazione</div>
      <div class="form-group"><label class="form-label">Mezzo</label>
        <select class="form-select" onchange="_rel.vid=this.value;_rel.html=null;renderMain()">
          ${vehicles.map(x=>`<option value="${x.id}" ${x.id===_rel.vid?'selected':''}>${escHtml(x.targa)} — ${escHtml(x.nome||'')}${x.venduto?' (venduto)':''}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Periodo</label>
        <select class="form-select" onchange="_rel.periodo=this.value;_rel.html=null;renderMain()">
          ${periodi.map(([k,l])=>`<option value="${k}" ${_rel.periodo===k?'selected':''}>${l}</option>`).join('')}
        </select></div>
      ${_rel.periodo==='custom'?`<div class="form-row">
        <div class="form-group"><label class="form-label">Dal</label>
          <input class="form-input" type="date" id="rel-da" value="${per.da}"></div>
        <div class="form-group"><label class="form-label">Al</label>
          <input class="form-input" type="date" id="rel-a" value="${per.a}"></div>
      </div>`:`<div style="font-size:12px;color:#64748b;margin:-4px 0 12px;">Dal ${fmtDate(per.da)} al ${fmtDate(per.a)}</div>`}
      <button class="btn btn-primary" style="width:100%;" onclick="generaRelazione()">📝 Genera relazione</button>
    </div>
    ${_rel.html?`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
      <button class="btn btn-primary" onclick="relAzione('vedi')">👁️ Visualizza</button>
      <button class="btn btn-primary" style="background:#0f766e;" onclick="relAzione('stampa')">🖨️ Stampa</button>
      <button class="btn btn-secondary" onclick="relAzione('condividi')">📤 Condividi</button>
      <button class="btn btn-secondary" onclick="relAzione('salva')">💾 Salva</button>
    </div>
    <div class="rz-anteprima" onclick="relAzione('vedi')" title="Visualizza"><div class="rz">${_rel.html}</div></div>
    <div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:6px;">Anteprima della pagina A4 · tocca per ingrandire</div>`:''}
    <div style="height:80px;"></div>`;
  _relScala();
}
// Rimpicciolisce la pagina A4 alla larghezza disponibile (stessa impaginazione del PDF)
function _relScala(){
  const box=document.querySelector('.rz-anteprima'); if(!box) return;
  const doc=box.firstElementChild;
  const k=Math.min(1, box.clientWidth/794);
  doc.style.transformOrigin='top left';
  doc.style.transform='scale('+k+')';
  box.style.height=Math.ceil(doc.offsetHeight*k)+'px';
}
window.addEventListener('resize', ()=>{ if(currentTab==='relazioni') _relScala(); });

function generaRelazione(){
  if(_rel.periodo==='custom'){
    _rel.da=document.getElementById('rel-da').value;
    _rel.a=document.getElementById('rel-a').value;
    if(!_rel.da||!_rel.a){ toast('Inserisci le date del periodo','error'); return; }
    if(_rel.da>_rel.a){ toast('La data iniziale non può essere successiva a quella finale','error'); return; }
  }
  const v=DB.vehicles().find(x=>x.id===_rel.vid);
  if(!v) return;
  const per=_relPeriodo(v);
  _rel.html=_relBuild(v, per.da, per.a);
  _rel.pdfP=null;
  renderMain();
  // Prepara il PDF in anticipo: così "Condividi" parte subito, ancora dentro il tocco
  setTimeout(()=>{ if(_rel.html && !_rel.pdfP) _relBlobP().catch(()=>{}); }, 300);
}
function _relPiede(v, per){ return 'Relazione '+(v?v.targa:'')+' · '+fmtDate(per.da)+' – '+fmtDate(per.a); }

// ── Costruzione della relazione (stesso HTML per anteprima e PDF) ──
function _relBuild(v, da, a){
  const oggi=today();
  const E=escHtml;
  const inP = d => !!d && d>=da && d<=a;
  const settings=DB.settings();
  const suppliers=DB.suppliers();
  const sup = id => suppliers.find(x=>x.id===id);
  const supNome = id => { const s=sup(id); return s?s.nome:'Fornitore non più presente'; };
  const num = n => String(Math.round(Number(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const kmTxt = n => (n==null||n==='') ? '—' : num(n);
  const plur = (n,s,pl) => n+' '+(n===1?s:pl);
  const dm = iso => iso ? fmtDate(iso).slice(0,5) : '';
  const badge = (cls, txt) => '<span class="b '+cls+'">'+E(txt)+'</span>';
  const sub = txt => txt ? '<span class="sub">'+E(txt)+'</span>' : '';
  const stagNome = s => s==='estate'?'Estive':s==='4stagioni'?'4 stagioni':'Invernali';
  const setNome = t => [t.marca,t.modello,t.dimensione].filter(Boolean).join(' ')+' ×'+(t.quantita||4);

  const allChecks=DB.checks().filter(c=>c.vehicleId===v.id);
  const allInts=DB.interventions().filter(i=>i.vehicleId===v.id);
  const allSegn=DB.segnalazioni().filter(s=>s.vehicleId===v.id);
  const tires=DB.tires().filter(t=>t.vehicleId===v.id);
  const allTireInts=DB.tireInterventions().filter(t=>t.vehicleId===v.id);
  const byDate = k => (x,y)=>String(x[k]||'').localeCompare(String(y[k]||''));
  const checks=allChecks.filter(c=>inP(c.data)).sort(byDate('data'));
  const ints=allInts.filter(i=>inP(i.dataApertura)).sort(byDate('dataApertura'));
  const segn=allSegn.filter(s=>inP(s.data)).sort(byDate('data'));
  const cambioData = t => t.stato==='completato'&&t.dataEffettiva ? t.dataEffettiva : t.dataProgrammata;
  const tireInts=allTireInts.filter(t=>inP(cambioData(t))).sort((x,y)=>String(cambioData(x)).localeCompare(String(cambioData(y))));

  // Stato di un intervento: etichetta colorata
  const aperto = i => i.stato==='in_lavorazione'||i.stato==='anomalia';
  const giorniAperto = i => Math.max(0,_relGiorni(i.dataApertura||oggi, oggi));
  const intBadge = i => {
    if(i.stato==='chiuso') return badge('ok', i.origine==='revisione'?'Eseguita':'Chiuso '+dm(i.dataChiusura));
    if(i.stato==='annullato') return badge('grey','Annullato');
    if(i.stato==='anomalia') return badge('ko','Anomalia');
    if(i.dataApertura && i.dataApertura>oggi) return badge('info','Programmato '+dm(i.dataApertura));
    return badge('run', giorniAperto(i)===0?'Aperto oggi':'Da '+plur(giorniAperto(i),'giorno','giorni'));
  };
  const intOrigine = i => {
    if(i.origine==='check'){ const c=allChecks.find(x=>x.id===i.checkId); return c?'Da check del '+dm(c.data):'Da check'; }
    if(i.origine==='segnalazione') return 'Da segnalazione';
    return '';
  };
  // Esito di un'anomalia di check / di una segnalazione
  const esitoInt = i => {
    if(!i) return {cls:'ko', txt:'Non ancora gestita'};
    if(i.fornitoreId) return {cls:i.stato==='chiuso'?'ok':'run', txt:'Affidata a '+supNome(i.fornitoreId)+(i.stato==='chiuso'?' · chiusa il '+dm(i.dataChiusura):' · in corso')};
    return i.stato==='chiuso' ? {cls:'ok', txt:'Risolta internamente il '+dm(i.dataChiusura)} : {cls:'run', txt:'Riparazione interna in corso'};
  };
  const intDiAnomalia = (c, voce) => { const cand=allInts.filter(i=>i.checkId===c.id&&(i.descrizione||'').startsWith(voce)); return cand.find(z=>z.stato!=='annullato')||null; };

  // Righe di tabella per i lavori dei fornitori
  const rigaInt = i => ({d:i.dataApertura, html:'<tr><td>'+fmtDate(i.dataApertura)+'</td><td class="km">'+kmTxt(i.kmApertura)+'</td><td>'
    +E(i.origine==='revisione'?'Revisione periodica':(i.descrizione||'Intervento'))
    +sub([intOrigine(i), i.origine==='revisione'&&i.noteChiusura?'Esito: '+i.noteChiusura:(i.noteChiusura||''), i.scadenzaRevisione?'nuova scadenza '+fmtDate(i.scadenzaRevisione):''].filter(Boolean).join(' · '))
    +'</td><td>'+intBadge(i)+'</td></tr>'});
  const rigaCambio = t => {
    let det='', st;
    if(t.stato==='completato'){
      const g=t.dataEffettiva, dep=depositoLabel(t);
      const smont=tires.filter(x=>x.dataSmontaggio===g), mont=tires.filter(x=>x.dataMontaggio===g);
      det=[smont.length?'Smontate '+smont.map(x=>stagNome(x.stagione).toLowerCase()+' '+setNome(x)+(x.stato==='buttata'?' → smaltite':' → deposito'+((depositoLabel(x)||dep)?' '+(depositoLabel(x)||dep):''))).join(', '):'',
           mont.length?'Montate '+mont.map(x=>stagNome(x.stagione).toLowerCase()+' '+setNome(x)).join(', '):''].filter(Boolean).join(' · ');
      st=badge('ok','Eseguito');
    } else st = t.stato==='annullato' ? badge('grey','Annullato') : badge('info','Programmato '+dm(t.dataProgrammata));
    if(t.note) det=(det?det+' · ':'')+t.note;
    return {d:cambioData(t), html:'<tr><td>'+fmtDate(cambioData(t))+'</td><td class="km">'+(t.stato==='completato'?kmTxt(t.kmEffettivo):'—')+'</td><td>Cambio gomme'+sub(det)+'</td><td>'+st+'</td></tr>'};
  };
  const tabLavori = righe => '<table><tr><th style="width:84px">Data</th><th style="width:72px">Km</th><th>Lavoro</th><th style="width:118px">Stato</th></tr>'
    + righe.sort((x,y)=>String(x.d).localeCompare(String(y.d))).map(r=>r.html).join('') + '</table>';

  // ── Numeri chiave ──
  const kms=[];
  checks.forEach(c=>kms.push(c.km)); ints.forEach(i=>{ kms.push(i.kmApertura); if(inP(i.dataChiusura)) kms.push(i.kmChiusura); });
  segn.forEach(s=>kms.push(s.km)); tireInts.forEach(t=>kms.push(t.kmEffettivo));
  const kmOk=kms.map(k=>parseInt(k)).filter(k=>!isNaN(k)&&k>0);
  const kmMin=kmOk.length?Math.min(...kmOk):null, kmMax=kmOk.length?Math.max(...kmOk):null;
  const kmPerc=(kmMin!=null&&kmMax>kmMin)?kmMax-kmMin:null;
  const mesi=Math.max(1, _relGiorni(da,a)/30.44);
  const nAnomCheck=checks.filter(c=>(c.items||[]).some(x=>x.val==='anomalia')).length;
  const intNoRev=ints.filter(i=>i.origine!=='revisione');
  const fornitoriIds=[...new Set([...ints.filter(i=>i.fornitoreId).map(i=>i.fornitoreId), ...tireInts.filter(t=>t.fornitoreId).map(t=>t.fornitoreId)])];
  const ggRev=v.scadenzaRevisione?_relGiorni(oggi, v.scadenzaRevisione):null;

  // Anomalie ricorrenti, mesi senza check
  const conta={};
  checks.forEach(c=>(c.items||[]).forEach(x=>{ if(x.val==='anomalia') conta[x.voce]=(conta[x.voce]||0)+1; }));
  const ricorrenti=Object.keys(conta).filter(k=>conta[k]>1);
  const mesiSenza=[];
  let m=new Date(da.slice(0,7)+'-01T12:00:00');
  while(true){
    const ini=m.toISOString().slice(0,10);
    const fine=new Date(m.getFullYear(), m.getMonth()+1, 0, 12).toISOString().slice(0,10);
    if(ini>a) break;
    if(ini>=da && fine<=a && !checks.some(c=>c.data>=ini&&c.data<=fine)) mesiSenza.push(_REL_MESI[m.getMonth()]+' '+m.getFullYear());
    m=new Date(m.getFullYear(), m.getMonth()+1, 1, 12);
  }
  // Cose aperte (a oggi, non solo nel periodo)
  const intAperti=allInts.filter(aperto);
  const segnAperte=allSegn.filter(s=>!allInts.some(i=>i.segnalazioneId===s.id&&i.stato!=='annullato'));
  const anomAperte=[];
  allChecks.forEach(c=>(c.items||[]).forEach(x=>{ if(x.val==='anomalia' && !intDiAnomalia(c,x.voce)) anomAperte.push({c, voce:x.voce}); }));

  // ── Testata e numeri chiave ──
  const t7=String(v.targa||'').toUpperCase().replace(/\s/g,'');
  const targa=/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(t7)?t7.slice(0,2)+' '+t7.slice(2,5)+' '+t7.slice(5):t7;
  let h='<div class="rz-doc">'
    +'<div class="rz-head"><div class="rz-targa"><div class="eu"><span>★★★</span>I</div><div class="num">'+E(targa)+'</div></div>'
    +'<div class="rz-titolo"><h1>Relazione attività del mezzo</h1><div class="sotto">'+E([v.nome, v.modello, v.anno].filter(Boolean).join(' · '))+' · dal '+fmtDate(da)+' al '+fmtDate(a)+'</div></div>'
    +'<div class="meta">Creata il '+fmtDate(oggi)+(settings.operator?'<br>da '+E(settings.operator):'')+'<br>VehicleCare Pro</div></div>';
  const tipiForn=[...new Set(fornitoriIds.map(id=>(sup(id)?.tipo||'').toLowerCase()).filter(Boolean))].join(', ');
  h+='<div class="rz-kpi">'
    +'<div><b>'+(kmPerc!=null?num(kmPerc):'—')+'</b><span>km percorsi</span><small>'+(kmPerc!=null?'≈ '+num(Math.round(kmPerc/mesi))+' km/mese':'km non registrati')+'</small></div>'
    +'<div'+(nAnomCheck?'':' class="ok"')+'><b>'+checks.length+'</b><span>check mensili</span><small>'+(checks.length?nAnomCheck+' con anomalie':'nessun check')+'</small></div>'
    +'<div><b>'+intNoRev.length+'</b><span>interventi</span><small>'+intNoRev.filter(i=>i.stato==='chiuso').length+' chiusi · '+intNoRev.filter(aperto).length+' aperti</small></div>'
    +'<div><b>'+fornitoriIds.length+'</b><span>fornitori</span><small>'+(E(tipiForn)||'nessuno')+'</small></div>'
    +'<div class="'+(ggRev==null?'':ggRev<0?'ko':ggRev<=30?'warn':'ok')+'"><b>'+(ggRev==null?'—':Math.abs(ggRev))+'</b><span>'+(ggRev!=null&&ggRev<0?'giorni di revisione scaduta':'giorni alla revisione')+'</span><small>'+(v.scadenzaRevisione?'scade il '+fmtDate(v.scadenzaRevisione):'scadenza non indicata')+'</small></div>'
    +'</div><div class="rz-body">';

  // ── 1. Sintesi ──
  const p1=[], p2=[], p3=[];
  p1.push(kmPerc!=null
    ? 'Nel periodo esaminato il mezzo ha percorso circa <b>'+num(kmPerc)+' km</b>, pari a circa '+num(Math.round(kmPerc/mesi))+' km al mese.'
    : 'Nel periodo esaminato non sono stati registrati km sufficienti a stimare l\'utilizzo del mezzo.');
  if(checks.length){
    p1.push('Sono stati eseguiti <b>'+plur(checks.length,'controllo mensile','controlli mensili')+'</b>'
      +(mesiSenza.length?', con '+(mesiSenza.length===1?'il mese di '+E(mesiSenza[0])+' senza controllo':plur(mesiSenza.length,'mese','mesi')+' senza controllo ('+E(mesiSenza.join(', '))+')'):', con cadenza regolare')
      +(nAnomCheck?'; in '+plur(nAnomCheck,'caso','casi')+' hanno rilevato anomalie.':' e nessuna anomalia rilevata.'));
  } else p1.push('Nel periodo <b>non risultano controlli mensili</b>.');
  ricorrenti.forEach(k=>p2.push('La voce <b>'+E(k)+'</b> è risultata anomala '+conta[k]+' volte nel periodo.'));
  const interniChiusi=ints.filter(i=>!i.fornitoreId&&i.origine!=='revisione'&&i.stato==='chiuso').length;
  const esterni=ints.filter(i=>i.fornitoreId&&i.origine!=='revisione');
  if(esterni.length||interniChiusi) p2.push('Sono stati eseguiti '+(esterni.length?plur(esterni.length,'intervento','interventi')+' presso fornitori esterni':'')+(esterni.length&&interniChiusi?' e ':'')+(interniChiusi?plur(interniChiusi,'riparazione interna','riparazioni interne'):'')+'.');
  const ultCambio=tireInts.filter(t=>t.stato==='completato').slice(-1)[0];
  if(ultCambio){
    const mont=tires.filter(x=>x.dataMontaggio===ultCambio.dataEffettiva);
    p2.push('L\'ultimo <b>cambio gomme</b> è stato eseguito il '+fmtDate(ultCambio.dataEffettiva)+(ultCambio.fornitoreId?' da '+E(supNome(ultCambio.fornitoreId)):'')
      +(mont.length?', montando le '+E(stagNome(mont[0].stagione).toLowerCase()):'')
      +(depositoLabel(ultCambio)?', con le gomme smontate in deposito presso '+E(depositoLabel(ultCambio)):'')+'.');
  }
  const rev=ints.filter(i=>i.origine==='revisione'&&i.stato==='chiuso').slice(-1)[0];
  if(rev) p2.push('La <b>revisione</b> è stata eseguita il '+fmtDate(rev.dataApertura)+(rev.fornitoreId?' presso '+E(supNome(rev.fornitoreId)):'')+'.');
  const ap=[];
  intAperti.forEach(i=>ap.push('l\'intervento <b>'+E(i.descrizione||'')+'</b>'+(i.fornitoreId?' presso '+E(supNome(i.fornitoreId)):'')+(i.dataApertura>oggi?' (programmato per il '+fmtDate(i.dataApertura)+')':' (aperto da '+plur(giorniAperto(i),'giorno','giorni')+')')));
  if(segnAperte.length) ap.push(plur(segnAperte.length,'segnalazione','segnalazioni')+' ('+segnAperte.map(s=>E(s.problema)).join(', ')+')');
  if(anomAperte.length) ap.push(plur(anomAperte.length,'anomalia di check','anomalie di check')+' ('+anomAperte.map(x=>E(x.voce)).join(', ')+')');
  p3.push(ap.length?'Al momento restano da gestire '+ap.join('; ')+'.':'Al momento non risultano attività aperte.');
  if(ggRev!=null) p3.push(ggRev<0?'La <b>revisione è scaduta</b> da '+plur(-ggRev,'giorno','giorni')+'.':'La revisione scade il '+fmtDate(v.scadenzaRevisione)+', tra '+plur(ggRev,'giorno','giorni')+'.');
  h+='<h2><span class="n">1</span> Sintesi</h2><div class="rz-sintesi">'+[p1,p2,p3].filter(x=>x.length).map(x=>'<p>'+x.join(' ')+'</p>').join('')+'</div>';

  // ── 2. Dati del mezzo ──
  const dot=[v.sollevatore&&'Sollevatore', v.pedana&&'Pedana', v.spazzolePost&&'Spazzole posteriori', v.lavavetriPost&&'Lavavetri posteriori'].filter(Boolean);
  const dati=[['Targa',v.targa],['Stato',v.venduto?'Venduto / dismesso':'In servizio'],['Nome',v.nome],['Modello',v.modello],['Anno',v.anno],
    ['Km attuali',v.km!=null&&v.km!==''?num(v.km)+' km':''],['In carico dal',fmtDate(_relPresaInCarico(v))],['Scadenza revisione',v.scadenzaRevisione?fmtDate(v.scadenzaRevisione):'Non indicata'],
    ['Dotazioni',dot.join(', ')||'Nessuna']].filter(x=>x[1]!=null&&x[1]!=='');
  h+='<h2><span class="n">2</span> Dati del mezzo</h2><div class="rz-scheda">'+dati.map(([k,x])=>'<div><span>'+E(k)+'</span><b>'+E(String(x))+'</b></div>').join('')+'</div>'
    +(v.note?'<p class="rz-note">Note: '+E(v.note)+'</p>':'');

  // ── 3. Attività interna ──
  h+='<h2><span class="n">3</span> Attività interna</h2><p>Comprende i controlli mensili eseguiti dagli operatori, le segnalazioni ricevute e i lavori risolti senza ricorrere a fornitori esterni.</p>';
  h+='<h3>Check mensili</h3>';
  if(!checks.length) h+='<p class="rz-vuoto">Nessun check registrato nel periodo.</p>';
  else h+='<table><tr><th style="width:84px">Data</th><th style="width:72px">Km</th><th style="width:90px">Operatore</th><th style="width:96px">Esito</th><th>Anomalie e gestione</th></tr>'
    +checks.map(c=>{
      const an=(c.items||[]).filter(x=>x.val==='anomalia');
      const det=an.length?an.map(x=>{ const e=esitoInt(intDiAnomalia(c,x.voce)); return '<b>'+E(x.voce)+'</b>'+(x.note?' — "'+E(x.note)+'"':'')+'<span class="sub '+e.cls+'">'+E(e.txt)+'</span>'; }).join(''):(c.note?E(c.note):'—');
      return '<tr><td>'+fmtDate(c.data)+'</td><td class="km">'+kmTxt(c.km)+'</td><td>'+E(c.operatore||'—')+'</td><td>'+(an.length?badge('ko',plur(an.length,'anomalia','anomalie')):badge('ok','Regolare'))+'</td><td>'+det+'</td></tr>';
    }).join('')+'</table>';
  const daNotare=[];
  if(ricorrenti.length) daNotare.push('anomalia ricorrente su '+ricorrenti.map(k=>'<b>'+E(k)+'</b> ('+conta[k]+' volte)').join(', '));
  if(mesiSenza.length) daNotare.push('nessun check registrato a <b>'+E(mesiSenza.join(', '))+'</b>');
  if(daNotare.length) h+='<div class="rz-nota">⚠️ <b>Da notare:</b> '+daNotare.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join('. ')+'.</div>';

  h+='<h3>Segnalazioni degli operatori</h3>';
  if(!segn.length) h+='<p class="rz-vuoto">Nessuna segnalazione nel periodo.</p>';
  else h+='<table><tr><th style="width:84px">Data</th><th style="width:90px">Operatore</th><th>Problema</th><th style="width:150px">Esito</th></tr>'
    +segn.map(s=>{
      const gi=allInts.find(i=>i.segnalazioneId===s.id&&i.stato!=='annullato');
      const e=esitoInt(gi);
      return '<tr><td>'+fmtDate(s.data)+'</td><td>'+E(s.operatore||'—')+'</td><td>'+E(s.problema)+sub(s.note)+'</td><td>'+(gi?badge(e.cls,gi.stato==='chiuso'?'Risolta':'In corso')+sub(e.txt):badge('ko','Aperta'))+'</td></tr>';
    }).join('')+'</table>';

  const interne=ints.filter(i=>!i.fornitoreId && i.origine!=='revisione');
  h+='<h3>Riparazioni interne</h3>';
  if(!interne.length) h+='<p class="rz-vuoto">Nessuna riparazione interna nel periodo.</p>';
  else h+=tabLavori(interne.map(rigaInt));

  // ── 4. Fornitori ──
  const perF={};
  const addF=(id,k,x)=>{ (perF[id]=perF[id]||{int:[],rev:[],gomme:[],dep:[]})[k].push(x); };
  ints.filter(i=>i.fornitoreId).forEach(i=>addF(i.fornitoreId, i.origine==='revisione'?'rev':'int', i));
  tireInts.filter(t=>t.fornitoreId).forEach(t=>addF(t.fornitoreId,'gomme',t));
  tires.filter(t=>t.stato==='deposito'&&t.depositoFornitoreId).forEach(t=>addF(t.depositoFornitoreId,'dep',t));
  const nLav = id => perF[id].int.length+perF[id].rev.length+perF[id].gomme.length;
  const ordF=Object.keys(perF).sort((x,y)=>nLav(y)-nLav(x) || supNome(x).localeCompare(supNome(y)));
  h+='<h2><span class="n">4</span> Fornitori</h2>';
  h+=ordF.length?'<p>Nel periodo '+(ordF.length===1?'ha lavorato sul mezzo un fornitore esterno':'hanno lavorato sul mezzo '+ordF.length+' fornitori esterni')+'. Per ciascuno sono riportati i lavori eseguiti e quelli ancora in corso.</p>'
               :'<p class="rz-vuoto">Nel periodo nessun lavoro risulta affidato a fornitori esterni.</p>';
  const icona = (s, f) => { const t=(s&&s.tipo)||''; if(f.rev.length&&!f.int.length&&!f.gomme.length) return '🛂'; return t==='Meccanico'?'🔧':t==='Gommista'?'🛞':t==='Carrozziere'?'🚗':t==='Elettrauto'?'⚡':'🏠'; };
  ordF.forEach(id=>{
    const f=perF[id], s=sup(id);
    const chiusi=f.int.filter(i=>i.stato==='chiuso');
    const gg=chiusi.filter(i=>i.dataChiusura&&i.dataApertura).map(i=>Math.max(0,_relGiorni(i.dataApertura,i.dataChiusura)));
    const nums=[];
    if(f.int.length){ nums.push([f.int.length,'interventi'],[chiusi.length,'chiusi'],[f.int.filter(aperto).length,'aperti']); if(gg.length) nums.push([Math.round(gg.reduce((x,y)=>x+y,0)/gg.length)+' g','chiusura media']); }
    if(f.rev.length) nums.push([f.rev.length,'revisioni']);
    if(f.gomme.length||f.dep.length) nums.push([f.gomme.length,'cambi gomme'],[f.dep.length,'set in deposito']);
    h+='<div class="rz-forn"><div class="top"><div class="ico">'+icona(s,f)+'</div><div><div class="nome">'+E(supNome(id))+'</div><div class="tipo">'+E((s&&s.tipo)||'')+'</div></div>'
      +'<div class="nums">'+nums.map(([n,l])=>'<div><b>'+n+'</b><span>'+l+'</span></div>').join('')+'</div></div><div class="corpo">'
      +(nLav(id)?tabLavori([...f.int.map(rigaInt), ...f.rev.map(rigaInt), ...f.gomme.map(rigaCambio)]):'')
      +(f.dep.length?'<p class="rz-dep">📦 Custodisce in deposito: '+f.dep.map(t=>E(stagNome(t.stagione).toLowerCase()+' '+setNome(t))).join(', ')+'.</p>':'')
      +'</div></div>';
  });
  // Lavori senza fornitore indicato
  const revSenza=ints.filter(i=>!i.fornitoreId&&i.origine==='revisione'), gommeSenza=tireInts.filter(t=>!t.fornitoreId);
  if(revSenza.length||gommeSenza.length)
    h+='<div class="rz-forn"><div class="top"><div class="ico">❔</div><div><div class="nome">Fornitore non indicato</div><div class="tipo">Revisioni e cambi gomme registrati senza indicare chi li ha eseguiti</div></div></div><div class="corpo">'
      +tabLavori([...revSenza.map(rigaInt), ...gommeSenza.map(rigaCambio)])+'</div></div>';

  // ── 5. Gomme ──
  const montate=tires.filter(t=>t.stato==='montata'), dep=tires.filter(t=>t.stato==='deposito');
  const smaltite=tires.filter(t=>t.stato==='buttata'&&inP(t.dataSmontaggio));
  const sets=[...montate.map(t=>({t,st:badge('ok','Montate'),info:stagNome(t.stagione)+' · montate il '+fmtDate(t.dataMontaggio)+(t.kmMontaggio!=null?' a '+num(t.kmMontaggio)+' km':'')})),
    ...dep.map(t=>({t,st:badge('info','In deposito'),info:stagNome(t.stagione)+(depositoLabel(t)?' · 📍 '+depositoLabel(t):'')+(t.dataSmontaggio?' · smontate il '+fmtDate(t.dataSmontaggio):'')})),
    ...smaltite.map(t=>({t,st:badge('grey','Smaltite'),info:stagNome(t.stagione)+' · smaltite il '+fmtDate(t.dataSmontaggio)}))];
  const vite=sets.map(x=>tireKmPercorsi(x.t, v.km)||0);
  const maxVita=Math.max(1,...vite);
  const col = s => s==='estate'?'#fbbf24':s==='4stagioni'?'#34d399':'#38bdf8';
  h+='<h2><span class="n">5</span> Gomme</h2>';
  h+=sets.length?'<p>Situazione dei set registrati sul mezzo. La vita di ogni set è calcolata dai km del veicolo ai cambi gomme.</p>'
    +sets.map((x,i)=>'<div class="rz-set"><div class="ic">'+tireIcon(x.t.stagione)+'</div><div class="mid"><div class="t">'+E(setNome(x.t))+' '+x.st+'</div><div class="s">'+E(x.info)+'</div>'
      +'<div class="bar"><i style="width:'+Math.round(vite[i]/maxVita*100)+'%;background:'+col(x.t.stagione)+'"></i></div></div>'
      +'<div class="km">'+(vite[i]?num(vite[i])+' km':'—')+'<small>vita del set</small></div></div>').join('')
    :'<p class="rz-vuoto">Nessuna gomma registrata.</p>';

  // ── 6. Situazione attuale ──
  const rosso=[], arancio=[], verde=[];
  segnAperte.forEach(s=>rosso.push('Segnalazione '+dm(s.data)+': '+s.problema));
  anomAperte.forEach(x=>rosso.push('Anomalia '+x.voce+' del check '+dm(x.c.data)));
  if(ggRev!=null&&ggRev<0) rosso.push('Revisione scaduta il '+fmtDate(v.scadenzaRevisione));
  intAperti.forEach(i=>arancio.push(i.descrizione+(i.fornitoreId?' presso '+supNome(i.fornitoreId):' (interno)')+(i.dataApertura>oggi?', programmato il '+dm(i.dataApertura):', da '+plur(giorniAperto(i),'giorno','giorni'))));
  allTireInts.filter(t=>t.stato==='programmato').forEach(t=>arancio.push('Cambio gomme programmato il '+dm(t.dataProgrammata)));
  if(ggRev!=null&&ggRev>=0&&ggRev<=30) arancio.push('Revisione in scadenza il '+fmtDate(v.scadenzaRevisione));
  if(ggRev!=null&&ggRev>30) verde.push('Revisione valida fino al '+fmtDate(v.scadenzaRevisione));
  if(montate.length){
    const mmdd=oggi.slice(5), inv=settings.tireInverno||'11-15', est=settings.tireEstate||'05-15';
    const stag=(mmdd>=inv||mmdd<est)?'inverno':'estate';
    const prossima=stag==='inverno'?'estate':'inverno';
    const y=parseInt(oggi.slice(0,4));
    let dataProssima=y+'-'+(prossima==='inverno'?inv:est);
    if(dataProssima<oggi) dataProssima=(y+1)+'-'+(prossima==='inverno'?inv:est);
    const preavviso=_relGiorni(oggi, dataProssima) <= (parseInt(settings.tireWarnDays)||30);
    if(montate.every(t=>t.stagione===stag||t.stagione==='4stagioni'||(preavviso&&t.stagione===prossima))) verde.push('Gomme '+stagNome(montate[0].stagione).toLowerCase()+' montate, adatte alla stagione');
    else if(!allTireInts.some(t=>t.stato==='programmato')) arancio.push('Gomme '+stagNome(montate[0].stagione).toLowerCase()+' montate: cambio stagionale da programmare');
  }
  const chMese=allChecks.some(c=>(c.data||'').slice(0,7)===oggi.slice(0,7));
  if(chMese) verde.push('Check di '+_REL_MESI[parseInt(oggi.slice(5,7))-1]+' eseguito');
  if(!intAperti.length) verde.push('Nessun intervento aperto');
  const box=(cls,tit,l)=>'<div class="'+cls+'"><b>'+tit+'</b>'+(l.length?'<ul>'+l.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'<div class="vuoto">Nulla da segnalare</div>')+'</div>';
  h+='<h2><span class="n">6</span> Situazione al '+fmtDate(oggi)+'</h2><div class="rz-stato">'+box('r','Da gestire',rosso)+box('a','In corso',arancio)+box('g','Regolare',verde)+'</div>';

  h+='</div><div class="rz-piede"><span>Relazione '+E(v.targa)+' · '+fmtDate(da)+' – '+fmtDate(a)+'</span><span>VehicleCare Pro</span></div></div>';
  return h;
}

// ── Azioni sulla relazione: visualizza, condividi, stampa, salva (PDF solo in memoria) ──
function _relNomeFile(){
  const v=DB.vehicles().find(x=>x.id===_rel.vid); const per=_relPeriodo(v);
  return 'Relazione_'+(v?v.targa:'mezzo')+'_'+per.da+'_'+per.a+'.pdf';
}
function _relBlobP(){
  if(!_rel.pdfP){
    const v=DB.vehicles().find(x=>x.id===_rel.vid);
    _rel.pdfP=htmlA4Pdf(_rel.html, _relPiede(v, _relPeriodo(v))).catch(e=>{ _rel.pdfP=null; throw e; });
  }
  return _rel.pdfP;
}
async function relAzione(a){
  if(!_rel.html) return;
  if(a==='vedi'){
    const v=DB.vehicles().find(x=>x.id===_rel.vid);
    apriVisualizzatore('Relazione '+(v?v.targa:''), '<div class="rz">'+_rel.html+'</div>',
      {condividi:()=>relAzione('condividi'), stampa:()=>relAzione('stampa'), salva:()=>relAzione('salva')});
  } else if(a==='stampa'){
    stampaHtml('<div class="rz">'+_rel.html+'</div>', 'cpr-rz');
  } else if(a==='condividi' || a==='salva'){
    await (a==='condividi'?pdfCondividi:pdfSalva)(_relBlobP(), _relNomeFile());
    _rel.pdfP=null;                       // il PDF temporaneo viene liberato
  }
}

// ═══════════════════════════════════════════════════════
//  DOCUMENTI A4: visualizzatore in app, PDF temporanei, stampa
//  Il PDF si ricava dall'HTML: testo vero (selezionabile),
//  riquadri e linee disegnati, icone ed emoji come immagini.
// ═══════════════════════════════════════════════════════
const A4_PX = 794;                       // larghezza A4 a 96 dpi
const _PDF_MM = 210 / A4_PX;             // mm per pixel

function _pdfRgb(c){
  const m=String(c||'').match(/rgba?\(([^)]+)\)/); if(!m) return null;
  const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(parseFloat);
  if(p.length>3 && p[3]===0) return null;
  return p.slice(0,3);
}
// Caratteri che i font standard del PDF sanno scrivere; gli altri diventano immagini
function _pdfScrivibile(ch){ return /^[\x20-\x7E\xA0-\xFF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]$/.test(ch); }

// Legge l'HTML impaginato e produce le operazioni di disegno (coordinate in px dal bordo del documento)
function _pdfOperazioni(root){
  const base=root.getBoundingClientRect();
  const R = r => ({x:r.left-base.left, y:r.top-base.top, w:r.width, h:r.height});
  const ops=[];
  const icone={};
  const blkIds=new WeakMap(); let blkN=0;
  const blkId = b => { if(!b) return 0; if(!blkIds.has(b)) blkIds.set(b, ++blkN); return blkIds.get(b); };
  const range=document.createRange();
  const iconaImg=(seg, fs, col)=>{
    const k=seg+'|'+Math.round(fs)+'|'+col;
    if(!icone[k]){
      const s=Math.ceil(fs*4), c=document.createElement('canvas'); c.width=c.height=s;
      const x=c.getContext('2d'); x.textAlign='center'; x.textBaseline='middle';
      x.font=(fs*3)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      x.fillStyle=col; x.fillText(seg, s/2, s/2+fs*0.15);
      icone[k]=c.toDataURL('image/png');
    }
    return icone[k];
  };

  function testo(node, cs){
    const t=node.nodeValue; if(!t || !t.trim()) return;
    const fs=parseFloat(cs.fontSize);
    const stile=(parseInt(cs.fontWeight)>=600?'bold':'')+(cs.fontStyle==='italic'?'italic':'') || 'normal';
    const col=_pdfRgb(cs.color)||[0,0,0];
    const up=cs.textTransform==='uppercase';
    // allineamento del blocco che contiene il testo (serve a tenere fermo il bordo giusto)
    let blk=node.parentElement; while(blk && getComputedStyle(blk).display==='inline') blk=blk.parentElement;
    const ta=blk?getComputedStyle(blk).textAlign:'left';
    const align= (ta==='right'||ta==='end') ? 'right' : ta==='center' ? 'center' : 'left';
    const bid=blkId(blk);
    const re=/(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*|\s+|[^\s\p{Extended_Pictographic}]+)/gu;
    let run=null, m, prima=/^\s/.test(t);
    // Spazi ai bordi del pezzo di testo: servono a chi copia il testo dal PDF ("La " + "revisione")
    const chiudi=()=>{ if(run && run.str.trim()){ if(run.spazio) run.dopo=' '; ops.push(run); } run=null; };
    while((m=re.exec(t))){
      const tok=m[0], i0=m.index;
      if(/^\s+$/.test(tok)){ if(run) run.spazio=true; continue; }
      // parti scrivibili e non scrivibili (icone, simboli)
      const parti=[]; let cur='', curOk=null;
      for(const ch of tok){
        const ok=!/\p{Extended_Pictographic}/u.test(ch) && _pdfScrivibile(ch);
        if(curOk===null||ok===curOk||ch==='️'||ch==='‍'){ cur+=ch; if(curOk===null) curOk=ok; }
        else { parti.push([cur,curOk]); cur=ch; curOk=ok; }
      }
      if(cur) parti.push([cur,curOk]);
      let off=i0;
      for(const [seg, ok] of parti){
        range.setStart(node, off); range.setEnd(node, off+seg.length); off+=seg.length;
        const rs=[...range.getClientRects()].filter(r=>r.width>0);
        if(!rs.length) continue;
        const r=R(rs[0]), r2=R(rs[rs.length-1]);
        if(!ok){
          chiudi();
          ops.push({k:'img', x:r.x, y:r.y, w:Math.max(r.w, r.h*0.9), h:r.h, data:iconaImg(seg, fs, cs.color), blk:bid, align});
          continue;
        }
        const str=up?seg.toUpperCase():seg;
        if(run && Math.abs(run.top-r.y)<1.5 && r.x>=run.x){
          run.str+=(run.spazio?' ':'')+str; run.dx=r2.x+r2.w-run.x; run.spazio=false;
        } else {
          chiudi();
          run={k:'txt', x:r.x, top:r.y, bottom:r.y+r.h, dx:r2.x+r2.w-r.x, str, fs, stile, col, align, blk:bid, spazio:false, prima:prima?' ':''};
        }
        prima=false;
        if(rs.length>1){ chiudi(); }   // parola andata a capo: chiude la riga
      }
    }
    chiudi();
  }

  function el(e, clipPadre){
    const cs=getComputedStyle(e);
    if(cs.display==='none'||cs.visibility==='hidden') return;
    const rects=e.getClientRects();
    const r=R(e.getBoundingClientRect());
    const inlineMulti = cs.display==='inline' && rects.length>1;
    const rad=parseFloat(cs.borderTopLeftRadius)||0;
    // Sfondo (anche sfumato)
    if(!inlineMulti && r.w>0 && r.h>0){
      const bg=_pdfRgb(cs.backgroundColor);
      const grad=cs.backgroundImage&&cs.backgroundImage.includes('gradient') ? (cs.backgroundImage.match(/rgba?\([^)]+\)/g)||[]).map(_pdfRgb).filter(Boolean) : null;
      if(grad && grad.length>1) ops.push({k:'grad', ...r, cols:grad});
      else if(bg){
        // dentro un riquadro arrotondato che ritaglia: segue gli angoli del riquadro
        const tocca = clipPadre && Math.abs(r.y-clipPadre.y)<1 && Math.abs(r.x-clipPadre.x)<1.5;
        const tutto = tocca && r.h>=clipPadre.h-1;      // occupa tutta l'altezza (es. barra): angoli tutti tondi
        ops.push({k:'rect', ...r, r:tocca?clipPadre.r:rad, soloSopra:!!tocca && !tutto, fill:bg});
      }
    }
    // Bordi
    const bw=['Top','Right','Bottom','Left'].map(s=>parseFloat(cs['border'+s+'Width'])||0);
    const bc=['Top','Right','Bottom','Left'].map(s=>_pdfRgb(cs['border'+s+'Color']));
    if(!inlineMulti && bw.some(w=>w>0)){
      const uguali=bw.every(w=>w===bw[0]) && bc.every(c=>c&&bc[0]&&c.join()===bc[0].join());
      if(uguali && bc[0]) ops.push({k:'rect', ...r, r:rad, stroke:bc[0], lw:bw[0]});
      else {
        if(bw[0]&&bc[0]) ops.push({k:'rect', x:r.x, y:r.y, w:r.w, h:bw[0], r:0, fill:bc[0]});
        if(bw[2]&&bc[2]) ops.push({k:'rect', x:r.x, y:r.y+r.h-bw[2], w:r.w, h:bw[2], r:0, fill:bc[2]});
        if(bw[3]&&bc[3]) ops.push({k:'rect', x:r.x, y:r.y, w:bw[3], h:r.h, r:rad?Math.min(rad,bw[3]/2):0, fill:bc[3]});
        if(bw[1]&&bc[1]) ops.push({k:'rect', x:r.x+r.w-bw[1], y:r.y, w:bw[1], h:r.h, r:0, fill:bc[1]});
      }
    }
    // Pallino degli elenchi
    if(cs.display==='list-item'){
      const fs=parseFloat(cs.fontSize), lh=parseFloat(cs.lineHeight)||fs*1.5;
      ops.push({k:'dot', x:r.x-fs*0.75, y:r.y+lh/2, rr:fs*0.17, fill:_pdfRgb(cs.color)||[0,0,0]});
    }
    const clip = (cs.overflow==='hidden' && rad>0) ? {x:r.x, y:r.y, h:r.h, r:rad} : null;
    for(const ch of e.childNodes){
      if(ch.nodeType===3) testo(ch, cs);
      else if(ch.nodeType===1) el(ch, clip);
    }
  }
  el(root, null);
  return ops;
}

// Punti in cui la pagina non va tagliata (righe, riquadri, titoli attaccati a ciò che segue)
function _pdfBlocchi(root){
  const base=root.getBoundingClientRect().top;
  const box = e => { const r=e.getBoundingClientRect(); return [r.top-base, r.bottom-base]; };
  const b=[...root.querySelectorAll('tr, h2, h3, p, li, img, .rz-nota, .rz-set, .rz-forn .top, .rz-scheda > div, .rz-kpi, .rz-head, .rz-stato')].map(box);
  root.querySelectorAll('table').forEach(t=>{ const r=t.rows; if(r.length>1) b.push([box(r[0])[0], box(r[1])[1]]); });
  root.querySelectorAll('.rz-forn').forEach(f=>{ const r=f.querySelectorAll('tr'); b.push([box(f)[0], r.length>1?box(r[1])[1]:box(f)[1]]); });
  root.querySelectorAll('h2, h3').forEach(h=>{ const n=h.nextElementSibling; if(n){ const nb=n.matches('table')&&n.rows.length>1?box(n.rows[1]):box(n); b.push([box(h)[0], Math.min(nb[1], box(h)[0]+400)]); } });
  return b;
}

// HTML A4 → PDF (Blob) con testo selezionabile
async function htmlA4Pdf(html, piede){
  const wrap=document.createElement('div');
  wrap.className='rz';
  wrap.style.cssText='position:fixed;left:-10000px;top:0;width:'+A4_PX+'px;background:#fff;';
  wrap.innerHTML=html;
  wrap.querySelector('.rz-piede')?.remove();      // il piè di pagina va su ogni pagina
  document.body.appendChild(wrap);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const ops=_pdfOperazioni(wrap);
    const blocchi=_pdfBlocchi(wrap);
    const totale=wrap.scrollHeight;
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF({orientation:'portrait', unit:'mm', format:'a4', compress:true});
    const TOP=10, BOT=14;
    // Tagli di pagina
    const tagli=[0];
    while(tagli[tagli.length-1] < totale-1){
      const ini=tagli[tagli.length-1];
      const cap=Math.floor((297-(tagli.length===1?0:TOP)-BOT)/_PDF_MM);
      let fine=Math.min(ini+cap, totale);
      if(fine<totale){
        let y=fine, giri=0;
        while(giri++<300){ const bb=blocchi.find(([t,bt])=>t<y-1 && bt>y+1 && (bt-t)<cap); if(!bb) break; y=bb[0]; }
        if(y>ini+cap*0.3) fine=y;
      }
      tagli.push(fine);
    }
    const pagine=tagli.length-1;
    const mm = px => px*_PDF_MM;
    for(let p=0;p<pagine;p++){
      if(p>0) pdf.addPage();
      const y0=tagli[p], y1=tagli[p+1];
      const dy=(p===0?0:TOP) - mm(y0);
      const Y = py => mm(py)+dy;
      // Pezzi della stessa riga (testo normale, grassetto, icone) scorrono uno dopo l'altro:
      // il carattere del PDF può essere più stretto di quello della pagina
      let linea=null;
      const segue = o => o.align==='left' && linea && linea.blk===o.blk && Math.abs(linea.top-o.y0)<3 && o.x>=linea.fineLayout-1;
      for(const o of ops){
        if(o.k==='txt'){
          if(o.top<y0-1 || o.bottom>y1+1) continue;
          pdf.setFont('helvetica', o.stile); pdf.setFontSize(o.fs*0.75); pdf.setTextColor(...o.col);
          const w=pdf.getTextWidth(o.str), target=mm(o.dx);
          // si restringe solo se sborderebbe; se è più corto si allinea come nella pagina
          const cs = (w>target && o.str.length>1) ? Math.max(-0.4, (target-w)/(o.str.length-1)) : 0;
          const wEff = cs ? target : w;
          let x0 = mm(o.x);
          if(o.align==='right') x0 = mm(o.x)+target-wEff; else if(o.align==='center') x0 = mm(o.x)+(target-wEff)/2;
          o.y0=o.top;
          const spazioPdf=pdf.getTextWidth(' ');
          if(segue(o)) x0 = linea.finePdf + Math.max((o.prima||linea.dopo) ? spazioPdf : 0, mm(o.x-linea.fineLayout));
          linea={blk:o.blk, top:o.top, fineLayout:o.x+o.dx, finePdf:x0+wEff, dopo:!!o.dopo};
          const pre=o.prima?spazioPdf+cs:0;
          pdf.text((o.prima||'')+o.str+(o.dopo||''), x0-pre, Y(o.bottom-o.fs*0.22), {charSpace:cs});
          continue;
        }
        if(o.k==='img'){
          if(o.y<y0-1 || o.y+o.h>y1+1) continue;
          o.y0=o.y;
          const xi = segue(o) ? linea.finePdf + mm(o.x-linea.fineLayout) : mm(o.x);
          linea={blk:o.blk, top:o.y, fineLayout:o.x+o.w, finePdf:xi+mm(o.w)};
          pdf.addImage(o.data, 'PNG', xi, Y(o.y), mm(o.w), mm(o.h), undefined, 'FAST');
          continue;
        }
        if(o.k==='dot'){
          if(o.y<y0 || o.y>y1) continue;
          pdf.setFillColor(...o.fill); pdf.circle(mm(o.x), Y(o.y), mm(o.rr), 'F');
          continue;
        }
        // rettangoli e sfumature: solo la parte che cade in questa pagina
        const top=Math.max(o.y, y0), bot=Math.min(o.y+o.h, y1);
        if(bot-top<=0.1) continue;
        const tagliato = top>o.y || bot<o.y+o.h;
        const x=mm(o.x), y=Y(top), w=mm(o.w), h=mm(bot-top);
        if(o.k==='grad'){
          const n=48, a=o.cols[0], z=o.cols[o.cols.length-1];
          for(let i=0;i<n;i++){
            const f=i/(n-1); pdf.setFillColor(...a.map((v,j)=>Math.round(v+(z[j]-v)*f)));
            pdf.rect(x+w*i/n, y, w/n+0.2, h, 'F');
          }
          continue;
        }
        const r=tagliato?0:Math.min(mm(o.r||0), w/2, h/2);
        if(o.fill){
          pdf.setFillColor(...o.fill);
          if(r>0.05){
            pdf.roundedRect(x, y, w, h, r, r, 'F');
            if(o.soloSopra) pdf.rect(x, y+r, w, h-r, 'F');     // angoli in basso dritti
          } else pdf.rect(x, y, w, h, 'F');
        }
        if(o.stroke){
          pdf.setDrawColor(...o.stroke); pdf.setLineWidth(mm(o.lw));
          const d=mm(o.lw)/2;
          if(r>0.05) pdf.roundedRect(x+d, y+d, w-2*d, h-2*d, r, r, 'S'); else pdf.rect(x+d, y+d, w-2*d, h-2*d, 'S');
        }
      }
      // Piè di pagina
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(148,163,184);
      pdf.setDrawColor(226,232,240); pdf.setLineWidth(0.2); pdf.line(12, 297-10, 198, 297-10);
      pdf.text(String(piede||'').split('').filter(_pdfScrivibile).join(''), 12, 297-6);
      pdf.text('Pagina '+(p+1)+' di '+pagine, 198, 297-6, {align:'right'});
    }
    return pdf.output('blob');
  } finally {
    wrap.remove();
  }
}

// ── Azioni sui PDF temporanei: nessun file resta nel telefono, tranne con "Salva" ──
async function pdfCondividi(blobP, nomeFile){
  let blob;
  try{ blob=await blobP; }catch(e){ console.error(e); toast('Errore preparazione PDF','error'); return; }
  const file=new File([blob], nomeFile, {type:'application/pdf'});
  if(!navigator.share || (navigator.canShare && !navigator.canShare({files:[file]}))){
    toast('Condivisione non disponibile su questo dispositivo: usa Salva','error'); return;
  }
  try{ await navigator.share({files:[file], title:nomeFile}); }
  catch(e){ if(!e || e.name!=='AbortError') toast('Condivisione non riuscita','error'); }
}
async function pdfSalva(blobP, nomeFile){
  let blob;
  try{ blob=await blobP; }catch(e){ console.error(e); toast('Errore preparazione PDF','error'); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nomeFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  toast('PDF salvato','success');
}
// Stampa di sistema da HTML (nessun file): classe 'cpr-img' per moduli immagine, 'cpr-rz' per documenti A4
function stampaHtml(html, classe){
  const frame=document.getElementById('check-print-frame');
  if(!frame) return;
  frame.className=classe||'';
  frame.innerHTML=html;
  const imgs=[...frame.querySelectorAll('img')];
  Promise.all(imgs.map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve())).then(()=>{
    const pulisci=()=>{ frame.innerHTML=''; frame.className=''; window.removeEventListener('afterprint', pulisci); };
    window.addEventListener('afterprint', pulisci);
    setTimeout(()=>window.print(), 50);
  });
}

// ── Visualizzatore a tutto schermo (dentro l'app, con zoom) ──
function apriVisualizzatore(titolo, html, azioni){
  document.getElementById('pv-overlay')?.remove();
  const ov=document.createElement('div');
  ov.id='pv-overlay';
  ov.innerHTML=`
    <div class="pv-bar">
      <button class="pv-x" title="Chiudi">✕</button>
      <span class="pv-tit">${escHtml(titolo)}</span>
      <button class="pv-z" data-z="-">−</button><button class="pv-z" data-z="fit">⤢</button><button class="pv-z" data-z="+">＋</button>
    </div>
    <div class="pv-body"><div class="pv-pag"><div class="pv-doc">${html}</div></div></div>
    <div class="pv-azioni">
      ${azioni.condividi?'<button data-a="condividi">📤 Condividi</button>':''}
      ${azioni.stampa?'<button data-a="stampa">🖨️ Stampa</button>':''}
      ${azioni.salva?'<button data-a="salva">💾 Salva</button>':''}
    </div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector('.pv-body'), pag=ov.querySelector('.pv-pag'), doc=ov.querySelector('.pv-doc');
  let k=1;
  const fit=()=>Math.min(1.5, (body.clientWidth-16)/A4_PX);
  const applica=()=>{ doc.style.transform='scale('+k+')'; pag.style.width=Math.ceil(A4_PX*k)+'px'; pag.style.height=Math.ceil(doc.offsetHeight*k)+'px'; };
  k=fit(); applica();
  ov.querySelector('.pv-x').onclick=()=>ov.remove();
  ov.querySelectorAll('.pv-z').forEach(b=>b.onclick=()=>{
    const z=b.dataset.z; k = z==='fit'?fit():Math.max(0.3, Math.min(3, k*(z==='+'?1.25:0.8))); applica();
  });
  ov.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>azioni[b.dataset.a]());
  // pizzico per ingrandire
  let d0=null, k0=1;
  body.addEventListener('touchstart', e=>{ if(e.touches.length===2){ d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); k0=k; } }, {passive:true});
  body.addEventListener('touchmove', e=>{ if(e.touches.length===2 && d0){ e.preventDefault(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); k=Math.max(0.3, Math.min(3, k0*d/d0)); applica(); } }, {passive:false});
  body.addEventListener('touchend', e=>{ if(e.touches.length<2) d0=null; });
}


// ── PLANNER — costanti layout ──
const PL_ROW_H    = 20;   // px altezza riga veicolo
const PL_ROW_GAP  = 2;    // px gap tra righe veicolo
const PL_HDR_H    = 24;   // px header numero giorno
const PL_CELL_GAP = 1;    // px gap tra righe settimana (border del grid wrapper)
const PL_COLS     = 7;

// Colori eventi
const EV_COLORS = {
  checkOk:    '#4ade80',
  checkAnom:  '#fb923c',
  intervento: '#f87171',
  gomme:      '#60a5fa',
  annullato:  '#facc15',
  segnalazione: '#facc15',
};

let _plannerYear  = new Date().getFullYear();
