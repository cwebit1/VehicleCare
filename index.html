}



// ── PLANNER — costanti layout ──
const PL_ROW_H    = 20;   // px altezza riga veicolo
const PL_ROW_GAP  = 2;    // px gap tra righe veicolo
const PL_HDR_H    = 24;   // px header numero giorno
const PL_CELL_GAP = 1;    // px gap tra righe settimana (border del grid wrapper)
const PL_COLS     = 7;

// Colori eventi
const EV_COLORS = {
  checkOk:    '#4ade80',
  checkAnom:  '#fb923c',
  intervento: '#f87171',
  gomme:      '#60a5fa',
  annullato:  '#facc15',
  segnalazione: '#facc15',
};

let _plannerYear  = new Date().getFullYear();
let _plannerMonth = new Date().getMonth();
let _plannerBubble = null;

// ═══════════════════════════════════════════════════════
//  PLANNER — funzione pura di build HTML per un mese
//  Genera tutto in memoria, non tocca il DOM.
// ═══════════════════════════════════════════════════════
function _buildMonthPanel(Y, M) {
  var now      = new Date();
  var todayStr = now.toISOString().slice(0, 10);
  var monthStr = Y + '-' + String(M + 1).padStart(2, '0');
  var daysInMonth     = new Date(Y, M + 1, 0).getDate();
  var startDayOfWeek  = (new Date(Y, M, 1).getDay() + 6) % 7; // lun=0
  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  var vehicles      = DB.vehicles().filter(function(v){ return !v.venduto; });
  var checks        = DB.checks();
  var interventions = DB.interventions();

  // Mappa check del mese
  var checkMap = {};
  checks.forEach(function(c) {
    if (!c.data || !c.data.startsWith(monthStr)) return;
    if (!checkMap[c.data]) checkMap[c.data] = {};
    var hasAnom = c.items && c.items.some(function(it){ return it.val === 'anomalia'; });
    checkMap[c.data][c.vehicleId] = { stato: hasAnom ? 'anomalia' : 'ok', checkId: c.id };
  });

  // Altezza cella
  var cellBodyH = vehicles.length * PL_ROW_H + Math.max(0, vehicles.length - 1) * PL_ROW_GAP;
  var cellH     = PL_HDR_H + cellBodyH;

  // Celle prima/dopo
  var beforeDays = startDayOfWeek;
  var totalCells = beforeDays + daysInMonth;
  var afterDays  = (7 - (totalCells % 7)) % 7;

  // Griglia celle
  var gridHtml = '';
  for (var i = 0; i < beforeDays; i++) {
    gridHtml += '<div class="pl-cell" style="height:' + cellH + 'px;">';
    gridHtml += '<div class="pl-cell-hdr" style="height:' + PL_HDR_H + 'px;"></div>';
    gridHtml += '<div style="display:flex;flex-direction:column;gap:' + PL_ROW_GAP + 'px;">';
    vehicles.forEach(function(){ gridHtml += '<div class="pl-vrow" style="height:' + PL_ROW_H + 'px;"></div>'; });
    gridHtml += '</div></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr   = monthStr + '-' + String(d).padStart(2, '0');
    var isToday   = dateStr === todayStr;
    var dayChecks = checkMap[dateStr] || {};
    gridHtml += '<div class="pl-cell' + (isToday ? ' is-today' : '') + '" style="height:' + cellH + 'px;" data-date="' + dateStr + '">';
    gridHtml += '<div class="pl-cell-hdr" style="height:' + PL_HDR_H + 'px;">' + d + '</div>';
    gridHtml += '<div style="display:flex;flex-direction:column;gap:' + PL_ROW_GAP + 'px;">';
    vehicles.forEach(function(v) {
      var ck     = dayChecks[v.id];
      var stato  = ck ? ck.stato : null;
      var cid    = ck ? ck.checkId : null;
      var cls    = stato === 'ok' ? ' ck-ok' : stato === 'anomalia' ? ' ck-anom' : '';
      var lbl    = stato ? escHtml(v.targa) : '';
      var dataCk = cid ? ' data-check-id="' + cid + '" data-vehicle-id="' + v.id + '"' : '';
      gridHtml += '<div class="pl-vrow' + cls + '"' + dataCk + ' style="height:' + PL_ROW_H + 'px;">' + lbl + '</div>';
    });
    gridHtml += '</div></div>';
  }
  for (var i = 0; i < afterDays; i++) {
    gridHtml += '<div class="pl-cell" style="height:' + cellH + 'px;">';
    gridHtml += '<div class="pl-cell-hdr" style="height:' + PL_HDR_H + 'px;"></div>';
    gridHtml += '<div style="display:flex;flex-direction:column;gap:' + PL_ROW_GAP + 'px;">';
    vehicles.forEach(function(){ gridHtml += '<div class="pl-vrow" style="height:' + PL_ROW_H + 'px;"></div>'; });
    gridHtml += '</div></div>';
  }

  // Segmenti barre intervento
  var mStart = Y + '-' + String(M+1).padStart(2,'0') + '-01';
  var mEnd   = Y + '-' + String(M+1).padStart(2,'0') + '-' + String(daysInMonth).padStart(2,'0');
  var segments = [];

  // Helper riutilizzabile: spezza un intervallo [startDateStr,endDateStr] (clippato al mese)
  // in segmenti contigui riga/colonna della griglia, e li accoda a `segments`.
  function _pushDateRangeSegments(startDateStr, endDateStr, item) {
    if (!startDateStr) return;
    if (!endDateStr) endDateStr = startDateStr;
    if (startDateStr > mEnd || endDateStr < mStart) return;
    var absStart = startDateStr > mStart ? startDateStr : mStart;
    var absEnd   = endDateStr < mEnd ? endDateStr : mEnd;
    if (absEnd < absStart) return;
    var giornoInizio = parseInt(absStart.slice(8, 10));
    var giornoFine   = parseInt(absEnd.slice(8, 10));
    var giorni = [];
    for (var d = giornoInizio; d <= giornoFine; d++) {
      var idx = startDayOfWeek + (d - 1);
      giorni.push({ riga: Math.floor(idx / PL_COLS), colonna: idx % PL_COLS });
    }
    if (!giorni.length) return;
    var cur = { riga: giorni[0].riga, colStart: giorni[0].colonna, colEnd: giorni[0].colonna, isFirst: true };
    for (var k = 1; k < giorni.length; k++) {
      var g = giorni[k];
      if (g.riga === cur.riga && g.colonna === cur.colEnd + 1) {
        cur.colEnd = g.colonna;
      } else {
        segments.push({ int: item, row: cur.riga, colStart: cur.colStart, colEnd: cur.colEnd, span: cur.colEnd - cur.colStart + 1, isFirst: cur.isFirst });
        cur = { riga: g.riga, colStart: g.colonna, colEnd: g.colonna, isFirst: false };
      }
    }
    segments.push({ int: item, row: cur.riga, colStart: cur.colStart, colEnd: cur.colEnd, span: cur.colEnd - cur.colStart + 1, isFirst: cur.isFirst });
  }

  var segnalazioniById = {};
  DB.segnalazioni().forEach(function(s){ segnalazioniById[s.id] = s; });
  var checksById = {};
  checks.forEach(function(c){ checksById[c.id] = c; });

  interventions.forEach(function(int) {
    if (!int.dataApertura) return;
    var isChiuso    = int.stato === 'chiuso';
    var isAnnullato = int.stato === 'annullato';
    var isFuturo    = int.dataApertura > todayStr;
    var endDateStr;
    if (isAnnullato || isFuturo) {
      endDateStr = int.dataApertura;
    } else if (int.dataChiusura) {
      endDateStr = int.dataChiusura;
    } else if (isChiuso) {
      endDateStr = int.dataApertura;
    } else {
      endDateStr = todayStr;
    }
    var storyId;
    if (int.segnalazioneId) {
      storyId = 'segn_' + int.segnalazioneId;
    } else if (int.checkId) {
      // trova la voce dell'anomalia collegata (descrizione inizia con la voce)
      var origCheck = checksById[int.checkId];
      var matchedVoce = null;
      if (origCheck && origCheck.items) {
        var found = origCheck.items.find(function(it){ return it.val==='anomalia' && int.descrizione && int.descrizione.startsWith(it.voce); });
        if (found) matchedVoce = found.voce;
      }
      storyId = matchedVoce ? ('check_' + int.checkId + '_' + matchedVoce) : ('check_' + int.checkId);
    } else {
      storyId = 'int_' + int.id;
    }
    _pushDateRangeSegments(int.dataApertura, endDateStr, Object.assign({}, int, { _storyId: storyId }));
  });

  // Anomalie da check senza intervento collegato — traccia fino ad oggi (o fino alla data del check se nel futuro)
  // Ogni anomalia del check genera il proprio segmento/storia, in modo che più anomalie sullo
  // stesso check occupino fasce separate nel planner.
  checks.forEach(function(c) {
    if (!c.data || !c.items) return;
    var anomItems = c.items.filter(function(it){ return it.val === 'anomalia'; });
    if (!anomItems.length) return;
    anomItems.forEach(function(a){
      var linkedInt = interventions.find(function(i){ return i.checkId===c.id && i.descrizione.startsWith(a.voce) && i.stato!=='annullato'; });
      var endDateStr;
      if (linkedInt && linkedInt.dataApertura) {
        if (linkedInt.dataApertura < c.data) return; // caso anomalo, non dovrebbe succedere
        if (linkedInt.dataApertura === c.data) {
          endDateStr = c.data;
        } else {
          var d = new Date(linkedInt.dataApertura+'T00:00:00');
          d.setDate(d.getDate()-1);
          endDateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        }
      } else {
        endDateStr = c.data > todayStr ? c.data : todayStr;
      }
      _pushDateRangeSegments(c.data, endDateStr, { id:c.id, vehicleId:c.vehicleId, _isCheckAnom:true, _checkId:c.id, stato:'anomalia_check', _storyId:'check_'+c.id+'_'+a.voce });
    });
  });

  // Segnalazioni — traccia in giallo da s.data fino al giorno prima dell'apertura
  // dell'intervento collegato NON annullato (se esiste), o fino ad oggi se ancora non gestita.
  // Un intervento annullato non "chiude" la segnalazione: resta tracciata come ancora aperta.
  // Se l'intervento è stato aperto lo stesso giorno della segnalazione, il giorno
  // della segnalazione resta comunque giallo (un solo giorno).
  DB.segnalazioni().forEach(function(s) {
    if (!s.data) return;
    var linked = interventions.find(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
    var endDateStr;
    if (linked && linked.dataApertura) {
      if (linked.dataApertura < s.data) return; // intervento aperto prima della segnalazione → niente da tracciare
      if (linked.dataApertura === s.data) {
        endDateStr = s.data; // stesso giorno: traccia comunque il giorno della segnalazione
      } else {
        // giorno prima della dataApertura dell'intervento
        var d = new Date(linked.dataApertura+'T00:00:00');
        d.setDate(d.getDate()-1);
        endDateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      }
    } else {
      endDateStr = s.data > todayStr ? s.data : todayStr;
    }
    _pushDateRangeSegments(s.data, endDateStr, { id:s.id, vehicleId:s.vehicleId, _isSegnalazione:true, _segnalazioneId:s.id, stato:'segnalazione', _storyId:'segn_'+s.id });
  });

  // Gomme programmate
  var tireInts = DB.tireInterventions();
  tireInts.filter(function(ti){ return ti.stato==='programmato'; }).forEach(function(ti){
    var dp = ti.dataProgrammata;
    if (!dp || dp < mStart || dp > mEnd) return;
    var vIdx = vehicles.findIndex(function(v){ return v.id===ti.vehicleId; });
    if (vIdx===-1) return;
    var g = parseInt(dp.slice(8,10));
    var cellIdx = startDayOfWeek + (g-1);
    segments.push({ int:{id:ti.id,vehicleId:ti.vehicleId,_isTireInt:true,_tireIntId:ti.id}, row:Math.floor(cellIdx/PL_COLS), colStart:cellIdx%PL_COLS, colEnd:cellIdx%PL_COLS, span:1, isFirst:true });
  });

  // Prima passata: calcola tutte le storie distinte per veicolo (su tutto il mese)
  // in modo che ogni fascia mantenga sempre la stessa posizione verticale in tutte le settimane.
  var vehicleStories = {}; // vehicleId → { storyId → laneIndex }
  segments.forEach(function(seg) {
    var vid = seg.int.vehicleId;
    var sid = seg.int._storyId || ('unique_'+Math.random());
    if (!vehicleStories[vid]) vehicleStories[vid] = {};
    if (!(sid in vehicleStories[vid])) {
      vehicleStories[vid][sid] = Object.keys(vehicleStories[vid]).length;
    }
  });

  // Seconda passata: assegna lane e altezza a ogni segmento usando il max del veicolo
  var segGroups = {};
  segments.forEach(function(seg) {
    var key = seg.row + '_' + seg.int.vehicleId;
    if (!segGroups[key]) segGroups[key] = [];
    segGroups[key].push(seg);
  });
  segments.forEach(function(seg) {
    var vid = seg.int.vehicleId;
    var sid = seg.int._storyId || null;
    var stories = vehicleStories[vid] || {};
    var n = Math.max(1, Object.keys(stories).length);
    var idx = (sid !== null && sid in stories) ? stories[sid] : 0;
    var fullLaneH = PL_ROW_H / n;
    var gap = n > 1 ? 1 : 0;
    seg._laneH   = fullLaneH - gap;
    seg._laneTop = idx * fullLaneH;
    seg._laneCount = n;
  });

  // Etichetta targa: una sola per riga/veicolo, indipendente dal numero di fasce.
  // Viene mostrata sopra il primo segmento (in ordine di colonna) di quella riga/veicolo.
  var colWidthPct = 100 / PL_COLS;
  var targaLabelsHtml = '';
  Object.keys(segGroups).forEach(function(key) {
    var group = segGroups[key];
    if (!group.length) return;
    var first = group[0];
    var vIdx = vehicles.findIndex(function(v){ return v.id===first.int.vehicleId; });
    if (vIdx===-1) return;
    if (!first.isFirst) return; // mostra la targa solo se il primo segmento è l'inizio reale della traccia
    var v = vehicles[vIdx];
    var left = first.colStart * colWidthPct;
    var width= first.span    * colWidthPct;
    var rowTop = first.row * (cellH + PL_CELL_GAP) + PL_HDR_H + vIdx * (PL_ROW_H + PL_ROW_GAP);
    targaLabelsHtml += '<div class="pl-bar-lbl pl-targa-lbl"'
      +' style="position:absolute;left:calc('+left+'% + 4px);width:calc('+width+'% - 8px);top:'+rowTop+'px;height:'+PL_ROW_H+'px;pointer-events:none;display:flex;align-items:center;z-index:3;">'
      +escHtml(v.targa)+'</div>';
  });

  // Barre overlay HTML
  var barsHtml = '';
  segments.forEach(function(seg) {
    var vIdx = vehicles.findIndex(function(v){ return v.id===seg.int.vehicleId; });
    if (vIdx===-1) return;
    var v    = vehicles[vIdx];
    var left = seg.colStart * colWidthPct;
    var width= seg.span    * colWidthPct;
    var rowTop = seg.row * (cellH + PL_CELL_GAP) + PL_HDR_H + vIdx * (PL_ROW_H + PL_ROW_GAP) + seg._laneTop;
    var barH = seg._laneH;
    var lbl  = '';
    if (seg.int._isTireInt) {
      barsHtml += '<button class="pl-bar pl-bar-tire"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+barH+'px;background:'+EV_COLORS.gomme+';"'
        +' data-tiid="'+seg.int._tireIntId+'" data-vid="'+seg.int.vehicleId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    } else if (seg.int._isCheckAnom) {
      barsHtml += '<button class="pl-bar pl-bar-checkanom"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+barH+'px;background:'+EV_COLORS.checkAnom+';"'
        +' data-checkanom-vid="'+seg.int.vehicleId+'" data-checkanom-cid="'+seg.int._checkId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    } else if (seg.int._isSegnalazione) {
      barsHtml += '<button class="pl-bar pl-bar-segnalazione"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+barH+'px;background:'+EV_COLORS.segnalazione+';"'
        +' data-segn-id="'+seg.int._segnalazioneId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    } else {
      var color = seg.int.stato==='annullato' ? EV_COLORS.annullato : EV_COLORS.intervento;
      barsHtml += '<button class="pl-bar"'
        +' style="left:calc('+left+'% + 1px);width:calc('+width+'% - 2px);top:'+rowTop+'px;height:'+barH+'px;background:'+color+';"'
        +' data-iid="'+seg.int.id+'" data-vid="'+seg.int.vehicleId+'">'
        +'<span class="pl-bar-lbl">'+lbl+'</span></button>';
    }
  });

  // Riepilogo (solo per il pannello corrente, sarà mostrato sotto il calendario)
  var futureInts    = interventions.filter(function(i){ return i.stato!=='chiuso'&&i.stato!=='annullato'&&i.dataApertura>todayStr; });
  var openInts      = interventions.filter(function(i){ return i.stato!=='chiuso'&&i.stato!=='annullato'&&i.dataApertura<=todayStr; });
  var annullatiInts = interventions.filter(function(i){ return i.stato==='annullato'; });

  function renderSumItem(i){
    var v=DB.vehicles().find(function(x){return x.id===i.vehicleId;});
    var statoVisivo,statoColor,statoBg;
    if(i.stato==='chiuso'){statoVisivo='✅ Chiuso';statoColor='#15803d';statoBg='#dcfce7';}
    else if(i.stato==='annullato'){statoVisivo='✕ Annullato';statoColor='#92400e';statoBg='#fef3c7';}
    else if(i.dataApertura>todayStr){statoVisivo='📅 Programmato';statoColor='#1e40af';statoBg='#dbeafe';}
    else{statoVisivo='🔧 In lavorazione';statoColor='#b45309';statoBg='#fef9c3';}
    var borderCol=i.stato==='annullato'?EV_COLORS.annullato:i.stato==='chiuso'?'#16a34a':i.dataApertura>todayStr?'#3b82f6':EV_COLORS.intervento;
    var supplier=i.fornitoreId?DB.suppliers().find(function(s){return s.id===i.fornitoreId;}):null;
    return '<div class="list-item" style="border-left:4px solid '+borderCol+';">'
      +'<div class="list-item-info">'
      +'<div class="list-item-name">'+escHtml((i.descrizione||'').slice(0,44))+((i.descrizione||'').length>44?'…':'')+'</div>'
      +'<div style="margin-top:4px;">'+(v?renderTargaHtml(v.targa):'')+'</div>'
      +'<div style="font-size:12px;color:#64748b;margin-top:5px;">📅 '+fmtDate(i.dataApertura)+(i.dataChiusura&&i.stato==='chiuso'?' → '+fmtDate(i.dataChiusura):'')+'</div>'
      +'<div style="margin-top:5px;"><span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:'+statoBg+';color:'+statoColor+';">'+statoVisivo+'</span>'
      +(supplier?'<span style="font-size:11px;color:#64748b;margin-left:6px;">🏠 '+escHtml(supplier.nome)+'</span>':'')
      +'</div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">'
      +(i.stato!=='annullato'&&i.stato!=='chiuso'?'<button class="pl-btn-chiudi" data-iid="'+i.id+'" data-vid="'+i.vehicleId+'" style="background:#16a34a;color:#fff;border:none;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;">Chiudi</button>':'')
      +'<button class="pl-btn-mod" data-iid="'+i.id+'" data-vid="'+i.vehicleId+'" style="background:#f1f5f9;color:#475569;border:none;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;">Modifica</button>'
      +'</div></div>';
  }

  var sumHtml =
    (futureInts.length>0
      ?'<div style="background:#eff6ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;font-weight:700;color:#1e40af;">📅 Programmati futuri ('+futureInts.length+') — naviga al mese corretto per vederli nel calendario</div>'
        +futureInts.map(renderSumItem).join('')
      :'')
    +(openInts.length===0?'<p style="font-size:13px;color:#94a3b8;margin-bottom:8px;">Nessun intervento aperto</p>':openInts.map(renderSumItem).join(''))
    +(annullatiInts.length>0
      ?'<div style="font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;">Annullati ('+annullatiInts.length+')</div>'
        +annullatiInts.map(renderSumItem).join('')
      :'');

  var dowHdr = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']
    .map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('');

  return {
    Y: Y, M: M,
    title: MONTHS[M] + ' ' + Y,
    dowHdr: dowHdr,
    gridHtml: gridHtml,
    barsHtml: barsHtml + targaLabelsHtml,
    openCount: openInts.length + futureInts.length,
    sumHtml: sumHtml
  };
}

// ── Crea il nodo DOM di un pannello mese (invisibile, non appeso al DOM) ──
// ── Disegna bordo oggi su un pannello ──
function _drawTodayBorder(panel) {
  var gridId = panel.querySelector('.pl-grid');
  if (!gridId) return;
  var todayCells = gridId.querySelectorAll('.pl-cell.is-today');
  if (!todayCells.length) return;
  var wrap = panel.querySelector('.pl-grid-wrap');
  if (!wrap) return;
  var wrapRect = wrap.getBoundingClientRect();
  var groups = {};
  todayCells.forEach(function(cell){
    var r = cell.getBoundingClientRect();
    var col = Math.round(r.left);
    if (!groups[col]) groups[col] = [];
    groups[col].push(r);
  });
  Object.values(groups).forEach(function(rects){
    var top    = Math.min.apply(null, rects.map(function(r){ return r.top; }));
    var bottom = Math.max.apply(null, rects.map(function(r){ return r.bottom; }));
    var left   = rects[0].left;
    var right  = rects[0].right;
    var div = document.createElement('div');
    div.id  = 'pl-today-col';
    div.style.cssText = 'position:absolute;border:2px solid #1e40af;border-radius:4px;pointer-events:none;z-index:4;box-shadow:0 0 0 1px rgba(30,64,175,.15);';
    div.style.top    = (top  - wrapRect.top  - 2) + 'px';
    div.style.left   = (left - wrapRect.left - 2) + 'px';
    div.style.width  = (right - left + 2) + 'px';
    div.style.height = (bottom - top + 4) + 'px';
    wrap.appendChild(div);
  });
}

// ── Attacca tutti gli event listener a un pannello mese ──
function _attachPanelListeners(panel) {
  // Barre intervento → fumetto
  panel.querySelectorAll('.pl-bar').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var iid = btn.dataset.iid;
      var int = DB.interventions().find(function(x){ return x.id===iid; });
      var v   = DB.vehicles().find(function(x){ return x.id===btn.dataset.vid; });
      var sup = int && int.fornitoreId ? DB.suppliers().find(function(x){ return x.id===int.fornitoreId; }) : null;
      if (!int) return;
      var rect   = btn.getBoundingClientRect();
      var finalX = Math.min(Math.max(rect.left+rect.width/2-128,8),window.innerWidth-264);
      var finalY = Math.max(rect.top-8,0);
      var statoColor = int.stato==='chiuso'?'#16a34a':int.stato==='anomalia'?'#dc2626':'#d97706';
      var statoLbl   = int.stato==='chiuso'?'✅ Chiuso':int.stato==='anomalia'?'⚠️ Anomalia':'🔧 In lavorazione';
      // Rimuovi bordo da eventuali barre precedentemente selezionate
      document.querySelectorAll('.pl-bar-selected').forEach(function(el){ el.classList.remove('pl-bar-selected'); el.style.outline=''; });
      btn.style.outline='1.5px solid #000';
      btn.classList.add('pl-bar-selected');
      var bubble = document.getElementById('pl-bubble');
      bubble.innerHTML='<div class="pl-bubble-inner">'
        +'<div style="font-size:11px;font-weight:700;color:'+statoColor+';margin-bottom:6px;">'+statoLbl+'</div>'
        +(v?'<div style="margin-bottom:4px;">'+renderTargaHtml(v.targa)+'</div>':'')
        +(v?'<div style="font-size:12px;font-weight:600;color:#1e293b;margin-bottom:4px;">'+escHtml(v.nome)+'</div>':'')
        +'<div style="font-size:12px;color:#334155;margin-bottom:4px;">'+escHtml(int.descrizione||'')+'</div>'
        +(sup?'<div style="font-size:11px;color:#64748b;">🏠 '+escHtml(sup.nome)+'</div>':'')
        +'<div style="font-size:11px;color:#94a3b8;margin-top:6px;">Dal '+fmtDate(int.dataApertura)+(int.kmApertura?' · '+fmtKM(int.kmApertura):'')+'</div>'
        +(int.dataChiusura?'<div style="font-size:11px;color:#94a3b8;">Al '+fmtDate(int.dataChiusura)+'</div>':'')
        +'<div style="display:flex;gap:6px;margin-top:10px;">'
        +(int.stato!=='chiuso'&&int.stato!=='annullato'?'<button class="bubble-chiudi" data-iid="'+int.id+'" data-vid="'+int.vehicleId+'" style="flex:1;background:#16a34a;color:#fff;border:none;border-radius:7px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;">Chiudi</button>':'')
        +(int.stato!=='chiuso'&&int.stato!=='annullato'?'<button class="bubble-ann" data-iid="'+int.id+'" data-vid="'+int.vehicleId+'" style="background:#ca8a04;color:#fff;border:none;border-radius:7px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;">✕ Annulla</button>':'')
        +'<button class="bubble-mod" data-iid="'+int.id+'" data-vid="'+int.vehicleId+'" style="background:#f1f5f9;color:#475569;border:none;border-radius:7px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;">Modifica</button>'
        +'</div>'
        +'</div>';
      bubble.style.display='block';
      bubble.style.left=finalX+'px';
      bubble.style.top=finalY+'px';
      bubble.style.transform='translateY(-100%)';
    });
  });

  // Barre GOMME → fumetto
  panel.querySelectorAll('.pl-bar-tire').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var tiid = btn.dataset.tiid;
      var ti   = DB.tireInterventions().find(function(x){ return x.id===tiid; });
      var v    = DB.vehicles().find(function(x){ return x.id===btn.dataset.vid; });
      if (!ti) return;
      var rect   = btn.getBoundingClientRect();
      var finalX = Math.min(Math.max(rect.left+rect.width/2-128,8),window.innerWidth-264);
      var finalY = Math.max(rect.top-8,0);
      document.querySelectorAll('.pl-bar-selected').forEach(function(el){ el.classList.remove('pl-bar-selected'); el.style.outline=''; });
      btn.style.outline='1.5px solid #000';
      btn.classList.add('pl-bar-selected');
      var bubble = document.getElementById('pl-bubble');
      bubble.innerHTML='<div class="pl-bubble-inner">'
        +'<div style="font-size:11px;font-weight:700;color:#1e40af;margin-bottom:6px;">🔵 Cambio gomme programmato</div>'
        +(v?'<div style="margin-bottom:4px;">'+renderTargaHtml(v.targa)+'</div>':'')
        +(v?'<div style="font-size:12px;font-weight:600;color:#1e293b;margin-bottom:6px;">'+escHtml(v.nome)+'</div>':'')
        +'<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">📅 '+fmtDate(ti.dataProgrammata)+'</div>'
        +(ti.note?'<div style="font-size:12px;color:#475569;margin-bottom:10px;">'+escHtml(ti.note)+'</div>':'')
        +'<button class="bubble-tire-edita" data-tiid="'+tiid+'" style="width:100%;background:#1e40af;color:#fff;border:none;border-radius:7px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;">Edita cambio gomme</button>'
        +'</div>';
      bubble.style.display='block';
      bubble.style.left=finalX+'px';
      bubble.style.top=finalY+'px';
      bubble.style.transform='translateY(-100%)';
    });
  });

  function _closeBubble() {
    var bubble = document.getElementById('pl-bubble');
    if (bubble) bubble.style.display='none';
    document.querySelectorAll('.pl-bar-selected').forEach(function(el){ el.classList.remove('pl-bar-selected'); el.style.outline=''; });
  }

  // Barre ANOMALIA DA CHECK (senza intervento) → apre maschera anomalie del check specifico
  panel.querySelectorAll('.pl-bar-checkanom').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      _closeBubble();
      document.querySelectorAll('.pl-bar-selected').forEach(function(el){ el.classList.remove('pl-bar-selected'); el.style.outline=''; });
      btn.style.outline='1.5px solid #000';
      btn.classList.add('pl-bar-selected');
      window._anomFromPlanner = true;
      openCheckAnomalieFromPlanner(btn.dataset.checkanomCid, btn.dataset.checkanomVid);
    });
  });

  // Barre SEGNALAZIONE aperta → apre dettaglio segnalazione
  panel.querySelectorAll('.pl-bar-segnalazione').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      _closeBubble();
      document.querySelectorAll('.pl-bar-selected').forEach(function(el){ el.classList.remove('pl-bar-selected'); el.style.outline=''; });
      btn.style.outline='1.5px solid #000';
      btn.classList.add('pl-bar-selected');
      openSegnalazioneDetail(btn.dataset.segnId);
    });
  });

  // Overlay click → check badge / cella nuova
  var overlay = panel.querySelector('.pl-bars-overlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target.closest('.pl-bar')) return;
      var bubble = document.getElementById('pl-bubble');
      if (bubble && bubble.style.display !== 'none') { _closeBubble(); return; }
      overlay.style.pointerEvents = 'none';
      var el = document.elementFromPoint(e.clientX, e.clientY);
      overlay.style.pointerEvents = '';
      if (!el) return;
      var vrow = el.closest('.pl-vrow');
      if (vrow && (vrow.classList.contains('ck-ok')||vrow.classList.contains('ck-anom'))) {
        var checkId=vrow.dataset.checkId, vehicleId=vrow.dataset.vehicleId;
        if (checkId && vehicleId) openCheckDetailFromPlanner(checkId, vehicleId);
        return;
      }
      var cell = el.closest('.pl-cell[data-date]');
      if (cell && cell.dataset.date) {
        var dd=cell.dataset.date;
        plannerNewIntervention(parseInt(dd.slice(0,4)),parseInt(dd.slice(5,7))-1,parseInt(dd.slice(8,10)));
      }
    });
  }

  // Riepilogo bottoni
  panel.querySelectorAll('.pl-btn-chiudi').forEach(function(el){
    el.addEventListener('click', function(){ openChiusuraForm(this.dataset.iid,this.dataset.vid,true); });
  });
  panel.querySelectorAll('.pl-btn-mod').forEach(function(el){
    el.addEventListener('click', function(){ openInterventionForm(this.dataset.vid,this.dataset.iid,true); });
  });
}

// ═══════════════════════════════════════════════════════
//  openPlanner — entry point
//  Strategia:
//  1. Apre la modale con header+legenda+dow+contenuto del
//     mese corrente in flow normale (modal-body scrolla normalmente).
//  2. Dopo il primo paint inietta prev/next come nodi
//     position:fixed traslati di ±100vw — invisibili,
//     pronti per lo swipe.
// ═══════════════════════════════════════════════════════
function openPlanner(year, month) {
  if (year  !== undefined) _plannerYear  = year;
  if (month !== undefined) _plannerMonth = month;
  if (_plannerMonth > 11) { _plannerMonth = 0;  _plannerYear++; }
  if (_plannerMonth < 0)  { _plannerMonth = 11; _plannerYear--; }
  _plannerBubble = null;

  var CY = _plannerYear, CM = _plannerMonth;
  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var PY = CM===0?CY-1:CY,  PM = CM===0?11:CM-1;
  var NY = CM===11?CY+1:CY, NM = CM===11?0:CM+1;

  var curData = _buildMonthPanel(CY, CM);

  var legendHtml =
    '<div class="pl-legend">'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkOk+'"></div>Check OK</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkAnom+'"></div>Check anomalia</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.intervento+'"></div>Intervento</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+'"></div>Cambio gomme</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.annullato+'"></div>Annullato</div>'
    +'</div>';

  var dowHdr = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']
    .map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('');

  // Costruisce l'HTML del pannello corrente direttamente come stringa
  // (va in flow normale dentro modal-body, che scrolla normalmente)
  var curPanelHtml =
    '<div class="pl-grid-wrap">'
    +'<div class="pl-grid" id="pl-grid-cur">'+curData.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+curData.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+curData.openCount+')</div>'+curData.sumHtml+'</div>';

  openModal('',
    '<div id="planner-wrap">'
    +'<div class="pl-header">'
    +'<button class="pl-nav-btn" id="pl-prev">&#8249;</button>'
    +'<div class="pl-title" id="pl-title">'+MONTHS[CM]+' '+CY+'</div>'
    +'<button class="pl-nav-btn" id="pl-next">&#8250;</button>'
    +'</div>'
    +legendHtml
    +'<div class="pl-dow-hdr">'+dowHdr+'</div>'
    +'<div id="pl-cur-panel">'+curPanelHtml+'</div>'
    +'<div id="pl-bubble" style="display:none;" class="pl-bubble"></div>'
    +'</div>'
  );

  setTimeout(function() {
    var curPanel = document.getElementById('pl-cur-panel');
    if (!curPanel) return;

    _attachPanelListeners(curPanel);
    _drawTodayBorder(curPanel);

    // Fumetto — event delegation
    document.getElementById('pl-bubble')?.addEventListener('click', function(e) {
      var bc=e.target.closest('.bubble-chiudi');
      var bm=e.target.closest('.bubble-mod');
      var ba=e.target.closest('.bubble-ann');
      var bt=e.target.closest('.bubble-tire-edita');
      function clearBubble(){ document.getElementById('pl-bubble').style.display='none'; document.querySelectorAll('.pl-bar-selected').forEach(function(el){el.classList.remove('pl-bar-selected');el.style.outline='';}); }
      if (bc){ clearBubble(); openChiusuraForm(bc.dataset.iid,bc.dataset.vid,true); }
      if (bm){ clearBubble(); openInterventionForm(bm.dataset.vid,bm.dataset.iid,true); }
      if (ba){ clearBubble(); annullaIntervento(ba.dataset.iid,ba.dataset.vid,true); }
      if (bt){ clearBubble(); openEditCambioGomme(bt.dataset.tiid); }
    });

    document.getElementById('pl-prev')?.addEventListener('click', function(){ _plannerSwipe(false); });
    document.getElementById('pl-next')?.addEventListener('click', function(){ _plannerSwipe(true); });

    // Swipe sul modal-body
    var body = document.getElementById('modal-body');
    if (body) _initPlannerSwipe(body);

    // ── Inietta prev/next off-screen DOPO il primo paint ──
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var box = document.getElementById('modal-box');
        if (!box) return;
        var W = box.offsetWidth;

        // Rimuovi pannelli precedenti se esistono (riapertura)
        ['pl-prev-panel','pl-next-panel'].forEach(function(id){
          var old = document.getElementById(id);
          if (old) old.remove();
        });

        // prev panel — costruito come nodo DOM, posizionato fixed fuori schermo a sinistra
        var prevData = _buildMonthPanel(PY, PM);
        var prevNode = _buildPanelNode(prevData, PY, PM);
        prevNode.id = 'pl-prev-panel';
        _setPanelOffscreen(prevNode, -W);
        _attachPanelListeners(prevNode);
        document.body.appendChild(prevNode);

        // next panel — fuori schermo a destra
        var nextData = _buildMonthPanel(NY, NM);
        var nextNode = _buildPanelNode(nextData, NY, NM);
        nextNode.id = 'pl-next-panel';
        _setPanelOffscreen(nextNode, W);
        _attachPanelListeners(nextNode);
        document.body.appendChild(nextNode);
      });
    });

  }, 50);
}

// ── Crea il nodo pannello off-screen (appeso a body, position:fixed) ──
function _buildPanelNode(data, Y, M) {
  var div = document.createElement('div');
  div.className = 'pl-month-panel';
  div.dataset.plY = Y;
  div.dataset.plM = M;
  // Il contenuto è identico alla struttura del pannello corrente
  div.innerHTML =
    '<div class="pl-grid-wrap">'
    +'<div class="pl-grid" id="pl-grid-'+Y+'-'+M+'">'+data.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+data.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+data.openCount+')</div>'+data.sumHtml+'</div>';
  return div;
}

// ── Posiziona un pannello off-screen (fixed, stessa geometria del modal-box) ──
function _setPanelOffscreen(node, dx) {
  var box = document.getElementById('modal-box');
  if (!box) return;
  var r = box.getBoundingClientRect();
  node.style.cssText =
    'position:fixed;'
    +'top:'+r.top+'px;left:'+r.left+'px;'
    +'width:'+r.width+'px;height:'+r.height+'px;'
    +'overflow-y:auto;-webkit-overflow-scrolling:touch;'
    +'padding:0 16px 20px;'
    +'background:#fff;'
    +'z-index:199;'   // sotto la modale (z-index 200) → invisibile
    +'transform:translateX('+dx+'px);'
    +'will-change:transform;pointer-events:none;';
}

// ── Esegui la transizione animata ──
// Strategia semplice e robusta:
//  1. Costruisce subito il DOM del mese nuovo (non animato)
//  2. Crea due cloni fixed: "uscita" (contenuto attuale) e "entrata" (nuovo)
//  3. Nasconde il modal-body, anima i cloni, poi ripristina
//  4. In questo modo il modal-body non viene mai sfarfallato
function _plannerSwipe(goNext) {
  // Blocca swipe multipli sovrapposti
  if (window._plannerSwiping) return;
  window._plannerSwiping = true;

  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  // Aggiorna stato globale
  _plannerMonth += goNext ? 1 : -1;
  if (_plannerMonth > 11) { _plannerMonth = 0;  _plannerYear++; }
  if (_plannerMonth < 0)  { _plannerMonth = 11; _plannerYear--; }

  var box  = document.getElementById('modal-box');
  var body = document.getElementById('modal-body');
  if (!box || !body) { window._plannerSwiping = false; openPlanner(_plannerYear, _plannerMonth); return; }

  var r    = box.getBoundingClientRect();
  var W    = r.width;
  var dur  = 300;
  var ease = 'cubic-bezier(.4,0,.2,1)';

  // ── Costruisce l'HTML del nuovo mese ──
  var newData = _buildMonthPanel(_plannerYear, _plannerMonth);
  var newPanelHtml =
    '<div id="planner-wrap">'
    +'<div class="pl-header">'
    +'<button class="pl-nav-btn" id="pl-prev">&#8249;</button>'
    +'<div class="pl-title" id="pl-title">'+MONTHS[_plannerMonth]+' '+_plannerYear+'</div>'
    +'<button class="pl-nav-btn" id="pl-next">&#8250;</button>'
    +'</div>'
    +'<div class="pl-legend">'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkOk+'"></div>Check OK</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.checkAnom+'"></div>Check anomalia</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.intervento+'"></div>Intervento</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.gomme+'"></div>Cambio gomme</div>'
    +'<div class="pl-leg-item"><div class="pl-leg-dot" style="background:'+EV_COLORS.annullato+'"></div>Annullato</div>'
    +'</div>'
    +'<div class="pl-dow-hdr">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(function(d){ return '<div class="pl-dow">'+d+'</div>'; }).join('')+'</div>'
    +'<div id="pl-cur-panel">'
    +'<div class="pl-grid-wrap">'
    +'<div class="pl-grid">'+newData.gridHtml+'</div>'
    +'<div class="pl-bars-overlay" style="position:absolute;inset:0;">'+newData.barsHtml+'</div>'
    +'</div>'
    +'<div class="pl-sum"><div class="pl-sum-hdr">Interventi aperti ('+newData.openCount+')</div>'+newData.sumHtml+'</div>'
    +'</div>'
    +'<div id="pl-bubble" style="display:none;" class="pl-bubble"></div>'
    +'</div>';

  // ── Crea clone "uscita": snapshot del contenuto corrente ──
  var cloneBase = 'position:fixed;top:'+r.top+'px;left:'+r.left+'px;'
    +'width:'+W+'px;overflow:hidden;background:#fff;pointer-events:none;will-change:transform;';
  // Altezza: dalla top del body fino al fondo del box
  var bodyTop  = body.getBoundingClientRect().top;
  var clipH    = r.bottom - bodyTop;

  var exitClone = document.createElement('div');
  exitClone.style.cssText = cloneBase
    +'top:'+bodyTop+'px;height:'+clipH+'px;z-index:210;padding:0 16px 20px;overflow-y:hidden;';
  exitClone.innerHTML = body.innerHTML;
  document.body.appendChild(exitClone);

  // ── Crea clone "entrata": il nuovo mese, parte da ±W ──
  var enterClone = document.createElement('div');
  enterClone.style.cssText = cloneBase
    +'top:'+bodyTop+'px;height:'+clipH+'px;z-index:209;padding:0 16px 20px;overflow-y:hidden;'
    +'transform:translateX('+(goNext ? W : -W)+'px);';
  enterClone.innerHTML = newPanelHtml;
  document.body.appendChild(enterClone);

  // Nasconde il body reale e setta l'overflow:hidden sul box per clippare
  body.style.visibility = 'hidden';
  box.style.overflow = 'hidden';

  // ── Avvia animazione al prossimo frame ──
  requestAnimationFrame(function() {
    var t = 'transform '+dur+'ms '+ease;
    exitClone.style.transition  = t;
    enterClone.style.transition = t;
    exitClone.style.transform   = 'translateX('+(goNext ? -W : W)+'px)';
    enterClone.style.transform  = 'translateX(0)';

    setTimeout(function() {
      // Pulizia cloni
      exitClone.remove();
      enterClone.remove();

      // Aggiorna il DOM reale con il nuovo mese
      body.innerHTML = newPanelHtml;
      body.style.visibility = '';
      body.scrollTop = 0;
      box.style.overflow = '';

      // Riattacca listeners
      var newCur = document.getElementById('pl-cur-panel');
      if (newCur) {
        _attachPanelListeners(newCur);
        _drawTodayBorder(newCur);
      }

      document.getElementById('pl-bubble')?.addEventListener('click', function(e) {
        var bc=e.target.closest('.bubble-chiudi');
        var bm=e.target.closest('.bubble-mod');
        var ba=e.target.closest('.bubble-ann');
        var bt=e.target.closest('.bubble-tire-edita');
        function clearBubble(){ document.getElementById('pl-bubble').style.display='none'; document.querySelectorAll('.pl-bar-selected').forEach(function(el){el.classList.remove('pl-bar-selected');el.style.outline='';}); }
        if (bc){ clearBubble(); openChiusuraForm(bc.dataset.iid,bc.dataset.vid,true); }
        if (bm){ clearBubble(); openInterventionForm(bm.dataset.vid,bm.dataset.iid,true); }
        if (ba){ clearBubble(); annullaIntervento(ba.dataset.iid,ba.dataset.vid,true); }
        if (bt){ clearBubble(); openEditCambioGomme(bt.dataset.tiid); }
      });

      document.getElementById('pl-prev')?.addEventListener('click', function(){ _plannerSwipe(false); });
      document.getElementById('pl-next')?.addEventListener('click', function(){ _plannerSwipe(true); });
      _initPlannerSwipe(body);

      // Sblocca swipe e ricrea pannelli off-screen
      window._plannerSwiping = false;

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var bx2 = document.getElementById('modal-box');
          if (!bx2) return;
          var W2 = bx2.offsetWidth;
          // Rimuovi vecchi off-screen
          ['pl-prev-panel','pl-next-panel'].forEach(function(id){
            var n=document.getElementById(id); if(n) n.remove();
          });
          var PY2 = _plannerMonth===0?_plannerYear-1:_plannerYear, PM2 = _plannerMonth===0?11:_plannerMonth-1;
          var NY2 = _plannerMonth===11?_plannerYear+1:_plannerYear, NM2 = _plannerMonth===11?0:_plannerMonth+1;

          var pD=_buildMonthPanel(PY2,PM2), pN=_buildPanelNode(pD,PY2,PM2);
          pN.id='pl-prev-panel'; _setPanelOffscreen(pN,-W2); _attachPanelListeners(pN); document.body.appendChild(pN);

          var nD=_buildMonthPanel(NY2,NM2), nN=_buildPanelNode(nD,NY2,NM2);
          nN.id='pl-next-panel'; _setPanelOffscreen(nN,W2); _attachPanelListeners(nN); document.body.appendChild(nN);
        });
      });
    }, dur + 10);
  });
}

// ── Inizializza swipe touch ──
function _initPlannerSwipe(el) {
  // No-op: lo swipe è gestito da un unico listener persistente su modal-overlay
  // inizializzato una sola volta da _initPlannerSwipeGlobal()
}

// Unico listener swipe planner — attaccato una volta sola sull'overlay
var _plannerSwipeInited = false;
function _initPlannerSwipeGlobal() {
  if (_plannerSwipeInited) return;
  _plannerSwipeInited = true;
  var tx=null, ty=null;
  var overlay = document.getElementById('modal-overlay');
  if (!overlay) return;
  overlay.addEventListener('touchstart', function(e) {
    // Solo se il planner è aperto
    if (!document.getElementById('planner-wrap')) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  overlay.addEventListener('touchend', function(e) {
    if (tx === null) return;
    if (!document.getElementById('planner-wrap')) { tx=null; return; }
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = null; ty = null;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      _plannerSwipe(dx < 0);
    }
  }, { passive: true });
}

// Apre la scheda check completa dal planner
function openCheckDetailFromPlanner(checkId, vehicleId) {
  var check = DB.checks().find(function(c) { return c.id === checkId; });
  var v = DB.vehicles().find(function(x) { return x.id === vehicleId; });
  if (!check) return;
  var anom = check.items ? check.items.filter(function(i) { return i.val === 'anomalia'; }) : [];
  var items = check.items || [];
  openModal2('Check — ' + (v ? v.targa : ''),
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'
    + (v ? renderTargaHtml(v.targa) : '')
    + '<div style="font-size:13px;color:#64748b;">'
    + fmtDate(check.data) + ' · ' + fmtKM(check.km) + ' · ' + escHtml(check.operatore || '') + '</div>'
    + '</div>'
    + (anom.length > 0
      ? '<div style="background:#fee2e2;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#b91c1c;font-weight:700;">'
        + '⚠️ ' + anom.length + ' anomali' + (anom.length===1?'a':'e') + ': ' + anom.map(function(a){return escHtml(a.voce);}).join(', ')
        + '</div>'
      : '<div style="background:#dcfce7;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#15803d;font-weight:700;">✅ Tutto OK</div>')
    + '<div style="border-top:1px solid #f1f5f9;padding-top:10px;">'
    + items.map(function(it) {
        var isAnom = it.val === 'anomalia';
        return '<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f8fafc;gap:8px;">'
          + '<span style="font-size:13px;font-weight:' + (isAnom?'700':'400') + ';color:' + (isAnom?'#b91c1c':'#475569') + ';">' + escHtml(it.voce) + '</span>'
          + '<span style="font-size:12px;font-weight:700;color:' + (isAnom?'#b91c1c':'#16a34a') + ';white-space:nowrap;">' + (isAnom?'⚠️ Anomalia':'✅ OK') + '</span>'
          + '</div>'
          + (it.note ? '<div style="font-size:11px;color:#64748b;padding:2px 0 6px;font-style:italic;">' + escHtml(it.note) + '</div>' : '');
      }).join('')
    + '</div>'
    + (check.note ? '<div style="margin-top:10px;font-size:13px;color:#64748b;">Note: ' + escHtml(check.note) + '</div>' : '')
    + (anom.length > 0
      ? '<button class="ck-gestisci-anom" data-cid="' + checkId + '" data-vid="' + vehicleId + '" '
        + 'style="width:100%;background:#dc2626;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;">'
        + '⚠️ Gestisci anomalie (' + anom.length + ')</button>'
      : '')
    + '<div style="height:8px;"></div>'
  );
  // Listener per pulsante Gestisci anomalie
  setTimeout(function(){
    var btn = document.querySelector('.ck-gestisci-anom');
    if(btn) btn.addEventListener('click', function(){
      openCheckAnomalieFromPlanner(btn.dataset.cid, btn.dataset.vid);
    });
  }, 30);
}
function openCheckAnomalieFromPlanner(checkId, vehicleId) {
  // Se non impostato dal planner, siamo nel contesto storico
  if(!window._anomFromPlanner) window._anomFromPlanner = false;
  var _fromPlanner = window._anomFromPlanner;
  window._anomFromPlanner = false;
  var check = DB.checks().find(function(c) { return c.id === checkId; });
  var v = DB.vehicles().find(function(x) { return x.id === vehicleId; });
  if (!check) return;

  var anom = check.items ? check.items.filter(function(i) { return i.val === 'anomalia'; }) : [];
  var interventions = DB.interventions();

  // Calcola anomalie ancora senza intervento ATTIVO (gli annullati non contano)
  var anomSenzaInt = anom.filter(function(a) {
    return !interventions.some(function(i) {
      return i.checkId === checkId && i.descrizione && i.descrizione.startsWith(a.voce) && i.stato !== 'annullato';
    });
  });

  if (anomSenzaInt.length === 0) {
    // Tutte le anomalie hanno un intervento collegato — mostra il riepilogo
    var risolteHtml = anom.map(function(a){
      var intCollegato = interventions.find(function(i){ return i.checkId===checkId && i.descrizione && i.descrizione.startsWith(a.voce) && i.stato!=='annullato'; });
      var statoColor = intCollegato && intCollegato.stato==='chiuso' ? '#16a34a' : '#dc2626';
      var statoLbl   = intCollegato ? (intCollegato.stato==='chiuso'?'✅ Chiuso':'🔧 In lavorazione') : '';
      var sup = intCollegato && intCollegato.fornitoreId ? DB.suppliers().find(function(s){ return s.id===intCollegato.fornitoreId; }) : null;
      return '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-bottom:8px;">'
        +'<div style="font-size:12px;font-weight:700;color:#b91c1c;margin-bottom:4px;">⚠️ '+escHtml(a.voce)+(a.note?' — <span style="font-style:italic;font-weight:400;">'+escHtml(a.note)+'</span>':'')+'</div>'

// Crea intervento da anomalia check (chiamato dal planner)
function creaInterventoAnomalia(checkId, vehicleId, voce, note, km) {
  var interventions = DB.interventions();
  // Controlla duplicato
  if (interventions.some(function(i) { return i.checkId === checkId && i.descrizione && i.descrizione.startsWith(voce); })) {
    toast('Intervento già esistente per questa anomalia');
    openCheckAnomalieFromPlanner(checkId, vehicleId);
    return;
  }
  interventions.push({
    id: DB.uid(), vehicleId: vehicleId, checkId: checkId,
    dataApertura: today(), kmApertura: parseInt(km) || null,
    descrizione: voce + (note ? ' — ' + note : ''),
    stato: 'anomalia', origine: 'check',
    fornitoreId: null, dataChiusura: null, kmChiusura: null, noteChiusura: '',
    createdAt: nowISO()
  });
  DB.saveInterventions(interventions);
  toast('Intervento creato', 'success');
  renderAlerts();
  // Riapri la stessa finestra anomalie — se ne restano apre ancora, altrimenti chiude
  openCheckAnomalieFromPlanner(checkId, vehicleId);
}

function plannerNewIntervention(year, month, day) {
  var dateStr  = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  var vehicles  = DB.vehicles().filter(function(v) { return !v.venduto; });
  var suppliers = DB.suppliers().filter(function(s) { return s.attivo; });
  if (!vehicles.length) { toast('Nessun veicolo attivo','error'); return; }
  var suppOpts = '<option value="">— Nessun fornitore —</option>'
    + suppliers.map(function(s) { return '<option value="' + s.id + '">' + escHtml(s.nome) + ' (' + escHtml(s.tipo) + ')</option>'; }).join('');
  openModal2('Nuovo intervento — ' + day + '/' + (month+1) + '/' + year,
    '<div class="form-group"><label class="form-label">Veicolo</label>'
    + '<select class="form-select" id="pni-veh">'
    + vehicles.map(function(v) { return '<option value="' + v.id + '">' + escHtml(v.targa) + ' — ' + escHtml(v.nome) + '</option>'; }).join('')
    + '</select></div>'
    + '<div class="form-group"><label class="form-label">Descrizione *</label>'
    + '<textarea class="form-input" id="pni-desc" rows="3" placeholder="Descrizione intervento..."></textarea></div>'
    + '<div class="form-group"><label class="form-label">Fornitore</label>'
    + '<select class="form-select" id="pni-fornitore">' + suppOpts + '</select></div>'
    + '<div class="form-group"><label class="form-label">Data apertura</label>'
    + '<input class="form-input" id="pni-data" type="date" value="' + dateStr + '"></div>'
    + '<div class="btn-row">'
    + '<button class="btn btn-secondary" onclick="closeModal2()">Annulla</button>'
    + '<button class="btn btn-primary" onclick="savePlannerIntervention()">Crea</button>'
    + '</div>'
  );
}

function savePlannerIntervention() {
  var desc       = document.getElementById('pni-desc')?.value.trim();
  var vehicleId  = document.getElementById('pni-veh')?.value;
  var data       = document.getElementById('pni-data')?.value;
  var fornitoreId= document.getElementById('pni-fornitore')?.value || null;
  if (!desc) { toast('Inserisci una descrizione','error'); return; }
  var v = DB.vehicles().find(function(x) { return x.id === vehicleId; });
  var interventions = DB.interventions();
  interventions.push({
    id: DB.uid(), vehicleId, descrizione: desc,
    dataApertura: data, kmApertura: parseInt(v?.km)||null,
    stato: 'in_lavorazione', fornitoreId: fornitoreId, origine: 'manuale',
    dataChiusura: null, kmChiusura: null, noteChiusura: '',
    createdAt: nowISO()
  });
  DB.saveInterventions(interventions);
  toast('Intervento creato','success');
  renderAlerts();
  closeModal2();
}

function caricaModuloPNG(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Seleziona un file PNG o JPG','error'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    // Verifica dimensioni
    const img = new Image();
    img.onload = function(){
      if(img.width !== 800 || img.height !== 1101){
        toast('Attenzione: dimensioni ' + img.width + '×' + img.height + 'px (attese 800×1101). Caricato comunque.','');
      }
      const s = DB.settings();
      s.pdfBg = e.target.result;
      DB.saveSettings(s);
      toast('Modulo caricato','success');
      openSettings();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toggleGestioneAvanzata(val){
  const s = DB.settings();
  s.gestioneAvanzata = !!val;
  DB.saveSettings(s);
  const slider = document.getElementById('advanced-slider');
  const knob = slider ? slider.querySelector('span') : null;
  if(slider) slider.style.background = val ? '#dc2626' : '#cbd5e1';
  if(knob) knob.style.left = val ? '25px' : '3px';
}

function saveModificaCambioGomme(intId){
  const tireInts = DB.tireInterventions();
  const idx = tireInts.findIndex(x=>x.id===intId);
  if(idx===-1){ toast('Intervento non trovato','error'); return; }

  tireInts[idx].vehicleId      = document.getElementById('et-vehicleId').value;
  tireInts[idx].stato          = document.getElementById('et-stato').value;
  tireInts[idx].dataProgrammata= document.getElementById('et-dataprog').value||null;
  tireInts[idx].dataEffettiva  = document.getElementById('et-dataeff').value||null;
  tireInts[idx].kmEffettivo    = parseInt(document.getElementById('et-kmeff').value)||null;
  tireInts[idx].note           = document.getElementById('et-note').value.trim();
  DB.saveTireInterventions(tireInts);

  // Salva modifiche gomme
  const tires = DB.tires();
  tires.filter(t=>t.vehicleId===tireInts[idx].vehicleId).forEach(tire=>{
    const ti = tires.findIndex(x=>x.id===tire.id);
    if(ti===-1) return;
    tires[ti].stagione      = document.getElementById('et-stagione-'+tire.id)?.value || tire.stagione;
    tires[ti].stato         = document.getElementById('et-stato-'+tire.id)?.value || tire.stato;
    tires[ti].marca         = document.getElementById('et-marca-'+tire.id)?.value.trim() || tire.marca;
    tires[ti].modello       = document.getElementById('et-modello-'+tire.id)?.value.trim() || '';
    tires[ti].dimensione    = document.getElementById('et-dim-'+tire.id)?.value.trim() || '';
    tires[ti].quantita      = parseInt(document.getElementById('et-qty-'+tire.id)?.value)||4;
    tires[ti].dataMontaggio = document.getElementById('et-datamon-'+tire.id)?.value||null;
    tires[ti].kmMontaggio   = parseInt(document.getElementById('et-kmmon-'+tire.id)?.value)||null;
    tires[ti].dataSmontaggio= document.getElementById('et-datasmon-'+tire.id)?.value||null;
    tires[ti].kmSmontaggio  = parseInt(document.getElementById('et-kmsmon-'+tire.id)?.value)||null;
    tires[ti].note          = document.getElementById('et-note-'+tire.id)?.value.trim()||'';
  });
  DB.saveTires(tires);

  closeModal();
  toast('Cambio gomme aggiornato','success');
  renderMain();
}

async function exportData(){
  if(typeof JSZip==='undefined'){
    toast('Libreria ZIP non disponibile — verifica connessione','error');
    return;
  }
  toast('Creazione backup ZIP…');
  try{
    const zip=new JSZip();
    // Dati testo
    const backup={
      version:2, exportedAt:nowISO(),
      vehicles:DB.vehicles(), checks:DB.checks(),
      interventions:DB.interventions(), suppliers:DB.suppliers(),
      tires:DB.tires(), tiresStorico:DB.tiresStorico(),
      tireInterventions:DB.tireInterventions(), settings:DB.settings()
    };
    zip.file('dati.json', JSON.stringify(backup, null, 2));
    // Foto veicoli da IndexedDB (vehicle_photos)
    const photos = await new Promise(res=>{
      const req=indexedDB.open('VehicleCarePro',2);
      req.onsuccess=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('vehicle_photos')){ res([]); return; }
        const tx=db.transaction('vehicle_photos','readonly');
        tx.objectStore('vehicle_photos').getAll().onsuccess=r=>res(r.target.result||[]);
      };
      req.onerror=()=>res([]);
    });
    if(photos.length>0){
      zip.file('vehicle_photos.json', JSON.stringify(photos, null, 2));
    }
    const docs=await IDB.getAll();
    if(docs.length>0){
      const docsFolder=zip.folder('documenti');
      const meta=[];
      for(const doc of docs){
        const ext=doc.nome.includes('.')?doc.nome.split('.').pop():'bin';
        const filename=`${doc.id}.${ext}`;
        docsFolder.file(filename, doc.data); // ArrayBuffer diretto
        meta.push({id:doc.id,vehicleId:doc.vehicleId,tipo:doc.tipo,nome:doc.nome,mime:doc.mime,filename,createdAt:doc.createdAt});
      }
      zip.file('documenti_meta.json', JSON.stringify(meta, null, 2));
    }
    const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const filename=`VehicleCarePro_${today()}.zip`;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    a.click();
    // Salva data ultimo backup
    const s=DB.settings();
    s.lastBackup=nowISO();
    DB.saveSettings(s);
    toast(`Backup "${filename}" scaricato`,'success');
  }catch(e){
    toast('Errore backup: '+e.message,'error');
    console.error(e);
  }
}

function importData(){
  if(typeof JSZip==='undefined'){
    toast('Libreria ZIP non disponibile — verifica connessione','error');
    return;
  }
  const input=document.createElement('input');
  input.type='file';
  input.accept='.zip,.json,application/zip,application/json';
  input.onchange=async function(e){
    const file=e.target.files[0];
    if(!file){ return; }
    toast('Lettura file backup…');
    try{
      // Distingui ZIP da JSON
      if(file.name.endsWith('.zip')||file.type==='application/zip'){
        await _importFromZip(file);
      } else {
        // Vecchio formato JSON — compatibilità
        const text=await file.text();
        const data=JSON.parse(text);
        if(!data.vehicles){ toast('File non valido','error'); return; }
        window._importData=data;
        _showImportConfirm(data, false);
      }
    }catch(err){
      toast('Errore lettura: '+err.message,'error');
      console.error(err);
    }
  };
  input.click();
}

async function _importFromZip(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const dataFile=zip.file('dati.json');
  if(!dataFile){ toast('ZIP non valido: manca dati.json','error'); return; }
  const data=JSON.parse(await dataFile.async('string'));
  if(!data.vehicles){ toast('File dati non valido','error'); return; }
  // Leggi meta documenti
  const metaFile=zip.file('documenti_meta.json');
  const docsToImport=[];
  if(metaFile){
    const meta=JSON.parse(await metaFile.async('string'));
    for(const m of meta){
      const zipEntry=zip.file('documenti/'+m.filename);
      if(zipEntry){
        const ab=await zipEntry.async('arraybuffer');
        docsToImport.push({id:m.id,vehicleId:m.vehicleId,tipo:m.tipo,nome:m.nome,mime:m.mime,data:ab,createdAt:m.createdAt});
      }
    }
  }
  window._importData=data;
  window._importDocs=docsToImport;
  // Foto veicoli
  const photosFile=zip.file('vehicle_photos.json');
  window._importPhotos=photosFile?JSON.parse(await photosFile.async('string')):[];
  _showImportConfirm(data, docsToImport.length);
}

function _showImportConfirm(data, docsCount){
  openModal('📥 Ripristina backup',`
    <div style="background:#dcfce7;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#15803d;font-weight:600;">
      ✅ File valido — pronto per il ripristino
    </div>
    <div style="font-size:14px;color:#334155;margin-bottom:12px;font-weight:600;">Contenuto:</div>
    <div style="background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;color:#334155;line-height:2;">
      🚗 ${data.vehicles?.length||0} veicoli<br>
      📋 ${data.checks?.length||0} check mensili<br>
      🔧 ${data.interventions?.length||0} interventi<br>
      🔵 ${data.tires?.length||0} set gomme<br>
      🏠 ${data.suppliers?.length||0} fornitori<br>
      ${docsCount!==false?`📎 ${docsCount} documenti allegati`:''}
      ${(window._importPhotos?.length||0)>0?`📸 ${window._importPhotos.length} foto veicoli`:''}
    </div>
    <p style="font-size:13px;color:#dc2626;margin-bottom:16px;font-weight:600;">⚠️ I dati attuali verranno sovrascritti!</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="_doImport()">Ripristina tutto</button>
    </div>
  `);
}

async function _doImport(){
  try{
    const data=window._importData;
    const docs=window._importDocs||[];
    if(!data){ toast('Nessun dato da importare','error'); return; }
    if(data.vehicles) DB.saveVehicles(data.vehicles);
    if(data.checks) DB.saveChecks(data.checks);
    if(data.interventions) DB.saveInterventions(data.interventions);
    if(data.suppliers) DB.saveSuppliers(data.suppliers);
    if(data.tires) DB.saveTires(data.tires);
    if(data.tiresStorico) DB.saveTiresStorico(data.tiresStorico);
    if(data.tireInterventions) DB.saveTireInterventions(data.tireInterventions);
    if(data.settings){ const s={...DB.settings(),...data.settings}; DB.saveSettings(s); }
    // Ripristina documenti in IDB
    if(docs.length>0){
      await IDB.clear();
      for(const doc of docs) await IDB.put(doc);
    }
    // Ripristina foto veicoli
    const photos=window._importPhotos||[];
    if(photos.length>0){
      await new Promise(res=>{
        const req=indexedDB.open('VehicleCarePro',2);
        req.onsuccess=e=>{
          const db=e.target.result;
          const tx=db.transaction('vehicle_photos','readwrite');
          const store=tx.objectStore('vehicle_photos');
          store.clear().onsuccess=()=>{ photos.forEach(p=>store.put(p)); tx.oncomplete=res; };
        };
        req.onerror=res;
      });
    }
    window._importPhotos=null;
    window._importData=null;
    window._importDocs=null;
    closeModal();
    toast('Dati ripristinati con successo','success');
    renderAlerts();
    renderMain();
  }catch(err){
    toast('Errore importazione: '+err.message,'error');
    console.error(err);
  }
}

function exportCSV(){
  const vehicles=DB.vehicles();
  const checks=DB.checks();
  const interventions=DB.interventions();

  const rows=[['Tipo','Data','Veicolo','Targa','KM','Dettaglio','Stato','Operatore']];

  checks.forEach(c=>{
    const v=vehicles.find(x=>x.id===c.vehicleId);
    const anom=c.items?.filter(i=>i.val==='anomalia').map(i=>i.voce).join('; ')||'';
    rows.push(['Check',c.data,v?.nome||'',v?.targa||'',c.km,anom||'Tutto OK','',c.operatore||'']);
  });

  interventions.forEach(i=>{
    const v=vehicles.find(x=>x.id===i.vehicleId);
    rows.push(['Intervento',i.dataApertura,v?.nome||'',v?.targa||'',i.kmApertura,i.descrizione,i.stato,'']);
  });

  const csv=rows.map(r=>r.map(cell=>`"${String(cell||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`vehiclecare-storico-${today()}.csv`;
  a.click();
  toast('CSV esportato','success');
}

      {src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="%231e40af"/><text y="360" x="256" text-anchor="middle" font-size="300" font-family="sans-serif">🚗</text></svg>',sizes:'512x512',type:'image/svg+xml'}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const link=document.createElement('link');
  link.rel='manifest';
  link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);

  // Service Worker inline
  if('serviceWorker' in navigator){
    const swCode=`
const CACHE='vcp-v3';
const URLS=['/'];
self.addEventListener('install',e=>{ e.waitUntil(caches.open(CACHE).then(c=>c.addAll([]))); self.skipWaiting(); });
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))); self.clients.claim(); });
self.addEventListener('fetch',e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))); });
    `;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
}

function renderBackupStatus(){
  const el=document.getElementById('backup-status-box');
  if(!el) return;
  const s=DB.settings();
  if(!s.lastBackup){
    el.innerHTML='<div style="background:#fee2e2;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#b91c1c;font-weight:600;">⚠️ Nessun backup eseguito</div>';
    return;
  }
  const days=Math.floor((new Date()-new Date(s.lastBackup))/(1000*60*60*24));
  const warn=days>=(s.backupWarningDays||7);
  el.innerHTML=`<div style="background:${warn?'#fef3c7':'#dcfce7'};border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:${warn?'#92400e':'#15803d'};font-weight:600;">
    ${warn?'⚠️':'✅'} Ultimo backup: ${new Date(s.lastBackup).toLocaleDateString('it-IT')} (${days} giorni fa)
  </div>`;
}

function checkBackupAlert(){
  const s=DB.settings();
  if(!s.lastBackup) return; // Prima volta, non disturbare
  const days=Math.floor((new Date()-new Date(s.lastBackup))/(1000*60*60*24));
  const warn=s.backupWarningDays||7;
  if(days>=warn){
    // Banner non invasivo in cima alla pagina principale
    const existing=document.getElementById('backup-alert-banner');
    if(existing) return;
    const banner=document.createElement('div');
    banner.id='backup-alert-banner';
    banner.className='backup-banner';
    banner.innerHTML=`
      <div class="backup-banner-text">⚠️ Ultimo backup ${days} giorni fa</div>
      <button class="backup-banner-btn" onclick="exportData();this.closest('#backup-alert-banner').remove()">Backup ora</button>
      <button onclick="this.closest('#backup-alert-banner').remove()" style="background:none;border:none;color:#92400e;font-size:18px;cursor:pointer;padding:0 4px;">×</button>
    `;
    const main=document.getElementById('main');
    main.insertBefore(banner, main.firstChild);
  }
}

// Sincronizza vehicle_photos dai documenti "Foto veicolo" già presenti in IDB.
// Serve dopo un ripristino backup dove vehicle_photos è vuoto ma i doc ci sono.
async function syncVehiclePhotosFromDocs(){
  try{
    const allDocs = await IDB.getAll();
    const fotoVeicolo = allDocs.filter(d => d.tipo === 'Foto veicolo' && d.mime && d.mime.startsWith('image/'));
    let changed = false;
    for(const doc of fotoVeicolo){
      const existing = await getVehiclePhoto(doc.vehicleId);
      if(!existing){
        const blob = new Blob([doc.data], {type: doc.mime});
        const dataUrl = await new Promise(res => {
          const r = new FileReader();
          r.onload = e => res(e.target.result);
          r.readAsDataURL(blob);
        });
        await saveVehiclePhoto(doc.vehicleId, dataUrl);
        changed = true;
      }
    }
    if(changed) renderMain();
  }catch(e){ console.warn('syncVehiclePhotosFromDocs:', e); }
}
