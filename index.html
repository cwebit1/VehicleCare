  document.getElementById('an-kpi').innerHTML = [
    {icon:'📋', label:'Check effettuati', val:fChecks.length, color:'#1e40af', bg:'#dbeafe'},
    {icon:'⚠️', label:'Anomalie rilevate', val:anomCount, color:'#b91c1c', bg:'#fee2e2'},
    {icon:'🔧', label:'Interventi aperti', val:intAperti, color:'#92400e', bg:'#fef3c7'},
    {icon:'✅', label:'Interventi chiusi', val:intChiusi, color:'#15803d', bg:'#dcfce7'},
  ].map(k=>`
    <div style="background:${k.bg};border-radius:12px;padding:14px 12px;">
      <div style="font-size:22px;margin-bottom:4px;">${k.icon}</div>
      <div style="font-size:26px;font-weight:800;color:${k.color};line-height:1;">${k.val}</div>
      <div style="font-size:11px;color:${k.color};opacity:.8;margin-top:3px;font-weight:600;">${k.label}</div>
    </div>
  `).join('');

  // ── Utility: raggruppa per periodo ──
  function periodKey(dateStr){
    const d=new Date(dateStr);
    if(_anGran==='week'){
      const tmp=new Date(d); tmp.setDate(d.getDate()-d.getDay()+1);
      return tmp.toISOString().slice(0,10);
    }
    return dateStr.slice(0,7);
  }
  function periodLabel(key){
    if(_anGran==='week'){
      const d=new Date(key);
      return `${d.getDate()}/${d.getMonth()+1}`;
    }
    const [y,m]=key.split('-');
    return ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'][parseInt(m)-1]+' '+y.slice(2);
  }

  // genera tutti i periodi nell'intervallo
  function allPeriods(){
    const keys=new Set(); let cur=new Date(fromD);
    while(cur<=toD){
      keys.add(periodKey(cur.toISOString().slice(0,10)));
      if(_anGran==='week') cur.setDate(cur.getDate()+7);
      else cur.setMonth(cur.getMonth()+1);
    } return [...keys].sort();
  }
  const periods = allPeriods();

  // ── Palette ──
  const PAL=['#3b82f6','#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#0ea5e9','#84cc16','#f97316'];

  // ── Canvas helpers ──
  function setupCanvas(id, h=180){
    const cvs=document.getElementById(id);
    const dpr=window.devicePixelRatio||1;
    const w=cvs.parentElement.clientWidth-28;
    cvs.width=w*dpr; cvs.height=h*dpr;
    cvs.style.width=w+'px'; cvs.style.height=h+'px';
    const ctx=cvs.getContext('2d'); ctx.scale(dpr,dpr);
    return {ctx,w,h};
  }

  function drawBarChart(id, labels, datasets, opts={}){
    const H=opts.h||180;
    const {ctx,w,h}=setupCanvas(id,H);
    const PAD={top:16,right:8,bottom:32,left:36};
    const cw=w-PAD.left-PAD.right, ch=h-PAD.top-PAD.bottom;
    const n=labels.length; if(!n) return;
    const nSeries=datasets.length;
    const maxVal=Math.max(...datasets.flatMap(d=>d.data),1);
    const yMax=Math.ceil(maxVal*1.15)||1;

    // grid
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
    const steps=4;
    for(let i=0;i<=steps;i++){
      const y=PAD.top+ch-(ch/steps*i);
      ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(PAD.left+cw,y); ctx.stroke();
      ctx.fillStyle='#94a3b8'; ctx.font='10px system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(yMax/steps*i),PAD.left-4,y+3);
    }

    const grpW=cw/n;
    const barW=Math.max(4, Math.min(24, grpW/nSeries-3));

    datasets.forEach((ds,si)=>{
      ctx.fillStyle=ds.color;
      ds.data.forEach((val,i)=>{
        const barH=val/yMax*ch;
        const x=PAD.left+grpW*i+(grpW-barW*nSeries-(nSeries-1)*2)/2+si*(barW+2);
        const y=PAD.top+ch-barH;
        const r=Math.min(4,barW/2);
        ctx.beginPath();
        ctx.moveTo(x+r,y); ctx.lineTo(x+barW-r,y);
        ctx.arcTo(x+barW,y,x+barW,y+r,r); ctx.lineTo(x+barW,y+barH);
        ctx.lineTo(x,y+barH); ctx.lineTo(x,y+r);
        ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); ctx.fill();
      });
    });
    // x labels
    ctx.fillStyle='#64748b'; ctx.font='10px system-ui'; ctx.textAlign='center';
    const step=Math.ceil(n/8);
    labels.forEach((lbl,i)=>{ if(i%step===0) ctx.fillText(lbl,PAD.left+grpW*i+grpW/2,h-PAD.bottom+14); });

    // legend
    if(datasets.length>1){
      let lx=PAD.left; const ly=8;
      datasets.forEach(ds=>{
        ctx.fillStyle=ds.color; ctx.fillRect(lx,ly-8,10,8);
        ctx.fillStyle='#475569'; ctx.font='10px system-ui'; ctx.textAlign='left';
        ctx.fillText(ds.label,lx+13,ly); lx+=ctx.measureText(ds.label).width+28;
      });
    }
  }

  function drawLineChart(id, labels, datasets, opts={}){
    const H=opts.h||180;
    const {ctx,w,h}=setupCanvas(id,H);
    const PAD={top:20,right:8,bottom:32,left:42};
    const cw=w-PAD.left-PAD.right, ch=h-PAD.top-PAD.bottom;
    const n=labels.length; if(n<2) return;
    const allVals=datasets.flatMap(d=>d.data);
    const minVal=Math.min(...allVals); const maxVal=Math.max(...allVals,minVal+1);
    const yMin=Math.max(0,minVal-Math.ceil((maxVal-minVal)*0.1));
    const yMax=maxVal+Math.ceil((maxVal-minVal)*0.15)||maxVal+1;

    // grid
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
    const steps=4;
    for(let i=0;i<=steps;i++){
      const y=PAD.top+ch-ch/steps*i;
      ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(PAD.left+cw,y); ctx.stroke();
      ctx.fillStyle='#94a3b8'; ctx.font='10px system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(yMin+(yMax-yMin)/steps*i),PAD.left-4,y+3);
    }

    const xStep=cw/(n-1);
    datasets.forEach((ds,si)=>{
      const col=ds.color||PAL[si%PAL.length];
      // area fill
      ctx.beginPath();
      ds.data.forEach((v,i)=>{ const x=PAD.left+xStep*i; const y=PAD.top+ch-(v-yMin)/(yMax-yMin)*ch; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.lineTo(PAD.left+xStep*(n-1),PAD.top+ch); ctx.lineTo(PAD.left,PAD.top+ch); ctx.closePath();
      ctx.fillStyle=col+'22'; ctx.fill();
      // line
      ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.lineJoin='round';
      ds.data.forEach((v,i)=>{ const x=PAD.left+xStep*i; const y=PAD.top+ch-(v-yMin)/(yMax-yMin)*ch; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.stroke();
      // dots
      ds.data.forEach((v,i)=>{
        const x=PAD.left+xStep*i; const y=PAD.top+ch-(v-yMin)/(yMax-yMin)*ch;
        ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
      });
    });

    // x labels
    const step=Math.ceil(n/8);
    ctx.fillStyle='#64748b'; ctx.font='10px system-ui'; ctx.textAlign='center';
    labels.forEach((lbl,i)=>{ if(i%step===0) ctx.fillText(lbl,PAD.left+xStep*i,h-PAD.bottom+14); });

    // legend
    if(datasets.length>1){
      let lx=PAD.left; const ly=12;
      datasets.forEach(ds=>{
        const col=ds.color||PAL[0];
        ctx.strokeStyle=col; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(lx,ly-4); ctx.lineTo(lx+16,ly-4); ctx.stroke();
        ctx.fillStyle='#475569'; ctx.font='10px system-ui'; ctx.textAlign='left';
        ctx.fillText(ds.label,lx+20,ly); lx+=ctx.measureText(ds.label).width+38;
      });
    }
  }

  function drawDonut(id, segments, opts={}){
    const H=opts.h||220;
    const {ctx,w,h}=setupCanvas(id,H);
    const cx=w/2, cy=h/2-10, r=Math.min(cx,cy)-20, inner=r*0.55;
    const total=segments.reduce((s,x)=>s+x.val,0)||1;
    let angle=-Math.PI/2;
    segments.forEach(seg=>{
      const slice=seg.val/total*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,angle,angle+slice);
      ctx.closePath(); ctx.fillStyle=seg.color; ctx.fill();
      angle+=slice;
    });
    // hole
    ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    // center text
    ctx.fillStyle='#1e293b'; ctx.font='bold 22px system-ui'; ctx.textAlign='center';
    ctx.fillText(segments.reduce((s,x)=>s+x.val,0),cx,cy+4);
    ctx.fillStyle='#64748b'; ctx.font='11px system-ui';
    ctx.fillText('totale',cx,cy+18);
    // legend bottom
    const legY=h-24; const itemW=w/segments.length;
    segments.forEach((seg,i)=>{
      const lx=itemW*i+itemW/2;
      ctx.fillStyle=seg.color; ctx.beginPath(); ctx.arc(lx-28,legY+2,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#475569'; ctx.font='10px system-ui'; ctx.textAlign='left';
      ctx.fillText(`${seg.label} (${seg.val})`,lx-20,legY+6);
    });
  }

  function drawHBar(id, labels, values, colors, opts={}){
    const barH=28, padV=8;
    const H=opts.h||(labels.length*(barH+padV)+40);
    const {ctx,w,h}=setupCanvas(id,H);
    const PAD={top:8,right:50,bottom:8,left:100};
    const cw=w-PAD.left-PAD.right;
    const maxVal=Math.max(...values,1);

    labels.forEach((lbl,i)=>{
      const y=PAD.top+i*(barH+padV);
      const val=values[i];
      const bw=val/maxVal*cw;
      const col=colors[i%colors.length];
      // bar bg
      ctx.fillStyle='#f1f5f9';
      ctx.beginPath();
      ctx.moveTo(PAD.left,y); ctx.lineTo(PAD.left+cw-6,y);
      ctx.arcTo(PAD.left+cw,y,PAD.left+cw,y+6,6); ctx.lineTo(PAD.left+cw,y+barH-6);
      ctx.arcTo(PAD.left+cw,y+barH,PAD.left+cw-6,y+barH,6); ctx.lineTo(PAD.left,y+barH);
      ctx.closePath(); ctx.fill();
      // bar fill
      if(bw>0){
        ctx.fillStyle=col;
        const r2=Math.min(6,bw/2);
        ctx.beginPath();
        ctx.moveTo(PAD.left,y); ctx.lineTo(PAD.left+bw-r2,y);
        ctx.arcTo(PAD.left+bw,y,PAD.left+bw,y+r2,r2); ctx.lineTo(PAD.left+bw,y+barH-r2);
        ctx.arcTo(PAD.left+bw,y+barH,PAD.left+bw-r2,y+barH,r2); ctx.lineTo(PAD.left,y+barH);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle='#334155'; ctx.font='11px system-ui'; ctx.textAlign='right';
      const shortLbl=lbl.length>14?lbl.slice(0,13)+'…':lbl;
      ctx.fillText(shortLbl,PAD.left-6,y+barH/2+4);
      ctx.fillStyle=bw>40?'#fff':col; ctx.font='bold 11px system-ui'; ctx.textAlign='left';
      ctx.fillText(val, bw>40?PAD.left+bw-28:PAD.left+bw+6, y+barH/2+4);
    });
  }

  // ── GRAFICO 1: KM nel tempo per veicolo ──
  const veicFilt = _anVehicle ? vehicles.filter(v=>v.id===_anVehicle) : vehicles;
  const kmDatasets = veicFilt.slice(0,5).map((v,vi)=>{
    const data=periods.map(p=>{
      const cs=fChecks.filter(c=>c.vehicleId===v.id&&periodKey(c.data)===p);
      return cs.length?Math.max(...cs.map(c=>parseInt(c.km)||0)):null;
    });
    // fill null with previous known value
    let last=null; const filled=data.map(v=>{ if(v!==null){last=v;return v;} return last||0; });
    return {label:v.targa,data:filled,color:PAL[vi%PAL.length]};
  });
  if(kmDatasets.length) drawLineChart('cvs-km',periods.map(periodLabel),kmDatasets,{h:200});

  // ── GRAFICO 2: Check per periodo ──
  const checkCounts=periods.map(p=>fChecks.filter(c=>periodKey(c.data)===p).length);
  drawBarChart('cvs-checks',periods.map(periodLabel),[{label:'Check',data:checkCounts,color:'#3b82f6'}]);

  // ── GRAFICO 3: Durata interventi — un grafico per fornitore ──
  const suppliersAll = DB.suppliers();
  const intChiusiDurata = fInts.filter(i=>i.stato==='chiuso' && i.dataApertura && i.dataChiusura);

  function roundRectFill(ctx, x, y, w, h, r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath(); ctx.fill();
  }

  // raggruppa per fornitore
  const fornMap = {};
  intChiusiDurata.forEach(i=>{
    const fKey = i.fornitoreId || '__interno__';
    if(!fornMap[fKey]) fornMap[fKey]=[];
    const giorni = Math.max(1, Math.round((new Date(i.dataChiusura)-new Date(i.dataApertura))/(1000*60*60*24)));
    const vTarga = DB.vehicles().find(v=>v.id===i.vehicleId)?.targa||'N/D';
    fornMap[fKey].push({targa: vTarga, giorni, intId: i.id});
  });

  const durataContainer = document.getElementById('an-chart-durata');
  durataContainer.innerHTML = '<div style="font-size:13px;font-weight:700;margin-bottom:10px;">⏱️ Durata interventi per fornitore</div>';

  const globalMaxG = Object.values(fornMap).length
    ? Math.max(...Object.values(fornMap).flatMap(bars=>bars.map(b=>b.giorni)), 1)
    : 1;

  if(Object.keys(fornMap).length===0){
    durataContainer.innerHTML += '<p style="color:#94a3b8;font-size:13px;">Nessun intervento chiuso nel periodo</p>';
  } else {
    Object.keys(fornMap).forEach((fKey, fi)=>{
      const fNome = fKey==='__interno__' ? 'Interno' : suppliersAll.find(s=>s.id===fKey)?.nome||'Fornitore';
      const color = PAL[fi%PAL.length];
      const bars = [...fornMap[fKey]].sort((a,b)=>b.giorni-a.giorni);
      const maxG = globalMaxG;

      // crea sotto-card per ogni fornitore
      const subCard = document.createElement('div');
      subCard.style.cssText='background:#f8fafc;border-radius:10px;padding:10px 12px;margin-bottom:10px;';
      durataContainer.appendChild(subCard);

      const barsHtml = bars.map(bar=>`
        <div onclick="openInterventionDetail('${bar.intId}')" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;">
          <div style="width:52px;flex-shrink:0;font-size:11px;font-weight:700;color:#334155;text-align:right;">${escHtml(bar.targa)}</div>
          <div style="flex:1;background:#e2e8f0;border-radius:5px;height:24px;position:relative;">
            <div style="width:${Math.round(bar.giorni/maxG*100)}%;background:${color};border-radius:5px;height:100%;"></div>
            <span style="position:absolute;left:${bar.giorni/maxG>0.4?'auto':'calc('+Math.round(bar.giorni/maxG*100)+'% + 6px)'};right:${bar.giorni/maxG>0.4?'8px':'auto'};top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:${bar.giorni/maxG>0.4?'#fff':color};">${bar.giorni}g</span>
          </div>
        </div>
      `).join('');

      subCard.innerHTML=`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <div style="width:10px;height:10px;border-radius:3px;background:${color};flex-shrink:0;"></div>
          <span style="font-size:12px;font-weight:700;color:#334155;">${escHtml(fNome)}</span>
          <span style="font-size:11px;color:#94a3b8;margin-left:auto;">${bars.length} intervent${bars.length===1?'o':'i'}</span>
        </div>
        ${barsHtml}
      `;
    });
  }

  // ── GRAFICO 5: Anomalie più frequenti ──
  const anomMap={};
  fChecks.forEach(c=>(c.items||[]).filter(i=>i.val==='anomalia').forEach(a=>{
    anomMap[a.voce]=(anomMap[a.voce]||0)+1;
  }));
  const anomSorted=Object.entries(anomMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(anomSorted.length){
    drawHBar('cvs-anom',anomSorted.map(x=>x[0]),anomSorted.map(x=>x[1]),
      anomSorted.map((_,i)=>PAL[i%PAL.length]),{h:anomSorted.length*36+40});
    document.querySelector('#cvs-anom').style.height=(anomSorted.length*36+40)+'px';
  } else {
    document.getElementById('an-chart-anom').innerHTML+='<p style="color:#94a3b8;font-size:13px;">Nessuna anomalia nel periodo</p>';
  }

  // ── GRAFICI 6 & 7: Segnalazioni e Anomalie — interno vs esterno ──
  const allInts = DB.interventions();
  const fSegn = DB.segnalazioni().filter(s=>{
    const d=new Date(s.data);
    return d>=fromD && d<=toD && (!_anVehicle||s.vehicleId===_anVehicle);
  });

  // Segnalazioni per periodo: totale / risolte internamente / con fornitore
  const segnTot   = periods.map(p=>fSegn.filter(s=>periodKey(s.data)===p).length);
  const segnInt   = periods.map(p=>fSegn.filter(s=>{
    if(periodKey(s.data)!==p) return false;
    const i=allInts.find(i=>i.segnalazioneId===s.id);
    return i && i.stato==='chiuso' && !i.fornitoreId;
  }).length);
  const segnEst   = periods.map(p=>fSegn.filter(s=>{
    if(periodKey(s.data)!==p) return false;
    const i=allInts.find(i=>i.segnalazioneId===s.id);
    return i && i.fornitoreId;
  }).length);

  document.querySelector('#an-chart-oper > div').textContent = '🚨 Segnalazioni — risoluzione';
  drawBarChart('cvs-oper', periods.map(periodLabel), [
    {label:'Totale',     data:segnTot, color:'#94a3b8'},
    {label:'Interno',    data:segnInt, color:'#10b981'},
    {label:'Fornitore',  data:segnEst, color:'#6366f1'},
  ]);

  // Aggiungi secondo grafico anomalie da check
  const anomChartDiv = document.createElement('div');
  anomChartDiv.className='card';
  anomChartDiv.style.marginBottom='12px';
  anomChartDiv.innerHTML='<div style="font-size:13px;font-weight:700;margin-bottom:10px;">🔍 Anomalie da check — risoluzione</div><canvas id="cvs-anom2" style="width:100%;"></canvas>';
  document.getElementById('an-chart-oper').after(anomChartDiv);

  // Anomalie da check per periodo
  const anomTot2 = periods.map(p=>{
    return fChecks.filter(c=>periodKey(c.data)===p)
      .reduce((s,c)=>s+(c.items||[]).filter(i=>i.val==='anomalia').length,0);
  });
  const anomInt2 = periods.map(p=>{
    return fChecks.filter(c=>periodKey(c.data)===p).reduce((s,c)=>{
      return s+(c.items||[]).filter(it=>{
        if(it.val!=='anomalia') return false;
        const iv=allInts.find(i=>i.checkId===c.id&&i.descrizione.startsWith(it.voce));
        return iv && iv.stato==='chiuso' && !iv.fornitoreId;
      }).length;
    },0);
  });
  const anomEst2 = periods.map(p=>{
    return fChecks.filter(c=>periodKey(c.data)===p).reduce((s,c)=>{
      return s+(c.items||[]).filter(it=>{
        if(it.val!=='anomalia') return false;
        const iv=allInts.find(i=>i.checkId===c.id&&i.descrizione.startsWith(it.voce));
        return iv && iv.fornitoreId;
      }).length;
    },0);
  });

  drawBarChart('cvs-anom2', periods.map(periodLabel), [
    {label:'Totale',    data:anomTot2, color:'#94a3b8'},
    {label:'Interno',   data:anomInt2, color:'#10b981'},
    {label:'Fornitore', data:anomEst2, color:'#6366f1'},
  ]);
}

init();
</script>
</body>
