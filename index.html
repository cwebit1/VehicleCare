async function uploadDoc(event, vehicleId, tipo){
  const file=event.target.files[0];
  if(!file){ return; }
  if(file.size>50*1024*1024){ toast('File troppo grande (max 50MB)','error'); return; }
  toast('Caricamento in corso…');
  try{
    // Leggi come ArrayBuffer per IndexedDB
    const arrayBuffer = await file.arrayBuffer();
    // Rimuovi eventuale doc precedente dello stesso tipo
    const existing = await IDB.getByVehicle(vehicleId);
    const old = existing.find(d=>d.tipo===tipo);
    if(old) await IDB.delete(old.id);
    // Salva in IndexedDB
    const docId = DB.uid();
    await IDB.put({
      id:docId, vehicleId, tipo,
      nome:file.name, mime:file.type,
      data:arrayBuffer, createdAt:nowISO()
    });
    // Se è la foto veicolo, aggiorna anche vehicle_photos per la card
    if(tipo==='Foto veicolo' && file.type.startsWith('image/')){
      const reader = new FileReader();
      reader.onload = async (ev)=>{ await saveVehiclePhoto(vehicleId, ev.target.result); };
      reader.readAsDataURL(file);
    }
    toast('Documento caricato','success');
    await openDocuments(vehicleId);
    renderMain();
  }catch(e){
    toast('Errore caricamento: '+e.message,'error');
    console.error(e);
  }
}

async function deleteDoc(docId, vehicleId){
  const doc = await IDB.get(docId);
  await IDB.delete(docId);
  if(doc && doc.tipo === 'Foto veicolo'){
    await deleteVehiclePhoto(vehicleId);
    renderMain();
  }
  toast('Documento eliminato');
  await openDocuments(vehicleId);
}

async function viewDoc(docId, isPdf){
  // La finestra del PDF va aperta subito, nel tocco dell'utente: dopo l'await
  // il browser mobile non la considera più un gesto e la blocca
  const w = isPdf ? window.open('', '_blank') : null;
  const doc=await IDB.get(docId);
  if(!doc){ if(w) w.close(); toast('Documento non trovato','error'); return; }
  const blob=new Blob([doc.data],{type:doc.mime});
  const url=URL.createObjectURL(blob);
  if(doc.mime==='application/pdf'){
    if(w){
      w.location.href = url;
    } else {
      // Finestra bloccata: apre il PDF tramite link
      const a=document.createElement('a');
      a.href=url; a.target='_blank'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  } else {
    if(w) w.close();
    openImageViewer(url, doc.nome||'Documento');
  }
}

function openImageViewer(url, title){
  // rimuovi viewer esistente
  const existing = document.getElementById('img-viewer-overlay');
  if(existing) existing.remove();

  let scale = 1, rotate = 0;
  let panX = 0, panY = 0;
  let isDragging = false, lastX = 0, lastY = 0;
  let lastDist = null;

  const overlay = document.createElement('div');
  overlay.id = 'img-viewer-overlay';
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);
    display:flex;flex-direction:column;overflow:hidden;touch-action:none;
  `;

  overlay.innerHTML = `
    <div id="ivw-header" style="display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;background:rgba(0,0,0,.6);flex-shrink:0;gap:8px;">
      <span style="color:#fff;font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(title)}</span>
      <button id="ivw-close" style="background:#dc2626;border:none;color:#fff;
        border-radius:7px;padding:0;font-size:16px;font-weight:900;cursor:pointer;
        width:32px;height:32px;display:flex;align-items:center;justify-content:center;
        flex-shrink:0;box-shadow:1px 2px 0 #991b1b;">✕</button>
    </div>
    <div id="ivw-canvas" style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;">
      <img id="ivw-img" src="${url}" draggable="false"
        style="max-width:90%;max-height:80vh;object-fit:contain;user-select:none;
               transition:transform .15s ease;transform-origin:center center;
               transform:scale(1) rotate(0deg) translate(0px,0px);">
    </div>
    <div id="ivw-toolbar" style="display:flex;align-items:center;justify-content:center;gap:10px;
      padding:12px 16px;background:rgba(0,0,0,.6);flex-shrink:0;flex-wrap:wrap;">
      <button class="ivw-btn" id="ivw-rot-l" title="Ruota sinistra">↺ -90°</button>
      <button class="ivw-btn" id="ivw-rot-r" title="Ruota destra">↻ +90°</button>
      <button class="ivw-btn" id="ivw-zoom-in" title="Zoom in">＋ Zoom</button>
      <button class="ivw-btn" id="ivw-zoom-out" title="Zoom out">－ Zoom</button>
      <button class="ivw-btn" id="ivw-reset" title="Reset" style="background:rgba(255,255,255,.1);">⊙ Reset</button>
      <a id="ivw-download" href="${url}" download="${escHtml(title)}"
        class="ivw-btn" style="text-decoration:none;">⬇ Salva</a>
    </div>
    <div id="ivw-hint" style="text-align:center;color:rgba(255,255,255,.35);font-size:11px;padding:4px 0 8px;">
      Pizzica per zoom • Trascina per spostare
    </div>
  `;

  // Stile bottoni toolbar
  const style = document.createElement('style');
  style.textContent = `.ivw-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.25);
    color:#fff;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;}
  .ivw-btn:active{background:rgba(255,255,255,.32);}`;
  overlay.appendChild(style);
  document.body.appendChild(overlay);

  const img = document.getElementById('ivw-img');

  function applyTransform(animated){
    img.style.transition = animated ? 'transform .18s ease' : 'none';
    img.style.transform = `translate(${panX}px,${panY}px) scale(${scale}) rotate(${rotate}deg)`;
  }

  function onMouseMove(e){
    if(!isDragging) return;
    panX += e.clientX - lastX; panY += e.clientY - lastY;
    lastX=e.clientX; lastY=e.clientY; applyTransform(false);
  }
  function onMouseUp(){ isDragging=false; }
  function closeViewer(){
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    overlay.remove(); URL.revokeObjectURL(url);
  }

  // Bottoni
  document.getElementById('ivw-close').onclick = closeViewer;
  document.getElementById('ivw-rot-l').onclick  = () => { rotate = (rotate - 90 + 360) % 360; applyTransform(true); };
  document.getElementById('ivw-rot-r').onclick  = () => { rotate = (rotate + 90) % 360; applyTransform(true); };
  document.getElementById('ivw-zoom-in').onclick  = () => { scale = Math.min(scale * 1.3, 8); applyTransform(true); };
  document.getElementById('ivw-zoom-out').onclick = () => { scale = Math.max(scale / 1.3, 0.2); applyTransform(true); };
  document.getElementById('ivw-reset').onclick  = () => { scale=1; rotate=0; panX=0; panY=0; applyTransform(true); };

  // Chiudi cliccando sfondo
  overlay.addEventListener('click', e => { if(e.target===overlay || e.target===document.getElementById('ivw-canvas')) closeViewer(); });

  // ── MOUSE drag & wheel ──
  img.addEventListener('mousedown', e => { isDragging=true; lastX=e.clientX; lastY=e.clientY; e.preventDefault(); });
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  overlay.addEventListener('wheel', e => {
    e.preventDefault();
    scale = e.deltaY < 0 ? Math.min(scale*1.15, 8) : Math.max(scale/1.15, 0.2);
    applyTransform(false);
  }, {passive:false});

  // ── TOUCH pinch + pan ──
  overlay.addEventListener('touchstart', e => {
    // Tocchi su pulsanti e link della barra: lasciati al browser, altrimenti
    // preventDefault sopprime il click e nessun pulsante (Chiudi compreso) funziona
    if(e.target.closest('button, a')) return;
    if(e.touches.length===1){ isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
    if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
    e.preventDefault();
  }, {passive:false});
  overlay.addEventListener('touchmove', e => {
    if(e.touches.length===1 && isDragging){
      panX += e.touches[0].clientX - lastX; panY += e.touches[0].clientY - lastY;
      lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; applyTransform(false);
    }
    if(e.touches.length===2 && lastDist!==null){
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      scale = Math.min(Math.max(scale*(dist/lastDist), 0.2), 8);
      lastDist=dist; applyTransform(false);
    }
    e.preventDefault();
  }, {passive:false});
  overlay.addEventListener('touchend', e => {
    if(e.touches.length<2) lastDist=null;
    if(e.touches.length===0) isDragging=false;
  });
}

function tireIcon(stagione){ return stagione==='estate'?'☀️':stagione==='4stagioni'?'🌦️':'❄️'; }

// Km di vita del set: km dei periodi precedenti (kmPrecedenti) + periodo attuale/ultimo
function tireKmPercorsi(t, kmVeicolo){
  const prec = parseInt(t.kmPrecedenti)||0;
  const kmM = parseInt(t.kmMontaggio)||0;
  if(t.stato==='buttata'||t.stato==='deposito'){
    // km bloccati allo smontaggio
    const kmS = parseInt(t.kmSmontaggio)||0;
    if(!t.kmMontaggio||!t.kmSmontaggio) return prec||null;
    return prec + Math.max(0, kmS - kmM);
  }
  // montata — km in corso
  const kmV = parseInt(kmVeicolo)||0;
  if(!t.kmMontaggio||!kmVeicolo) return prec||null;
  return prec + Math.max(0, kmV - kmM);
}

function renderTires(container){
  const vehicles = DB.vehicles().filter(v=>!v.venduto);
  if(vehicles.length===0){
    container.innerHTML='<div class="empty"><p>Nessun veicolo attivo</p></div>';
    return;
  }
  const tires = DB.tires();
  const tireInts = DB.tireInterventions();
  container.innerHTML = vehicles.map(v=>renderVehicleTireCard(v, tires, tireInts)).join('')
    + '<div style="height:80px;"></div>';
}

function renderVehicleTireCard(v, tires, tireInts){
  const vTires = tires.filter(t=>t.vehicleId===v.id);
  const montate  = vTires.filter(t=>t.stato==='montata');
  const deposito = vTires.filter(t=>t.stato==='deposito');
  const buttate  = vTires.filter(t=>t.stato==='buttata');

  // Intervento cambio programmato aperto
  const intProg = (tireInts||[]).find(i=>i.vehicleId===v.id && i.stato==='programmato');

  function kmRow(t){
    const km = tireKmPercorsi(t, v.km);
    return km!=null ? Number(km).toLocaleString('it-IT')+' km percorsi' : '—';
  }

  // ── Sezione MONTATE ──
  const montateHtml = montate.length>0 ? `
    <div class="tire-section-label">🟢 Montate</div>
    ${montate.map(t=>`
      <div class="tire-row tire-row-edit" onclick="openEditTireSet('${t.id}')" title="Modifica set">
        <div class="tire-row-icon">${tireIcon(t.stagione)}</div>
        <div class="tire-row-body">
          <div class="tire-row-name">${escHtml(t.marca)}${t.modello?' '+escHtml(t.modello):''} <span style="font-weight:400;color:#94a3b8;font-size:12px;">${escHtml(t.dimensione||'')} ×${t.quantita||4}</span></div>
          <div class="tire-row-meta">Dal ${fmtDate(t.dataMontaggio)} &nbsp;·&nbsp; ${kmRow(t)}</div>
        </div>
        <span class="tire-status montate">Montate ✏️</span>
      </div>
    `).join('')}
  ` : `<div style="font-size:13px;color:#94a3b8;padding:8px 0;">Nessuna gomma montata</div>`;

  // ── Sezione DEPOSITO ──
  const depositoHtml = deposito.length>0 ? `
    <div class="tire-section-label" style="margin-top:10px;">📦 In deposito</div>
    ${deposito.map(t=>`
      <div class="tire-row tire-row-edit" onclick="openEditTireSet('${t.id}')" title="Modifica set">
        <div class="tire-row-icon">${tireIcon(t.stagione)}</div>
        <div class="tire-row-body">
          <div class="tire-row-name">${escHtml(t.marca)}${t.modello?' '+escHtml(t.modello):''} <span style="font-weight:400;color:#94a3b8;font-size:12px;">${escHtml(t.dimensione||'')} ×${t.quantita||4}</span></div>
          <div class="tire-row-meta">Smontate ${fmtDate(t.dataSmontaggio)} &nbsp;·&nbsp; ${kmRow(t)}${depositoLabel(t)?' &nbsp;·&nbsp; 📍 '+escHtml(depositoLabel(t)):''}</div>
        </div>
        <span class="tire-status deposito">Deposito ✏️</span>
      </div>
    `).join('')}
  ` : '';

  // ── Calcoli KM per barra cumulativa ──
  const kmVeicolo = parseInt(v.km) || 0;

  const tuttiSet = [...vTires].filter(t=>t.kmMontaggio!=null).sort((a,b)=>a.kmMontaggio-b.kmMontaggio);
  const kmPrimoSet = tuttiSet.length>0 ? parseInt(tuttiSet[0].kmMontaggio) : null;

  // Segmento GRIGIO: km prima del primo set registrato
  const kmNonTracciati = (kmPrimoSet!=null && kmVeicolo>0) ? Math.max(0, kmPrimoSet) : 0;

  // Segmenti per stagione — include sia montate che buttate/deposito (storico)
  // Colore: GIALLO (#fbbf24) = estive, AZZURRO (#38bdf8) = invernali, VERDE (#34d399) = 4 stagioni
  // Le "smaltite" mantengono il loro colore stagionale (più scuro per indicare l'usura)
  const allTracked = vTires.filter(t=>t.stato!=='montata'); // storico (buttate + deposito)
  const kmEstiveStorico   = allTracked.filter(t=>t.stagione==='estate') .reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);
  const kmInvernaliStorico= allTracked.filter(t=>t.stagione==='inverno').reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);
  const kmEstiveMontate   = montate.filter(t=>t.stagione==='estate') .reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);
  const kmInvernaliMontate= montate.filter(t=>t.stagione==='inverno').reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);
  const km4sStorico       = allTracked.filter(t=>t.stagione==='4stagioni').reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);
  const km4sMontate       = montate.filter(t=>t.stagione==='4stagioni').reduce((s,t)=>{ const k=tireKmPercorsi(t,v.km); return s+(k||0); }, 0);

  const totRef = kmVeicolo || 1;
  const pctGrigio       = Math.min(100, Math.round((kmNonTracciati/totRef)*100));
  let remaining         = 100 - pctGrigio;
  const pctEstiveS      = Math.min(remaining, Math.round((kmEstiveStorico/totRef)*100));   remaining -= pctEstiveS;
  const pctInvernaliS   = Math.min(remaining, Math.round((kmInvernaliStorico/totRef)*100)); remaining -= pctInvernaliS;
  const pct4sS          = Math.min(remaining, Math.round((km4sStorico/totRef)*100));        remaining -= pct4sS;
  const pctEstiveM      = Math.min(remaining, Math.round((kmEstiveMontate/totRef)*100));    remaining -= pctEstiveM;
  const pctInvernaliM   = Math.min(remaining, Math.round((kmInvernaliMontate/totRef)*100)); remaining -= pctInvernaliM;
  const pct4sM          = Math.min(remaining, Math.round((km4sMontate/totRef)*100));

  const barraKmHtml = kmVeicolo>0 ? `
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;">Vita km veicolo</span>
        <span style="font-size:12px;font-weight:700;color:#475569;">${Number(kmVeicolo).toLocaleString('it-IT')} km totali</span>
      </div>
      ${(()=>{
        const _segs=[
          [pctGrigio,     '#cbd5e1'],
          [pctEstiveS,    '#f59e0b'],
          [pctInvernaliS, '#60a5fa'],
          [pct4sS,        '#059669'],
          [pctEstiveM,    '#fbbf24'],
          [pctInvernaliM, '#38bdf8'],
          [pct4sM,        '#34d399']
        ].filter(s=>s[0]>0);
        const _divs=_segs.map((s,i)=>{
          const _rL=i===0?'999px':'0';
          const _rR=i===_segs.length-1?'999px':'0';
          return `<div style="flex:0 0 ${s[0]}%;height:10px;background:${s[1]};border-radius:${_rL} ${_rR} ${_rR} ${_rL};"></div>`;
        }).join('');
        return `<div style="height:10px;display:flex;">${_divs}</div>`;
      })()}
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;">
        ${kmNonTracciati>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#cbd5e1;border-radius:50%;flex-shrink:0;"></div>
          Non tracciati: <strong>${Number(kmNonTracciati).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${kmEstiveStorico>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#f59e0b;border-radius:50%;flex-shrink:0;"></div>
          ☀️ Estive (storico): <strong>${Number(kmEstiveStorico).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${kmInvernaliStorico>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#60a5fa;border-radius:50%;flex-shrink:0;"></div>
          ❄️ Invernali (storico): <strong>${Number(kmInvernaliStorico).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${km4sStorico>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#059669;border-radius:50%;flex-shrink:0;"></div>
          🌦️ 4 stagioni (storico): <strong>${Number(km4sStorico).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${kmEstiveMontate>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#fbbf24;border-radius:50%;flex-shrink:0;"></div>
          ☀️ Estive (in uso): <strong>${Number(kmEstiveMontate).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${kmInvernaliMontate>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#38bdf8;border-radius:50%;flex-shrink:0;"></div>
          ❄️ Invernali (in uso): <strong>${Number(kmInvernaliMontate).toLocaleString('it-IT')} km</strong>
        </div>`:''}
        ${km4sMontate>0?`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#64748b;">
          <div style="width:8px;height:8px;background:#34d399;border-radius:50%;flex-shrink:0;"></div>
          🌦️ 4 stagioni (in uso): <strong>${Number(km4sMontate).toLocaleString('it-IT')} km</strong>
        </div>`:''}
      </div>
    </div>
  ` : '';

  // ── Sezione STORICO (set smaltiti) ──
  const storicoCompleto = [...buttate].sort((a,b)=>new Date(b.dataSmontaggio)-new Date(a.dataSmontaggio));

  const storicoHtml = storicoCompleto.length>0 ? `
    <div class="tire-section-label" style="margin-top:12px;cursor:pointer;user-select:none;" onclick="toggleSection('storico-${v.id}','arrow-s-${v.id}')">
      📋 Storico smaltite (${storicoCompleto.length}) <span id="arrow-s-${v.id}">▶</span>
    </div>
    <div id="storico-${v.id}" style="display:none;margin-top:6px;">
      ${storicoCompleto.map((t,idx)=>{
        const kmP   = tireKmPercorsi(t, v.km);
        const kmPct = kmVeicolo>0 && kmP!=null ? Math.round((kmP/totRef)*100) : 0;
        const sep   = idx>0 ? 'border-top:1px solid #f1f5f9;' : '';
        return `
        <div style="padding:10px 0;${sep}">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;">
            <span style="font-size:18px;flex-shrink:0;">${tireIcon(t.stagione)}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;color:#1e293b;">${escHtml(t.marca)}${t.modello?' '+escHtml(t.modello):''}</div>
              <div style="font-size:11px;color:#94a3b8;margin-top:1px;">${escHtml(t.dimensione||'')}${t.quantita?' · ×'+t.quantita:''} — ${t.stagione==='estate'?'Estive':t.stagione==='4stagioni'?'4 stagioni':'Invernali'}</div>
            </div>
            <span style="font-size:12px;font-weight:700;color:#f87171;white-space:nowrap;flex-shrink:0;">${kmP!=null?Number(kmP).toLocaleString('it-IT')+' km':'—'}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;font-size:11px;color:#64748b;margin-bottom:7px;padding-left:28px;flex-wrap:wrap;">
            <span>📅 ${fmtDate(t.dataMontaggio)}${t.kmMontaggio!=null?' · '+Number(t.kmMontaggio).toLocaleString('it-IT')+' km':''}</span>
            <span style="color:#cbd5e1;">→</span>
            <span>🗑️ ${fmtDate(t.dataSmontaggio)}${t.kmSmontaggio!=null?' · '+Number(t.kmSmontaggio).toLocaleString('it-IT')+' km':''}</span>
          </div>
          ${kmP!=null&&kmVeicolo>0?`
          <div style="padding-left:28px;">
            <div style="height:5px;background:#f1f5f9;border-radius:999px;overflow:hidden;">
              <div style="width:${kmPct}%;height:100%;background:#f87171;border-radius:999px;"></div>
            </div>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>
  ` : '';

  // ── Pulsante principale ──
  let mainBtn = '';
  if(intProg){
    mainBtn = `
      <div style="background:#fef3c7;border-radius:10px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <div style="font-size:12px;font-weight:700;color:#92400e;">🔵 CAMBIO GOMME PROGRAMMATO</div>
          <div style="font-size:12px;color:#78350f;margin-top:2px;">Data: ${fmtDate(intProg.dataProgrammata)}</div>
        </div>
        <button onclick="openEditCambioGomme('${intProg.id}')" style="background:#d97706;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">Edita</button>
      </div>`;
  } else if(montate.length>0){
    mainBtn = `
      <button class="tire-change-btn" onclick="openPianificaCambio('${v.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/></svg>
        Pianifica cambio gomme
      </button>`;
  } else {
    mainBtn = `
      <div class="tire-add-row" onclick="openTireForm('${v.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registra prime gomme
      </div>`;
  }

  return `
  <div class="card" style="margin-bottom:10px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      ${renderTargaHtml(v.targa)}
      <span style="font-size:13px;color:#64748b;margin-left:4px;">${escHtml(v.nome)}</span>
    </div>
    <div class="tire-table">
      ${montateHtml}
      ${depositoHtml}
      ${storicoHtml}
      ${barraKmHtml}
    </div>
    ${mainBtn}
  </div>`;
}

function toggleSection(elId, arrowId){
  const el = document.getElementById(elId);
  const ar = document.getElementById(arrowId);
  if(!el) return;
  const open = el.style.display==='none';
  el.style.display = open?'block':'none';
  if(ar) ar.textContent = open?'▼':'▶';
}

// ─────────────────────────────────────────────
//  REGISTRA PRIME GOMME (primo inserimento)
// ─────────────────────────────────────────────
function openTireForm(vehicleId){
  const v = DB.vehicles().find(x=>x.id===vehicleId);
  openModal(`Prima registrazione gomme — ${v?.targa||''}`, `
    <div style="background:#dbeafe;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#1e40af;">
      Registra le gomme attualmente montate sul veicolo.
    </div>
    <div class="form-group"><label class="form-label">Stagione</label>
      <select class="form-select" id="tr-stagione">
        <option value="estate">☀️ Estive</option>
        <option value="inverno">❄️ Invernali</option>
      </select></div>
    <div class="form-group"><label class="form-label">Marca *</label>
      <input class="form-input" id="tr-marca" placeholder="Michelin, Pirelli…" autocomplete="off"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Modello</label>
        <input class="form-input" id="tr-modello" placeholder="Pilot Sport" autocomplete="off"></div>
      <div class="form-group"><label class="form-label">Dimensione</label>
        <input class="form-input" id="tr-dim" placeholder="215/65R16" autocomplete="off"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Quantità</label>
        <select class="form-select" id="tr-qty">
          <option value="4">4</option><option value="2">2</option><option value="6">6</option>
        </select></div>
      <div class="form-group"><label class="form-label">KM al montaggio</label>
        <input class="form-input" id="tr-km" type="number" inputmode="numeric" value="" placeholder="${kmUltimoCheck(vehicleId)??''}" min="0"></div>
    </div>
    <div class="form-group"><label class="form-label">Data montaggio</label>
      <input class="form-input" id="tr-data" type="date" value="${today()}"></div>
    <div class="form-group"><label class="form-label">Note</label>
      <textarea class="form-input" id="tr-note" rows="2" placeholder="Condizioni, usura iniziale…"></textarea></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveTire('${vehicleId}')">Registra</button>
    </div>
  `);
}

function saveTire(vehicleId){
  const marca = document.getElementById('tr-marca').value.trim();
  if(!marca){ toast('Inserisci la marca','error'); return; }
  const tires = DB.tires();
  tires.push({
    id: DB.uid(), vehicleId,
    stagione: document.getElementById('tr-stagione').value,
    marca,
    modello:    document.getElementById('tr-modello').value.trim(),
    dimensione: document.getElementById('tr-dim').value.trim(),
    quantita:   parseInt(document.getElementById('tr-qty').value)||4,
    stato: 'montata',
    kmMontaggio:  kmInput('tr-km'),
    dataMontaggio: document.getElementById('tr-data').value||today(),
    kmSmontaggio: null, dataSmontaggio: null,
    note: document.getElementById('tr-note').value.trim(),
    createdAt: nowISO()
  });
  DB.saveTires(tires);
  closeModal();
  toast('Gomme registrate','success');
  renderMain();
}

// ─────────────────────────────────────────────
//  STEP 1 — PIANIFICA CAMBIO GOMME
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
//  FORNITORE E DEPOSITO DEL CAMBIO GOMME
// ─────────────────────────────────────────────
// Fornitore proposto: Technogomme, se presente tra i fornitori
function _gommistaDefaultId(){
  const s = DB.suppliers().find(x=>/techno\s*gomm/i.test(x.nome||''));
  return s ? s.id : '';
}
function _gommeSupplierOpts(selId){
  return DB.suppliers().filter(s=>s.attivo || s.id===selId)
    .map(s=>`<option value="${s.id}" ${s.id===selId?'selected':''}>${escHtml(s.nome)}${s.tipo?' ('+escHtml(s.tipo)+')':''}${s.attivo?'':' — non attivo'}</option>`).join('');
}
function _gommeFornitoreSelect(id, selId){
  return `<select class="form-select" id="${id}"><option value="">— Non indicato —</option>${_gommeSupplierOpts(selId)}</select>`;
}
// Deposito: un fornitore oppure un luogo scritto a mano (es. "Cantina Struttura RSD")
function _gommeDepositoSelect(id, fornId, luogo){
  const custom = !fornId && !!luogo;
  return `<select class="form-select" id="${id}" onchange="document.getElementById('${id}-txt').style.display=this.value==='__luogo'?'block':'none'">
      <option value="">— Non indicato —</option>${_gommeSupplierOpts(fornId)}
      <option value="__luogo" ${custom?'selected':''}>✏️ Personalizza…</option>
    </select>
    <input class="form-input" id="${id}-txt" style="margin-top:6px;display:${custom?'block':'none'};" placeholder="Es. Cantina Struttura RSD" value="${escHtml(luogo||'')}" autocomplete="off">`;
}
// Restituisce {depositoFornitoreId, depositoLuogo}, oppure null se "Personalizza" è vuoto
function _gommeDepositoRead(id){
  const v = document.getElementById(id)?.value || '';
  if(v==='__luogo'){
    const t = (document.getElementById(id+'-txt')?.value||'').trim();
    return t ? {depositoFornitoreId:null, depositoLuogo:t} : null;
  }
  return {depositoFornitoreId:v||null, depositoLuogo:null};
}
// Km del veicolo registrati sulle gomme: bloccati; solo in modalità avanzata si sbloccano con "Modifica km"
function _kmLockBtn(ids){
  if(!DB.settings().gestioneAvanzata) return '<div style="font-size:11px;color:#94a3b8;margin:-6px 0 12px;">🔒 I km si modificano solo in modalità avanzata.</div>';
  return `<button type="button" class="btn btn-secondary" style="width:100%;margin:-4px 0 14px;" onclick="_sbloccaKm(this,'${ids.join(',')}')">🔓 Modifica km</button>`;
}
function _sbloccaKm(btn, ids){
  if(!DB.settings().gestioneAvanzata) return;
  const els = ids.split(',').map(id=>document.getElementById(id)).filter(Boolean);
  els.forEach(el=>{ el.readOnly=false; });
  btn.remove();
  if(els[0]) els[0].focus();
}
function depositoLabel(x){
  if(!x) return '';
  if(x.depositoFornitoreId){ const s=DB.suppliers().find(s=>s.id===x.depositoFornitoreId); return s?s.nome:''; }
  return x.depositoLuogo||'';
}

function openPianificaCambio(vehicleId){
  const v = DB.vehicles().find(x=>x.id===vehicleId);
  const tires = DB.tires().filter(t=>t.vehicleId===vehicleId);
  const montate = tires.filter(t=>t.stato==='montata');
  const deposito = tires.filter(t=>t.stato==='deposito');

  // Calcola quante gomme ci sono in deposito per stagione opposta
  const stagMontata = montate[0]?.stagione||'estate';
  const stagOpposta = stagMontata==='estate'?'inverno':'estate';
  const depOpposta  = deposito.filter(t=>t.stagione===stagOpposta);
  const totDepQty   = depOpposta.reduce((s,t)=>s+(t.quantita||4),0);

  let depositoInfo = '';
  if(depOpposta.length>0){
    depositoInfo = `
      <div style="background:#dcfce7;border-radius:8px;padding:10px 12px;margin-bottom:12px;">
        <div style="font-size:12px;font-weight:700;color:#15803d;margin-bottom:6px;">📦 In deposito (${stagOpposta}): ${totDepQty} gomme disponibili</div>
        ${depOpposta.map(t=>`<div style="font-size:12px;color:#166534;">${tireIcon(t.stagione)} ${escHtml(t.marca)} ${escHtml(t.modello||'')} — ×${t.quantita||4}</div>`).join('')}
      </div>`;
  } else {
    depositoInfo = `
      <div style="background:#fee2e2;border-radius:8px;padding:10px 12px;margin-bottom:12px;">
        <div style="font-size:12px;font-weight:700;color:#b91c1c;">⚠️ Nessuna gomma ${stagOpposta} in deposito — servirà acquistarne di nuove</div>
      </div>`;
  }

function aggiornaSplit(tireId, qty){
  const mode = document.querySelector(`input[name="smonta-mode-${tireId}"]:checked`)?.value;
  const wrap = document.getElementById('split-wrap-'+tireId);
  if(wrap) wrap.style.display = mode==='split' ? 'block' : 'none';
  if(mode==='split') aggiornaRiepilogoSplit(tireId, qty);
}

function aggiornaRiepilogoSplit(tireId, qty){
  const input = document.getElementById('split-qty-'+tireId);
  const label = document.getElementById('split-label-'+tireId);
  if(!input||!label) return;
  const dep = parseInt(input.value)||0;
  const but = qty - dep;
  label.textContent = `→ ${dep} in deposito + ${but} smaltite`;
}

function aggiornaMontaggioNuove(vehicleId){
  // Conta quante gomme di deposito sono selezionate
  const tires = DB.tires().filter(t=>t.vehicleId===vehicleId);
  const montate = tires.filter(t=>t.stato==='montata');
  const totalMontate = montate.reduce((s,t)=>s+(t.quantita||4),0);

  let depSelezionate = 0;
  document.querySelectorAll('.dep-check:checked').forEach(cb=>{
    depSelezionate += parseInt(cb.dataset.qty)||0;
  });

  const mancanti = Math.max(0, totalMontate - depSelezionate);
  const nuoveWrap = document.getElementById('nuove-wrap');
  const nuoveLabel = document.getElementById('nuove-qty-label');
  if(nuoveWrap) nuoveWrap.style.display = mancanti>0 ? 'block' : 'none';
  if(nuoveLabel) nuoveLabel.textContent = mancanti;
}

function saveEditCambioGomme(intId, vehicleId){
  const dataEff = document.getElementById('ec-data').value||today();
  const km = kmInput('ec-km');
  if(!km){ toast('Inserisci i KM del veicolo','error'); return; }
  const fornitoreId = document.getElementById('ec-fornitore')?.value || null;
  const dep = document.getElementById('ec-deposito') ? _gommeDepositoRead('ec-deposito') : {depositoFornitoreId:null, depositoLuogo:null};
  if(!dep){ toast('Scrivi dove sono in deposito le gomme','error'); return; }

  const tires = DB.tires();
  const montate = tires.filter(t=>t.vehicleId===vehicleId&&t.stato==='montata');
  const totalMontate = montate.reduce((s,t)=>s+(t.quantita||4),0);

  // ── A. Smontaggio ──
  montate.forEach(t=>{
    const mode = document.querySelector(`input[name="smonta-mode-${t.id}"]:checked`)?.value||'tutte-deposito';
    const idx = tires.findIndex(x=>x.id===t.id);
    if(idx===-1) return;
    const kmPercorsi = km - (parseInt(t.kmMontaggio)||0);

    if(mode==='tutte-deposito'){
      tires[idx].stato = 'deposito';
      tires[idx].dataSmontaggio = dataEff;
      tires[idx].kmSmontaggio = km;
      Object.assign(tires[idx], dep);
    } else if(mode==='tutte-buttate'){
      tires[idx].stato = 'buttata';
      tires[idx].dataSmontaggio = dataEff;
      tires[idx].kmSmontaggio = km;
    } else {
      // split
      const qtyDep = parseInt(document.getElementById('split-qty-'+t.id)?.value)||0;
      const qtyBut = (t.quantita||4) - qtyDep;
      // Dividi il set in due record
      tires[idx].quantita = qtyDep;
      tires[idx].stato = 'deposito';
      tires[idx].dataSmontaggio = dataEff;
      tires[idx].kmSmontaggio = km;
      Object.assign(tires[idx], dep);
      if(qtyBut>0){
        tires.push({
          ...t,
          id: DB.uid(),
          quantita: qtyBut,
          stato: 'buttata',
          dataSmontaggio: dataEff,
          kmSmontaggio: km
        });
      }
    }
  });

  // ── B. Montaggio dal deposito ──
  let depSelezionate = 0;
  document.querySelectorAll('.dep-check').forEach(cb=>{
    const tid = cb.dataset.tid;
    const qty = parseInt(cb.dataset.qty)||0;
    const idx = tires.findIndex(x=>x.id===tid);
    if(idx===-1) return;
    if(cb.checked){
      depSelezionate += qty;
      // conserva i km fatti nei periodi precedenti prima di rimontarle
      const t0 = tires[idx];
      if(t0.kmMontaggio!=null && t0.kmSmontaggio!=null){
        t0.kmPrecedenti = (parseInt(t0.kmPrecedenti)||0) + Math.max(0, (parseInt(t0.kmSmontaggio)||0) - (parseInt(t0.kmMontaggio)||0));
      }
      tires[idx].stato = 'montata';
      tires[idx].dataMontaggio = dataEff;
      tires[idx].kmMontaggio = km;
      tires[idx].dataSmontaggio = null;
      tires[idx].kmSmontaggio = null;
      tires[idx].depositoFornitoreId = null;
      tires[idx].depositoLuogo = null;
    }
  });

  // ── C. Nuove gomme (se servono) ──
  const mancanti = Math.max(0, totalMontate - depSelezionate);
  if(mancanti>0){
    const marca = document.getElementById('ng-marca')?.value.trim()||'';
    if(!marca){ toast('Inserisci la marca delle gomme nuove','error'); return; }
    tires.push({
      id: DB.uid(), vehicleId,
      stagione: document.getElementById('ng-stagione')?.value||'inverno',
      marca,
      modello:    document.getElementById('ng-modello')?.value.trim()||'',
      dimensione: document.getElementById('ng-dim')?.value.trim()||'',
      quantita:   mancanti,
      stato: 'montata',
      kmMontaggio: km, dataMontaggio: dataEff,
      kmSmontaggio: null, dataSmontaggio: null,
      note: document.getElementById('ng-note')?.value.trim()||'',
      createdAt: nowISO()
    });
  }

  DB.saveTires(tires);

  // Chiudi l'intervento
  const tireInts = DB.tireInterventions();
  const iidx = tireInts.findIndex(x=>x.id===intId);
  if(iidx>-1){
    tireInts[iidx].stato = 'completato';
    tireInts[iidx].dataEffettiva = dataEff;
    tireInts[iidx].kmEffettivo = km;
    tireInts[iidx].fornitoreId = fornitoreId;
    Object.assign(tireInts[iidx], dep);
  }
  DB.saveTireInterventions(tireInts);

  // Aggiorna KM veicolo (solo se più alti)
  updateVehicleKm(vehicleId, km);

  closeModal();
  toast('Cambio gomme completato ✅','success');
  renderMain();
  renderAlerts();
}

function annullaTireIntervento(intId){
  const tireInts = DB.tireInterventions();
  const idx = tireInts.findIndex(x=>x.id===intId);
  if(idx>-1){ tireInts[idx].stato='annullato'; }
  DB.saveTireInterventions(tireInts);
  closeModal();
  toast('Intervento annullato');
  renderMain();
}

        ${prec>0?`<div style="font-size:11px;color:#94a3b8;margin-top:2px;">di cui ${prec.toLocaleString('it-IT')} km nei montaggi precedenti</div>`:''}
        <div style="font-size:11px;color:#94a3b8;margin-top:2px;">Differenza tra i km del veicolo ${smontato?'allo smontaggio e al montaggio':'attuali e al montaggio'}.</div>
      </div>`;
    })()}
    <div class="form-group"><label class="form-label">Note</label>
      <textarea class="form-input" id="es-note" rows="2">${val(t.note)}</textarea></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveEditTireSet('${t.id}')">💾 Salva</button>
    </div>
    <button class="btn btn-danger" style="width:100%;margin-top:10px;" onclick="eliminaTireSet('${t.id}')">🗑️ Elimina questo set</button>
    <div style="height:8px;"></div>
  `);
}

function saveEditTireSet(tireId){
  const tires = DB.tires();
  const t = tires.find(x=>x.id===tireId);
  if(!t){ toast('Set gomme non trovato','error'); return; }
  const num = id => { const el=document.getElementById(id); if(!el || String(el.value).trim()==='') return null; const n=parseInt(el.value); return isNaN(n)?null:n; };
  const f = {
    stagione:   document.getElementById('es-stagione').value,
    marca:      document.getElementById('es-marca').value.trim(),
    modello:    document.getElementById('es-modello').value.trim(),
    dimensione: document.getElementById('es-dim').value.trim(),
    quantita:   parseInt(document.getElementById('es-qty').value)||4,
    dataMontaggio: document.getElementById('es-datamon').value||null,
    kmMontaggio:   num('es-kmmon'),
    note:       document.getElementById('es-note').value.trim()
  };
  if(document.getElementById('es-datasmon')){
    f.dataSmontaggio = document.getElementById('es-datasmon').value||null;
    f.kmSmontaggio   = num('es-kmsmon');
  }

  if(document.getElementById('es-deposito')){
    const dep = _gommeDepositoRead('es-deposito');
    if(!dep){ toast('Scrivi dove sono in deposito le gomme','error'); return; }
    Object.assign(f, dep);
  }
  if(!f.marca){ toast('Inserisci la marca','error'); return; }
  if([f.kmMontaggio, f.kmSmontaggio].some(k=>k!=null && k<0)){ toast('I km non possono essere negativi','error'); return; }
  if(f.dataSmontaggio && f.dataMontaggio && f.dataSmontaggio < f.dataMontaggio){ toast('La data di smontaggio non può precedere il montaggio','error'); return; }
  if(f.kmSmontaggio!=null && f.kmMontaggio!=null && f.kmSmontaggio < f.kmMontaggio){ toast('I km allo smontaggio non possono essere inferiori al montaggio','error'); return; }

  // Salva solo i campi cambiati
  const norm = x => (x===undefined||x===null||x==='') ? null : String(x);
  let cambiati = 0;
  Object.keys(f).forEach(k=>{
    if(norm(f[k])!==norm(t[k])){ t[k]=f[k]; cambiati++; }
  });
  if(cambiati) DB.saveTires(tires);

  closeModal();
  toast(cambiati ? 'Gomme aggiornate' : 'Nessuna modifica', cambiati?'success':'');
  if(cambiati){ renderMain(); renderAlerts(); }
}

function eliminaTireSet(tireId){
  const t = DB.tires().find(x=>x.id===tireId);
  if(!t){ toast('Set gomme non trovato','error'); return; }
  const v = DB.vehicles().find(x=>x.id===t.vehicleId);
  openModal('🗑️ Elimina set gomme', `
    <p style="font-size:15px;color:#334155;margin-bottom:8px;">Stai per eliminare il set <strong>${escHtml(t.marca||'')}${t.modello?' '+escHtml(t.modello):''}</strong> ×${parseInt(t.quantita)||4}${v?' di <strong>'+escHtml(v.targa)+'</strong>':''}.</p>
    <p style="font-size:13px;color:#ef4444;margin-bottom:20px;">I km percorsi da questo set non verranno più conteggiati. Questa azione è irreversibile.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="openEditTireSet('${t.id}')">Annulla</button>
      <button class="btn btn-danger" onclick="confirmEliminaTireSet('${t.id}')">🗑️ Elimina</button>
    </div>
  `);
}
function confirmEliminaTireSet(tireId){
  DB.saveTires(DB.tires().filter(t=>t.id!==tireId));
  closeModal();
  toast('Set gomme eliminato','success');
  renderMain();
  renderAlerts();
}

function saveSupplierEdit(id){
  const data=_supplierFormData();
  if(!data.nome){ toast('Inserisci il nome','error'); return; }
  const suppliers=DB.suppliers();
  const idx=suppliers.findIndex(s=>s.id===id);
  if(idx<0){ toast('Fornitore non trovato','error'); return; }
  const patch={};
  Object.keys(data).forEach(k=>{ const cur=suppliers[idx][k]; const same = typeof data[k]==='boolean' ? (!!cur===data[k]) : ((cur??'')===data[k]); if(!same) patch[k]=data[k]; });
  if(!Object.keys(patch).length){ toast('Nessuna modifica'); closeModal(); return; }
  suppliers[idx]={...suppliers[idx],...patch};
  DB.saveSuppliers(suppliers);
  toast('Fornitore aggiornato','success');
  closeModal();
  renderMain();
}

function renderReport(container){
  const vehicles=DB.vehicles();
  const checks=DB.checks();
  const interventions=DB.interventions();
  const tires=DB.tires();

  const attivi=vehicles.filter(v=>!v.venduto).length;
  const venduti=vehicles.filter(v=>v.venduto).length;
  const intAperti=interventions.filter(i=>i.stato==='in_lavorazione').length;
  const intChiusi=interventions.filter(i=>i.stato==='chiuso').length;
  const intAnnullati=interventions.filter(i=>i.stato==='annullato').length;

  // Anomalie = anomalie da check items senza intervento + segnalazioni non gestite
  const segnalazioni=DB.segnalazioni();
  var anomCount=0;
  checks.forEach(function(c){
    (c.items||[]).forEach(function(item){
      if(item.val==='anomalia'){
        const handled=interventions.some(function(i){ return i.checkId===c.id&&i.descrizione.startsWith(item.voce) && i.stato!=='annullato'; });
        if(!handled) anomCount++;
      }
    });
  });
  segnalazioni.forEach(function(s){
    const handled=interventions.some(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
    if(!handled) anomCount++;
  });
  const intAnomalie=anomCount;

  // Check ultimi 6 mesi
  const now=new Date();
  const monthlyChecks=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const mm=d.getMonth()+1; const yy=d.getFullYear();
    const count=checks.filter(c=>{ const cd=new Date(c.data); return cd.getMonth()+1===mm&&cd.getFullYear()===yy; }).length;
    monthlyChecks.push({label:mm+'/'+yy, count, mm, yy});
  }
  const maxCheck=Math.max(...monthlyChecks.map(m=>m.count),1);

  // Stat card helper — cliccabile
  function statCard(num, label, color, onclick){
    return '<div class="stat-card" onclick="'+onclick+'" style="cursor:pointer;transition:box-shadow .15s;" '
      +'onmousedown="this.style.boxShadow=\'0 0 0 3px '+color+'33\'" '
      +'onmouseup="this.style.boxShadow=\'\'">'
      +'<div class="stat-num" style="color:'+color+';">'+num+'</div>'
      +'<div class="stat-label">'+label+' ›</div>'
      +'</div>';
  }

  container.innerHTML=
    '<div class="section-title">Veicoli</div>'
    +'<div class="stats-grid">'
    +statCard(attivi,'Attivi','#1e40af',"reportDetail('veicoli-attivi')")
    +statCard(venduti,'Venduti','#64748b',"reportDetail('veicoli-venduti')")
    +'</div>'

    +'<div class="section-title">Interventi</div>'
    +'<div class="stats-grid">'
    +statCard(intAperti,'In lavorazione','#d97706',"reportDetail('int-lavorazione')")
    +statCard(intAnomalie,'Anomalie','#dc2626',"reportDetail('int-anomalie')")
    +statCard(intChiusi,'Chiusi','#16a34a',"reportDetail('int-chiusi')")
    +statCard(intAnnullati,'Annullati','#ca8a04',"reportDetail('int-annullati')")
    +statCard(interventions.length,'Totali','#1e293b',"reportDetail('int-tutti')")
    +'</div>'

    +'<div class="section-title">Check ultimi 6 mesi</div>'
    +'<div class="card">'
    +'<div style="display:flex;align-items:flex-end;gap:8px;height:100px;">'
    +monthlyChecks.map(function(m){
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;" onclick="reportDetail(\'checks-'+m.mm+'-'+m.yy+'\')">'
        +'<div style="font-size:11px;color:#1e40af;font-weight:600;">'+m.count+'</div>'
        +'<div style="width:100%;background:#1e40af;border-radius:4px 4px 0 0;height:'+( Math.round((m.count/maxCheck)*70)+5)+'px;min-height:5px;"></div>'
        +'<div style="font-size:10px;color:#94a3b8;white-space:nowrap;">'+m.label+'</div>'
        +'</div>';
    }).join('')
    +'</div></div>'

    +'<div class="section-title">Cronologico — ultimi 2 mesi</div>'
    +renderCronologico()
    +'<div style="height:80px;"></div>';
}

function renderCronologico(){
  const now = new Date();
  const twoMonthsAgo = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const cutoff = twoMonthsAgo.toISOString().slice(0,10);

  const vehicles   = DB.vehicles();
  const checks     = DB.checks();
  const interventions = DB.interventions();
  const segnalazioni  = DB.segnalazioni();
  const tireInts   = DB.tireInterventions ? DB.tireInterventions() : [];

  // Raccogli tutti gli eventi
  var events = [];

  checks.forEach(function(c){
    if(!c.data || c.data < cutoff) return;
    const v = vehicles.find(function(x){ return x.id===c.vehicleId; });
    const anom = (c.items||[]).filter(function(i){ return i.val==='anomalia'; }).length;
    events.push({
      date: c.data,
      ts: c.data,
      type: 'check',
      icon: anom ? '⚠️' : '✅',
      color: anom ? '#dc2626' : '#16a34a',
      bg: anom ? '#fee2e2' : '#dcfce7',
      title: 'Check ' + (v ? v.targa : ''),
      sub: anom ? anom+' anomali'+(anom===1?'a':'e') : 'Tutto OK',
      km: c.km ? fmtKM(c.km) : null,
      op: c.operatore || null
    });
  });

  interventions.forEach(function(i){
    if(i.dataApertura && i.dataApertura >= cutoff){
      const v = vehicles.find(function(x){ return x.id===i.vehicleId; });
      events.push({
        date: i.dataApertura, ts: i.dataApertura+'T00:00:00',
        type: 'int-open',
        icon: '🔧', color: '#d97706', bg: '#fef3c7',
        title: 'Intervento aperto — '+(v?v.targa:''),
        sub: (i.descrizione||'').slice(0,60),
        km: i.kmApertura ? fmtKM(i.kmApertura) : null,
        op: null
      });
    }
    if(i.stato==='chiuso' && i.dataChiusura && i.dataChiusura >= cutoff){
      const v = vehicles.find(function(x){ return x.id===i.vehicleId; });
      events.push({
        date: i.dataChiusura, ts: i.dataChiusura+'T23:59:00',
        type: 'int-close',
        icon: '✅', color: '#16a34a', bg: '#dcfce7',
        title: 'Intervento chiuso — '+(v?v.targa:''),
        sub: (i.descrizione||'').slice(0,60),
        km: i.kmChiusura ? fmtKM(i.kmChiusura) : null,
        op: null
      });
    }
  });

  segnalazioni.forEach(function(s){
    if(!s.data || s.data < cutoff) return;
    const v = vehicles.find(function(x){ return x.id===s.vehicleId; });
    events.push({
      date: s.data, ts: s.data,
      type: 'segn',
      icon: '📢', color: '#b91c1c', bg: '#fee2e2',
      title: 'Segnalazione — '+(v?v.targa:''),
      sub: (s.problema||'').slice(0,60),
      km: s.km ? fmtKM(s.km) : null,
      op: s.operatore || null
    });
  });

  tireInts.forEach(function(ti){
    if((ti.stato==='completato' || ti.stato==='eseguito') && ti.dataEffettiva && ti.dataEffettiva >= cutoff){
      const v = vehicles.find(function(x){ return x.id===ti.vehicleId; });
      events.push({
        date: ti.dataEffettiva, ts: ti.dataEffettiva,
        type: 'tire',
        icon: '🔵', color: '#1e40af', bg: '#dbeafe',
        title: 'Cambio gomme — '+(v?v.targa:''),
        sub: ti.note || '',
        km: null, op: null
      });
    }
  });

  if(!events.length){
    return '<div class="card" style="text-align:center;color:#94a3b8;font-size:14px;padding:24px;">Nessuna attività negli ultimi 2 mesi</div>';
  }

  // Ordina dal più recente
  events.sort(function(a,b){ return b.ts.localeCompare(a.ts); });

  // Raggruppa per data
  var byDate = {};
  var dateOrder = [];
  events.forEach(function(e){
    if(!byDate[e.date]){ byDate[e.date]=[]; dateOrder.push(e.date); }
    byDate[e.date].push(e);
  });

  var html = '<div style="position:relative;padding-left:20px;">';
  // Linea verticale timeline
  html += '<div style="position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e2e8f0;border-radius:2px;"></div>';

  dateOrder.forEach(function(date){
    var evs = byDate[date];
    var d = new Date(date+'T00:00:00');
    var dayLabel = d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
    dayLabel = dayLabel.charAt(0).toUpperCase()+dayLabel.slice(1);

    html += '<div style="margin-bottom:16px;">';
    // Dot + data
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
    html += '<div style="width:14px;height:14px;border-radius:50%;background:#1e40af;border:2px solid #fff;box-shadow:0 0 0 2px #1e40af;flex-shrink:0;margin-left:-6px;"></div>';
    html += '<div style="font-size:13px;font-weight:800;color:#fff;background:#1e293b;padding:3px 10px;border-radius:20px;">'+dayLabel+'</div>';
    html += '</div>';

    evs.forEach(function(e){
      html += '<div style="margin-left:8px;margin-bottom:6px;background:'+e.bg+';border-radius:10px;padding:10px 12px;border-left:3px solid '+e.color+';">';
      html += '<div style="display:flex;align-items:center;gap:6px;">';
      html += '<span style="font-size:15px;">'+e.icon+'</span>';
      html += '<span style="font-size:13px;font-weight:700;color:'+e.color+';">'+escHtml(e.title)+'</span>';
      html += '</div>';
      if(e.sub) html += '<div style="font-size:12px;color:#475569;margin-top:3px;padding-left:21px;">'+escHtml(e.sub)+'</div>';
      var meta = [];
      if(e.km) meta.push('📍 '+e.km);
      if(e.op) meta.push('👤 '+escHtml(e.op));
      if(meta.length) html += '<div style="font-size:11px;color:#94a3b8;margin-top:4px;padding-left:21px;">'+meta.join(' · ')+'</div>';
      html += '</div>';
    });

    html += '</div>';
  });

  html += '</div>';
  return html;
}

function reportDetail(type){
  const vehicles=DB.vehicles();
  const interventions=DB.interventions();
  const checks=DB.checks();
  let title='', html='';

  function intRow(i){
    const v=vehicles.find(x=>x.id===i.vehicleId);
    const statoLbl=i.stato==='in_lavorazione'?'🔧 In lavorazione':i.stato==='anomalia'?'⚠️ Anomalia':i.stato==='chiuso'?'✅ Chiuso':'✕ Annullato';
    return '<div class="list-item">'
      +'<div class="list-item-info">'
      +'<div class="list-item-name">'+escHtml((i.descrizione||'').slice(0,50))+'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">'+(v?renderTargaHtml(v.targa):'')+' <span style="font-size:11px;color:#64748b;">'+statoLbl+'</span></div>'
      +'<div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+fmtDate(i.dataApertura)+(i.dataChiusura?' → '+fmtDate(i.dataChiusura):'')+'</div>'
      +'</div>'
      +'<button onclick="openInterventionForm(\''+i.vehicleId+'\',\''+i.id+'\')" style="background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;flex-shrink:0;">Apri</button>'
      +'</div>';
  }

  function vehRow(v){
    return '<div class="list-item">'
      +'<div class="list-item-info">'
      +renderTargaHtml(v.targa)
      +'<div style="font-size:14px;font-weight:600;margin-top:4px;">'+escHtml(v.nome)+'</div>'
      +'<div style="font-size:12px;color:#64748b;">'+escHtml(v.modello||'')+(v.anno?' · '+v.anno:'')+(v.km?' · '+fmtKM(v.km):'')+'</div>'
      +'</div></div>';
  }

  if(type==='veicoli-attivi'){
    title='Veicoli attivi';
    const list=vehicles.filter(v=>!v.venduto);
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessun veicolo attivo</p>':list.map(vehRow).join('');
  } else if(type==='veicoli-venduti'){
    title='Veicoli venduti';
    const list=vehicles.filter(v=>v.venduto);
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessun veicolo venduto</p>':list.map(vehRow).join('');
  } else if(type==='int-lavorazione'){
    title='In lavorazione';
    const list=interventions.filter(i=>i.stato==='in_lavorazione');
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessuno</p>':list.map(intRow).join('');
  } else if(type==='int-anomalie'){
    title='Anomalie aperte';
    // Anomalie da check items senza intervento
    const anomItems=[];
    const allChecks=DB.checks();
    allChecks.forEach(function(c){
      const v2=vehicles.find(x=>x.id===c.vehicleId);
      (c.items||[]).forEach(function(item){
        if(item.val==='anomalia'){
          const handled=interventions.some(function(i){ return i.checkId===c.id&&i.descrizione.startsWith(item.voce) && i.stato!=='annullato'; });
          if(!handled) anomItems.push({tipo:'check', vehicleId:c.vehicleId, v:v2, descrizione:item.voce, note:item.note||'', data:c.data, km:c.km, checkId:c.id});
        }
      });
    });
    // Segnalazioni non gestite
    DB.segnalazioni().forEach(function(s){
      const handled=interventions.some(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
      if(!handled){
        const v2=vehicles.find(x=>x.id===s.vehicleId);
        anomItems.push({tipo:'segnalazione', vehicleId:s.vehicleId, v:v2, descrizione:s.problema, note:s.note||'', data:s.data, km:s.km, segnalazioneId:s.id});
      }
    });
    if(anomItems.length===0){
      html='<p style="color:#94a3b8;font-size:13px;">Nessuna anomalia aperta</p>';
    } else {
      html=anomItems.map(function(a){
        var tipoLabel=a.tipo==='segnalazione'?'📢 Segnalazione':'⚠️ Check';
        return '<div class="list-item">'
          +'<div class="list-item-info">'
          +'<div class="list-item-name">'+escHtml(a.descrizione)+(a.note?'<span style="font-size:11px;color:#64748b;"> — '+escHtml(a.note)+'</span>':'')+'</div>'
          +'<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">'+(a.v?renderTargaHtml(a.v.targa):'')+' <span style="font-size:11px;color:#b91c1c;font-weight:600;">'+tipoLabel+'</span></div>'
          +'<div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+fmtDate(a.data)+(a.km?' · '+fmtKM(a.km):'')+'</div>'
          +'</div>'
          +'<button onclick="openAnomalieModal(&quot;'+a.vehicleId+'&quot;)" style="background:#fee2e2;color:#b91c1c;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">Gestisci</button>'
          +'</div>';
      }).join('');
    }
  } else if(type==='int-chiusi'){
    title='Interventi chiusi';
    const list=interventions.filter(i=>i.stato==='chiuso');
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessuno</p>':list.map(intRow).join('');
  } else if(type==='int-annullati'){
    title='Interventi annullati';
    const list=interventions.filter(i=>i.stato==='annullato');
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessuno</p>':list.map(intRow).join('');
  } else if(type==='int-tutti'){
    title='Tutti gli interventi';
    html=interventions.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessuno</p>':interventions.map(intRow).join('');
  } else if(type.startsWith('checks-')){
    const parts=type.split('-');
    const mm=parseInt(parts[1]), yy=parseInt(parts[2]);
    const MONTHS=['','Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
    title='Check '+MONTHS[mm]+' '+yy;
    const list=checks.filter(c=>{ const d=new Date(c.data); return d.getMonth()+1===mm&&d.getFullYear()===yy; });
    html=list.length===0?'<p style="color:#94a3b8;font-size:13px;">Nessun check</p>':list.map(function(c){
      const v=vehicles.find(x=>x.id===c.vehicleId);
      const anom=c.items?.filter(i=>i.val==='anomalia')||[];
      return '<div class="list-item">'
        +'<div class="list-item-info">'
        +(v?renderTargaHtml(v.targa):'')
        +'<div style="font-size:12px;color:#64748b;margin-top:3px;">'+fmtDate(c.data)+' · '+fmtKM(c.km)+' · '+escHtml(c.operatore||'')+'</div>'
        +(anom.length>0?'<div style="font-size:11px;color:#b91c1c;margin-top:2px;">⚠️ '+anom.map(function(a){return escHtml(a.voce);}).join(', ')+'</div>':'<div style="font-size:11px;color:#16a34a;margin-top:2px;">✅ Tutto OK</div>')
        +'</div>'
        +'<button onclick="openHistory(\''+c.vehicleId+'\')" style="background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;flex-shrink:0;">Storico</button>'
        +'</div>';
    }).join('');
  }

  openModal(title, html+'<div style="height:10px;"></div>');
}

const _rel = {vid:'', periodo:'presa', da:'', a:'', html:null, pdfP:null};

function _relIsoAdd(iso, months){ const d=new Date(iso+'T12:00:00'); d.setMonth(d.getMonth()+months); return d.toISOString().slice(0,10); }
function _relGiorni(daIso, aIso){ return Math.round((new Date(aIso+'T12:00:00')-new Date(daIso+'T12:00:00'))/86400000); }
const _REL_MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

// Data di presa in carico: inserimento nell'app, altrimenti il primo evento registrato
function _relPresaInCarico(v){
  const date=[];
  if(v.createdAt) date.push(String(v.createdAt).slice(0,10));
  DB.checks().forEach(c=>{ if(c.vehicleId===v.id&&c.data) date.push(c.data); });
  DB.interventions().forEach(i=>{ if(i.vehicleId===v.id&&i.dataApertura) date.push(i.dataApertura); });
  DB.segnalazioni().forEach(s=>{ if(s.vehicleId===v.id&&s.data) date.push(s.data); });
  DB.tires().forEach(t=>{ if(t.vehicleId===v.id&&t.dataMontaggio) date.push(t.dataMontaggio); });
  DB.tireInterventions().forEach(t=>{ if(t.vehicleId===v.id){ const d=t.dataEffettiva||t.dataProgrammata; if(d) date.push(d); } });
  date.sort();
  return date[0] || today();
}

function _relPeriodo(v){
  const oggi=today();
  switch(_rel.periodo){
    case 'mese':     return {da:_relIsoAdd(oggi,-1), a:oggi};
    case '12mesi':   return {da:_relIsoAdd(oggi,-12), a:oggi};
    case 'anno':     return {da:oggi.slice(0,4)+'-01-01', a:oggi};
    case 'annoPrec': { const y=parseInt(oggi.slice(0,4))-1; return {da:y+'-01-01', a:y+'-12-31'}; }
    case 'custom':   return {da:_rel.da||oggi, a:_rel.a||oggi};
    default:         return {da:_relPresaInCarico(v), a:oggi};
  }
}
