function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT'); }
function fmtKM(n){ if(!n&&n!==0) return '—'; return Number(n).toLocaleString('it-IT')+' km'; }
function today(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function daysDiff(dateStr){ const d=new Date(dateStr); const n=new Date(); return Math.round((d-n)/(1000*60*60*24)); }
// Stato revisione su base MESE: preavviso da 15gg prima dell'inizio del mese di scadenza,
// per tutto il mese; scaduta quando il mese di scadenza è finito.
function revStatus(scad){
  if(!scad) return 'none';
  const d=new Date(scad+'T00:00:00');
  if(isNaN(d)) return 'none';
  const y=d.getFullYear(), m=d.getMonth();
  const monthEnd=new Date(y, m+1, 0); monthEnd.setHours(23,59,59,999);   // ultimo giorno del mese
  const warnStart=new Date(y, m, 1); warnStart.setDate(warnStart.getDate()-15); warnStart.setHours(0,0,0,0); // 15gg prima dell'inizio mese
  const now=new Date(); now.setHours(0,0,0,0);
  if(now>monthEnd) return 'scaduta';
  if(now>=warnStart) return 'in_scadenza';
  return 'ok';
}
function fmtMese(scad){
  const mesi=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d=new Date(scad+'T00:00:00');
  if(isNaN(d)) return '';
  return mesi[d.getMonth()]+' '+d.getFullYear();
}
function formatTarga(s){ return (s||'').toUpperCase().replace(/\s/g,''); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Testo sicuro dentro un attributo HTML (data-*, value): virgolette e a capo compresi
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'&#10;').replace(/\r/g,'&#13;'); }

// ── KM: valori proposti in grigio ─────────────────────
// Il campo resta vuoto con il valore proposto in grigio (placeholder):
// se non si scrive nulla viene salvato il proposto, se si scrive vale il numero scritto.
function kmUltimoCheck(vehicleId){
  const cs=DB.checks().filter(c=>c.vehicleId===vehicleId && c.km!=null && c.km!=='');
  if(!cs.length){ const v=DB.vehicles().find(x=>x.id===vehicleId); return v&&v.km?(parseInt(v.km)||null):null; }
  cs.sort((a,b)=>String(a.data||'').localeCompare(String(b.data||'')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  return parseInt(cs[cs.length-1].km)||null;
}
function kmInput(id){
  const el=document.getElementById(id); if(!el) return null;
  if(String(el.value).trim()!=='') return parseInt(el.value)||0;
  const p=parseInt(el.placeholder); return isNaN(p)?null:p;
}
// Collega i km di chiusura a quelli di apertura (proposti in grigio)
function linkKmChiusura(apId, chId){
  const ap=document.getElementById(apId), ch=document.getElementById(chId);
  if(!ap||!ch) return;
  const upd=()=>{ const k=kmInput(apId); ch.placeholder = k!=null ? String(k) : ''; };
  ap.addEventListener('input', upd); upd();
}
// La scheda mezzo prende i km solo se sono più alti di quelli attuali
function updateVehicleKm(vehicleId, km, extra){
  const k=parseInt(km);
  const vs=DB.vehicles(); const i=vs.findIndex(v=>v.id===vehicleId); if(i<0) return;
  let changed=false;
  if(k && k>(parseInt(vs[i].km)||0)){ vs[i].km=k; changed=true; }
  if(extra){ Object.keys(extra).forEach(key=>{ if(vs[i][key]!==extra[key]){ vs[i][key]=extra[key]; changed=true; } }); }
  if(changed) DB.saveVehicles(vs);
}

function renderAlerts(){
  const bar = document.getElementById('alert-bar');
  bar.innerHTML='';
  const vehicles = DB.vehicles();
  const interventions = DB.interventions();
  const settings = DB.settings();
  const warnDays = settings.revWarningDays||30;
  const now = new Date();

  // Revisioni in scadenza o SCADUTE — un chip PER VEICOLO, apre il form revisione di quel mezzo
  const revList = vehicles.filter(v=>!v.venduto && v.scadenzaRevisione && revStatus(v.scadenzaRevisione)!=='ok' && revStatus(v.scadenzaRevisione)!=='none')
    .sort((a,b)=>new Date(a.scadenzaRevisione)-new Date(b.scadenzaRevisione));
  revList.forEach(function(v){
    const scaduta = revStatus(v.scadenzaRevisione)==='scaduta';
    const txt = '📋 '+v.targa+' · '+(scaduta?'Revisione scaduta':'Revisione in scadenza');
    const chip = mkChip('red', txt, ()=>openRevisioneForm(v.id));
    bar.appendChild(chip);
  });

  // Anomalie — un chip per veicolo, apre il modal anomalie senza intervento
  // Anomalie dai check items (val==='anomalia') senza intervento già creato
  const checks = DB.checks();
  const anomByVehicle = {};
  checks.forEach(function(c){
    const vCheck = vehicles.find(x=>x.id===c.vehicleId);
    if(!vCheck || vCheck.venduto) return;
    (c.items||[]).forEach(function(item){
      if(item.val==='anomalia'){
        const alreadyHandled = interventions.some(function(i){
          return i.checkId===c.id && i.descrizione.startsWith(item.voce) && i.stato!=='annullato';
        });
        if(!alreadyHandled){
          if(!anomByVehicle[c.vehicleId]) anomByVehicle[c.vehicleId]=0;
          anomByVehicle[c.vehicleId]++;
        }
      }
    });
  });
  Object.keys(anomByVehicle).forEach(function(vid){
    const v = vehicles.find(x=>x.id===vid);
    const targa = v ? v.targa : '?';
    const n = anomByVehicle[vid];
    const chip = mkChip('red', '🔴 '+targa+' · '+n+' anomali'+(n>1?'e':'a'), ()=>openAnomalieModal(vid));
    bar.appendChild(chip);
  });

  // Segnalazioni aperte (senza intervento o risoluzione)
  const segnalazioni = DB.segnalazioni();
  segnalazioni.forEach(function(s){
    const vSegn = vehicles.find(x=>x.id===s.vehicleId);
    if(!vSegn || vSegn.venduto) return;
    const alreadyHandled = DB.interventions().some(function(i){ return i.segnalazioneId===s.id && i.stato!=='annullato'; });
    if(alreadyHandled) return;
    const targa = vSegn.targa;
    const chip = mkChip('red', '📢 '+targa+' · Segnalazione', ()=>openSegnalazioneDetail(s.id));
    bar.appendChild(chip);
  });

  // Aperti — un chip per intervento: "In lavorazione" se la data intervento è oggi o passata,
  // altrimenti "In attesa di lavorazione" (fase tratteggiata, deve ancora arrivare il giorno).
  const oggiStr = today();
  const lav = interventions.filter(i=>i.stato==='in_lavorazione');
  lav.forEach(i=>{
    const v = vehicles.find(x=>x.id===i.vehicleId);
    if(!v || v.venduto) return;
    const targa = v.targa;
    const inLav = !i.dataApertura || i.dataApertura<=oggiStr;
    const txt = inLav ? '🔧 '+targa+' · In lavorazione' : '⏳ '+targa+' · In attesa di lavorazione';
    const chip = mkChip('amber', txt, ()=>openInterventionDetail(i.id));
    bar.appendChild(chip);
  });

  // Cambio gomme
  const alertGomme = checkTireAlerts(settings);
  if(alertGomme){
    const chip = mkChip(alertGomme.scaduto?'red':'blue', `🔵 ${alertGomme.testo}`, ()=>{switchTab('gomme');});
    bar.appendChild(chip);
  }

  if(!bar.innerHTML) bar.innerHTML='<div style="font-size:12px;color:rgba(255,255,255,.6);padding:4px 0;">Nessun alert attivo</div>';
}

function openAnomalieModal(vehicleId){
  const vehicles     = DB.vehicles();
  const checks       = DB.checks().filter(c=>c.vehicleId===vehicleId);
  const interventions= DB.interventions();
  const v            = vehicles.find(x=>x.id===vehicleId);

  // Raccogli tutte le anomalie senza intervento già creato, da tutti i check del veicolo
  const allAnom = [];
  checks.forEach(function(c){
    const anomItems = (c.items||[]).filter(i=>i.val==='anomalia');
    anomItems.forEach(function(a){
      const exists = interventions.some(function(i){
        return i.checkId===c.id && i.descrizione.startsWith(a.voce) && i.stato!=='annullato';
      });
      if(!exists) allAnom.push({c, a});
    });
  });

  if(!allAnom.length){
    toast('Nessuna anomalia aperta per questo veicolo');
    return;
  }

  var rows = allAnom.map(function(x){
    const c   = x.c;
    const a   = x.a;
    const vStr = escAttr(a.voce);
    const nStr = escAttr(a.note||'');
    const noteHtml = a.note ? '<br><span style="color:#9a3412;font-style:italic;">'+escHtml(a.note)+'</span>' : '';
    return '<div id="anom-row-'+c.id+'-'+escHtml(a.voce).replace(/\W/g,'_')+'" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;">'
      +'<div style="font-size:13px;color:#7c2d12;flex:1;"><strong>'+escHtml(a.voce)+'</strong>'+noteHtml
      +'<div style="font-size:11px;color:#9a3412;margin-top:2px;">'+fmtDate(c.data)+' · '+fmtKM(c.km)+'</div>'
      +'</div>'
      +'<div style="display:flex;gap:6px;flex-shrink:0;">'
      +'<button data-action="intervento" data-vid="'+vehicleId+'" data-cid="'+c.id+'" data-voce="'+vStr+'" data-note="'+nStr+'" data-km="'+c.km+'" style="background:#1e40af;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;">+ Intervento</button>'
      +'<button data-action="risolto" data-vid="'+vehicleId+'" data-cid="'+c.id+'" data-voce="'+vStr+'" data-km="'+c.km+'" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;">✓ Risolto</button>'
      +'</div></div>';
  }).join('');

  const html = '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;">'
    +'<div style="font-size:12px;font-weight:700;color:#c2410c;margin-bottom:10px;">ANOMALIE SENZA INTERVENTO — '+(v?v.targa:'')+'</div>'
    +rows
    +'</div>';

  openModal('Anomalie — '+(v?v.targa:''), html);

  // Event delegation — clona il nodo per azzerare eventuali listener accumulati (evita creazioni multiple)
  setTimeout(function(){
    var oldBox = document.getElementById('modal-box');
    if(!oldBox) return;
    var newBox = oldBox.cloneNode(true);
    oldBox.parentNode.replaceChild(newBox, oldBox);
    var consumed = false;
    newBox.addEventListener('click', function(e){
      const btn = e.target.closest('button[data-action]');
      if(!btn) return;
      if(consumed) return; // anti doppio-trigger
      consumed = true;
      const action = btn.dataset.action;
      const vid    = btn.dataset.vid;
      const cid    = btn.dataset.cid;
      const voce   = btn.dataset.voce;
      const note   = btn.dataset.note||'';
      const km     = parseInt(btn.dataset.km)||null;
      if(action==='intervento'){
        closeModal();
        createSingleIntervention(vid, cid, voce, note, km);
      } else if(action==='risolto'){
        closeModal();
        risolviAnomalia(vid, cid, voce, km);
      }
    });
  }, 10);
}

// Cambio gomme: le date in Impostazioni sono le SCADENZE (Codice della Strada:
// invernali entro il 15/11, estive entro il 15/05). L'avviso compare dal preavviso
// (default 30 giorni) e conta i mezzi attivi che hanno ancora montate le gomme
// dell'altra stagione; dopo la scadenza diventa rosso finché il cambio non è registrato.
function checkTireAlerts(settings){
  const warn = parseInt(settings.tireWarnDays)||30;
  const today = new Date(); today.setHours(0,0,0,0);
  const scad = (mmdd, y)=>{ const p=String(mmdd||'').split('-'); return new Date(y, (parseInt(p[0])||1)-1, parseInt(p[1])||1); };
  const stagioni = [
    {stagione:'inverno', nome:'invernali', mmdd:settings.tireInverno||'11-15'},
    {stagione:'estate',  nome:'estive',    mmdd:settings.tireEstate||'05-15'}
  ];
  // Periodo in corso: quello con l'inizio del preavviso più recente non successivo a oggi
  let cur=null;
  const y=today.getFullYear();
  stagioni.forEach(st=>{
    [y-1,y,y+1].forEach(yy=>{
      const dl=scad(st.mmdd, yy);
      const start=new Date(dl); start.setDate(start.getDate()-warn);
      if(start<=today && (!cur || start>cur.start)) cur={...st, deadline:dl, start};
    });
  });
  if(!cur) return null;
  const montate = DB.tires().filter(t=>t.stato==='montata');
  const mezzi = DB.vehicles().filter(v=>!v.venduto).filter(v=>{
    const m = montate.filter(t=>t.vehicleId===v.id);
    return m.length>0 && m.some(t=>t.stagione!==cur.stagione && t.stagione!=='4stagioni');
  });
  if(!mezzi.length) return null;
  const p2=n=>String(n).padStart(2,'0');
  const startStr = cur.start.getFullYear()+'-'+p2(cur.start.getMonth()+1)+'-'+p2(cur.start.getDate());
  const programmati = mezzi.filter(v=>DB.tireInterventions().some(t=>t.vehicleId===v.id && t.stato==='programmato' && (t.dataProgrammata||'')>=startStr)).length;
  const data = cur.deadline.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});
  const scaduto = today>cur.deadline;
  const n = mezzi.length===1 ? '1 mezzo' : mezzi.length+' mezzi';
  const testo = (scaduto ? `Gomme ${cur.nome} scadute il ${data}: ${n}` : `Gomme ${cur.nome} entro il ${data}: ${n}`)
    + (programmati ? ` (${programmati} programmat${programmati===1?'o':'i'})` : '');
  return {testo, scaduto, mezzi:mezzi.map(v=>v.targa)};
}

function _revPlus2(dateStr){
  if(!dateStr) return '';
  var d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  d.setFullYear(d.getFullYear()+2);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function saveRevisione(vehicleId){
  const v = DB.vehicles().find(x=>x.id===vehicleId);
  if(!v){ toast('Veicolo non trovato','error'); return; }
  const data = document.getElementById('rev-data').value || today();
  const km = kmInput('rev-km');
  const fornitoreId = document.getElementById('rev-fornitore').value || null;
  const nuovaScad = document.getElementById('rev-scad').value || _revPlus2(data);
  if(nuovaScad <= data){ toast('La nuova scadenza deve essere successiva alla data della revisione','error'); return; }
  const note = document.getElementById('rev-note').value.trim();
  // Intervento chiuso "Revisione periodica" — traccia data, km, fornitore nello storico
  const interventions = DB.interventions();
  interventions.push({
    id: DB.uid(), vehicleId,
    descrizione: 'Revisione periodica',
    origine: 'revisione',
    stato: 'chiuso',
    dataApertura: data, dataProgrammazione: data, dataChiusura: data,
    kmApertura: km, kmChiusura: km,
    fornitoreId: fornitoreId,
    scadenzaRevisione: nuovaScad,
    noteChiusura: note || 'Revisione effettuata',
    createdAt: nowISO()
  });
  DB.saveInterventions(interventions);
  // Aggiorna la scadenza sulla scheda veicolo

  if(idx>-1){ vehicles[idx].scadenzaRevisione = nuovaScad; DB.saveVehicles(vehicles); }
  updateVehicleKm(vehicleId, km);
  closeModal();
  toast('Revisione registrata · nuova scadenza '+fmtDate(nuovaScad),'success');
  refreshAll();
}

// ═══════════════════════════════════════════════════════
//  TARGA RENDERER
// ═══════════════════════════════════════════════════════
function renderTargaHtml(t){
  var raw = formatTarga(t);
  // Formato targa: AB 123 KL con spazio visivo tra i gruppi
  var fmt = raw;
  if(/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(raw)){
    fmt = raw.slice(0,2) + ' ' + raw.slice(2,5) + ' ' + raw.slice(5,7);
  }
  // SVG targa italiana: w=160 h=40 (rapporto ~4:1 come targa reale)
  // Banda EU: 30px larghezza
  // Stelle: 12 disposte in cerchio (raggio 7px, centro x=15 y=14)
  // Dimensioni SVG targa
  var W=190, H=46, EU=32, RX=6, SW=2.5;
  var cx=EU/2, cy=H*0.38, r=8;
  var nStars=12;
  var starsPath='';
  for(var i=0;i<nStars;i++){
    var ang=(i/nStars)*2*Math.PI-Math.PI/2;
    var sx=cx+r*Math.cos(ang), sy=cy+r*Math.sin(ang);
    var re=2.5, ri=1.0, pts='';
    for(var p=0;p<10;p++){
      var a2=(p/10)*2*Math.PI-Math.PI/2;
      var rr=p%2===0?re:ri;
      pts+=(p===0?'M':'L')+(sx+rr*Math.cos(a2)).toFixed(2)+','+(sy+rr*Math.sin(a2)).toFixed(2);
    }
    starsPath+='<path d="'+pts+'Z" fill="#FFD700"/>';
  }
  // Banda EU: stondata solo a sinistra (angoli sx arrotondati, dx dritti)
  var euPath='M '+(SW/2+RX)+','+(SW/2)
    +' H '+(EU)+' V '+(H-SW/2)
    +' H '+(SW/2+RX)
    +' Q '+(SW/2)+','+(H-SW/2)+' '+(SW/2)+','+(H-SW/2-RX)
    +' V '+(SW/2+RX)
    +' Q '+(SW/2)+','+(SW/2)+' '+(SW/2+RX)+','+(SW/2)+' Z';
  // Testo targa: usa viewBox scaling, fontSize grande che occupa tutta l'altezza
  var txtX=EU+(W-EU)/2, txtY=H/2;
  var svg='<svg class="targa-svg" width="'+W+'" height="'+H
    +'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    // Sfondo bianco bordo arrotondato
    +'<rect x="'+(SW/2)+'" y="'+(SW/2)+'" width="'+(W-SW)+'" height="'+(H-SW)
    +'" rx="'+RX+'" ry="'+RX+'" fill="#fff" stroke="#111" stroke-width="'+SW+'"/>'
    // Banda EU — path con solo angoli sinistri arrotondati
    +'<path d="'+euPath+'" fill="#1e40af"/>'
    // Stelle
    +starsPath
    // I
    +'<text x="'+cx+'" y="'+(H-7)+'" text-anchor="middle"'
    +' font-family="Arial,sans-serif" font-size="11" font-weight="900" fill="#fff">I</text>'
    // Testo targa — font condensed con textLength per riempire esattamente lo spazio
    +'<text x="'+txtX+'" y="'+txtY+'" text-anchor="middle" dominant-baseline="central"'
    +' font-family="Arial Narrow,Arial,sans-serif" font-size="30" font-weight="900"'
    +' fill="#111" letter-spacing="1"'
    +' textLength="'+(W-EU-16)+'" lengthAdjust="spacingAndGlyphs">'+escHtml(fmt)+'</text>'
    +'</svg>';
  return svg;
}

// ── SWIPE GESTURE ──
(function(){
  let x0=null, y0=null;
  const THRESHOLD=50, EDGE=30;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    x0=t.clientX; y0=t.clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    const panel=document.getElementById('nav-panel');
    const isOpen=panel.classList.contains('open');
    // swipe right from left edge → apri
    if(!isOpen && dx>THRESHOLD && Math.abs(dy)<80 && x0<EDGE) toggleNav();
    // swipe left quando aperto → chiudi
    if(isOpen && dx<-THRESHOLD && Math.abs(dy)<80) closeNav();
    x0=null; y0=null;
  },{passive:true});
})();

function gestioneToggleVenduto(id, venduto){

async function getVehiclePhoto(vehicleId){
  try{
    const db = await IDB.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('vehicle_photos','readonly');
      const req = tx.objectStore('vehicle_photos').get(vehicleId);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror   = ()=>resolve(null);
    });
  }catch(e){ return null; }
}

async function getAllVehiclePhotos(){
  try{
    const db = await IDB.open();
    return await new Promise((resolve)=>{
      const tx = db.transaction('vehicle_photos','readonly');
      const req = tx.objectStore('vehicle_photos').getAll();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror   = ()=>resolve([]);
    });
  }catch(e){ return []; }
}
async function saveVehiclePhoto(vehicleId, dataUrl){
  try{
    const db = await IDB.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('vehicle_photos','readwrite');
      tx.objectStore('vehicle_photos').put({vehicleId, dataUrl});
      tx.oncomplete = ()=>resolve();
    });
  }catch(e){}
}

async function saveVehiclePhotoCloud(vehicleId, dataUrl, cloudId){
  try{
    const db = await IDB.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('vehicle_photos','readwrite');
      tx.objectStore('vehicle_photos').put({vehicleId, dataUrl, cloudId});
      tx.oncomplete = ()=>resolve();
    });
  }catch(e){}
}

async function deleteVehiclePhoto(vehicleId){
  const old = await getVehiclePhoto(vehicleId);
  await deleteVehiclePhotoRaw(vehicleId);
  if(old && old.dataUrl) CloudSync.onFileDeleted(photoFileId(old));
}
async function deleteVehiclePhotoRaw(vehicleId){
  try{
    const db = await IDB.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('vehicle_photos','readwrite');
      tx.objectStore('vehicle_photos').delete(vehicleId);
      tx.oncomplete = ()=>resolve();
    });
  }catch(e){}
}

async function handleVehiclePhotoUpload(event, vehicleId){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 10*1024*1024){ toast('Foto troppo grande (max 10MB)','error'); return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    await saveVehiclePhoto(vehicleId, e.target.result);
    toast('Foto salvata','success');
    renderMain();
  };
  reader.readAsDataURL(file);
}

async function removeVehiclePhoto(vehicleId){
  await deleteVehiclePhoto(vehicleId);
  toast('Foto rimossa');
  renderMain();
}

function _vehicleFormData(){
  const kmTxt=document.getElementById('vf-km').value;
  return {
    targa:document.getElementById('vf-targa').value.trim().toUpperCase().replace(/\s+/g,''),
    nome:document.getElementById('vf-nome').value.trim(),
    modello:document.getElementById('vf-modello').value.trim(),
    anno:document.getElementById('vf-anno').value||null,
    km:kmTxt==='' ? null : (parseInt(kmTxt)||0),
    scadenzaRevisione:document.getElementById('vf-revisione').value||null,
    sollevatore:document.getElementById('vf-sollevatore').checked,
    pedana:document.getElementById('vf-pedana').checked,
    spazzolePost:document.getElementById('vf-spazzolePost').checked,
    lavavetriPost:document.getElementById('vf-lavavetriPost').checked,
    note:document.getElementById('vf-note').value.trim(),
  };
}
function _vehicleCheck(data, selfId){
  if(!data.targa||!data.nome) return 'Targa e nome sono obbligatori';
  const dup=DB.vehicles().find(v=>v.id!==selfId && String(v.targa||'').toUpperCase().replace(/\s+/g,'')===data.targa);
  if(dup) return 'Targa già presente: '+dup.targa+' — '+(dup.nome||'');
  return null;
}
function _afterVehicleSave(){
  closeModal();
  renderMain();
  renderAlerts();
  if(DB.settings().darkMode) applyDarkMode(true);
}

function openVehicleCreateForm(){
  openModal('Nuovo Veicolo', _vehicleFieldsHtml({}) + `
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveVehicleCreate()">Aggiungi veicolo</button>
    </div>`);
}
function saveVehicleCreate(){
  const data=_vehicleFormData();
  const err=_vehicleCheck(data, null);
  if(err){ toast(err,'error'); return; }
  const vehicles=DB.vehicles();
  vehicles.push({id:DB.uid(),...data,venduto:false,createdAt:nowISO()});
  DB.saveVehicles(vehicles);
  toast('Veicolo aggiunto','success');
  _afterVehicleSave();
}

function openVehicleEditForm(id){
  const v=DB.vehicles().find(x=>x.id===id);
  if(!v){ toast('Veicolo non trovato','error'); return; }
  openModal('Modifica Veicolo', _vehicleFieldsHtml(v) + `
    <div style="font-size:11px;color:#94a3b8;margin:6px 0 2px;">Le dotazioni valgono per i check nuovi: i check già fatti restano come sono stati registrati.</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveVehicleEdit('${id}')">Salva modifiche</button>
    </div>`);
}
function saveVehicleEdit(id){
  const vehicles=DB.vehicles();
  const idx=vehicles.findIndex(v=>v.id===id);
  if(idx<0){ toast('Veicolo non trovato','error'); return; }
  const data=_vehicleFormData();
  const err=_vehicleCheck(data, id);
  if(err){ toast(err,'error'); return; }
  const norm=x=>(x===undefined||x===null||x==='')?null:String(x);
  const patch={};
  Object.keys(data).forEach(k=>{
    const cur=vehicles[idx][k];
    const same = typeof data[k]==='boolean' ? (!!cur===data[k]) : (norm(data[k])===norm(cur));
    if(!same) patch[k]=data[k];
  });
  if(!Object.keys(patch).length){ toast('Nessuna modifica'); closeModal(); return; }
  vehicles[idx]={...vehicles[idx],...patch};
  DB.saveVehicles(vehicles);
  toast('Veicolo aggiornato','success');
  _afterVehicleSave();
}

function saveVehicle(id){ return id ? saveVehicleEdit(id) : saveVehicleCreate(); }

function deleteVehicle(id){
  const v=DB.vehicles().find(x=>x.id===id);
  openModal('Elimina veicolo',`
    <p style="font-size:15px;color:#334155;margin-bottom:6px;">Eliminare <strong>${escHtml(v?.nome||'')}</strong>?</p>
    <p style="font-size:13px;color:#94a3b8;margin-bottom:20px;">Verranno eliminati anche check, interventi e documenti collegati.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-danger" onclick="_doDeleteVehicle('${id}')">Elimina</button>
    </div>
  `);
}

function _doDeleteVehicle(id){
  DB.saveVehicles(DB.vehicles().filter(v=>v.id!==id));
  DB.saveChecks(DB.checks().filter(c=>c.vehicleId!==id));
  DB.saveInterventions(DB.interventions().filter(i=>i.vehicleId!==id));
  DB.saveTires(DB.tires().filter(t=>t.vehicleId!==id));
  IDB.deleteByVehicle(id); // Documenti da IndexedDB
  closeModal();
  toast('Veicolo eliminato');
  renderMain();
  renderAlerts();
}

function toggleVenduto(id, venduto){
  const vehicles=DB.vehicles();
  const idx=vehicles.findIndex(v=>v.id===id);
  if(idx>-1){ vehicles[idx].venduto=venduto; DB.saveVehicles(vehicles); }

function openSegnalazioneForm(vehicleId){

  const settings = DB.settings();
  openModal('📢 Nuova Segnalazione — '+(v?v.targa:''),
    '<div class="form-group"><label class="form-label">Problema *</label>'
    +'<textarea class="form-input" id="segn-problema" rows="3" placeholder="Descrivi il problema riscontrato…"></textarea></div>'
    +'<div class="form-group"><label class="form-label">Note aggiuntive</label>'
    +'<textarea class="form-input" id="segn-note" rows="2" placeholder="Opzionale…"></textarea></div>'
    +'<div class="form-group inline"><label class="form-label">Operatore</label>'
    +'<input class="form-input" id="segn-operatore" type="text" value="'+escHtml(settings.operator||'')+'" placeholder="Nome operatore"></div>'
    +'<div class="form-group inline"><label class="form-label">KM attuali</label>'
    +'<input class="form-input" id="segn-km" type="number" inputmode="numeric" value="" placeholder="'+(kmUltimoCheck(vehicleId)??'')+'" min="0"></div>'
    +'<div class="btn-row">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Annulla</button>'
    +'<button class="btn btn-primary" id="btn-save-segn">Invia segnalazione</button>'
    +'</div>'
  );
  document.getElementById('btn-save-segn').onclick = function(){
    saveSegnalazione(vehicleId);
  };
}

function saveSegnalazione(vehicleId){
  const problema  = (document.getElementById('segn-problema')?.value||'').trim();
  const note      = (document.getElementById('segn-note')?.value||'').trim();
  const operatore = (document.getElementById('segn-operatore')?.value||'').trim();
  const km        = kmInput('segn-km');
  if(!problema){ toast('Inserisci una descrizione del problema','error'); return; }
  const segnalazioni = DB.segnalazioni();
  segnalazioni.push({
    id: DB.uid(), vehicleId,
    problema, note, operatore, km,
    data: today(),
    createdAt: nowISO()
  });
  DB.saveSegnalazioni(segnalazioni);
  closeModal();
  toast('Segnalazione inviata','success');
  renderAlerts();
  renderMain();
}

function saveSegnalazioneEdit(segnId){
  const segnalazioni = DB.segnalazioni();
  const s = segnalazioni.find(x=>x.id===segnId);
  if(!s){ toast('Segnalazione non trovata','error'); return; }
  const kmEl = document.getElementById('segn-km');
  const f = {
    problema:  document.getElementById('segn-problema').value.trim(),
    note:      document.getElementById('segn-note').value.trim(),
    data:      document.getElementById('segn-data').value,
    km:        kmEl.value.trim()==='' ? null : (parseInt(kmEl.value)||0),
    operatore: document.getElementById('segn-operatore').value.trim()
  };
  if(!f.problema){ toast('Inserisci una descrizione del problema','error'); return; }
  if(!f.data){ toast('Inserisci la data','error'); return; }
  if(f.data > today()){ toast('La data non può essere futura','error'); return; }
  if(f.km!=null && f.km<0){ toast('I km non possono essere negativi','error'); return; }
  // Salva solo i campi cambiati
  const norm = x => (x===undefined||x===null||x==='') ? null : String(x);
  let cambiati = 0;
  Object.keys(f).forEach(k=>{ if(norm(f[k])!==norm(s[k])){ s[k]=f[k]; cambiati++; } });
  if(cambiati) DB.saveSegnalazioni(segnalazioni);
  closeModal();
  toast(cambiati ? 'Segnalazione aggiornata' : 'Nessuna modifica', cambiati?'success':'');
  if(cambiati){ renderAlerts(); renderMain(); }
}

    +'<button id="btn-segn-int" class="btn btn-primary">+ Intervento</button>'
    +'<button id="btn-segn-ris" class="btn" style="background:#16a34a;color:#fff;">✓ Risolto</button>'

    +'<div style="font-size:12px;color:#b91c1c;font-weight:700;margin-bottom:2px;">SEGNALAZIONE</div>'
    +'<div style="font-size:14px;color:#1e293b;font-weight:600;">'+escHtml(s.problema)+'</div>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">Come è stata risolta? (opzionale)</label>'
    +'<textarea class="form-input" id="ris-segn-note" rows="3" placeholder="Es: controllato, non necessita intervento…"></textarea></div>'
    +'<div class="btn-row">'
    +'<button class="btn btn-secondary" onclick="closeModal()">Annulla</button>'
    +'<button id="btn-save-ris-segn" class="btn" style="background:#16a34a;color:#fff;font-weight:700;">Segna risolto</button>'
    +'</div>'
  );
  document.getElementById('btn-save-ris-segn').onclick = function(){
    const note = (document.getElementById('ris-segn-note')?.value||'').trim();
    const interventions = DB.interventions();
    const v = DB.vehicles().find(x=>x.id===s.vehicleId);
    interventions.push({
      id: DB.uid(), vehicleId: s.vehicleId,
      segnalazioneId: s.id,
      descrizione: s.problema+(note?' — '+note:''),
      dataApertura: today(), kmApertura: s.km||(v?parseInt(v.km):null),
      stato: 'chiuso', origine: 'segnalazione',
      fornitoreId: null, dataChiusura: today(), kmChiusura: null,
      noteChiusura: note||'Risolto senza intervento esterno',
      createdAt: nowISO()
    });
    DB.saveInterventions(interventions);
    closeModal();
    toast('Segnalazione risolta','success');
    renderAlerts();
    renderMain();
  };
}

// Punto d'ingresso unico: con un id apre la MODIFICA, senza id la CREAZIONE.
function openCheckForm(vehicleId, editCheckId){
  if(editCheckId) return openCheckEditForm(editCheckId);
  return openCheckCreateForm(vehicleId);
}

// Corpo comune delle due maschere. voci = elenco voci mostrate, in ordine;
// np = voci "NON PRESENTE" (non modificabili); checkItems contiene i valori correnti.
function _checkFormHtml(o){
  window._ckVoci = o.voci.slice();
  window._ckNP = Object.assign({}, o.np);
  return `
    <div class="form-group inline">
      <label class="form-label">KM attuali *</label>
      <input class="form-input" id="ck-km" type="number" inputmode="numeric" value="${o.km??''}" placeholder="${o.kmProposti??''}" min="0">
    </div>
    <div class="form-group inline">
      <label class="form-label">Operatore</label>
      <input class="form-input" id="ck-op" value="${escHtml(o.op||'')}" placeholder="Nome operatore">
    </div>
    <div class="form-group inline">
      <label class="form-label">Data check</label>
      <input class="form-input" id="ck-date" type="date" value="${o.data||''}">
    </div>
    <div class="divider"></div>
    <div class="section-title">Voci di controllo</div>
    <div id="check-voci-list">
      ${o.voci.map((voce,i)=>{
        const cur = checkItems[voce]||{val:'',note:''};
        if(o.np[voce]){
          return '<div class="check-item" id="chk-row-'+i+'" style="opacity:0.55;">'
            +'<div class="check-label">'+escHtml(voce)+'</div>'
            +'<div class="check-toggle"><span style="font-size:11px;font-weight:700;color:#94a3b8;background:#f1f5f9;border-radius:6px;padding:5px 8px;white-space:nowrap;">NON PRESENTE</span></div>'
            +'</div>';
        }
        return '<div class="check-item" id="chk-row-'+i+'">'
          +'<div class="check-label">'+escHtml(voce)+'</div>'
          +'<div class="check-toggle">'
          +'<button class="ctgl ok'+(cur.val==='ok'?' active':'')+'" onclick="setCheck('+i+',\'ok\',window._ckVoci['+i+'])" id="chk-ok-'+i+'">OK</button>'
          +'<button class="ctgl anom'+(cur.val==='anomalia'?' active':'')+'" onclick="setCheck('+i+',\'anomalia\',window._ckVoci['+i+'])" id="chk-an-'+i+'">⚠️</button>'
          +'</div></div>'
          +'<textarea class="check-note" id="chk-note-'+i+'" placeholder="Note per '+escAttr(voce)+'…" oninput="checkItems[window._ckVoci['+i+']].note=this.value">'+escHtml(cur.note)+'</textarea>';
      }).join('')}
    </div>
    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">Note generali</label>
      <textarea class="form-input" id="ck-notes" rows="2" placeholder="Osservazioni generali…">${escHtml(o.note||'')}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="${o.saveCmd}">${o.saveLabel}</button>
    </div>
    <div style="height:10px;"></div>`;
}
function _checkFormRestoreButtons(){
  setTimeout(()=>{ (window._ckVoci||[]).forEach((voce,i)=>{ const ci=checkItems[voce]; if(ci&&ci.val&&ci.val!=='non_presente'&&!window._ckNP[voce]) setCheck(i,ci.val,voce); }); },30);
}
// Legge le voci dalla maschera aperta
function _checkFormItems(){
  return (window._ckVoci||[]).map((voce,i)=>{
    if(window._ckNP[voce]) return {voce, val:'non_presente', note:''};
    const noteEl=document.getElementById('chk-note-'+i);
    const ci=checkItems[voce]||{val:'',note:''};
    return {voce, val:ci.val, note:(noteEl?noteEl.value.trim():'')||ci.note||''};
  });
}

// ── CREA: voci attuali e dotazione attuale del mezzo ──
function openCheckCreateForm(vehicleId){
  const v=DB.vehicles().find(x=>x.id===vehicleId);
  if(!v){ toast('Veicolo non trovato','error'); return; }
  const isNonPresente = (voce) => {
    if(voce === 'Sollevatore' && !v.sollevatore) return true;
    if(voce === 'Dispositivi ritenzione carrozzine' && !v.sollevatore && !v.pedana) return true;
    if(voce === 'Spazzole posteriori' && !v.spazzolePost) return true;
    if(voce === 'Lavavetri posteriori' && !v.lavavetriPost) return true;
    return false;
  };
  checkItems={}; const np={};
  CHECK_VOCI.forEach(voce=>{
    if(isNonPresente(voce)){ np[voce]=true; checkItems[voce]={val:'non_presente',note:''}; }
    else checkItems[voce]={val:'',note:''};
  });
  openModal(`Nuovo Check — ${v.targa}`, _checkFormHtml({
    voci:CHECK_VOCI, np, km:'', kmProposti:kmUltimoCheck(vehicleId), op:DB.settings().operator||'', data:today(), note:'',
    saveCmd:`saveCheckCreate('${vehicleId}')`, saveLabel:'Salva check'
  }));
}

// ── MODIFICA: il check resta com'era (voci, ordine e NON PRESENTE di allora) ──
function openCheckEditForm(checkId){
  const c=DB.checks().find(x=>x.id===checkId);
  if(!c){ toast('Check non trovato','error'); return; }
  const v=DB.vehicles().find(x=>x.id===c.vehicleId);
  const items=(c.items||[]);
  checkItems={}; const np={};
  items.forEach(it=>{
    checkItems[it.voce]={val:it.val||'', note:it.note||''};
    if(it.val==='non_presente') np[it.voce]=true;
  });
  openModal(`Modifica Check — ${v?.targa||''}`, _checkFormHtml({
    voci:items.map(it=>it.voce), np, km:c.km??'', kmProposti:'', op:c.operatore||'', data:c.data||'', note:c.note||'',
    saveCmd:`saveCheckEdit('${checkId}')`, saveLabel:'Salva modifiche'
  }));
  _checkFormRestoreButtons();
}

function setCheck(idx, val, voce){
  checkItems[voce] = checkItems[voce]||{val:'',note:''};
  checkItems[voce].val = val;
  const okBtn=document.getElementById('chk-ok-'+idx);
  const anBtn=document.getElementById('chk-an-'+idx);
  const noteEl=document.getElementById('chk-note-'+idx);
  okBtn.classList.toggle('active', val==='ok');
  anBtn.classList.toggle('active', val==='anomalia');
  if(noteEl){ noteEl.classList.toggle('show', val==='anomalia'); }
}

// Compatibilità: vecchie chiamate a saveCheck
function saveCheck(vehicleId, editCheckId){
  if(editCheckId) return saveCheckEdit(editCheckId);
  return saveCheckCreate(vehicleId);
}

function saveCheckCreate(vehicleId){
  const km=document.getElementById('ck-km').value;
  if(!km){ toast('Inserisci i KM','error'); return; }
  const op=document.getElementById('ck-op').value.trim()||DB.settings().operator||'Operatore';
  const date=document.getElementById('ck-date').value||today();
  const notes=document.getElementById('ck-notes').value.trim();
  const items=_checkFormItems();
  const anomalie=items.filter(i=>i.val==='anomalia');
  const checks=DB.checks();
  const checkId=DB.uid();
  checks.push({ id:checkId, vehicleId, data:date, operatore:op, km:parseInt(km), items, note:notes, createdAt:nowISO() });
  DB.saveChecks(checks);
  // Scheda mezzo: km solo se più alti, ultimo check solo se è il più recente
  const v=DB.vehicles().find(x=>x.id===vehicleId);
  updateVehicleKm(vehicleId, km, (!v || !v.ultimoCheck || date>=v.ultimoCheck) ? {ultimoCheck:date} : null);

  closeModalSmart();
  renderMain();
  renderAlerts();

  if(anomalie.length>0){
    window._pendingAnomalies={ vehicleId, checkId, anomalie, km:parseInt(km) };
    setTimeout(()=>askCreateInterventions(), 350);
  } else {
    toast('✅ Check salvato — tutto OK','success');
  }
}

function saveCheckEdit(checkId){
  const checks=DB.checks();
  const idx=checks.findIndex(c=>c.id===checkId);
  if(idx<0){ toast('Check non trovato','error'); return; }
  const c=checks[idx];
  const kmTxt=document.getElementById('ck-km').value;
  if(!kmTxt){ toast('Inserisci i KM','error'); return; }
  const form={
    km:parseInt(kmTxt),
    operatore:document.getElementById('ck-op').value.trim(),
    data:document.getElementById('ck-date').value||c.data,
    items:_checkFormItems(),
    note:document.getElementById('ck-notes').value.trim()
  };
  // Solo i campi cambiati
  const patch={};
  Object.keys(form).forEach(k=>{ if(JSON.stringify(form[k]??null)!==JSON.stringify(c[k]??(k==='note'||k==='operatore'?'':null))) patch[k]=form[k]; });
  if(!Object.keys(patch).length){ toast('Nessuna modifica'); closeModalSmart(); return; }
  checks[idx]={...c,...patch};
  DB.saveChecks(checks);
  // Scheda mezzo: ultimo check = data del check più recente; km solo se più alti
  const propri=checks.filter(x=>x.vehicleId===c.vehicleId).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  const ultimo=propri[propri.length-1];
  if(ultimo) updateVehicleKm(c.vehicleId, ultimo.km, {ultimoCheck:ultimo.data});
  closeModalSmart();
  renderMain();
  renderAlerts();
  toast('✅ Check aggiornato','success');
}

function askCreateInterventions(){
  const { vehicleId, checkId, anomalie, km } = window._pendingAnomalies||{};
  if(!vehicleId){ return; }
  const v=DB.vehicles().find(x=>x.id===vehicleId);

  // Verifica quali anomalie hanno già un intervento collegato
  const interventions=DB.interventions();
  const anomalieSenzaIntervento=anomalie.filter(a=>
    !interventions.some(i=>i.checkId===checkId && i.descrizione.startsWith(a.voce) && i.stato!=='annullato')
  );

  if(anomalieSenzaIntervento.length===0){
    toast('✅ Check salvato — interventi già presenti','success');
    return;
  }

  openModal('⚠️ Anomalie rilevate — check salvato',`
    <div style="background:#dcfce7;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#15803d;font-weight:600;">
      ✅ Check salvato correttamente. Puoi sempre creare gli interventi dallo storico.
    </div>
    <p style="font-size:14px;color:#334155;margin-bottom:10px;">Trovate <strong>${anomalieSenzaIntervento.length} anomali${anomalieSenzaIntervento.length!==1?'e':'a'}</strong> per <strong>${escHtml(v?.nome||'')}</strong>:</p>
    ${anomalieSenzaIntervento.map(a=>`
      <div style="padding:8px 12px;background:#fee2e2;border-radius:8px;margin-bottom:6px;font-size:13px;color:#b91c1c;font-weight:600;">
        ⚠️ ${escHtml(a.voce)}${a.note?`<div style="font-weight:400;color:#7f1d1d;margin-top:2px;">${escHtml(a.note)}</div>`:''}
      </div>`).join('')}
    <p style="font-size:12px;color:#94a3b8;margin:10px 0 14px;">Puoi creare gli interventi ora oppure in seguito dallo Storico veicolo.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Dopo (dallo storico)</button>
      <button class="btn btn-danger" onclick="_createAnomalyInterventions()">Crea interventi ora</button>
    </div>
  `);
}

function _createAnomalyInterventions(){
  const { vehicleId, checkId, anomalie, km } = window._pendingAnomalies||{};
  if(!vehicleId){ closeModal(); return; }

  const interventions=DB.interventions();
  // Solo anomalie senza intervento già esistente
  const toCreate=anomalie.filter(a=>
    !interventions.some(i=>i.checkId===checkId && i.descrizione.startsWith(a.voce) && i.stato!=='annullato')
  );
  toCreate.forEach(a=>{
    interventions.push({
      id:DB.uid(), vehicleId, checkId,
      dataApertura:today(), kmApertura:km,
      descrizione:a.voce+(a.note?' — '+a.note:''),
      stato:'anomalia', origine:'check',
      fornitoreId:null, dataChiusura:null, kmChiusura:null, noteChiusura:'',
      createdAt:nowISO()
    });
  });
  DB.saveInterventions(interventions);
  window._pendingAnomalies=null;
  closeModal();
  toast(`${toCreate.length} intervento${toCreate.length!==1?'i':''} creato${toCreate.length!==1?'i':''}`, 'success');
  renderAlerts();
  renderMain();
}

// Crea un singolo intervento da anomalia check — chiamato dallo storico in qualsiasi momento
function createSingleIntervention(vehicleId, checkId, voce, note, km){
  const interventions=DB.interventions();
  // Evita duplicati
  if(interventions.some(i=>i.checkId===checkId && i.descrizione.startsWith(voce) && i.stato!=='annullato')){
    toast('Intervento già esistente per questa anomalia');
    return;
  }
  // Recupera la data dell'anomalia dal check
  const check=DB.checks().find(c=>c.id===checkId);
  const anomalyDate=check?check.data:today();
  
  // Non creare subito, apri il form per configurare
  window._newIntervention={
    vehicleId, checkId,
    descrizione:voce+(note?' — '+note:''),
    note, km:parseInt(km)||null,
    dataApertura:anomalyDate,
    forAnomalia:true
  };
  openInterventionForm(vehicleId);
}

function saveChiusura(intId, vehicleId){
  const note=document.getElementById('ch-note').value.trim();
  if(!note){ toast('Inserisci le note di chiusura','error'); return; }
  const interventions=DB.interventions();
  const idx=interventions.findIndex(i=>i.id===intId);
  if(idx>-1){
    const chiuso={...interventions[idx], stato:'chiuso',
      dataChiusura:document.getElementById('ch-data').value||today(),
      kmChiusura:kmInput('ch-km'), noteChiusura:note};
    const err=_checkInterventionData(chiuso);
    if(err){ toast(err,'error'); return; }
    interventions[idx]=chiuso;
    updateVehicleKm(vehicleId, chiuso.kmChiusura);
  }
  DB.saveInterventions(interventions);
  closeModal();
  toast('Intervento chiuso','success');
  window._chiusuraFromPlanner=false;
  refreshAll();
}

function annullaIntervento(intId, vehicleId, fromPlanner){

}

function saveAnnullaIntervento(intId, vehicleId, fromPlanner){
  const note = document.getElementById('ann-note').value.trim();
  const interventions = DB.interventions();
  const idx = interventions.findIndex(i=>i.id===intId);
  if(idx>-1){
    interventions[idx].stato = 'annullato';
    interventions[idx].noteChiusura = note||'Intervento annullato';
    interventions[idx].dataChiusura = today();
  }
  DB.saveInterventions(interventions);
  closeModal();
  toast('Intervento annullato','success');
  renderAlerts();
  renderMain();
  if(fromPlanner) openPlanner(_plannerYear, _plannerMonth);
}

function openInterventionForm(vehicleId, intId){
  if(intId) return openInterventionEditForm(intId);
  return openInterventionCreateForm(vehicleId);
}

// Controlli comuni su date e km. Restituisce il messaggio d'errore o null.
function _checkInterventionData(d){
  if(!d.descrizione) return 'Inserisci una descrizione';
  if(!d.dataApertura) return 'Inserisci la data intervento';
  if(d.dataProgrammazione && d.dataProgrammazione > d.dataApertura) return 'La data programmazione non può essere successiva alla data intervento';
  if(d.stato==='chiuso'){
    if(!d.dataChiusura) return 'Inserisci la data di chiusura';
    if(d.dataChiusura < d.dataApertura) return 'La data di chiusura non può essere precedente alla data intervento';
    if(d.kmChiusura!=null && d.kmApertura!=null && d.kmChiusura < d.kmApertura) return 'I km di chiusura non possono essere inferiori ai km di apertura';
  }
  return null;
}
function _kmVal(id){ const v=document.getElementById(id).value; return v==='' ? null : (parseInt(v)||0); }

const INT_STATI=[['in_lavorazione','🔧 In lavorazione'],['anomalia','⚠️ Anomalia'],['chiuso','✅ Chiuso'],['annullato','✕ Annullato']];

// ── CREA ──────────────────────────────────────────────
function openInterventionCreateForm(vehicleId){
  const v=DB.vehicles().find(x=>x.id===vehicleId);
  // Il contesto "da anomalia" vale solo per QUESTA creazione e viene consumato subito
  window._intCreateCtx = window._newIntervention || null;
  window._newIntervention = null;
  const ctx = window._intCreateCtx;
  const suppliers=DB.suppliers().filter(s=>s.attivo);
  const suppliersOptions=suppliers.map(s=>`<option value="${s.id}">${escHtml(s.nome)} (${escHtml(s.tipo)})</option>`).join('');
  const descrizione = ctx?.descrizione || (window._preInterventoDesc||'');
  window._preInterventoDesc = null;
  const dataApertura = ctx?.dataApertura || today();
  const kmProposti = kmUltimoCheck(vehicleId);
  const statoOpts = INT_STATI.map(([val,lab])=>`<option value="${val}" ${val==='in_lavorazione'?'selected':''}>${lab}</option>`).join('');

  openModal('Nuovo Intervento — '+(v?.targa||''), `
    <div class="form-group"><label class="form-label">Descrizione problema *</label>
      <textarea class="form-input" id="int-desc" rows="3" placeholder="Descrivi il problema o l'intervento…">${escHtml(descrizione)}</textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Data programmazione</label>
        <input class="form-input" id="int-data-prog" type="date" value="${dataApertura}"></div>
      <div class="form-group"><label class="form-label">Data intervento *</label>
        <input class="form-input" id="int-data" type="date" value="${dataApertura}"></div>
    </div>
    <div class="form-group"><label class="form-label">KM apertura</label>
      <input class="form-input" id="int-km" type="number" inputmode="numeric" value="" placeholder="${kmProposti??''}" min="0"></div>
    <div class="form-group"><label class="form-label">Stato</label>
      <select class="form-select" id="int-stato">${statoOpts}</select></div>
    <div class="form-group"><label class="form-label">Fornitore</label>
      <select class="form-select" id="int-fornitore">
        <option value="">— Nessun fornitore —</option>
        ${suppliersOptions}
      </select></div>
    <div id="chiusura-fields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Data chiusura *</label>
          <input class="form-input" id="int-data-ch" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">KM chiusura</label>
          <input class="form-input" id="int-km-ch" type="number" inputmode="numeric" value="" min="0"></div>
      </div>
      <div class="form-group"><label class="form-label">Note chiusura</label>
        <textarea class="form-input" id="int-note-ch" rows="2" placeholder="Cosa è stato fatto…"></textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="window._intCreateCtx=null;closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveInterventionCreate('${vehicleId}')">Crea intervento</button>
    </div>
  `);
  setTimeout(()=>{
    const sel=document.getElementById('int-stato');
    if(sel) sel.onchange=function(){
      document.getElementById('chiusura-fields').style.display = this.value==='chiuso' ? '' : 'none';
    };
    linkKmChiusura('int-km','int-km-ch');
  },10);
}

function saveInterventionCreate(vehicleId){
  const ctx = window._intCreateCtx || null;
  const stato=document.getElementById('int-stato').value;
  const data={
    vehicleId,
    descrizione:document.getElementById('int-desc').value.trim(),
    dataApertura:document.getElementById('int-data').value,
    dataProgrammazione:document.getElementById('int-data-prog').value||null,
    kmApertura:kmInput('int-km'),
    stato, fornitoreId:document.getElementById('int-fornitore').value||null,
    origine:'manuale',
    dataChiusura:stato==='chiuso'?document.getElementById('int-data-ch').value:null,
    kmChiusura:stato==='chiuso'?kmInput('int-km-ch'):null,
    noteChiusura:stato==='chiuso'?document.getElementById('int-note-ch').value:'',
  };
  const err=_checkInterventionData(data);
  if(err){ toast(err,'error'); return; }
  if(ctx && ctx.checkId){ data.checkId=ctx.checkId; data.origine='check'; }
  const interventions=DB.interventions();
  interventions.push({id:DB.uid(),...data,createdAt:nowISO()});
  DB.saveInterventions(interventions);
  if(stato==='chiuso') updateVehicleKm(vehicleId, data.kmChiusura);
  window._intCreateCtx=null;
  toast('Intervento creato','success');
  closeModalSmart();
  refreshAll();
}

// ── MODIFICA ──────────────────────────────────────────
// Mostra il record così com'è (campi vuoti restano vuoti) e salva SOLO i campi cambiati.

  const it=DB.interventions().find(i=>i.id===intId);
  if(!it){ toast('Intervento non trovato','error'); return; }
  const v=DB.vehicles().find(x=>x.id===it.vehicleId);

  const suppliers=DB.suppliers().filter(s=>s.attivo || s.id===it.fornitoreId);
  const suppliersOptions=suppliers.map(s=>`<option value="${s.id}" ${it.fornitoreId===s.id?'selected':''}>${escHtml(s.nome)} (${escHtml(s.tipo)})${s.attivo?'':' — non attivo'}</option>`).join('');
  const stati = INT_STATI.some(([val])=>val===it.stato) ? INT_STATI : INT_STATI.concat([[it.stato, it.stato]]);

  openModal('Modifica Intervento — '+(v?.targa||''), `
    <div style="background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#64748b;">

    <div class="form-row">
      <div class="form-group"><label class="form-label">Data programmazione</label>
        <input class="form-input" id="int-data-prog" type="date" value="${val(it.dataProgrammazione)}"></div>
      <div class="form-group"><label class="form-label">Data intervento *</label>
        <input class="form-input" id="int-data" type="date" value="${val(it.dataApertura)}"></div>
    </div>
    <div class="form-group"><label class="form-label">KM apertura</label>
      <input class="form-input" id="int-km" type="number" value="${val(it.kmApertura)}" min="0"></div>
    <div class="form-group"><label class="form-label">Stato</label>
      <select class="form-select" id="int-stato">${statoOpts}</select></div>
    <div id="int-chiusura-warn" style="display:none;background:#fef3c7;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#92400e;font-weight:600;">
      ⚠️ Cambiando stato, data, km e note di chiusura verranno rimossi.
    </div>
    <div class="form-group"><label class="form-label">Fornitore</label>
      <select class="form-select" id="int-fornitore">
        <option value="" ${it.fornitoreId?'':'selected'}>— Nessun fornitore —</option>
        ${suppliersOptions}
      </select></div>
    <div id="chiusura-fields" style="${chiuso?'':'display:none'}">
      <div class="form-row">

        <div class="form-group"><label class="form-label">KM chiusura</label>

        <textarea class="form-input" id="int-note-ch" rows="2" placeholder="Cosa è stato fatto…">${chiuso?escHtml(it.noteChiusura||''):''}</textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveInterventionEdit('${intId}')">Salva modifiche</button>
    </div>
  `);
  setTimeout(()=>{
    const sel=document.getElementById('int-stato');

      document.getElementById('chiusura-fields').style.display = this.value==='chiuso' ? '' : 'none';
      document.getElementById('int-chiusura-warn').style.display = (chiuso && this.value!=='chiuso') ? '' : 'none';
    };
    linkKmChiusura('int-km','int-km-ch');
  },10);
}

function saveInterventionEdit(intId){
  const interventions=DB.interventions();
  const idx=interventions.findIndex(i=>i.id===intId);
  if(idx<0){ toast('Intervento non trovato','error'); return; }
  const it=interventions[idx];
  const stato=document.getElementById('int-stato').value;
  // Valori del modulo (stessa forma dei campi del record)
  const form={
    descrizione:document.getElementById('int-desc').value.trim(),
    dataProgrammazione:document.getElementById('int-data-prog').value||null,
    dataApertura:document.getElementById('int-data').value,
    kmApertura:_kmVal('int-km'),
    stato,
    fornitoreId:document.getElementById('int-fornitore').value||null,
  };
  if(stato==='chiuso'){
    form.dataChiusura=document.getElementById('int-data-ch').value||null;
    // km in grigio applicati solo se l'intervento viene chiuso adesso; se era già chiuso vale ciò che è scritto
    form.kmChiusura = it.stato==='chiuso' ? _kmVal('int-km-ch') : kmInput('int-km-ch');
    form.noteChiusura=document.getElementById('int-note-ch').value;
  }else if(it.stato==='chiuso'){
    // Riaperto/annullato un intervento chiuso: i dati di chiusura non valgono più
    form.dataChiusura=null; form.kmChiusura=null; form.noteChiusura='';
  }
  const err=_checkInterventionData({...it,...form});
  if(err){ toast(err,'error'); return; }
  // Solo i campi effettivamente cambiati (vuoto e assente valgono uguale)
  const norm=x=>(x===undefined||x===null||x==='')?null:String(x);
  const patch={};
  Object.keys(form).forEach(k=>{ if(norm(form[k])!==norm(it[k])) patch[k]=form[k]; });
  if(!Object.keys(patch).length){ toast('Nessuna modifica'); closeModalSmart(); return; }
  interventions[idx]={...it,...patch};
  DB.saveInterventions(interventions);
  if(patch.stato==='chiuso' || patch.kmChiusura!=null) updateVehicleKm(it.vehicleId, interventions[idx].kmChiusura);
  toast('Intervento aggiornato','success');
  closeModalSmart();
  refreshAll();
}

function openCheckViewer(checkId, vehicleId){
  // Ordine CRESCENTE: idx=0 = più vecchio, idx=total-1 = più recente
  const allChecks = DB.checks()
    .filter(c => c.vehicleId === vehicleId)
    .sort((a,b) => new Date(a.data) - new Date(b.data));

  const idx = allChecks.findIndex(c => c.id === checkId);
  const c = allChecks[idx];
  if(!c){ toast('Check non trovato','error'); return; }
  const v = DB.vehicles().find(x => x.id === vehicleId);
  const total = allChecks.length;
  const pos = idx + 1; // 1=più vecchio, total=più recente

  const anom = c.items ? c.items.filter(i => i.val === 'anomalia') : [];
  // ‹ = precedente (più vecchio) = idx-1
  // › = successivo (più recente) = idx+1
  const prevId = idx > 0       ? allChecks[idx-1].id : null;
  const nextId = idx < total-1 ? allChecks[idx+1].id : null;

  // Nav buttons: usa data attributes per evitare problemi di quote nell'onclick
  const prevStyle = 'background:rgba(255,255,255,.2);border:none;color:' + (prevId?'#fff':'rgba(255,255,255,.3)') + ';border-radius:8px;width:34px;height:34px;font-size:22px;cursor:' + (prevId?'pointer':'default') + ';';

      + '<span style="font-size:12px;font-weight:700;color:' + statoColor + ';white-space:nowrap;">' + statoLbl + '</span>'

      + (it.note ? '<div style="font-size:11px;color:#64748b;padding:2px 0 6px;font-style:italic;">' + escHtml(it.note) + '</div>' : '');
  }).join('');

    : '';

    + '<button id="ck-prev" data-cid="' + (prevId||'') + '" data-vid="' + vehicleId + '" style="' + prevStyle + '">&#8249;</button>'
    + '<div style="text-align:center;"><div style="font-size:15px;font-weight:700;">📋 Check mensile</div>'
    + '<div style="font-size:11px;opacity:.8;">' + pos + ' di ' + total + ' — ' + fmtDate(c.data) + '</div></div>'
    + '<button id="ck-next" data-cid="' + (nextId||'') + '" data-vid="' + vehicleId + '" style="' + nextStyle + '">&#8250;</button>'

    + (v ? renderTargaHtml(v.targa) : '')

    + '<div style="font-size:12px;color:#64748b;">' + fmtKM(c.km) + ' · ' + escHtml(c.operatore||'') + '</div></div>'

    // Gestisci anomalie
    var btnAnom = document.getElementById('ck-anom-btn');
    if(btnAnom) btnAnom.addEventListener('click', function(){ openCheckAnomalieFromPlanner(c.id, vehicleId); });
  }, 30);
}

function openStampaCheck(year, month){
  const now = new Date();
  if(year===undefined){ year = now.getFullYear(); month = now.getMonth(); }
  if(month<0){ month=11; year--; }
  if(month>11){ month=0; year++; }
  window._stampaCheckYM = {year:year, month:month};
  const mesi=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const vById = {}; DB.vehicles().forEach(v=>vById[v.id]=v);
  const checks = DB.checks().filter(function(c){
    if(!c.data) return false;
    const d=new Date(c.data+'T00:00:00');
    return d.getFullYear()===year && d.getMonth()===month;
  }).sort((a,b)=> a.data<b.data?-1 : a.data>b.data?1 : 0);

  let listHtml;
  if(checks.length===0){
    listHtml = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:24px 0;">Nessun check eseguito in questo mese.</div>';
  } else {
    listHtml = checks.map(function(c){
      const v=vById[c.vehicleId];
      const anom=(c.items||[]).some(it=>it.val==='anomalia');
      return '<label style="display:flex;align-items:center;gap:10px;padding:9px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;margin-bottom:6px;cursor:pointer;">'
        +'<input type="checkbox" class="stc-chk" value="'+c.id+'" checked style="width:18px;height:18px;flex-shrink:0;">'
        +'<span style="font-weight:700;color:#1e293b;font-size:13px;">'+escHtml(v?v.targa:'—')+'</span>'
        +'<span style="color:#64748b;font-size:12px;">'+fmtDate(c.data)+'</span>'
        +(anom?'<span title="Con anomalie" style="margin-left:auto;width:9px;height:9px;border-radius:50%;background:#fb923c;flex-shrink:0;"></span>':'')
        +'</label>';
    }).join('');
  }

  const html =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;">'
    +'<button onclick="openStampaCheck('+year+','+(month-1)+')" style="background:#eff6ff;color:#1e40af;border:none;border-radius:10px;width:42px;height:42px;font-size:20px;font-weight:700;cursor:pointer;">‹</button>'
    +'<div style="font-weight:800;color:#1e293b;font-size:15px;">'+mesi[month]+' '+year+'</div>'
    +'<button onclick="openStampaCheck('+year+','+(month+1)+')" style="background:#eff6ff;color:#1e40af;border:none;border-radius:10px;width:42px;height:42px;font-size:20px;font-weight:700;cursor:pointer;">›</button>'
    +'</div>'
    + (checks.length? '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
        +'<button onclick="_stcToggleAll()" id="stc-toggle" style="background:none;border:none;color:#1e40af;font-size:12px;font-weight:700;cursor:pointer;padding:0;">Deseleziona tutti</button>'
        +'<span id="stc-count" style="font-size:12px;color:#64748b;">'+checks.length+' selezionati</span>'
        +'</div>' : '')
    + '<div style="max-height:48vh;overflow-y:auto;">'+listHtml+'</div>'
    + (checks.length? '<div style="display:flex;gap:8px;margin-top:14px;">'
        +'<button onclick="stampaCheckBatch(\'view\')" style="flex:1;background:#1e40af;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;">👁️ Visualizza</button>'
        +'<button onclick="stampaCheckBatch(\'print\')" style="flex:1;background:#0f766e;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;">🖨️ Stampa</button>'
        +'</div><div style="display:flex;gap:8px;margin-top:8px;">'
        +'<button onclick="stampaCheckBatch(\'share\')" style="flex:1;background:#f1f5f9;color:#334155;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;">📤 Condividi</button>'

function _stcUpdateCount(){
  const all=document.querySelectorAll('.stc-chk');

  const cnt=document.getElementById('stc-count');
  if(cnt) cnt.textContent=sel.length+' selezionati';

  if(tg) tg.textContent = (all.length>0 && sel.length===all.length) ? 'Deseleziona tutti' : 'Seleziona tutti';
}

function _stcToggleAll(){
  const all=document.querySelectorAll('.stc-chk');
  const sel=document.querySelectorAll('.stc-chk:checked');
  const check = sel.length!==all.length;
  all.forEach(ch=>ch.checked=check);
  _stcUpdateCount();
}

function _drawCheckCanvas(c, v, img){
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 1101;
  const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 800, 1101);

    // ── Font e colori ──
    const COL_TEXT = '#141414';
    const COL_X    = '#d20000';

    // ── Helper: disegna X su checkbox ──
    function drawX(x, y){
      ctx.strokeStyle = COL_X;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x-5, y-5); ctx.lineTo(x+5, y+5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+5, y-5); ctx.lineTo(x-5, y+5); ctx.stroke();
    }

    // ── Helper: testo con wrap ──
    function drawNote(text, yt, yb){
      if(!text) return;
      ctx.fillStyle = COL_TEXT;
      ctx.font = 'bold 12px Arial, sans-serif';
      const cy = Math.floor((yt + yb) / 2);
      const w = ctx.measureText(text).width;
      if(w <= MODULO_NOTE_W){
        ctx.fillText(text, MODULO_NOTE_X, cy - 5 + 9);
      } else {
        // Spezza in 2 righe
        const words = text.split(' ');
        let r1='', r2='';
        let best = words.length;
        for(let i=1;i<words.length;i++){
          const a=words.slice(0,i).join(' ');
          const b=words.slice(i).join(' ');
          if(ctx.measureText(a).width<=MODULO_NOTE_W && ctx.measureText(b).width<=MODULO_NOTE_W){
            // Scegli split più bilanciato
            if(Math.abs(ctx.measureText(a).width - ctx.measureText(b).width) <
               Math.abs(ctx.measureText(r1).width - ctx.measureText(r2).width) || !r1){
              r1=a; r2=b;
            }
          }
        }
        if(!r1){ r1=text; r2=''; }
        ctx.fillText(r1, MODULO_NOTE_X, cy - 10 + 9);
        if(r2) ctx.fillText(r2, MODULO_NOTE_X, cy - 10 + 9 + 11);
      }
    }

    // ── 1. Header testi — Y abbassata per stare sulle righe ──
    ctx.fillStyle = COL_TEXT;
    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.fillText(fmtDate(c.data)||'', 253, 197);
    ctx.fillText(escHtml(c.operatore||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'), 408, 197);
    ctx.fillText((v?.targa||'') + (c.km ? ' (Km ' + Number(c.km).toLocaleString('it-IT') + ')' : ''), 253, 233);

    // ── 2. S. Fermo fisso ──
    drawX(MODULO_SFERMO[0], MODULO_SFERMO[1]);

    // ── 3. Voci check ──
    const anomalieTesto = [];
    c.items && c.items.forEach(function(it){
      const m = MODULO_MAP[it.voce];
      if(!m){
        // Livello olio/liquidi: se anomalia → aggiungi alle anomalie testo
        if(it.val === 'anomalia'){
          anomalieTesto.push(it.voce + (it.note ? ': '+it.note : ''));
        }
        return;
      }
      if(it.val === 'anomalia'){
        drawX(m.neg[0], m.neg[1]);
        drawNote(it.note||'', m.yt, m.yb);
      } else if(it.val === 'non_presente'){
        // Voce non presente come dotazione: nessuna X, scrive NON PRESENTE nelle note
        drawNote('NON PRESENTE', m.yt, m.yb);
      } else {
        drawX(m.pos[0], m.pos[1]);
      }
    });

    // ── 4. Campo anomalie ──
    const anomStr = anomalieTesto.join(' | ');
    if(anomStr){
      ctx.fillStyle = COL_TEXT;
      ctx.font = 'bold 12px Arial, sans-serif';
      ctx.fillText(anomStr.slice(0,120), MODULO_ANOM_X, MODULO_ANOM_Y);
    }

    // ── 5. Note generali (c.note) — inizia dopo "U.d.O:", continua sulle righe tratteggiate sotto ──
    if(c.note){
      ctx.fillStyle = COL_TEXT;
      ctx.font = 'bold 12px Arial, sans-serif';
      // Prima riga: parte dopo l'etichetta "UdO:" (x=455), larghezza ridotta
      // Righe successive: partono dall'inizio (x=64), larghezza piena
      const noteLineYs = [865, 885, 905, 925];
      const words = c.note.split(' ');
      let line = '', lineIdx = 0;
      for(const w of words){
        const lineX = lineIdx === 0 ? 350 : 64;
        const lineW = lineIdx === 0 ? 395 : 680;
        const test = line ? line + ' ' + w : w;
        if(ctx.measureText(test).width > lineW && line){
          ctx.fillText(line, lineX, noteLineYs[lineIdx]);
          lineIdx++;
          if(lineIdx >= noteLineYs.length) { line=''; break; }
          line = w;
        } else { line = test; }
      }
      if(line && lineIdx < noteLineYs.length){
        const lineX = lineIdx === 0 ? 455 : 64;
        ctx.fillText(line, lineX, noteLineYs[lineIdx]);
      }
    }

  return canvas;
}

// Moduli check → PDF temporaneo (un modulo per pagina A4)
function _checkPdfBlob(dataUrls){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  dataUrls.forEach((d,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(d, 'PNG', 0, 0, 210, 297); });
  return pdf.output('blob');
}
// mode: 'view' visualizzatore in app · 'print' stampa · 'share' condividi · 'save' salva
function _checkAzione(dataUrls, nomeFile, mode){
  const blobP = () => new Promise((res,rej)=>{ try{ res(_checkPdfBlob(dataUrls)); }catch(e){ rej(e); } });
  const az = {
    condividi: ()=>pdfCondividi(blobP(), nomeFile),
    stampa:    ()=>stampaHtml(dataUrls.map(d=>'<img src="'+d+'">').join(''), 'cpr-img'),
    salva:     ()=>pdfSalva(blobP(), nomeFile)
  };
  if(mode==='view'){
    apriVisualizzatore(nomeFile.replace(/\.pdf$/,'').replace(/_/g,' '),
      dataUrls.map(d=>'<img src="'+d+'" style="display:block;width:'+A4_PX+'px;margin-bottom:12px;background:#fff;">').join(''), az);
  } else (az[{print:'stampa', share:'condividi', save:'salva'}[mode]] || az.stampa)();
}

        <span><span class="lbl">KM</span><span class="val">${fmtKM(c.km)}</span></span>
        <span><span class="lbl">Operatore</span><span class="val">${escHtml(c.operatore||'')}</span></span>
      </div>
      ${anom.length>0?`<div style="padding:2mm 3mm;background:#fff8e1;border:1px solid #f59e0b;margin-bottom:4mm;font-size:9pt;">
        ⚠ ${anom.length} anomali${anom.length===1?'a':'e'}: ${anom.map(a=>escHtml(a.voce)).join(' · ')}
      </div>`:''}
    </div>
    <table class="cpr-table">

      <tbody>${righe}</tbody>

async function openHistory(vehicleId){
  const v=DB.vehicles().find(x=>x.id===vehicleId);
  window._openView='history'; window._openViewVehicle=vehicleId;
  window._histReturn=vehicleId;
  if(!window._histFilter || window._histFilter.vid!==vehicleId) window._histFilter={vid:vehicleId, f:'tutto'};
  const filtro=window._histFilter.f;
  const avanzata=DB.settings().gestioneAvanzata;
  const oggi=today();
  const allInterventions=DB.interventions();
  const checks=DB.checks().filter(c=>c.vehicleId===vehicleId);
  const interventions=allInterventions.filter(i=>i.vehicleId===vehicleId);
  const tires=DB.tires().filter(t=>t.vehicleId===vehicleId);
  const tireInts=DB.tireInterventions().filter(t=>t.vehicleId===vehicleId);
  const segnalazioni=DB.segnalazioni().filter(s=>s.vehicleId===vehicleId);
  const suppliers=DB.suppliers();
  let docs=[];
  try{ docs=await IDB.getByVehicle(vehicleId); }catch(e){ console.warn('Storico documenti:', e); }

  // Montaggi/smontaggi già raccontati da un cambio gomme completato nello stesso giorno
  const giorniCambio=new Set(tireInts.filter(t=>t.stato==='completato'&&t.dataEffettiva).map(t=>t.dataEffettiva));
  // Ultima revisione: mostra la scadenza attuale della scheda se l'intervento non la riporta
  const ultimaRev=interventions.filter(i=>i.origine==='revisione').sort((a,b)=>String(b.dataApertura||'').localeCompare(String(a.dataApertura||'')))[0];

  const events=[
    ...checks.map(c=>({type:'check',date:c.data,data:c})),
    ...interventions.map(i=>({type:'intervento',date:i.dataApertura,data:i})),
    ...segnalazioni.map(s=>({type:'segnalazione',date:s.data,data:s})),
    ...tireInts.map(t=>({type:'cambio',date:(t.stato==='completato'&&t.dataEffettiva)?t.dataEffettiva:t.dataProgrammata,data:t})),
    ...tires.filter(t=>t.dataMontaggio && !giorniCambio.has(t.dataMontaggio)).map(t=>({type:'tireMont',date:t.dataMontaggio,data:t})),
    ...tires.filter(t=>t.stato!=='montata' && t.dataSmontaggio && !giorniCambio.has(t.dataSmontaggio)).map(t=>({type:'tireSmont',date:t.dataSmontaggio,data:t})),
    ...docs.map(d=>({type:'doc',date:String(d.createdAt||'').slice(0,10),data:d}))
  ].filter(ev=>filtro==='tutto' || HIST_CATEGORIA[ev.type]===filtro)
   .sort((a,b)=>{
    const d=String(b.date||'').localeCompare(String(a.date||''));
    if(d!==0) return d;
    // Stessa data: ordina per momento di creazione (creato dopo = più in alto)
    const ca=(a.data&&a.data.createdAt)?a.data.createdAt:'';
    const cb=(b.data&&b.data.createdAt)?b.data.createdAt:'';
    return cb.localeCompare(ca);
  });

  const badge=function(st){
    if(st==='chiuso') return '<span style="background:#dcfce7;color:#15803d;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;">✅ Chiuso</span>';

  const linkRow=function(open, testo, destra){

    <div class="divider"></div>
    ${filtriHtml}
    ${timelineHtml}
    <div style="height:10px;"></div>
  `);
  _histVisible=true;
  _installHistoryClicks();
}

// Un solo gestore per i tocchi nello Storico (prima se ne aggiungeva uno a ogni apertura)
function _installHistoryClicks(){
  const box=document.getElementById('modal-box');
  if(!box || box._histClicks) return;
  box._histClicks=true;
  box.addEventListener('click', function(e){
    if(!_histVisible) return;
    const vid=window._histReturn;
    const f=e.target.closest('[data-hfilter]');
    if(f){ window._histFilter={vid, f:f.dataset.hfilter}; openHistory(vid); return; }
    const bi=e.target.closest('[data-segn-int]');
    if(bi){ const s=DB.segnalazioni().find(x=>x.id===bi.dataset.segnInt); if(s){ closeModal(); createInterventionFromSegnalazione(s); } return; }
    const br=e.target.closest('[data-segn-risolto]');
    if(br){ const s=DB.segnalazioni().find(x=>x.id===br.dataset.segnRisolto); if(s){ closeModal(); risolviSegnalazione(s); } return; }
    if(e.target.closest('button, a, input, select, textarea')) return;
    const el=e.target.closest('[data-open]');
    if(!el) return;
    const [kind, id]=el.dataset.open.split(':');
    if(kind==='check') openCheckViewer(id, vid);
    else if(kind==='int') openInterventionDetail(id);
    else if(kind==='segn') openSegnalazioneDetail(id);
    else if(kind==='tire') openEditTireSet(id);
    else if(kind==='cambio'){
      const t=DB.tireInterventions().find(x=>x.id===id);
      if(t && t.stato==='programmato') openEditCambioGomme(id); else modificaCambioGomme(id);
    }
    else if(kind==='doc'){
      // Il PDF va aperto nel tocco, prima di leggere il file
      const pdf=el.dataset.pdf==='1';
      viewDoc(id, pdf);
    }
  });
}

        </button>`:''}

      ${doc?`
        <div style="margin-bottom:8px;font-size:12px;color:#64748b;">📎 ${escHtml(doc.nome)}</div>
        ${doc.mime&&doc.mime.startsWith('image/')?
          `<img src="${previewUrls[doc.id]||''}" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover;" onclick="viewDoc('${doc.id}')">`:
